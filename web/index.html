/* Fly so the subject lands in the strip the sheet is NOT covering. Without this
   Leaflet centres on the full map, the sheet then eats the bottom 60% of the
   screen, and the zone you just asked about ends up pushed off the top edge. */
/* ---------- THE BEACH EXTENT BAND ----------
   Daniel, 2026-09-17: "When zooming into the beach after selecting it, draw a
   boundary showing what the beach area is."

   THE BOUNDARY IS DRAWN ON THE WATER, NOT ON THE LAND, and that is the whole
   design. The zone line describes water: it is the coastline pushed 25 m out to
   sea, and the four tiers are all instructions about going IN. A closed polygon
   around the sand as well would draw a line across somebody's garden and across
   the road, on imagery accurate to 75 m in the west and 150 m in the east, and
   a reader takes a hard edge as a survey. Nobody surveyed the back of these
   beaches, so nothing is drawn there.

   So: the GPS-aligned zone line offset back 25 m to the shoreline, and that
   line pushed 95 m seaward, joined into one polygon. Lightly filled in the tier
   colour, with only a subtle dashed stroke on the seaward side,
   sides, because the seaward edge is not a boundary either: the hazard does not
   stop at 120 m, that is just how far out this beach is still this beach.

   THE ENDS ARE THE PART THAT IS A CLAIM, so the ends get the only strokes: one
   perpendicular tick at each end, at full tier colour. They mark where Cocles
   stops and Chiquita starts, which IS a decision somebody made and the one
   thing a reader needs when the instruction changes between two stretches of
   the same sand.

   It is drawn under the zone lines and above the tiles (pane "shadowPane"), so
   it can never dilute the stroke that carries the instruction.

   The full band is 120 METRES from shore and stays in metres. It does not grow a pixel floor at
   low zoom, because the band is a claim about how far out this beach is and a
   band that silently widens to stay visible is a claim that changes with the
   zoom. Wide enough to read as an area,
   narrow enough that two neighbouring bands never merge into one wash.

   BAND_MIN_ZOOM IS 13, NOT 14, AND THE PHONE IS WHY. A deep link to Cocles on a
   390 px phone with the sheet at PEEK fits a 3.1 km beach at z13.75, so a
   floor of 14 removed the band on the exact device and the exact path this was
   built for: scan the QR on the sand, and the boundary you were promised is
   not drawn. At z13 the band is 6.7 px, which the dashed seaward edge and the
   two end caps still carry. At z12 it is 3.4 px, which is a muddier line and
   not an area, so that is where it stops. */
// The OSM zone stroke is 25 m seaward of the mapped shoreline. Fill from the
// shoreline to 120 m offshore, instead of beginning 25 m out and ending at 145 m.
var BAND_INNER_M = -25;
var BAND_M = 95;
var BAND_MIN_ZOOM = 13;
let bandLayer = null, bandZone = null;

/* ITS OWN PANE, AT z-index 350, AND NOT ONE OF LEAFLET'S.
   The band has to sit above the imagery and below the zone stroke, and neither
   stock pane is that slot. overlayPane (400) is where the strokes are, and a
   layer added to it after them draws on top, which would put a 16% wash over
   the one mark on this map that must not be diluted. shadowPane (500) is worse,
   it is above them by construction. tilePane (200) is below the imagery's own
   transformed tile containers and a vector renderer put there is moved by them.
   350 is the gap between tilePane and overlayPane, which is exactly the
   relationship this band has to both. pointer-events off: the band is a
   read-only mark and the zone's invisible 44 px hit line must keep the tap. */
var BAND_PANE = "cgBandPane";
map.createPane(BAND_PANE);
map.getPane(BAND_PANE).style.zIndex = 350;
map.getPane(BAND_PANE).style.pointerEvents = "none";

function seawardEdge(z){
  // Metres per degree at this coast; the same frame tools/osm_coastline.py uses.
  const mLat = 111132, mLon = 111320 * Math.cos(9.645 * Math.PI / 180);
  const pts = z.line.map(p => [p[1] * mLon, p[0] * mLat]);
  const inner = [], out = [];
  for(let i = 0; i < pts.length; i++){
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    // The LEFT normal, which is seaward: the line runs west to east and the
    // open sea is on its left. tools/osm_coastline.py offsets the same way and
    // for the same reason; if one of them ever flips, both must.
    inner.push([pts[i][0] - dy / len * BAND_INNER_M,
                pts[i][1] + dx / len * BAND_INNER_M]);
    out.push([pts[i][0] - dy / len * BAND_M, pts[i][1] + dx / len * BAND_M]);
  }
  return {inner, outer: out,
          ll: q => [q[1] / mLat, q[0] / mLon]};
}

function bandPolygon(z){
  const e = seawardEdge(z);
  return e.inner.concat(e.outer.slice().reverse()).map(e.ll);
}

function endTicks(z){
  const mLat = 111132, mLon = 111320 * Math.cos(9.645 * Math.PI / 180);
  const pts = z.line.map(p => [p[1] * mLon, p[0] * mLat]);
  /* THE DIRECTION IS ALWAYS THE FORWARD ONE, a -> b west to east, at BOTH ends.
     The first version of this took the tangent at the far end from the last
     point back to the second-to-last, which is the line's direction REVERSED,
     which flips the left normal, which drew the east tick 120 m inland through
     the trees. A normal is only seaward relative to a direction of travel; the
     same mistake in tools/osm_coastline.py would offset the entire coastline
     into the jungle and still look like a coastline. */
  const tick = (at, a, b) => {
    const dx = pts[b][0] - pts[a][0], dy = pts[b][1] - pts[a][1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    // From the mapped shoreline to the illustrative offshore extent.
    return [[(pts[at][1] + ny * BAND_INNER_M) / mLat, (pts[at][0] + nx * BAND_INNER_M) / mLon],
            [(pts[at][1] + ny * BAND_M) / mLat, (pts[at][0] + nx * BAND_M) / mLon]];
  };
  const n = pts.length;
  return [tick(0, 0, Math.min(1, n - 1)),
          tick(n - 1, Math.max(0, n - 2), n - 1)];
}

function clearBand(){
  if(bandLayer){ bandLayer.remove(); bandLayer = null; }
  bandZone = null;
}

function showBand(z){
  clearBand();
  if(!z || !z.line.length || map.getZoom() < BAND_MIN_ZOOM) { bandZone = z || null; return; }
  const col = COLOR[tierOf(z)];
  const edge = seawardEdge(z);
  bandLayer = L.layerGroup([
    L.polygon(bandPolygon(z), {
      pane:BAND_PANE, stroke:false, fill:true, fillColor:col, fillOpacity:.14,
      interactive:false
    }),
    /* THE SEAWARD EDGE IS DASHED AND THE END CAPS ARE SOLID, and the difference
       between those two strokes is the whole claim this band makes.
       The ends are a decision somebody took: Cocles stops here and Chiquita
       starts, on the same continuous sand, and that is what a reader needs when
       the instruction changes under their feet. Solid.
       The seaward edge is not a decision and not a survey. The hazard does not
       stop 120 m out; that is simply how far out this beach is still this
       beach. A fill alone was invisible over brown reef imagery at 16%, so the
       edge has to be drawn, and a dashed edge is the honest way to draw an
       extent nobody measured. There is no landward edge at all: nothing on this
       map is entitled to draw a line across somebody's garden. */
    L.polyline(edge.outer.map(edge.ll), {
      pane:BAND_PANE, color:col, weight:1, opacity:.55, dashArray:"5 7",
      interactive:false
    }),
    ...endTicks(z).map(t => L.polyline(t, {
      pane:BAND_PANE, color:col, weight:2, opacity:.9, lineCap:"butt",
      interactive:false
    }))
  ]).addTo(map);
  bandZone = z;
}

// The band appears and disappears with zoom on its own, because a reader who
// pinches out past z14 with a sheet open should not be left with a wash they
// cannot resolve, and one who pinches back in should get it back.
map.on("zoomend", ()=>{ if(bandZone) showBand(bandZone); });

function flyClear(bounds, opts){
  map.setMaxBounds(null); // Restore the appropriate coverage after the flight.
  const open  = sheet.classList.contains("open");
  const headH = mapTopInset();
  if(desktop()){
    // Two columns, not two bands: the rail on the left and the panel on the
    // right. Padding by both is what keeps the coast out from under the panel.
    const rail = document.querySelector(".dock")?.offsetWidth || 360;
    const panel = 0; // The detail sheet replaces the left rail.
    map.flyToBounds(bounds, Object.assign({
      duration:.7, maxZoom:17,
      paddingTopLeft:[rail + 24, headH + 16],
      paddingBottomRight:[panel + 24, 32]
    }, opts||{}));
    return;
  }
  // The stop it is heading for, not where it is: it starts below the screen.
  const sheetH = open ? sheetPanel.visibleOf(sheetPanel.stop) : 0;
  map.flyToBounds(bounds, Object.assign({
    duration:.7, maxZoom:17,
    paddingTopLeft:[24, headH + 16],
    paddingBottomRight:[24, sheetH + 16]
  }, opts||{}));
}

function openPost(p){
  const render = ()=>{
    const t = T[lang];
    /* The deferral renders here too, and it is not boilerplate. This sheet says
       a fixed structure nearby holds rescue flotation, which is the most
       reassuring thing on the whole map, and it is exactly the sheet a reader
       could finish believing the map has them covered. The rule that outranks
       the map outranks it here as well: the guard standing on the sand beats
       this page, on every sheet, without exception. It was missing from this
       one and from the shaded-area sheet, which were the only two that
       described something reassuring. */
    return `
    <h2 id="sheet-title" tabindex="-1">${p.name[lang]}</h2>
    <p class="sub">${p.proposed ? (lang==='es'?'Propuesta en el mapa fuente. No indica equipo disponible.':'Proposed in the source map. Does not indicate available equipment.') : p.hours[lang]}</p>
    ${titleChip(CGSymbols.badge(p.proposed?'proposed_rescue_station':'rescue_station'), p.proposed ? (lang==='es'?'Propuesta':'Proposed') : t.station)}
    ${provenance(p, true)}
    <p class="why">${p.proposed ? (lang==='es'?'No es una estación operativa confirmada.':'This is not a confirmed operating station.') : t.stationHolds}</p>
    <p class="caveat">${lang==='es'?'Número y estado según el mapa completo aportado. La presencia de equipo no confirma guardavidas.':'Number and status follow the supplied full map. Equipment does not confirm lifeguard staffing.'}</p>
    <p class="defer">${t.defer}</p>
    <div class="actions">
      ${!p.proposed ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.ll.join(',')}">${t.route}</a>` : ''}
      <a class="btn" href="${reportHref(t.reportSubject + ": " + p.name.es)}">${t.report}</a>
      <a class="btn primary wide" href="tel:911">${t.call}</a>
    </div>
    ${sheetFoot()}`;
  };
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
  flyClear(L.latLngBounds([p.ll]).pad(0.002), {maxZoom:16.5});
  sheetAddress("p=" + localId(p.id));
}

/* ---------- the legend ----------
   Caribbean Guard's own V5 sheet carries a bilingual key in its corner and this
   map shipped without one, so four numbered marks sat on the coast meaning
   nothing until tapped (hat 5, finding 8) and the stroke vocabulary was taught
   only on the cards (hat 1, finding 7).

   MERGED, in two sections. "Qué hacer" is our four instructions, each with the
   stroke that carries it. "En el mapa" is their vocabulary in their words:
   Corriente de Resaca, Estación de Rescate. Spanish then English, two columns,
   exactly as V5 prints it.

   THE ROWS ARE CONDITIONAL ON THE LAYER EXISTING. V5 also keys roads, paths and
   Ubicaciones, and this map draws none of those today. A legend entry for a
   mark that is not on the map is a second kind of lie, and this page's whole
   argument is about not making the first kind. `hasLocations` flips the moment
   a locations layer lands in the data, and the row appears then. */
let hasLocations = false;

/* The marks, drawn as the map draws them rather than described, and defined
   ONCE: the legend and the sheet that opens when you tap the thing have to show
   the same mark, or the legend is teaching a vocabulary the sheets do not use.
   The station's dark outline is the one the marker carries: #f39c12 alone does
   not clear 3:1 over Caribbean water. */
const markRip = () => CGSymbols.badge("rip_current");
const markStation = () => CGSymbols.badge("rescue_station");
const markArea = () => CGSymbols.badge("strong_current_area");
const markMe = () => CGSymbols.badge("me");
const markPlaces = () => CGSymbols.badge("location");

function legendHTML(){
  const t = T[lang], o = lang === "es" ? "en" : "es", u = T[o];
  const row = (mark, a, b) =>
    `<div class="row"><span class="mark" aria-hidden="true">${mark}</span>
       <span class="txt"><span class="cur">${a}</span><span class="oth">${b}</span></span></div>`;
  return `<h3>${t.legendMap}</h3>
    ${row(markRip(), t.legendRip, u.legendRip)}
    ${row(markStation(), t.legendStation, u.legendStation)}
    ${row(markArea(), t.legendArea, u.legendArea)}
    ${hasLocations ? row(markPlaces(), t.legendPlaces, u.legendPlaces) : ""}
    ${row(markMe(), t.legendMe, u.legendMe)}`;
}

function openLegend(){
  const render = ()=>`<h2 id="sheet-title" tabindex="-1">${T[lang].legendTitle}</h2>
    <div class="legend">${legendHTML()}</div>
    <p class="defer">${T[lang].defer}</p>
    ${sheetFoot()}`;
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
  // A legend is a reading task, not a glance, so it opens past PEEK.
  sheetStop("half");
}
const sourceLayerDefs = [
  ['hazards','rip_current','Corrientes de resaca','Rip currents'],
  ['rescue','rescue_station','Equipo de rescate','Rescue equipment'],
  ['proposals','proposed_rescue_station','Propuestas / sin identificar','Proposed / unknown'],
  ['access','pedestrian','Caminos y senderos','Roads and paths'],
  ['places','location','Lugares','Places']
];

const sourceLayerState = Object.fromEntries(sourceLayerDefs.map(([id])=>[id,true]));
const sourceLayers = Object.fromEntries(sourceLayerDefs.map(([id])=>[id,L.layerGroup().addTo(map)]));
let legendExpanded = false;
let legendClosingTimer = null;
function renderLegendPerm(){
  clearTimeout(legendClosingTimer);
  const el = document.getElementById("legend-perm");
  if(!el) return;
  const restoreToggleFocus = document.activeElement?.classList?.contains('key-toggle') && el.contains(document.activeElement);
  el.classList.remove('is-closing');
  const mobileLegend = legendExpanded && !desktop();
  document.body.classList.toggle('legend-mode', mobileLegend);
  const dockEl = document.getElementById('dock');
  if(mobileLegend) dockEl.setAttribute('inert', '');
  else if(!document.getElementById('sheet')?.classList.contains('open')) dockEl.removeAttribute('inert');
  el.setAttribute("aria-label", lang === "es" ? "Leyenda" : "Legend");
  const es = lang === 'es';
  el.classList.toggle('is-open', legendExpanded);
  el.innerHTML = `<button type="button" class="key-toggle" aria-controls="legend-content" aria-expanded="${legendExpanded}">
      <span>${es ? 'Capas del mapa' : 'Map layers'}</span><span class="key-toggle-icon" aria-hidden="true"></span>
    </button><div class="key-content" id="legend-content" ${legendExpanded?'':'hidden'}>
    <div class="source-layer-grid">${sourceLayerDefs.map(([id,icon,esName,enName])=>`<label>
      <input type="checkbox" data-source-layer="${id}" ${sourceLayerState[id]?'checked':''}>
      ${CGSymbols.badge(icon)}<span>${es?esName:enName}</span></label>`).join('')}</div>
    <p class="key-hint">${es?'Acerca el mapa para ver más detalles. Los símbolos punteados son propuestas.':'Zoom in for detail. Dashed symbols are proposed.'}</p>
    <details class="key-data"><summary>${es?'Fuentes y precisión':'Sources and accuracy'}</summary>
      <p>${es?'Lugares y caminos: datos de OpenStreetMap; algunos lugares aún son estimados. Las flechas se ajustan a la costa GPS desde el documento original, pero no indican corrientes actuales. Los caminos no confirman acceso.':'Places and roads: OpenStreetMap data; some places remain estimated. Arrows follow the GPS coast from the source document, but do not show live currents. Roads do not confirm access.'} <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>.</p>
    </details></div>`;
  el.querySelector('.key-toggle').onclick = () => {
    if(legendExpanded && !desktop() && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.classList.add('is-closing');
      legendClosingTimer = setTimeout(()=>{ el.classList.remove('is-closing'); legendExpanded = false; renderLegendPerm(); }, 220);
    }else{ legendExpanded = !legendExpanded; renderLegendPerm(); }
  };
  if(restoreToggleFocus) el.querySelector('.key-toggle').focus({preventScroll:true});
  el.querySelectorAll('[data-source-layer]').forEach(input=>input.onchange=()=>{
    sourceLayerState[input.dataset.sourceLayer]=input.checked;
    const layer=sourceLayers[input.dataset.sourceLayer];
    input.checked?layer.addTo(map):map.removeLayer(layer);
  });
}
document.getElementById("legend-open").onclick = openLegend;

/* ---------- beach picker ----------
   The coast is 12 km of near identical jungle and sand. Nobody pans a map to
   find their beach. They read the name off the sign behind them, so the names
   are the navigation and the status is visible before anything is tapped. */
/* Cards use the shared status pictograms; shoreline strokes stay on the map. */
function swatch(tier, onTier){
  /* CGGeom.TIERS is the same table the map draws from, and the swatch derives
     its pattern the same way zoneStroke does: gap = gapK * weight, dash =
     ratio * gap, ratio null means solid. One table, two readers, so the card
     cannot teach a pattern the map does not draw. That was the whole point of
     putting the stroke on the card in the first place.
     The card shows the REFERENCE weight rather than the current zoom's, so the
     legend stays still while the map under it rescales. */
  /* THE NAVY BOX IS GONE. Every swatch used to be drawn on a
     <rect fill="#24384a"> so that the stroke could be shown in its literal map
     colour: on a dark ground #f5b942 amber is legible, and on white it measures
     about 1.8:1, under the 3:1 a meaningful graphic has to clear. Daniel's
     finding 2026-09-17, and he named it precisely: "I do not like that there is
     a blue box holding each of the linework types, this should be eliminated."
     He is right. Eight navy chips down a white rail, each one a different
     background from the card it sits on, is a third container layer on a
     component that already has two, and the thing they contain is 24 px of
     line.

     SO THE SWATCH CHANGES WHAT IT SAMPLES. It draws the map stroke's WEIGHT and
     DASH exactly, from the same CGGeom.TIERS table the map draws from, and its
     colour in the light-ground variant (`--*-text`) rather than the literal map
     colour. High and low are the same hue either way; only moderate differs,
     amber to a dark ochre, and that was ALREADY true of the bar beside it. The
     weight and the dash are the part a deuteranope reads, and they are exact.

     Colours come from the stylesheet rather than from a second copy here, so a
     token cannot be changed in one place and not the other. */
  const s = CGGeom.TIERS[tier];
  const css = getComputedStyle(document.documentElement);
  /* onTier: the swatch is being drawn INSIDE the glyph tile of a status card,
     whose ground is already this tier's colour. Drawing the stroke in the tier
     colour there would draw it in its own background. White, and the dash and
     weight still carry the tier exactly as they do on the rail. */
  const col = onTier ? "#fff"
            : (css.getPropertyValue("--" + tier + "-text") || "").trim() || COLOR[tier];
  const w = Math.max(3, s.weight * 0.85);
  const gap = s.gapK * w, dash = s.ratio == null ? null : s.ratio * gap;
  return `<svg class="sw" width="34" height="14" viewBox="0 0 34 14" aria-hidden="true" focusable="false">
    <line x1="2" y1="7" x2="32" y2="7" stroke="${col}"
          stroke-width="${w}" stroke-linecap="round"
          ${dash == null ? "" : `stroke-dasharray="${+dash.toFixed(2)} ${+gap.toFixed(2)}"`}/>
  </svg>`;
}

/* THE STATUS PILL. One component, used on the card and in the sheet, so the
   thing somebody reads on the strip and the thing they read after tapping are
   the same object rather than two that can drift apart.
   Tier colour is the left bar. Text is always ink. See the .pill CSS.

   IT TAKES A TIER AND AN INSTRUCTION, AND NOTHING ELSE. It used to also carry a
   station's name, a hazard's noun and an area title, which made the component
   that means "do this" the component that a noun arrived in. Those take
   titleChip() below. */
function statusPill(tier, instruction){
  return `<span class="pill ${tier}">${swatch(tier)}${instruction}</span>`;
}

/* The neutral counterpart: what KIND of thing this sheet is about, with the mark
   the map draws for it, so the sheet doubles as a key for whatever was tapped. */
function titleChip(mark, text){
  return `<span class="chip title">${mark}${text}</span>`;
}

/* CARD ANATOMY, top to bottom: name, instruction, hours. THREE THINGS.

   THE PROVENANCE CHIPS ARE GONE FROM THE CARD. Every card carried "Sin revisar"
   and "Sin recorrer", on all five beaches, always, because nothing has been
   reviewed and only the middle 1.86 km has been surveyed. Two chips repeated
   five times is ten marks that never differ, and a mark that never differs
   carries no information: it cannot distinguish one beach from another, which
   is the only job the left rail has. Daniel's finding 2026-09-17: "Limit
   redundancies and unnecessary text. Like Not reviewed and Not surveyed. The
   point of the left side menu is to simply show the beaches on site."

   The claim itself is NOT dropped. It moves to the one place a reader is
   actually deciding something, the sheet, where it renders once as a sentence
   instead of ten times as a badge. See trustLine().

   If a beach is ever reviewed and its neighbours are not, this rule inverts:
   a difference between beaches belongs on the card. Bring the chip back on the
   day it can be absent from some card. */
function cardHTML(z){
  const t = T[lang];
  return `<button class="card" data-id="${z.id}" aria-current="false">
      ${CGSymbols.badge(z.character.class, "beach-symbol")}
      <span class="beach-copy">
      <span class="nm">${z.name[lang]}</span>
      <span class="beach-status">${t[z.character.class]}</span>
      </span>
    </button>`;
}

function buildPicker(){
  const t = T[lang];
  const selected = document.querySelector('.card[aria-current="true"]')?.dataset.id;
  // Character on the card, because the character is what the map stroke says and
  // the card is the legend for the stroke. A signed bulletin adds a chip; it
  // never replaces the character label.
  const cards = ZONES.map(cardHTML).join("") + UNASSESSED_BEACHES.map(b=>`
    <button class="card unassessed" data-id="${b.id}" aria-current="false">
      ${CGSymbols.badge('unknown', 'beach-symbol')}
      <span class="beach-copy"><span class="nm">${b.name}</span>
      <span class="beach-status">${t.unassessedStatus}</span></span>
    </button>`).join("");
  /* The absence, listed as a peer of the presences, and a DIFFERENT SPECIES of
     card: dashed, hatched, and carrying no status pill at all. Hat 1 skimmed
     straight past the most defensible thing on the page because it had the same
     size, shape and row as a beach and was only greyer. Still last, because it
     is the rest. */
  const voidCard = `<button class="card void" data-id="void" aria-current="false">
      ${CGSymbols.badge('unknown', 'beach-symbol')}
      <span class="beach-copy">
      <span class="nm">${t.voidName}</span>
      <span class="vd">${t.voidStatus}</span>
      </span>
    </button>`;
  document.getElementById("picker").innerHTML = cards + voidCard;
  document.querySelectorAll(".card").forEach(c=>{
    c.setAttribute("aria-current", c.dataset.id === selected);
    c.onclick = c.dataset.id === "void" ? openVoid
      : c.dataset.id.startsWith("cg:beach/")
        ? ()=>openUnassessedBeach(UNASSESSED_BEACHES.find(b=>b.id === c.dataset.id))
        : ()=>openZone(ZONES.find(z=>z.id === c.dataset.id));
  });
  renderCounter();
  // after layout, not during it: offsetHeight read in the same frame as the
  // innerHTML write returns the height of the markup that has not been laid out
  requestAnimationFrame(measureDock);
}

/* "2 de 6". A horizontal scroller with both scrollbars hidden does not announce
   its own length: hats 1 and 2 both saw two cards, concluded that was all there
   was, and never reached Cocles at card three. The edge fade (a mask on .strip)
   says there is more; this says how much more and where you are. Hidden on
   desktop, where all six are stacked and visible. */
function renderCounter(){
  const el = document.getElementById("counter");
  if(!el) return;
  const cards = [...document.querySelectorAll(".card")];
  if(!cards.length) return;
  const strip = document.getElementById("picker");
  const mid = strip.scrollLeft + strip.clientWidth / 2;
  let best = 0, bestD = Infinity;
  cards.forEach((c, i)=>{
    const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
    if(d < bestD){ bestD = d; best = i; }
  });
  el.textContent = T[lang].counter(best + 1, cards.length);
}
document.getElementById("picker").addEventListener("scroll", ()=>{
  clearTimeout(renderCounter._t);
  renderCounter._t = setTimeout(renderCounter, 80);
}, {passive:true});

function markCurrent(id){
  document.querySelectorAll(".card").forEach(c=>{
    const on = c.dataset.id===id;
    c.setAttribute("aria-current",on);
    /* A deep link (?z=cocles) has to move the strip, not only the map. The QR
       code on the post at Cocles opens card three, and until this ran the
       reader landed on card one and had to hunt for the beach they were
       standing on. */
    /* The strip, never the page. scrollIntoView scrolls EVERY scrollable
       ancestor, and with the phone panels parked partly below the screen by
       transform, that included the document: selecting a beach shifted the
       whole page up 96 px and hid the top bar. */
    if(on){
      const strip = document.getElementById("picker");
      const r = c.getBoundingClientRect(), sr = strip.getBoundingClientRect();
      if(strip.scrollHeight > strip.clientHeight + 1 && (r.top < sr.top || r.bottom > sr.bottom)){
        strip.scrollTo({top: strip.scrollTop + r.top - sr.top - (sr.height - r.height) / 2,
                        behavior: reducedMotion.matches ? "auto" : "smooth"});
      }
    }
  });
  anyCurrent = !!id && !!layers[id];
  Object.entries(layers).forEach(([k,g])=>{ g.cgCurrent = (k === id); });
  restyleZones();
  setTimeout(renderCounter, 420);   // after the smooth scroll settles
}

/* The dock's height is not a constant and it is not knowable up front: it grows
   when the saved-copy bar appears and when a card grows absence marks. Two things
   depend on it. The fab and the compass stack above it, and fitCoast() pads the
   letterbox by it, so a dock that grows after the opening fit pushes the coast up
   off centre and leaves a band of nothing under it.

   Re-fitting is conditional on the map still being at its floor. If somebody has
   zoomed into a beach, moving the camera under them because a chip appeared would
   be worse than an imperfect letterbox. */
let lastDockH = 0;
function measureDock(mayFit = true){
  const dock = document.getElementById("dock");
  if(!dock) return;
  const phone = !desktop();
  // On a phone the panels own --dock-h (placeControls); mid-slide or under an
  // open sheet the dock's own height is not the one the controls should clear.
  if(phone && (dock.classList.contains("settling") || dock.classList.contains("dragging") ||
               document.getElementById("sheet").classList.contains("open"))) return;
  const h = phone ? Math.max(0, Math.round(window.innerHeight - dock.getBoundingClientRect().top))
                  : dock.offsetHeight;
  if(h === lastDockH) return;
  const first = lastDockH === 0;
  lastDockH = h;
  document.documentElement.style.setProperty("--dock-h", h + "px");
  // `mayFit` is false when the caller is about to fit anyway, as refit() is.
  // Without it a resize fits twice, and the first of the two runs against a
  // dock height that has not been laid out yet.
  if(!mayFit || !zonesReady) return;
  if(first || Math.abs(map.getZoom() - map.getMinZoom()) < 0.01) fitCoast();
}

/* ---------- locate ---------- */
let meMarker=null, meCircle=null;
const toast=document.getElementById("toast");

/* THE TWO BANNERS SHARE ONE STRIP AND THE SAFETY ONE IS ON TOP.
   Both are pinned under the top bar. The update banner sits at z-index 1500 and
   the toast at 1400, so a "newer version of this map" notice was drawn straight
   over "the beach zones did not load, do not trust this map without them" and
   hid it completely. A convenience notice may never cover a safety one.
   Whichever appears first keeps the strip and the other one stacks beneath it,
   so the order they arrive in does not decide which one gets read. */
function stackBanners(){
  const upd = document.getElementById("update");
  const updShown = upd && upd.classList.contains("show");
  const toastShown = toast.classList.contains("show");
  toast.style.marginTop = (updShown && !toastShown) ? (upd.offsetHeight + 10) + "px" : "";
  if(upd) upd.style.marginTop = (toastShown && updShown) ? (toast.offsetHeight + 10) + "px" : "";
}

function say(msg,ms=4200){
  toast.textContent=msg;
  stackBanners();              // measure the other banner BEFORE showing this one
  toast.classList.add("show");
  stackBanners();              // and again, so the other one moves if it is up
  clearTimeout(say._t);
  say._t=setTimeout(()=>{ toast.classList.remove("show"); stackBanners(); }, ms);
}

/* THE FIRST RUN IS A LABELLED ACTION, NOT AN ICON.
   Hat 1's only question standing on the sand is "which beach am I on", and the
   control that answers it was an unlabelled crosshair below a compass, which
   reads as a map widget rather than as an answer. Nothing ever called
   getCurrentPosition on load either, so the map never offered.
   So on the first visit the dock carries "¿En qué playa estoy?" full width, and
   once it has been used once it collapses to the icon, because by then the icon
   has a meaning. The flag is per-device and survives a reload; if localStorage
   is unavailable the labelled action simply stays, which is the safe failure. */
const LOCATE_KEY = "cg-located";
function locateUsed(){
  try{ return localStorage.getItem(LOCATE_KEY) === "1"; }catch(e){ return false; }
}
function renderLocate(){
  const first = document.getElementById("locate-first");
  const fab = document.getElementById("locate");
  const show = false;
  first.classList.toggle("show", show);
  fab.classList.toggle("hidden", show);
  requestAnimationFrame(measureDock);
}
function runLocate(){
  try{ localStorage.setItem(LOCATE_KEY, "1"); }catch(e){}
  renderLocate();
  doLocate();
}
document.getElementById("locate-first").onclick = runLocate;
document.getElementById("locate").onclick = runLocate;

function doLocate(){
  const t=T[lang];
  if(!navigator.geolocation){ say(t.denied); return; }
  say(t.locating);
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la,longitude:lo,accuracy:acc}=pos.coords;
    const ll=[la,lo];
    if(meMarker){map.removeLayer(meMarker);map.removeLayer(meCircle);}

    /* The circle is GPS error AND our registration error, combined, not GPS
       alone. The imagery under the dot is only known to 75 m in the west and
       about 150 m east of Punta Uva, so drawing a tight 8 m GPS circle would
       claim a precision this map does not have. Two independent errors add in
       quadrature. Drawing it honestly is the difference between a map that is
       useful and a map that misleads someone about where the water is safe. */
    const mapErr = lo < GEO_EAST_OF ? GEO_ACCURACY_EAST_M : GEO_ACCURACY_M;
    const shown  = Math.sqrt(acc*acc + mapErr*mapErr);
    meCircle=L.circle(ll,{radius:shown,color:"#1565c0",weight:1,fillOpacity:.14}).addTo(map);
    meMarker=L.marker(ll,{icon:L.divIcon({className:"cg-gps-marker",iconSize:[36,36],iconAnchor:[18,18],
      html:'<svg viewBox="0 0 36 36" width="36" height="36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#1565c0" stroke="#fff" stroke-width="3"/><circle cx="18" cy="12" r="3.2" fill="#fff"/><path d="M12 25c.4-4.1 2.4-6.4 6-6.4s5.6 2.3 6 6.4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>'})}).addTo(map);
    meMarker.bindTooltip(lang === "es" ? "Tu ubicación GPS" : "Your GPS location");
    if(!L.latLngBounds(IMG_BOUNDS).contains(ll)){ say(t.outside,6000); map.fitBounds(IMG_BOUNDS); return; }
    toast.classList.remove("show");
    document.getElementById("locate").classList.add("on");
    /* Surface the zone you are standing on, but ONLY when there is exactly one
       credible answer.

       The old rule was "nearest zone within 450 m", and that was unsafe. Cocles
       ends 419 m from where Chiquita begins, which is inside 450 m, so along that
       stretch both zones qualified and the winner was decided by a few metres of
       vertex geometry sitting on top of a GPS fix and a georeference good to 75 m
       at best. Cocles is danger and Chiquita is caution. The map would show one of
       them, full screen, with no hint that it had guessed.

       Now: the nearest zone must be close in absolute terms AND clearly closer
       than the runner-up. If two zones are in contention the map says so and lets
       the person choose, because a wrong verdict here is worse than no verdict. */
    // z.line while it is there, z.at as the fallback. Falling back to a single
    // midpoint makes the distances coarser, so the MARGIN_M test below is
    // harder to pass, so the map says "you are between two beaches" more often
    // rather than less. An uncertainty that fails towards asking is the right
    // direction for this particular guess.
    const near = ZONES.map(z=>{
      const pts = z.line.length ? z.line : [z.at];
      return {z, d: Math.min(...pts.map(pt=>map.distance(ll,pt)))};
    }).sort((a,b)=>a.d-b.d);
    const NEAR_M = 250, MARGIN_M = 150;
    if(near[0] && near[0].d < NEAR_M &&
       (!near[1] || near[1].d - near[0].d > MARGIN_M)){
      openZone(near[0].z);
    } else {
      flyClear(meCircle.getBounds(), {maxZoom:16});
      if(near[0] && near[0].d < 700) say(t.ambiguous, 7000);
    }
  },()=>say(T[lang].denied,5000),{enableHighAccuracy:true,timeout:9000,maximumAge:30000});
}

/* ---------- language ----------
   EVERY aria-label moves, not one. Hat 4, finding 12: in English the close
   button still announced "Cerrar", refresh "Actualizar" and the toggle group
   "Idioma"; only #locate was ever relabelled, so a screen reader in English got
   a Spanish interface with one English word in it.

   AND THE OPEN SHEET IS RE-RENDERED, NOT DISMISSED. This function used to end
   with sheet.classList.remove("open"): hat 4 opened Playa Cocles, could not read
   the English, tapped ES, and the verdict vanished. Switching language is a
   request to read the same thing in another language. */
function updateCoastalLabels(){
  const es = lang === "es", expanded = document.body.classList.contains("list-expanded");
  document.getElementById("dock-handle").setAttribute("aria-label", es

/* ============================================================
   CARIBBEAN GUARD'S OWN ANNOTATIONS
   Everything drawn here comes from web/data/cg-hazards.geojson, machine-read off
   the sheet Caribbean Guard already publishes on /programa-playa-organizada and
   georeferenced against Bing at 294 inliers, 1.2 m.

   It covers 1.82 km of a 16.66 km coast, which is what their sheet covers. The
   absence of arrows elsewhere means nobody has mapped it, NOT that it is clear,
   and the layer says so when you open it.

   Nothing here is authored by this map. Every feature carries needs_confirmation
   and the sheet has no date on it.
   ============================================================ */
const ANNOT = {rips:[], stations:[], areas:[]};
let legacyRipLayer;

/* Arrow weight, head size and the minimum drawn shaft are a function of zoom,
   and all three moved to geometry.js along with the thing that matters more:
   THE ARROW IS OUTLINED NOW, not shadowed.

   Hat 4 measured the old one. #e53935 against the water sampled next to it,
   rgb(45,72,65), is 2.00:1, and 1.79:1 as a deuteranope sees it, against the
   3:1 bar WCAG 1.4.11 sets for a graphical object that carries meaning. A drop
   shadow cannot fix that, because contrast is measured at an edge and a shadow
   is a blur. Ink at 0.85 against the red is 4.4:1, and that ink edge is what
   the eye locks onto, so the arrow stops depending on whatever water it
   happens to be floating over. */

function drawAnnotations(gj){
  const layer = L.layerGroup().addTo(map);
  legacyRipLayer = L.layerGroup().addTo(layer);
  gj.features.forEach(f=>{
    // rescue_station is handled by joinStations(), not here: those markers are
    // already on screen from POSTS before this fetch resolves, and drawing them
    // again would double them.
    const k = f.properties.kind, g = f.geometry;
    if(k === "rip_current"){
      const pts = g.coordinates.map(c=>[c[1], c[0]]);
      const arrow = CGGeom.outlinedArrow(map, pts, {}).addTo(legacyRipLayer);
      // Our own hit line, on the TRUE position rather than the drawn one: at
      // the overview a 40 m rip is shorter than its own arrowhead and the shaft
      // is stretched to stay legible, but the tap target belongs where the
      // hazard is.
      L.polyline(pts,{color:"#000",weight:30,opacity:0})
        .addTo(legacyRipLayer).on("click", ()=>openAnnot("rip", f));
      ANNOT.rips.push({f, pts, arrow});
    }
    else if(k === "strong_current_area"){
      const ring = g.coordinates[0].map(c=>[c[1], c[0]]);
      // The full map explicitly labels this bay as an area of strong currents.
      // Preserve the existing geometry; only the supported classification changes.
      const poly = L.polygon(ring,{color:"#bb2333",weight:2,dashArray:"6 6",
                                   fillColor:"#d83b48",fillOpacity:.22}).addTo(layer);
      poly.on("click", ()=>openAnnot("area", f));
      ANNOT.areas.push({f});
    }
  });
  // Heads and shafts are sized in screen space, so both are rebuilt on zoom.
  map.on("zoomend", ()=>{
    restyleZones();
    ANNOT.rips.forEach(r=>r.arrow.cgRedraw(map, r.pts, {}));
  });
  return layer;
}

function openAnnot(kind, f){
  const render = ()=>{
    const t = T[lang];
    /* No `sub` line here any more. It used to print ripLen, "aproximadamente
       38 m desde la orilla", one of nine values got by measuring the length of a
       hand-drawn arrow. The escape instruction takes that slot instead, which
       is the thing a swimmer actually needs from this sheet. */
    /* Same skeleton as openZone, in the same order, and that is the fix rather
       than a tidy-up: name, mark, provenance, the thing to know, the deferral.
       These two sheets had the provenance UNDER the deferral on the rip and
       missing the deferral entirely on the area, so the two sheets a reader
       reaches by tapping the map read differently from the five they reach by
       tapping a card. A page that argues its verdicts are dated observations
       cannot put the date somewhere different depending on which mark you
       touched. */
    const body = kind === "rip"
      ? `<h2 id="sheet-title" tabindex="-1">${t.ripTitle}</h2>
         ${titleChip(markRip(), t.legendRip)}
         ${provenance(f.properties, true)}
         <p class="why">${t.escapeRip} ${t.escapeHelp}</p>
         <p class="prov">${t.ripDir}</p>
         <p class="defer">${t.defer}</p>`
      : `<h2 id="sheet-title" tabindex="-1">${t.areaTitle}</h2>
         ${titleChip(markArea(), t.legendArea)}
         ${provenance(f.properties, true)}
         <p class="why">${t.areaWhy}</p>
         <p class="defer">${t.defer}</p>`;
    return body + `
    <div class="actions">
      <a class="btn" href="${reportHref(t.reportSubject + ": " + t.ripTitle)}">${t.report}</a>
      <a class="btn primary" href="tel:911">${t.call}</a>
    </div>
    ${sheetFoot()}`;
  };
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
}

/* The newer full PDF is registered provisionally from four shared equipment
   markers. It is drawn on this GPS map only; there is no second map view. */
const projectedArrows = [];
const projectedDetail = [];
let projectedLoaded = false;
const projectedNames = {
  rip_current:['Corriente de resaca','Rip current'],
  rescue_station:['Equipo de rescate','Rescue equipment'],
  proposed_rescue_station:['Equipo propuesto','Proposed equipment'],
  proposed_cg_station:['Estación CG propuesta','Proposed CG station'],
  unclassified_facility:['Símbolo sin definir','Undefined symbol'],
  location:['Referencia','Place']
};
function sourceEsc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
}
function sourcePlaceLabel(p,es){
  const generic=/^(1 minuto|3 minutos|Calle|Centro|Apartamentos|Hotel)$/i.test(p.name||'');
  const mappedName=/real location/i.test(p.osm_name||'')?'':p.osm_name;
  return mappedName||(!generic&&p.name)||(es?'Lugar sin identificar':'Unidentified place');
}
function sourcePopup(f){
  const es=lang==='es', p=f.properties, names=projectedNames[p.kind]||['Anotación','Annotation'];
  const proposed=p.kind.startsWith('proposed');
  if(p.kind==='location'){
    const label=sourcePlaceLabel(p,es);
    const note=p.registration==='osm_named_place'
      ? (es?'Ubicación en OpenStreetMap':'OpenStreetMap location')
      : (es?'Posición estimada del documento':'Estimated document position');
    return `<strong>${sourceEsc(label)}</strong><br><small>${note}</small>`;
  }
  const note=proposed ? (es?'Propuesto, no disponible':'Proposed, not available')
    : p.kind==='unclassified_facility' ? (es?'Servicio no identificado':'Service unknown')
    : (es?'Posición aproximada':'Approximate position');
  return `<strong>${sourceEsc(names[es?0:1])}${p.number?' '+sourceEsc(p.number):''}</strong><br><small>${note}</small>`;
}
function drawProjectedAnnotations(gj){
  const categories={rip_current:'hazards',rescue_station:'rescue',
    proposed_rescue_station:'proposals',proposed_cg_station:'proposals',unclassified_facility:'proposals',
    location:'places'};
  for(const f of gj.features){
    const kind=f.properties.kind, group=sourceLayers[categories[kind]];
    if(!group)continue;
    if(f.id==='pdf:location/408')continue; // Coincident duplicate of source mark 406.
    const g=f.geometry;
    if(kind==='rip_current'){
      const pts=g.coordinates.map(([lon,lat])=>[lat,lon]);
      const arrow=CGGeom.outlinedArrow(map,pts,{}).addTo(group);
      const hit=L.polyline(pts,{color:'#000',weight:20,opacity:0}).addTo(group).bindPopup(()=>sourcePopup(f));
      projectedArrows.push({arrow,pts,hit});
    }else{
      const symbol=kind==='location'?'location':kind==='unclassified_facility'?'unknown':kind;
      const [lon,lat]=g.coordinates;
      const markerTitle=kind==='location'
        ? sourcePlaceLabel(f.properties,lang==='es')
        : (projectedNames[kind]?.[lang==='es'?0:1]||'Annotation');
      const marker=L.marker([lat,lon],{title:markerTitle,
        icon:L.divIcon({className:'projected-marker '+(kind==='location'?'projected-place':''),
          iconSize:[30,30],iconAnchor:[15,15],html:CGSymbols.badge(symbol)+(f.properties.number?`<span class="projected-number">${sourceEsc(f.properties.number)}</span>`:'')})
      }).addTo(group).bindPopup(()=>sourcePopup(f));
      projectedDetail.push({layer:marker,kind});
    }
  }
  map.on('zoomend',()=>{
    const zoom=map.getZoom(), show=zoom>=15;
    const separation=zoom<16?56:zoom<17?30:0;
    document.body.classList.toggle('map-overview',!show);
    const used=[];
    projectedArrows.forEach(({arrow,pts,hit})=>{
      const center=map.latLngToContainerPoint(pts[Math.floor(pts.length/2)]);
      const visible=show&&used.every(p=>p.distanceTo(center)>separation);
      if(visible){
        used.push(center);
        if(!sourceLayers.hazards.hasLayer(arrow))arrow.addTo(sourceLayers.hazards);
        if(!sourceLayers.hazards.hasLayer(hit))hit.addTo(sourceLayers.hazards);
        arrow.cgRedraw(map,pts,{});
      }else{
        sourceLayers.hazards.removeLayer(arrow);
        sourceLayers.hazards.removeLayer(hit);
      }
    });
    projectedDetail.forEach(({layer,kind})=>{
      const visible=kind==='location'?zoom>=15.5:zoom>=14;
      const node=layer.getElement();if(node)node.style.display=visible?'':'none';
    });
  });
  map.fire('zoomend');
}
fetch('data/full-map-geographic.geojson')

/* ---------- north arrow ----------
   The imagery is rectified north-up, so a static arrow is already truthful. The
   useful version is live: on a phone with a magnetometer the needle holds north
   while you turn, which answers the question somebody standing on sand actually
   has, which is not "where is north" but "which way am I facing".

   iOS needs an explicit permission gesture, so the button asks for it on tap and
   stays a plain arrow if it is refused or unavailable. */
(function(){
  const btn = document.getElementById("compass");
  const needle = document.getElementById("needle");
  if(!btn || !needle) return;
  let live = false;

  function onOrient(e){
    // webkitCompassHeading is degrees clockwise from north; alpha is counter
    const heading = (typeof e.webkitCompassHeading === "number")
      ? e.webkitCompassHeading
      : (e.absolute && typeof e.alpha === "number" ? 360 - e.alpha : null);
    if(heading == null || Number.isNaN(heading)) return;
    if(!live){ live = true; btn.classList.add("live"); }
    // rotate the needle AGAINST the heading so it keeps pointing at true north
    needle.style.transform = `rotate(${-heading}deg)`;
    btn.setAttribute("aria-label", `${T[lang].north} ${Math.round(heading)}°`);
  }

  function start(){
    window.addEventListener("deviceorientationabsolute", onOrient, true);
    window.addEventListener("deviceorientation", onOrient, true);
  }

  btn.addEventListener("click", ()=>{
    const DOE = window.DeviceOrientationEvent;
    if(DOE && typeof DOE.requestPermission === "function"){
      DOE.requestPermission()
        .then(r=>{ if(r === "granted") start(); else say(T[lang].compassDenied, 4500); })
        .catch(()=>say(T[lang].compassDenied, 4500));
    } else if(DOE){
      start();
      // no event within a second means there is no magnetometer behind the API
      setTimeout(()=>{ if(!live) say(T[lang].compassNone, 4000); }, 1200);
    } else {
      say(T[lang].compassNone, 4000);
    }
  });

  // Android and desktop with a sensor can start without a gesture
  if(window.DeviceOrientationEvent &&
     typeof window.DeviceOrientationEvent.requestPermission !== "function") start();
})();

/* ============================================================
   4. THE SAVED COPY

   The old code ran say(T[lang].save) unconditionally on every load, which
   displayed "Guarde esta página. La señal es débil en la playa." to every visitor
   before they did anything. It was the most-seen string on the map and it
   instructed the reader to perform something the page could not do. That is the
   same class of failure as "en tiempo real", applied to capability instead of
   data, shipping three functions away from the rule that forbids it.

   So the capability now exists, and the copy is calibrated to what it actually
   delivers on each platform:

     - It says the page is SAVED ON THIS PHONE, not that it "works offline",
       because on iOS Safari that second sentence is not ours to promise.
     - It says when, with a label, always. Beachsafe's field for a cache that has
       never populated reads the literal word "Never" and that is the right
       default: an empty field reads as fine.
     - It says how often it refreshes, and gives a button to do it by hand.
     - It says, plainly, that iOS may clear the copy after about a week of Safari
       use without a visit, and that the home screen is what prevents that.
       WebKit documents both the seven day rule and the home screen exemption.

   The nudge to install fires when installing is possible and useful, and says
   something accurate when it is not.
   ============================================================ */

/* ---------- THE SEA ----------
   Open-Meteo's marine model, one request, for the whole coast.

   WHY OPEN-METEO. It is the only source checked on 2026-09-17 that has a marine
   product covering this point, needs no API key, and answers a browser directly
   (access-control-allow-origin: *, verified with a real Origin header). A key
   would have to ship in this file, world-readable, on a static site with no
   backend to hide it behind. OpenWeatherMap has no marine product at any tier;
   Surfline and surf-forecast publish no API and forbid derivative use; the US
   National Weather Service returns InvalidPoint here because Costa Rica is
   outside its domain; IMN Costa Rica publishes nothing machine-readable.
   Its terms carry no safety-of-life prohibition, only an as-is disclaimer, and
   the free tier is non-commercial, which is what Caribbean Guard is. CC-BY 4.0,
   so the credit line is a licence condition and not a courtesy: do not remove it.

   ONE REQUEST, NOT FIVE, AND NOT PER BEACH. See the .sea note in the stylesheet.

   IT IS A FORECAST AND THE COPY SAYS SO. There is no wave OBSERVATION anywhere
   near here: the nearest NDBC buoy is 42058 at about 830 km, and its wave height
   field currently reads missing. Every number below is a model output, every
   label says "modelo", and the timestamp is the model's own hour rather than the
   time we fetched it. This page is allowed to say what a model predicts. It is
   not allowed to say what the sea is doing, which is the same sentence at the
   bottom of every beach sheet.

   AND IT COMPUTES NO VERDICT. No provider publishes a rip current index for
   Costa Rica, so a swim / no-swim line here would be Caribbean Guard asserting a
   threshold that nobody at Caribbean Guard has signed. Daniel's ruling
   2026-09-17: show the numbers, let the four tiers carry the instruction. When
   the guards give us wave heights they actually close a beach at, that belongs
   on the TODAY axis with a name on it, not in this strip. */
const SEA_URL = "https://marine-api.open-meteo.com/v1/marine" +
  "?latitude=9.647&longitude=-82.727" +
  "&current=wave_height,wave_period,wave_direction,sea_surface_temperature" +
  "&timezone=America%2FCosta_Rica";
const SEA_STALE_H = 3;
const seaEl = document.getElementById("sea");
let seaData = null;

/* One land-weather model point for the region. Open-Meteo currently resolves
   all five beach coordinates to the same default grid cell, so repeating the
   request per beach would imply precision the model does not have. This panel
   is weather context only; it never changes the swimming instruction. */
const WEATHER_URL = "https://api.open-meteo.com/v1/forecast" +
  "?latitude=9.65&longitude=-82.74" +
  "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +
  "&cell_selection=nearest&timezone=America%2FCosta_Rica" +
  "&timeformat=unixtime&forecast_days=1";
const WEATHER_STALE_H = 3;
let weatherData = null;

function weatherCondition(code){
  const t = T[lang];
  if(code === 0) return t.weatherClear;
  if(code >= 1 && code <= 3) return t.weatherClouds;
  if(code === 45 || code === 48) return t.weatherFog;
  if(code >= 95) return t.weatherStorm;
  if((code >= 51 && code <= 82)) return t.weatherRain;
  return t.weatherMixed;
}
function renderWeatherPanel(){
  const t = T[lang], c = weatherData;
  const valid = c && Number.isFinite(c.time) &&
    [c.temperature_2m,c.relative_humidity_2m,c.wind_speed_10m].every(Number.isFinite) &&
    Math.abs(Date.now() / 1000 - c.time) <= WEATHER_STALE_H * 3600;
  const at = valid ? new Date(c.time * 1000).toLocaleTimeString(
    lang === "es" ? "es-CR" : "en-GB",
    {timeZone:"America/Costa_Rica",hour:"2-digit",minute:"2-digit"}) : "";
  const metric = (label, value) => `<div><span>${label}</span><strong>${value}</strong></div>`;
  return `<section class="sheet-weather" aria-label="${t.weatherTitle}">
    <div class="weather-head"><span class="eyebrow">${t.weatherTitle}</span>
      <span class="weather-time">${valid ? `${t.weatherModel} · ${at} CR` : t.weatherModel}</span></div>
    ${valid ? `<div class="weather-metrics">
      ${metric(t.weatherAir, Math.round(c.temperature_2m) + "°C")}
      ${metric(t.weatherWind, Math.round(c.wind_speed_10m) + " km/h")}
      ${metric(t.weatherHumidity, Math.round(c.relative_humidity_2m) + "%")}
    </div><p class="weather-foot">${weatherCondition(c.weather_code)} · ${t.weatherScope}
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>`
    : `<p class="weather-empty">${t.weatherUnavailable}</p>`}
  </section>`;
}
function refreshWeatherPanel(){
  const panel = sheetBody.querySelector(".sheet-weather");
  if(panel){ panel.outerHTML = renderWeatherPanel(); requestAnimationFrame(fitZoneDetail); }
}
function fitZoneDetail(){
  const detail = sheetBody.querySelector('.zone-detail');
  if(!detail) return;
  detail.classList.remove('compact-weather','weather-hidden');
  if(window.innerWidth < 820 || window.innerHeight <= 760) return;
  if(detail.scrollHeight > detail.clientHeight + 2) detail.classList.add('compact-weather');
  if(detail.scrollHeight > detail.clientHeight + 2) detail.classList.add('weather-hidden');
}
window.addEventListener('resize', ()=>requestAnimationFrame(fitZoneDetail));
fetch(WEATHER_URL, {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    const c = d && d.current;
    if(!c || c.temperature_2m == null) throw new Error("no weather values");
    weatherData = c;
    refreshWeatherPanel();
  })
  .catch(err => console.warn("[cg] regional weather did not load:", err));

function seaDir(deg){
  const d = T[lang].seaDirs;
  return d[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
}

function renderSea(){
  if(!seaData){ seaEl.hidden = true; return; }
  const t = T[lang], c = seaData;
  /* The model's own hour, parsed as LOCAL. Open-Meteo returns "2026-09-17T12:00"
     with no zone because we asked for America/Costa_Rica, and new Date() on a
     bare string like that is local in every browser that matters. Appending "Z"
     here, or asking for UTC, would print a reading three hours off on the one
     line whose whole job is saying when. */
  const at = new Date(c.time.replace(" ", "T"));
  const ageH = (Date.now() - at.getTime()) / 3600000;
  const stale = ageH > SEA_STALE_H;
  const hhmm = at.toLocaleTimeString(lang === "es" ? "es-CR" : "en-GB",
                                     {hour:"2-digit", minute:"2-digit"});
  const col = (kind, val, lbl) =>
    `<div class="col"><span class="tile" aria-hidden="true">${CGSymbols.svg(kind)}</span>
       <span class="val">${val}</span><span class="lbl">${lbl}</span></div>`;
  seaEl.className = "sea" + (stale ? " stale" : "");
  seaEl.hidden = false;
  seaEl.innerHTML = `
    <div class="cols" style="--from:${Math.round(((c.wave_direction % 360) + 360) % 360)}deg">
      ${col("wave",   c.wave_height.toFixed(1) + " m", t.seaWave)}
      ${col("period", Math.round(c.wave_period) + " s", t.seaPeriod)}
      ${col("from",   seaDir(c.wave_direction), t.seaFrom)}
      ${col("temp",   Math.round(c.sea_surface_temperature) + "°C", t.seaTemp)}
    </div>
    <div class="foot"><div>${stale ? t.seaStale(SEA_STALE_H) + " " : ""}${t.seaAll}</div>
      <div>${t.seaCredit} <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
      <span class="stamp"> · ${t.seaModel(hhmm)}</span></div></div>`;
}

/* NETWORK-FIRST WITH A CACHED FALLBACK, and no precache entry.
   The service worker must never hold this: a precached sea state would be
   served from disk on a visit weeks later and would look current. The fetch is
   allowed to fail silently and the strip simply does not render, because a
   coast with no sea strip reads as "no reading", which is true, while a strip
   with an old number reads as a reading, which is not. That is the same
   argument as the geometry fetch above, inverted: geometry failing is worth
   shouting about because a coast with no strokes looks safe; the sea failing is
   not, because the four tiers do not depend on it. */
fetch(SEA_URL, {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    const c = d && d.current;
    if(!c || c.wave_height == null){ throw new Error("no marine values"); }
    seaData = c;
    renderSea();
    measureDock();
  })
  .catch(err => console.warn("[cg] sea state did not load:", err));

const SW_SUPPORTED = "serviceWorker" in navigator;
const standalone = () => window.matchMedia("(display-mode: standalone)").matches ||
                         navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

let installPrompt = null;     // Chromium's beforeinstallprompt, stashed
let savedAt = null;           // when the cache was last written, from the worker

/* The saved bar is no longer a bar. It is one 12 px line inside .dockrow,
   sharing that line with the legend chip and the strip counter, because on a
   390 px phone every row of chrome is a row of map the reader does not get.
   It still says the same three things it always said: that the page is saved
   on this device, when, and how to refresh it by hand. */
const savedTxt = document.getElementById("saved-txt");
const savedRf  = document.getElementById("saved-refresh");

/* A failure message has to survive long enough to be read. The worker broadcasts
   the saved date on several occasions, and an ordinary re-render arriving a
   moment after a failed refresh would quietly replace "no signal" with a
   reassuring date. Holding the failure for a few seconds is the difference
   between telling somebody their refresh did not happen and pretending it did. */
let failUntil = 0, failTimer = null;
function renderSaved(state){
  const t = T[lang];
  if(state === "failed"){
    failUntil = Date.now() + 8000;
    // and then hand the date back, because the date is the more useful of the
    // two things this strip can say and a bar stuck on an error has stopped
    // answering "how old is what I am reading"
    clearTimeout(failTimer);
    failTimer = setTimeout(()=>{ failUntil = 0; renderSaved(); }, 8000);
  } else if(!state && Date.now() < failUntil){
    return;
  }
  savedTxt.textContent =
      state === "refreshing" ? t.savedRefreshing
    : state === "failed"     ? t.savedFailed
    : !SW_SUPPORTED          ? t.savedNoStore
    : savedAt                ? t.savedAt(fmtStamp(savedAt))
    : t.savedNever;
  savedRf.classList.toggle("busy", state === "refreshing");
  savedRf.disabled = state === "refreshing";
  measureDock();
}

/* The explanation, on tap. Everything in here is a statement about what this
   page does, not a promise about what the sea is doing, so it is the one sheet
   in the file with no hazard colour in it at all. */
function openSaved(){
  const t = T[lang];
  const when = savedAt ? t.savedAt(fmtStamp(savedAt)) : t.savedNever;
  let install = "";
  if(standalone()){
    install = `<p class="caveat">${t.savedInstalled}</p>`;
  } else if(installPrompt){
    install = `<div class="actions"><button class="btn primary wide" id="do-install">${t.installBtn}</button></div>`;
  } else if(isIOS()){
    install = `<p class="caveat">${t.installIos}</p>`;
  }
  const html = `
    <h2 id="sheet-title" tabindex="-1">${t.savedTitle}</h2>
    <p class="sub">${when}</p>
    ${SW_SUPPORTED
      ? `<p class="why">${t.savedWhatIs}</p>
         <p class="prov"><span class="row">${t.savedCadence}</span></p>
         ${isIOS() && !standalone() ? `<p class="caveat">${t.savedIos}</p>` : ""}`
      : `<p class="why">${t.savedNoSw}</p>`}
    ${install}
    ${sheetFoot()}`;
  openSheet(html, openSaved);
  const btn = document.getElementById("do-install");
  if(btn) btn.onclick = ()=>{
    const p = installPrompt; installPrompt = null;
    closeSheet();
    if(p) p.prompt();
  };
}
savedTxt.onclick = openSaved;

/* Manual refresh. Asks the worker to re-fetch everything from the network and
   report back, then reloads so the page the user is looking at is the new one.
   Without signal it says so and leaves the saved copy alone. */
savedRf.onclick = ()=>{
  if(!navigator.serviceWorker.controller){ location.reload(); return; }
  renderSaved("refreshing");
  const ch = new MessageChannel();
  const done = setTimeout(()=>renderSaved("failed"), 15000);
  ch.port1.onmessage = e=>{
    clearTimeout(done);
    if(e.data && e.data.ok){ location.reload(); }
    else renderSaved("failed");
  };
  navigator.serviceWorker.controller.postMessage({action:"REFRESH"}, [ch.port2]);
};

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  installPrompt = e;
});

if(SW_SUPPORTED){
  /* updateViaCache:"none" so the browser never serves a cached sw.js and the
     update check is real. */
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"})
    .then(reg=>{
      /* Surfrider's update prompt, which is the part people forget. A cache-first
         safety map that cannot say "the verdicts you are reading are the old
         ones, tap for today's" will show a stale verdict forever, which is the
         failure the provenance machinery exists to prevent, one layer down. */
      const banner = document.getElementById("update");
      function offerUpdate(worker){
        const t = T[lang];
        document.getElementById("update-msg").textContent = t.updateMsg;
        document.getElementById("update-go").textContent  = t.updateGo;
        banner.classList.add("show");
        stackBanners();
        document.getElementById("update-go").onclick = ()=>{
          banner.classList.remove("show");
          stackBanners();
          worker.postMessage({action:"SKIP_WAITING"});
        };
        document.getElementById("update-no").onclick = ()=>{
          banner.classList.remove("show"); stackBanners();
        };
      }
      if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          // only when there is already a controller: the very first install is
          // not an update and must not raise a banner
          if(nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });
      // check again when the page comes back to the foreground, which on a phone
      // is the moment somebody has walked down to the beach and reopened it
      document.addEventListener("visibilitychange", ()=>{
        if(!document.hidden) reg.update().catch(()=>{});
      });
    })
    .catch(()=>{ /* no worker: renderSaved() already says the page is not saved */ });

  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });

  // the worker reports when it last wrote the cache
  navigator.serviceWorker.addEventListener("message", e=>{
    if(e.data && e.data.savedAt){
      savedAt = new Date(e.data.savedAt);
      renderSaved();
    }
  });
  navigator.serviceWorker.ready.then(reg=>{
    if(reg.active) reg.active.postMessage({action:"SAVED_AT"});
  });

  /* WebKit's storage policy grants persistence on heuristics, and one of them is
     whether the site is a Home Screen web app. Asking costs one line and it is
     the documented mechanism by which the cache survives on the platform most
     tourists are carrying. */
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
renderSaved();

/* ---------- QR deep links:  ?z=cocles   or   ?p=est2 ----------
   The URL carries the LOCAL part of the namespaced id, not the whole id. QR codes
   go on aluminium bolted to a post and are the least revisable thing this project
   will produce, so the shortest stable form wins and ?z=cocles keeps working. */
(function(){
  setLang(lang);
  renderLocate();
  /* The dock is the rail on desktop and a band on a phone, and which one it is
     changes the map's padding, the locate control and whether the legend is a
     sheet or a column. Nothing here reads a stored breakpoint, so a window
     dragged across 820 px settles correctly. */
  window.addEventListener("resize", ()=>{ renderLocate(); });
  layoutPanels();
  const q=new URLSearchParams(location.search);
  if(q.toString()) history.replaceState(null, "", location.pathname);
  const z=ZONES.find(x=>localId(x.id)===q.get("z"));
  const b=UNASSESSED_BEACHES.find(x=>localId(x.id)===q.get("b"));
  const p=POSTS.find(x=>localId(x.id)===q.get("p"));
  /* Open from the full-coast view rather than jumping straight in. The fly is
     what tells someone who just scanned a QR code where on the coast they are. */
  if(z){ setTimeout(()=>openZone(z),350); }
  else if(b){ setTimeout(()=>openUnassessedBeach(b),350); }
  else if(p){ setTimeout(()=>openPost(p),350); }

  /* The install nudge, which is what "Guarde esta página" was reaching for. It
     fires only when it is true: installing is possible, the page is not already
     installed, and the reader has not dismissed it before. */
  if(standalone() || !SW_SUPPORTED) return;
  let seen = false;
  try{ seen = localStorage.getItem("cg-install-nudge") === "1"; }catch(e){}
  if(seen) return;
  setTimeout(()=>{
    if(standalone()) return;
    if(!installPrompt && !isIOS()) return;   // nothing to instruct on this platform
    say(T[lang].installNudge, 7000);
    try{ localStorage.setItem("cg-install-nudge","1"); }catch(e){}
  }, 4000);
})();
</script>
</body>
</html>
