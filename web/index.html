/* Follow the phone's locale, with Spanish as the floor.

   Following the locale is right: this coast is mostly read by tourists, and a
   tourist's phone is usually in their own language. Spanish as the floor is also
   right: Caribbean Guard is a Costa Rican organisation writing in Spanish, so an
   unrecognised locale should land on the language of the place, not on English.

   Walking `navigator.languages` rather than only `navigator.language` matters for
   the case in between. A German phone set to ["de-DE", "en-GB"] has stated that
   it prefers English over nothing, and we publish English, so it gets English.
   A phone set to ["de-DE"] alone has stated no preference we can honour, and
   falls to Spanish. That is a preference being respected in the first case and a
   fallback being applied in the second, which are different things.

   The two-language check is deliberately explicit rather than
   `startsWith("en") ? "en" : "es"`. That earlier form silently sent every
   non-English locale to Spanish, which happens to be the same answer most of the
   time and for the wrong reason. */
function pickLang(){
  const tags = (navigator.languages && navigator.languages.length)
    ? navigator.languages
    : [navigator.language || ""];
  for(const tag of tags){
    const base = String(tag).toLowerCase().split("-")[0];
    if(base === "en") return "en";
    if(base === "es") return "es";
  }
  return "es";   // the floor, and it is the language of the coast
}
let lang = pickLang();

/* Map graphics drawn straight onto photography, so the job
   here is separating the three tiers FROM EACH OTHER rather than from a page
   background. They are separated by brightness, not hue, because hue is the first
   thing a sun-washed screen loses:
       moderate  L 0.545   ---- 3.19:1 ----+
       low       L 0.251   -- 1.98:1 --+   |
       high      L 0.137   -- 1.52:1 --+---+
   The dark #9C5C00 moderate is deliberately NOT used here: against high it
   measures 1.06:1, which on a map line is indistinguishable. It stays reserved
   for text and dots on white, where it is the value that passes 4.5:1. */
const COLOR = {low:"#1f9d55", moderate:"#f5b942", high:"#c62828"};

/* ============================================================
   3. THE TWO AXES, AND THE THREE WAYS OF NOT KNOWING

   Absence gets drawn, never hidden. Safeswim publishes eleven pin types and two
   of them are kinds of not knowing: grey means the feed broke, and a separate
   "water safety information only" pin means this beach was never in the
   programme at all. Different facts, different marks.

   Ours has three, and they can co-occur, so they render as a STACK of marks and
   never as one banner:

     never       nobody at Caribbean Guard has ever reviewed this beach
     expired     somebody did, too long ago
     unsurveyed  this stretch is outside the annotated sheet the hazards came off

   The third is the one that matters most and it was the one least visible: the
   sheet covers 1.86 km of 16.66 km, and the map used to say so in a toast that
   fired six seconds after load and then vanished. An absence rendered as nothing
   is indistinguishable from an absence of hazard, which is the precise misreading
   the coverage caveat exists to prevent. It is now a permanent card in the picker
   and a permanent mark on every beach it applies to.
   ============================================================ */

/* The stretch Caribbean Guard's annotated sheet actually covers, in longitude.
   Seeded from the shipped data so the picker can render before the fetch
   resolves, then recomputed from the fetched features so it can never drift from
   what is drawn. The coast runs broadly east to west, so a longitude interval is
   the right shape for this and a bounding box would overstate it. */
let SURVEY = {w:-82.724144, e:-82.707199};

function surveyRelation(z){
  const lons = z.line.map(p=>p[1]);
  const lo = Math.min(...lons), hi = Math.max(...lons);
  if(hi < SURVEY.w || lo > SURVEY.e) return "out";
  if(lo >= SURVEY.w && hi <= SURVEY.e) return "in";
  return "partial";
}

/* Days elapsed since a YYYY-MM-DD, built in LOCAL time.
   new Date("2026-07-01") parses as UTC midnight, and formatting that anywhere
   west of Greenwich renders the previous day, so a review dated the 1st displayed
   as 30 June. On fields whose entire purpose is saying when, an off by one day is
   not acceptable. */
function localDate(ymd){
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(d){
  return d.toLocaleDateString(lang === "es" ? "es-CR" : "en-GB",
                              {year:"numeric", month:"long", day:"numeric"});
}
function fmtStamp(d){
  return d.toLocaleString(lang === "es" ? "es-CR" : "en-GB",
                          {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}

/* ---- axis 1: character ---- */
function characterState(z){
  const r = z.character.reviewed;
  if(!r) return {gap:"never"};
  const on = localDate(r.on);
  const days = Math.floor((Date.now() - on.getTime()) / 86400000);
  return days > CHARACTER_VALID_DAYS
    ? {gap:"expired", reviewed:r, on, days}
    : {reviewed:r, on, days};
}

/* ---- axis 2: today ---- */
function todayState(z){
  const t = z.today;
  if(!t) return null;
  const at = new Date(t.at);
  const hours = (Date.now() - at.getTime()) / 3600000;
  return {notice:t.notice, at, hours, stale: hours > TODAY_VALID_HOURS, rec:t};
}
/* Only a signed, unexpired notice draws on the map, and `normal` draws nothing:
   "a guard looked and found nothing unusual" adds no mark, because the mark would
   read as an all clear and that is not what it says. */
function todayHalo(z){
  const s = todayState(z);
  if(!s || s.stale || s.notice === "normal") return null;
  return "#7b1fa2";
}

/* ---- the three absences, as data ---- */
function absences(z){
  const t = T[lang], out = [];
  const c = characterState(z);
  //                 css            mark   card tag           sheet heading + sentence
  if(c.gap === "never")
    out.push({css:"never",      mk:"?", tag:t.gapNeverTag,      short:t.gapNeverShort,      long:t.gapNever});
  if(c.gap === "expired")
    out.push({css:"expired",    mk:"!", tag:t.gapExpiredTag,    short:t.gapExpiredShort,    long:t.gapExpired});
  const rel = surveyRelation(z);
  if(rel === "out")
    out.push({css:"unsurveyed", mk:"⌀", tag:t.gapUnsurveyedTag, short:t.gapUnsurveyedShort, long:t.gapUnsurveyed});
  if(rel === "partial")
    out.push({css:"unsurveyed", mk:"◐", tag:t.gapPartialTag,    short:t.gapPartialShort,    long:t.gapPartial});
  return out;
}

/* One row of marks on the card: a signed bulletin first if there is one, then
   every absence that applies. One container, so a beach that is both unreviewed
   and unsurveyed shows two marks side by side rather than two stacked rows. */
function cardChips(z){
  const t = T[lang], s = todayState(z);
  const chips = [];
  if(s && !s.stale)
    chips.push(`<span class="gap today"><span class="mk" aria-hidden="true">●</span>${t.axisToday}</span>`);
  absences(z).forEach(a=>
    chips.push(`<span class="gap ${a.css}"><span
      class="mk" aria-hidden="true">${a.mk}</span>${a.tag}</span>`));
  return chips.length ? `<span class="gaps">${chips.join("")}</span>` : "";
}
function gapList(z){
  const g = absences(z);
  if(!g.length) return "";
  return `<ul class="gaplist">${g.map(a=>
    `<li class="${a.css}">
       <span class="mk" aria-hidden="true">${a.mk}</span>
       <span><b>${a.short}</b>${a.long}</span>
     </li>`).join("")}</ul>`;
}

/* ---- provenance, two fields, following OVSICORI ----
   Autor and Revisado are different claims and they render as different rows.
   Collapsing them is how a machine reading of a published graphic gets read as a
   lifeguard's word. The empty review state renders visibly rather than hiding:
   theirs prints a bare "-", ours says who is missing. */
function provenance(rec){
  const t = T[lang];
  const authored = t["authored" + rec.authored.charAt(0).toUpperCase() + rec.authored.slice(1)];
  const r = rec.reviewed;
  let reviewed, stale = "";
  if(!r){
    reviewed = t.reviewedNobody;
  } else {
    const on = localDate(r.on);
    const days = Math.floor((Date.now() - on.getTime()) / 86400000);
    reviewed = t.reviewedBy(r.by, r.org, fmtDate(on));
    if(days > CHARACTER_VALID_DAYS) stale = " " + t.charStale(CHARACTER_VALID_DAYS);
  }
  return `<p class="prov${!r || stale ? " unverified" : ""}">
    <span class="row"><b>${t.provAuthor}:</b> ${authored}</span>
    <span class="row"><b>${t.provReviewed}:</b> ${reviewed}${stale}</span>
  </p>`;
}

/* ---- the today block, always rendered, including when it is empty ----
   Rendered empty and grey rather than empty and amber. Nobody signing a bulletin
   is the ordinary state on 16 km of coast run by one association, and an amber
   alarm shown every single day teaches people that amber means nothing. */
function todayBlock(z){
  const t = T[lang], s = todayState(z);
  if(!s){
    return `<p class="axis">${t.axisToday}</p>
      <div class="today none">
        <p class="verdict"><span class="badge">${t.axisToday}</span>${t.todayNone}</p>
        <p class="stamp">${t.todayNoneWhy}</p>
      </div>`;
  }
  const label = {"no-swim":t.todayNoSwim, "care":t.todayCare, "normal":t.todayNormal}[s.notice];
  const rider = s.notice === "normal" ? `<p class="rider">${t.todayNormalRider}</p>` : "";
  const old   = s.stale ? `<p class="rider">${t.todayStale(TODAY_VALID_HOURS)}</p>` : "";
  return `<p class="axis">${t.axisToday}</p>
    <div class="today signed${s.stale ? " stale" : ""}">
      <p class="verdict"><span class="badge">${t.axisToday}</span>${label}</p>
      <p class="stamp">${t.todaySigned(s.rec.by, s.rec.org, fmtStamp(s.at))}</p>
      ${old}${rider}
    </div>`;
}

/* ---------- map ---------- */
const BB = L.latLngBounds(IMG_BOUNDS);
const SAFE = L.latLngBounds(IMG_SAFE);
const map = L.map("map",{
  zoomControl:false, attributionControl:true,
  maxBounds:BB.pad(0.02), maxBoundsViscosity:1.0,
  maxZoom:18, zoomSnap:0.25, tap:true
});
/* Ship the 45 KB overview and nothing else, then fetch the 1.19 MB base only when
   somebody actually zooms or pans past the default view.

   Measured: at the default letterboxed zoom the overlay is 372x125 CSS px, which is
   1116x375 device px at DPR 3, and the overview is 1000 px wide. They are already at
   the same effective resolution, so the full base buys nothing visible there. Someone
   who scans a QR code, reads their status off the card and pockets the phone never
   downloads it, and the whole map costs them under 90 KB. Only someone who zooms pays,
   at the moment they ask for it.

   The overview stays underneath rather than being swapped out, so there is never a
   blank frame. Both overlays resolve to the same rect in the same absolutely
   positioned pane, so the upgrade cannot reflow anything: measured CLS is exactly 0. */
const backdrop = L.imageOverlay("img/base-lo.webp", IMG_BOUNDS,
  {alt:"", className:"backdrop", interactive:false, zIndex:1}).addTo(map);
L.imageOverlay("img/base-lo.webp", IMG_BOUNDS,
  {alt:"Costa de Talamanca", zIndex:2}).addTo(map);

let baseLoaded = false;
function loadFullBase(){
  if(baseLoaded) return;
  baseLoaded = true;
  const full = L.imageOverlay("img/base.webp", IMG_BOUNDS,
                              {opacity:0, alt:"", zIndex:3});
  full.addTo(map);
  const el = full.getElement();
  if(el){ el.fetchPriority = "low"; el.setAttribute("aria-hidden","true"); }
  full.once("load", ()=>full.setOpacity(1));
}
// Armed AFTER the opening view settles. fitCoast() calls fitBounds, which fires
// zoomend, so arming here would trigger the fetch on load and defeat the point.
function armBaseUpgrade(){
  map.once("zoomend", loadFullBase);
  map.once("dragend", loadFullBase);
}
map.attributionControl.setPrefix("").addAttribution("Caribbean Guard");

/* Contain, do not cover. This was cover-fit, and on a 390px portrait phone that
   blew a 3.5:1 coast up until you could see about 370 m of it: all water, no
   headland, nothing telling you which beach you were looking at. Someone who has
   just scanned a QR code needs orientation in the first second, so show the whole
   16.6 km and let the empty bands above and below be the page background. The
   image carries alpha for the same reason, so the rotated corners read as
   background rather than as black wedges. */
function chrome(){
  return {
    top: (document.querySelector(".topbar")?.offsetHeight || 64) + 8,
    // the dock, not the picker: the saved-copy bar sits above the cards inside it
    bot: (document.querySelector(".dock")?.offsetHeight || 96) + 8
  };
}

/* The chrome must never be allowed to consume the viewport.

   getBoundsZoom() subtracts the padding from the map size. Hand it a padding
   larger than the map and the scale it computes is garbage, which Leaflet then
   clamps to maxZoom. That garbage becomes the zoom floor via setMinZoom(), and
   every branch below lands on it. Measured before this clamp existed: a 400x200
   viewport, where the topbar and dock total 216 px, drew the 744 px coast at
   28,299 px wide, a 38x overzoom that is stable rather than transient because the
   floor has latched.

   That is reachable two ways. A genuinely short landscape window, and, more
   importantly, the middle of a phone rotation: the viewport passes through very
   short intermediate shapes, and the refit fires immediately on rotation by
   design, so it fires straight into one.

   Capping total padding at 60 percent of the axis means the dock may overlap the
   map on a very short window. That is strictly better than the map being
   unreadable, and it only ever engages below about 360 px of height. */
function fitPadding(){
  const c = chrome(), size = map.getSize();
  let top = c.top, bot = c.bot;
  const capY = size.y * 0.6;
  if(top + bot > capY && top + bot > 0){
    const k = capY / (top + bot);
    top = Math.floor(top * k);
    bot = Math.floor(bot * k);
  }
  return {top, bot, x: Math.min(8, size.x * 0.3)};
}
/* Wide viewports COVER, narrow ones CONTAIN, and the difference is not cosmetic.

   The coast is a 3:1 strip. On a landscape desktop window the image can fill the
   frame, so there is no reason to ever show the page behind it: the floor is set
   to the cover zoom and the background never appears. On a portrait phone cover
   would blow the image up until you can see about 370 m of a 16.6 km coast, all
   water and no landmark, which is the failure this file already fixed once. So
   there the floor stays at contain and the empty bands are page colour on purpose.

   maxBounds is tightened to the image itself at the same time, otherwise you can
   still pan the background into view without zooming at all. */
function wide(){ return window.matchMedia("(min-width:760px) and (orientation:landscape)").matches; }

/* `keepView` is passed by the resize path and by nothing else.

   A viewport change always has to recompute the zoom floor, the backdrop and the
   pan limit, because all three are derived from what the viewport can reach. It
   does NOT have to move the camera. Somebody who has zoomed into Cocles and then
   rotates the phone wants to still be looking at Cocles: refitting the whole
   coast under them throws away the thing they navigated to, which on a 16 km
   strip means finding their beach again. So the limits are always recomputed and
   the camera is only reset when it was sitting at the floor anyway, where a
   refit is exactly what is wanted. */
function fitCoast(opts){
  const keepView = !!(opts && opts.keepView);
  const hadZoom = map.getZoom(), hadCentre = map.getCenter();

  /* Refresh Leaflet's cached container size FIRST, before anything reads it.
     Leaflet caches the container size in map._size and only recomputes it in
     invalidateSize(). Without this line getSize(), getBoundsZoom(), fitBounds()
     and sizeBackdrop() all compute against the viewport as it was at load, so
     rotating a phone to landscape left a 1052 px wide image inside a 502 px
     viewport. On a 3:1 coast, rotating to see more of it is the most natural
     gesture there is, and it produced a dark blurred rectangle with no
     coastline. Do not remove this. */
  map.invalidateSize({animate:false, pan:false});

  /* Release the pan limit BEFORE fitting, and only then recompute it.
     maxBounds is derived from the backdrop, which is itself sized for the
     viewport that was current when it was last computed. Leaving the old limit
     in force means fitBounds gets dragged back toward the previous viewport's
     centre, and because each fit then starts from an already-displaced centre
     the error compounds: successive resizes walked the map to y=1350, entirely
     below the fold. */
  map.setMaxBounds(null);

  // Clear the floor too. getBoundsZoom clamps its own result to the current
  // minZoom, so setting minZoom from it ratchets upward on every call and the
  // map slowly loses the ability to show the whole coast.
  // Read whether the user was at the floor BEFORE clearing it, or the comparison
  // is against 0 and every view looks zoomed in.
  const wasAtFloor = Math.abs(hadZoom - map.getMinZoom()) < 0.01;
  map.setMinZoom(0);

  // Contain everywhere. Seeing all 16.6 km at once is worth more than never
  // showing the page behind the map: the whole point of the overview is knowing
  // which beach you are looking at, and a cover fit on this 3:1 strip zooms in
  // far enough to lose that on every viewport shape. The empty bands are the
  // app's own navy, so they read as a deliberate letterbox rather than a gap.
  // Padding is read AFTER invalidateSize, because it is clamped against the map
  // size and that size has just changed.
  const c = fitPadding();
  const pad = L.point(c.x, c.top).add(L.point(c.x, c.bot));
  // Derive the floor from getBoundsZoom, NOT from getZoom() after fitBounds.
  // fitBounds animates, so on the next line getZoom() is still the OLD zoom and
  // the floor lands above the fit: the map then sits below its own minimum and
  // snaps upward on the first interaction.
  let z = map.getBoundsZoom(BB, false, pad);
  // Belt and braces. fitPadding() makes a degenerate padding impossible, but a
  // non-finite floor here would latch into setMinZoom and poison every later
  // fit, so it is worth one line to never store one.
  if(!isFinite(z)) z = map.getBoundsZoom(BB, false, L.point(0, 0));

  // No slack below the fit. Zooming out past the whole coast only ever buys more
  // empty space, so the floor IS the fit.
  map.setMinZoom(z);
  sizeBackdrop(z);
  // Pan limit is the BACKDROP, not the image. Clamping to the image looks right
  // and breaks flyClear: offsetting the centre so a zone clears the bottom sheet
  // pushes the viewport past the image edge, maxBounds drags it back, and the
  // zone the user just asked about ends up behind the sheet. The backdrop is
  // large enough to absorb that offset and there is no flat fill inside it.
  map.setMaxBounds(backdrop.getBounds());

  if(keepView && !wasAtFloor){
    // Limits rebuilt for the new viewport, camera left where the user put it.
    // Math.max because the new floor can be HIGHER than the old zoom: rotating a
    // phone to landscape raised the floor from 12 to 12.75 here, and leaving the
    // camera below its own minimum is the bug the getBoundsZoom comment above
    // describes. setMaxBounds has already been applied, so an off-limit centre is
    // clamped by Leaflet rather than by us.
    map.setView(hadCentre, Math.max(hadZoom, z), {animate:false});

    /* Safety net, and it is the whole point of this function.

       maxBounds is the BACKDROP rather than the image, deliberately, so that
       flyClear can offset the centre off the image to clear the bottom sheet.
       The backdrop is sized for the viewport at the ZOOM FLOOR, so it is enormous
       in geographic terms, and a centre that is a harmless few pixels off the
       image at the floor is thousands of pixels off it when zoomed in. Rotating
       from that state left the coast 2,900 px above the viewport: measured, box
       [-235, -2925, 742, -2257] in an 845x502 window.

       So preserving the view is conditional on the view still containing some
       coast. If keeping it would show nothing but blurred backdrop, it is not a
       view worth keeping, and the whole coast is strictly better than a blank
       rectangle. This makes "the map is gone" structurally unreachable from any
       viewport change, rather than fixed one cause at a time. */
    if(map.getBounds().intersects(BB)) return;
  }
  // animate:false because this is a layout correction, not a journey. An
  // animated refit during a rotation is a camera moving under somebody's thumb,
  // and it also leaves the map in an intermediate state that nothing can assert
  // against.
  map.fitBounds(BB, {paddingTopLeft:[c.x, c.top], paddingBottomRight:[c.x, c.bot],
                     animate:false});
}
/* Stretch the backdrop to cover whatever the viewport can reach at the zoom
   floor, computed rather than guessed: a portrait phone leaves bands several
   times the height of the strip, a landscape desktop leaves far less, and a
   fixed padding would be wrong on both. */
function sizeBackdrop(floor){
  const size = map.getSize();
  const c = BB.getCenter();
  const nw = map.unproject(map.project(c, floor).subtract(size.divideBy(1.7)), floor);
  const se = map.unproject(map.project(c, floor).add(size.divideBy(1.7)), floor);
  const need = L.latLngBounds(nw, se);
  backdrop.setBounds(L.latLngBounds(
    [Math.min(need.getSouth(), BB.getSouth()), Math.min(need.getWest(), BB.getWest())],
    [Math.max(need.getNorth(), BB.getNorth()), Math.max(need.getEast(), BB.getEast())]));
}

map.setView(BB.getCenter(), 14);
fitCoast();
// after the opening fit has finished animating, not immediately: fitBounds emits
// zoomend asynchronously, so arming synchronously still catches its own event
map.whenReady(()=>setTimeout(armBaseUpgrade, 400));

/* Refit on anything that changes the viewport, debounced.

   `resize` alone is not enough coverage. iOS Safari fires `orientationchange`
   and then reports the OLD innerHeight for a frame or two, so a refit scheduled
   off that event measures the pre-rotation viewport and lands wrong; hence the
   trailing second pass. `visualViewport` covers the on-screen keyboard and the
   collapsing address bar, which resize does not reliably report on mobile.

   ROTATION IS NOT DEBOUNCED, and that is the point.

   A drag-resize on a desktop fires continuously and the intermediate sizes are
   meaningless, so it waits. A rotation is one discrete event whose intermediate
   size is the OLD one, and every millisecond spent waiting is a millisecond the
   coast is drawn at the previous orientation's width. Measured at a 150 ms
   debounce: 120 ms after rotating to landscape the strip was still 442 px wide in
   an 846 px viewport, reaching its correct 744 px only by 300 ms. Nobody rotates
   this map to recentre it; they rotate it to get more coast, so the thing they
   asked for must not be the thing that lags. */
let refitTimer = null, refitTrailing = null, rotateUntil = 0;
function runRefit(){
  measureDock(false);   // update --dock-h, do not let it fit as well
  fitCoast({keepView:true});
}
function refit(delay){
  // A rotation also emits `resize`, in either order and sometimes twice. While
  // a rotation is in flight every viewport event belongs to it, so none of them
  // may reintroduce the delay.
  clearTimeout(refitTimer);
  refitTimer = setTimeout(runRefit, Date.now() < rotateUntil ? 0 : delay);
}
window.addEventListener("resize", ()=>refit(150));
window.addEventListener("orientationchange", ()=>{
  rotateUntil = Date.now() + 800;
  refit(0);
  // iOS Safari reports the old innerHeight for a frame or two after this event,
  // so the immediate pass can land on stale metrics. Run again once it settles.
  clearTimeout(refitTrailing);
  refitTrailing = setTimeout(runRefit, 500);
});
if(window.visualViewport) window.visualViewport.addEventListener("resize", ()=>refit(150));

/* Watch the CONTAINER, not only the window, and this is the one that closes the
   load-during-resize case.

   The opening fit runs inline at parse time, against whatever the container
   measured at that instant. If the window is still being resized while the page
   is coming up, that measurement is of a viewport that no longer exists by the
   time anything is painted, and no `resize` event necessarily follows, because
   the resize was already in progress before any listener was attached. The map
   then sits at the wrong scale and offset until a reload: measured in a real
   Chrome window, the base landed at y=1278 in a 932 tall viewport, showing only
   the blurred backdrop.

   That is not a hypothetical. Rotating a phone while the page is still loading
   on weak signal is exactly the case, and weak signal is the condition this map
   is built for.

   A ResizeObserver reports the container's box whenever it changes, including
   changes that happened before it was attached, so the first callback is itself
   the correction. It also covers the mobile address bar collapsing, which
   `resize` reports inconsistently. It cannot loop: `#map` is `position:absolute;
   inset:0`, so fitting the map never changes the container's size. */
if(window.ResizeObserver){
  let seenFirst = false;
  new ResizeObserver(()=>{
    // The first callback fires on observe with the current box. Take it
    // immediately rather than debounced, because during load it IS the fix.
    refit(seenFirst ? 150 : 0);
    seenFirst = true;
  }).observe(document.getElementById("map"));
}
// Belt and braces for browsers without ResizeObserver, and for a viewport that
// settles after the document finishes loading.
window.addEventListener("load", ()=>refit(0));

/* Pattern and weight carry the tier independently of colour, so the map still
   works in sunlight, on a cheap screen, and for the 1 in 12 men who cannot
   separate red from green.

   The polarity here is deliberate and it is the reverse of what this file used to
   do. It previously drew the worst tier as a fine dotted line and the best as a
   solid one, which made the most dangerous thing on the map the faintest mark on
   it. Every convention a tourist already carries, road markings, hazard tape,
   warning signage, says the loud mark is the dangerous one. So high is now the
   heaviest and most solid, and low is the lightest. At a glance the map should
   shout hazard and merely note its absence, not the other way round.

   These three carry the CHARACTER, which is a property of the place. A bulletin a
   guard signed this morning is a property of the moment, so it never recolours
   these: it draws its own halo underneath. See todayHalo(). */
const STROKE = {
  high:     {weight:11, dash:null},     // heaviest, unbroken: a wall
  moderate: {weight:8,  dash:"16 10"},  // broken: proceed with care
  low:      {weight:5,  dash:"2 8"}     // lightest: a note, not a promise
};

/* Stroke weight and dash length are a function of zoom, not constants.

   At the whole-coast view an 11 px line is about 200 m wide on the ground and
   swallows the beach it describes; a 16 px dash gap closes up and "caution"
   stops looking dashed at all, so the pattern that carries the status for anyone
   who cannot separate the colours quietly disappears. Zoomed in to a single
   beach the same 11 px is a thread.

   Both scale, and the RATIO between the three weights is preserved at every
   zoom, because that ranking is the thing doing the work: the loudest mark is
   always the most dangerous one. */
function zoneStroke(tier){
  const base = STROKE[tier];
  const t = Math.max(0, Math.min(1, (map.getZoom() - 11.5) / 5.5));
  // 0.42x at the whole-coast view, 1.5x on a single beach. The low end matters
  // more than it looks: on a portrait phone the strip is only about 130 px tall,
  // so a stroke sized for desktop covers the beach it is describing.
  const k = 0.42 + t * 1.08;
  const out = {weight: Math.max(2.5, base.weight * k)};
  if(base.dash){
    // scale the pattern with the line, or a thin line gets a coarse dash and a
    // thick one gets a dotted texture that reads as a different status
    out.dashArray = base.dash.split(" ").map(n => Math.max(2, +n * k)).join(" ");
  }
  return out;
}

let zonesReady = false;
function restyleZones(){
  // fitCoast() emits zoomend during startup, before the zone layers exist.
  // `typeof layers === "undefined"` does NOT guard this: typeof still throws on a
  // const in the temporal dead zone. An ordinary flag does.
  if(!zonesReady) return;
  ZONES.forEach(z=>{
    const l = layers[z.id]; if(!l) return;
    const st = zoneStroke(tierOf(z));
    l.line.setStyle({weight: st.weight * (l.current ? 1.25 : 1),
                     dashArray: st.dashArray || null});
    if(l.halo) l.halo.setStyle({weight: st.weight * 2.4 + 6});
  });
}

/* ---------- draw zones ---------- */
const layers = {};
ZONES.forEach(z=>{
  const g = L.layerGroup().addTo(map);
  const st0 = zoneStroke(tierOf(z));

  /* A bulletin signed today draws UNDER the character stroke, never over it and
     never instead of it. If a guard signs "stay out today" at Punta Uva, the map
     has to shout, but recolouring the line would erase the standing character the
     moment somebody signed one calm morning, which is the exact conflation the
     two axis split exists to undo. A halo is additive: both claims stay legible
     and the character stroke stays on top. */
  const halo = todayHalo(z);
  let haloLayer = null;
  if(halo){
    haloLayer = L.polyline(z.line,{color:halo, weight:st0.weight * 2.4 + 6,
                                   opacity:.5, lineCap:"round"}).addTo(g);
  }

  // No casing. A translucent white stroke under every line read as a grey
  // sausage the colour sat inside, which is worse than the legibility problem it
  // was there to solve. The strokes carry their own contrast: the map darkens
  // under them instead (see .leaflet-overlay-pane filter).
  const line = L.polyline(z.line,{color:COLOR[tierOf(z)],
                                  weight:st0.weight,
                                  dashArray:st0.dashArray || null,
                                  opacity:1,lineCap:"round"}).addTo(g);
  const hit = L.polyline(z.line,{color:"#000",weight:44,opacity:0}).addTo(g);
  hit.on("click",()=>openZone(z));
  layers[z.id]={line, halo:haloLayer};
});
zonesReady = true;
map.on("zoomend", restyleZones);
restyleZones();

const postMarkers = {};
POSTS.forEach(p=>{
  const icon = L.divIcon({className:"", html:`<div class="po ${p.kind}">${p.n}</div>`,
    iconSize:[30,30], iconAnchor:[15,15]});
  postMarkers[p.id] = L.marker(p.ll,{icon}).addTo(map).on("click",()=>openPost(p));
});

/* Move the markers onto the authoritative geometry once it arrives, and say so
   if the inline fallback had drifted. Silent preference for one of two copies is
   how the duplicate went unnoticed for as long as it did. */
function joinStations(gj){
  gj.features.forEach(f=>{
    if(f.properties.kind !== "rescue_station") return;
    const p = POSTS.find(x=>x.id === f.id);
    if(!p){ console.warn("[cg] station in the data with no copy here:", f.id); return; }
    const ll = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    const drift = map.distance(p.ll, ll);
    if(drift > 1) console.warn(`[cg] ${f.id}: fallback is ${drift.toFixed(1)} m from the data. Update the ll in POSTS.`);
    p.ll = ll;
    postMarkers[p.id].setLatLng(ll);
  });
  const missing = POSTS.filter(p=>!gj.features.some(f=>f.id === p.id));
  if(missing.length) console.warn("[cg] stations with no record in the data:", missing.map(p=>p.id));
}

/* ---------- bottom sheet ---------- */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheet-body");
document.getElementById("sheet-close").onclick = ()=>sheet.classList.remove("open");

/* The sheet renders TODAY first and CHARACTER second, and labels both.

   Today first because it is the more perishable claim and the one somebody is
   about to act on. Character second because it is what survives when nobody has
   signed anything, which is the state all five beaches are in right now.

   A map that says NOT A SWIMMING AREA has to be able to say who decided that and
   when, and the honest answer today is nobody. Saying so out loud costs some of
   the artefact's authority, and that is the correct trade: an organisation that
   admits what it has not checked is more trustworthy than one that implies it has
   checked everything. It also turns the claim from a guarantee into a timestamped
   observation, which is the difference that matters if this is ever read back to
   somebody after an accident. */
function openZone(z){
  const t = T[lang], c = z.character;
  const rider = c.class === "lower-risk"
    ? `<p class="caveat">${t.charLowerRiskRider}</p>` : "";
  const caveats = (c.caveats || [])
    .map(cv=>`<p class="caveat">${cv[lang]}</p>`).join("");
  sheetBody.innerHTML = `
    <h2>${z.name[lang]}</h2>
    <p class="sub">${z.sub[lang]}</p>
    ${todayBlock(z)}
    <p class="axis">${t.axisCharacter}</p>
    <span class="status ${tierOf(z)}">${t[c.class]}</span>
    <p class="why">${c.why[lang]}</p>
    ${rider}${caveats}
    <p class="defer">${t.defer}</p>
    ${provenance(c)}
    ${gapList(z)}
    <ul class="facts">${c.facts[lang].map(f=>`<li><span class="ic">•</span><span>${f}</span></li>`).join("")}</ul>
    <div class="actions">
      <a class="btn primary" href="tel:911">${t.call}</a>
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${z.line[Math.floor(z.line.length/2)].join(",")}">${t.route}</a>
    </div>`;
  sheet.classList.add("open");
  markCurrent(z.id);
  flyClear(L.latLngBounds(z.line).pad(0.55));
  history.replaceState(null,"","?z=" + localId(z.id));
}

/* The coast this map does not describe, opened from its own card in the picker.
   Every number in it is computed from the data that is actually loaded, so it
   cannot drift from what is drawn. */
function openVoid(){
  const t = T[lang];
  const km = m => (m / 1000).toFixed(m < 3000 ? 2 : 1);
  const total = map.distance([9.646, IMG_BOUNDS[0][1]], [9.646, IMG_BOUNDS[1][1]]);
  const zoned = ZONES.reduce((sum, z) =>
    sum + z.line.slice(1).reduce((s, p, i) => s + map.distance(z.line[i], p), 0), 0);
  const surveyed = map.distance([9.643, SURVEY.w], [9.643, SURVEY.e]);
  sheetBody.innerHTML = `
    <span class="status" style="background:var(--void)">${t.voidStatus}</span>
    <h2>${t.voidName}</h2>
    <p class="why">${t.voidWhy(km(total), km(zoned), km(surveyed))}</p>
    <p class="caveat">${t.voidRule}</p>
    <p class="defer">${t.defer}</p>
    <div class="actions">
      <a class="btn primary wide" href="tel:911">${t.call}</a>
    </div>`;
  sheet.classList.add("open");
  markCurrent(null);
  history.replaceState(null, "", location.pathname);
}

/* Fly so the subject lands in the strip the sheet is NOT covering. Without this
   Leaflet centres on the full map, the sheet then eats the bottom 60% of the
   screen, and the zone you just asked about ends up pushed off the top edge. */
function flyClear(bounds, opts){
  const sheetH = sheet.classList.contains("open") ? sheet.offsetHeight : 0;
  const headH  = document.querySelector(".topbar")?.offsetHeight || 64;
  map.flyToBounds(bounds, Object.assign({
    duration:.7, maxZoom:17,
    paddingTopLeft:[24, headH + 16],
    paddingBottomRight:[24, sheetH + 16]
  }, opts||{}));
}

function openPost(p){
  const t=T[lang];
  sheetBody.innerHTML = `
    <span class="status station">${t.station} ${p.n}</span>
    <h2>${p.name[lang]}</h2>
    <p class="sub">${p.hours[lang]}</p>
    <p class="why">${t.stationHolds}</p>
    <p class="caveat">${t.stationScope}</p>
    ${provenance(p)}
    <div class="actions">
      <a class="btn primary" href="tel:911">${t.call}</a>
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${p.ll.join(",")}">${t.route}</a>
    </div>`;
  sheet.classList.add("open");
  flyClear(L.latLngBounds([p.ll]).pad(0.002), {maxZoom:16.5});
  history.replaceState(null,"","?p=" + localId(p.id));
}

/* ---------- beach picker ----------
   The coast is 12 km of near identical jungle and sand. Nobody pans a map to
   find their beach. They read the name off the sign behind them, so the names
   are the navigation and the status is visible before anything is tapped. */
/* The swatch on each card draws the SAME stroke the map uses for that status.
   That is the legend, and it sits where the decision is made instead of behind a
   tap. The file used to define legendSafe/legendCaution/legendDanger strings and
   never reference them anywhere, which meant the pattern vocabulary existed on
   the map but was taught nowhere. A user cannot learn that solid means stop if
   nothing ever tells them. */
function swatch(tier){
  const s = STROKE[tier];     // the card shows the reference weights, not the
                              // current zoom's, so the legend stays stable
  return `<svg class="sw" width="26" height="12" viewBox="0 0 26 12" aria-hidden="true" focusable="false">
    <line x1="1" y1="6" x2="25" y2="6" stroke="${COLOR[tier]}"
          stroke-width="${Math.max(3, s.weight * 0.6)}" stroke-linecap="round"
          ${s.dash ? `stroke-dasharray="${s.dash.split(" ").map(n=>+n*0.6).join(" ")}"` : ""}/>
  </svg>`;
}

function buildPicker(){
  const t = T[lang];
  // Character on the card, because the character is what the map stroke says and
  // the card is the legend for the stroke. A signed bulletin adds a mark; it
  // never replaces the character label.
  const cards = ZONES.map(z=>`
    <button class="card" data-id="${z.id}" aria-current="false">
      <span class="nm">${z.name[lang]}</span>
      <span class="st ${tierOf(z)}">${swatch(tierOf(z))}${t[z.character.class]}</span>
      ${cardChips(z)}
    </button>`).join("");
  // The absence, listed as a peer of the presences. Last, because it is the rest.
  const voidCard = `<button class="card void" data-id="void" aria-current="false">
      <span class="nm">${t.voidName}</span>
      <span class="st">${t.voidStatus}</span>
    </button>`;
  document.getElementById("picker").innerHTML = cards + voidCard;
  document.querySelectorAll(".card").forEach(c=>{
    c.onclick = c.dataset.id === "void"
      ? openVoid
      : ()=>openZone(ZONES.find(z=>z.id === c.dataset.id));
  });
  // after layout, not during it: offsetHeight read in the same frame as the
  // innerHTML write returns the height of the markup that has not been laid out
  requestAnimationFrame(measureDock);
}
function markCurrent(id){
  document.querySelectorAll(".card").forEach(c=>{
    const on = c.dataset.id===id;
    c.setAttribute("aria-current",on);
    if(on) c.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  });
  Object.entries(layers).forEach(([k,o])=>
    o.line.setStyle({opacity: k===id ? 1 : .55}));
  Object.entries(layers).forEach(([k,o])=>{ o.current = (k===id); });
  restyleZones();
}

/* The dock's height is not a constant and it is not knowable up front: it grows
   when the saved-copy bar appears and when a card grows absence marks. Two things
   depend on it. The fab and the compass stack above it, and fitCoast() pads the
   letterbox by it, so a dock that grows after the opening fit pushes the coast up
   off centre and leaves a band of nothing under it.

   Re-fitting is conditional on the map still being at its floor. If somebody has
   zoomed into a beach, moving the camera under them because a chip appeared would
   be worse than an imperfect letterbox. */
let lastDockH = 0;
function measureDock(mayFit = true){
  const dock = document.getElementById("dock");
  if(!dock) return;
  const h = dock.offsetHeight;
  if(h === lastDockH) return;
  const first = lastDockH === 0;
  lastDockH = h;
  document.documentElement.style.setProperty("--dock-h", h + "px");
  // `mayFit` is false when the caller is about to fit anyway, as refit() is.
  // Without it a resize fits twice, and the first of the two runs against a
  // dock height that has not been laid out yet.
  if(!mayFit || !zonesReady) return;
  if(first || Math.abs(map.getZoom() - map.getMinZoom()) < 0.01) fitCoast();
}

/* ---------- locate ---------- */
let meMarker=null, meCircle=null;
const toast=document.getElementById("toast");
function say(msg,ms=4200){ toast.textContent=msg; toast.classList.add("show");
  clearTimeout(say._t); say._t=setTimeout(()=>toast.classList.remove("show"),ms); }

document.getElementById("locate").onclick=()=>{
  const t=T[lang];
  if(!navigator.geolocation){ say(t.denied); return; }
  say(t.locating);
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la,longitude:lo,accuracy:acc}=pos.coords;
    const ll=[la,lo];
    if(meMarker){map.removeLayer(meMarker);map.removeLayer(meCircle);}

    /* The circle is GPS error AND our registration error, combined, not GPS
       alone. The imagery under the dot is only known to 75 m in the west and
       about 150 m east of Punta Uva, so drawing a tight 8 m GPS circle would
       claim a precision this map does not have. Two independent errors add in
       quadrature. Drawing it honestly is the difference between a map that is
       useful and a map that misleads someone about where the water is safe. */
    const mapErr = lo < GEO_EAST_OF ? GEO_ACCURACY_EAST_M : GEO_ACCURACY_M;
    const shown  = Math.sqrt(acc*acc + mapErr*mapErr);
    meCircle=L.circle(ll,{radius:shown,color:"#1565c0",weight:1,fillOpacity:.14}).addTo(map);
    meMarker=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#1565c0",fillOpacity:1}).addTo(map);
    if(!L.latLngBounds(IMG_BOUNDS).contains(ll)){ say(t.outside,6000); map.fitBounds(IMG_BOUNDS); return; }
    toast.classList.remove("show");
    document.getElementById("locate").classList.add("on");
    /* Surface the zone you are standing on, but ONLY when there is exactly one
       credible answer.

       The old rule was "nearest zone within 450 m", and that was unsafe. Cocles
       ends 419 m from where Chiquita begins, which is inside 450 m, so along that
       stretch both zones qualified and the winner was decided by a few metres of
       vertex geometry sitting on top of a GPS fix and a georeference good to 75 m
       at best. Cocles is danger and Chiquita is caution. The map would show one of
       them, full screen, with no hint that it had guessed.

       Now: the nearest zone must be close in absolute terms AND clearly closer
       than the runner-up. If two zones are in contention the map says so and lets
       the person choose, because a wrong verdict here is worse than no verdict. */
    const near = ZONES.map(z=>({z, d: Math.min(...z.line.map(pt=>map.distance(ll,pt)))}))
                      .sort((a,b)=>a.d-b.d);
    const NEAR_M = 250, MARGIN_M = 150;
    if(near[0] && near[0].d < NEAR_M &&
       (!near[1] || near[1].d - near[0].d > MARGIN_M)){
      openZone(near[0].z);
    } else {
      flyClear(meCircle.getBounds(), {maxZoom:16});
      if(near[0] && near[0].d < 700) say(t.ambiguous, 7000);
    }
  },()=>say(T[lang].denied,5000),{enableHighAccuracy:true,timeout:9000,maximumAge:30000});
};

/* ---------- language ---------- */
function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.getElementById("btn-es").setAttribute("aria-pressed",l==="es");
  document.getElementById("btn-en").setAttribute("aria-pressed",l==="en");
  document.getElementById("tagline").textContent=T[l].tagline;
  document.getElementById("locate").setAttribute("aria-label",
    l==="es" ? "Mi ubicación" : "My location");
  buildPicker();
  renderSaved();
  sheet.classList.remove("open");
}
document.getElementById("btn-es").onclick=()=>setLang("es");
document.getElementById("btn-en").onclick=()=>setLang("en");


/* ============================================================
   CARIBBEAN GUARD'S OWN ANNOTATIONS
   Everything drawn here comes from web/data/cg-hazards.geojson, machine-read off
   the sheet Caribbean Guard already publishes on /programa-playa-organizada and
   georeferenced against Bing at 294 inliers, 1.2 m.

   It covers 1.82 km of a 16.66 km coast, which is what their sheet covers. The
   absence of arrows elsewhere means nobody has mapped it, NOT that it is clear,
   and the layer says so when you open it.

   Nothing here is authored by this map. Every feature carries needs_confirmation
   and the sheet has no date on it.
   ============================================================ */
const ANNOT = {rips:[], stations:[], areas:[]};

/* Arrow weight and head size are a function of zoom, not constants.

   A rip is 30 to 100 m long. At the whole-coast view that is a couple of pixels,
   so a fixed 13 px head is a red blob detached from a shaft nobody can see, and
   eleven of them read as noise. Zoomed in, the same head is a pinprick on a
   200 px shaft. So both scale with zoom, clamped at each end: readable as a
   direction when close, and legible as a cluster of hazards when far. */
function arrowScale(){
  const z = map.getZoom();
  // z11.5 whole coast -> z18 standing on the beach
  const t = Math.max(0, Math.min(1, (z - 12) / 5));
  return {weight: 2.5 + t * 4.5, head: 6 + t * 14, shaftMin: 20 - t * 16};
}

function arrowHead(a, b, colour){
  // A rip is a direction, not a place, so it needs a head. Leaflet has no arrow,
  // so this is two short segments rotated onto the bearing of the last leg.
  const p1 = map.latLngToLayerPoint(a), p2 = map.latLngToLayerPoint(b);
  // NOT named L: that shadows Leaflet's own L inside this function and the very
  // next line, L.point(...), throws "L.point is not a function".
  const sc = arrowScale();
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x), LEN = sc.head, SPREAD = 0.42;
  const wing = d => map.layerPointToLatLng(
    L.point(p2.x - LEN * Math.cos(ang + d), p2.y - LEN * Math.sin(ang + d)));
  return L.polyline([wing(-SPREAD), b, wing(SPREAD)],
                    {color:colour, weight:sc.weight, opacity:1,
                     lineCap:"round", lineJoin:"round"});
}

/* At the overview a 40 m rip is shorter than its own arrowhead, so the shaft is
   stretched to a readable minimum along its own bearing. The position stays the
   position; only the drawn length changes, and it stops mattering by z15. */
function shaftPoints(pts){
  const sc = arrowScale();
  if(sc.shaftMin <= 1) return pts;
  const a = map.latLngToLayerPoint(pts[0]), b = map.latLngToLayerPoint(pts[pts.length-1]);
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  if(len >= sc.shaftMin || len === 0) return pts;
  const k = sc.shaftMin / len;
  return [pts[0], map.layerPointToLatLng(L.point(a.x + dx * k, a.y + dy * k))];
}

function drawAnnotations(gj){
  const layer = L.layerGroup().addTo(map);
  gj.features.forEach(f=>{
    // rescue_station is handled by joinStations(), not here: those markers are
    // already on screen from POSTS before this fetch resolves, and drawing them
    // again would double them.
    const k = f.properties.kind, g = f.geometry;
    if(k === "rip_current"){
      const pts = g.coordinates.map(c=>[c[1], c[0]]);
      const drawn = shaftPoints(pts);
      const sc = arrowScale();
      const shaft = L.polyline(drawn,{color:"#e53935",weight:sc.weight,opacity:1,
                                      dashArray:"9 6",lineCap:"round"}).addTo(layer);
      const head = arrowHead(drawn[drawn.length-2] || drawn[0],
                             drawn[drawn.length-1], "#e53935").addTo(layer);
      const hit = L.polyline(pts,{color:"#000",weight:30,opacity:0}).addTo(layer);
      hit.on("click", ()=>openAnnot("rip", f));
      ANNOT.rips.push({f, shaft, head});
    }
    else if(k === "shaded_area_meaning_unknown"){
      const ring = g.coordinates[0].map(c=>[c[1], c[0]]);
      // Deliberately NOT red and NOT green. The sheet's legend does not define
      // this polygon, so it could be a hazard zone or a designated safe swimming
      // zone, and either colour would assert an answer nobody has given.
      const poly = L.polygon(ring,{color:"#5b6b7a",weight:2,dashArray:"6 6",
                                   fillColor:"#5b6b7a",fillOpacity:.16}).addTo(layer);
      poly.on("click", ()=>openAnnot("area", f));
      ANNOT.areas.push({f});
    }
  });
  // Heads and shafts are sized in screen space, so both are rebuilt on zoom.
  map.on("zoomend", ()=>{
    restyleZones();
    const sc = arrowScale();
    ANNOT.rips.forEach(r=>{
      const pts = r.f.geometry.coordinates.map(c=>[c[1], c[0]]);
      const drawn = shaftPoints(pts);
      r.shaft.setLatLngs(drawn);
      r.shaft.setStyle({weight: sc.weight});
      const h = arrowHead(drawn[drawn.length-2] || drawn[0], drawn[drawn.length-1], "#e53935");
      r.head.setLatLngs(h.getLatLngs());
      r.head.setStyle({weight: sc.weight});
    });
  });
  return layer;
}

function openAnnot(kind, f){
  const t = T[lang];
  const body = kind === "rip"
    ? `<span class="status high">${t.ripTitle}</span>
       <h2>${t.ripTitle}</h2>
       <p class="sub">${t.ripLen(f.properties.length_m)}</p>
       <p class="why">${t.ripWhy}</p>
       <p class="defer">${t.defer}</p>
       <p class="prov">${t.ripDir}</p>`
    : `<span class="status station" style="background:#5b6b7a">${t.areaTitle}</span>
       <h2>${t.areaTitle}</h2>
       <p class="why">${t.areaWhy}</p>`;
  sheetBody.innerHTML = body + provenance(f.properties) + `
    <div class="actions">
      <a class="btn primary" href="tel:911">${t.call}</a>
      <button class="btn" onclick="document.getElementById('sheet').classList.remove('open')">${t.close}</button>
    </div>`;
  sheet.classList.add("open");
}

fetch("data/cg-hazards.geojson")
  .then(r=>r.ok ? r.json() : Promise.reject(r.status))
  .then(gj=>{
    drawAnnotations(gj);
    joinStations(gj);
    /* Recompute the surveyed window from what actually loaded, so the extent the
       absence marks describe can never drift from the extent that is drawn.
       The coverage used to be announced in a toast that fired six seconds after
       load and then vanished; it is now the void card and the per beach marks,
       which are still there when somebody looks up from the sand. */
    const lons = [];
    gj.features.forEach(f=>{
      const g = f.geometry;
      const cs = g.type === "Polygon" ? g.coordinates[0]
               : g.type === "Point"   ? [g.coordinates]
               : g.coordinates;
      cs.forEach(c=>lons.push(c[0]));
    });
    if(lons.length){
      SURVEY = {w:Math.min(...lons), e:Math.max(...lons)};
      const open = document.querySelector('.card[aria-current="true"]');
      buildPicker();
      if(open) markCurrent(open.dataset.id);
    }
  })
  .catch(()=>{ /* the map is still usable without the overlay; stay quiet */ });


/* ---------- north arrow ----------
   The imagery is rectified north-up, so a static arrow is already truthful. The
   useful version is live: on a phone with a magnetometer the needle holds north
   while you turn, which answers the question somebody standing on sand actually
   has, which is not "where is north" but "which way am I facing".

   iOS needs an explicit permission gesture, so the button asks for it on tap and
   stays a plain arrow if it is refused or unavailable. */
(function(){
  const btn = document.getElementById("compass");
  const needle = document.getElementById("needle");
  if(!btn || !needle) return;
  let live = false;

  function onOrient(e){
    // webkitCompassHeading is degrees clockwise from north; alpha is counter
    const heading = (typeof e.webkitCompassHeading === "number")
      ? e.webkitCompassHeading
      : (e.absolute && typeof e.alpha === "number" ? 360 - e.alpha : null);
    if(heading == null || Number.isNaN(heading)) return;
    if(!live){ live = true; btn.classList.add("live"); }
    // rotate the needle AGAINST the heading so it keeps pointing at true north
    needle.style.transform = `rotate(${-heading}deg)`;
    btn.setAttribute("aria-label", `${T[lang].north} ${Math.round(heading)}°`);
  }

  function start(){
    window.addEventListener("deviceorientationabsolute", onOrient, true);
    window.addEventListener("deviceorientation", onOrient, true);
  }

  btn.addEventListener("click", ()=>{
    const DOE = window.DeviceOrientationEvent;
    if(DOE && typeof DOE.requestPermission === "function"){
      DOE.requestPermission()
        .then(r=>{ if(r === "granted") start(); else say(T[lang].compassDenied, 4500); })
        .catch(()=>say(T[lang].compassDenied, 4500));
    } else if(DOE){
      start();
      // no event within a second means there is no magnetometer behind the API
      setTimeout(()=>{ if(!live) say(T[lang].compassNone, 4000); }, 1200);
    } else {
      say(T[lang].compassNone, 4000);
    }
  });

  // Android and desktop with a sensor can start without a gesture
  if(window.DeviceOrientationEvent &&
     typeof window.DeviceOrientationEvent.requestPermission !== "function") start();
})();

/* ============================================================
   4. THE SAVED COPY

   The old code ran say(T[lang].save) unconditionally on every load, which
   displayed "Guarde esta página. La señal es débil en la playa." to every visitor
   before they did anything. It was the most-seen string on the map and it
   instructed the reader to perform something the page could not do. That is the
   same class of failure as "en tiempo real", applied to capability instead of
   data, shipping three functions away from the rule that forbids it.

   So the capability now exists, and the copy is calibrated to what it actually
   delivers on each platform:

     - It says the page is SAVED ON THIS PHONE, not that it "works offline",
       because on iOS Safari that second sentence is not ours to promise.
     - It says when, with a label, always. Beachsafe's field for a cache that has
       never populated reads the literal word "Never" and that is the right
       default: an empty field reads as fine.
     - It says how often it refreshes, and gives a button to do it by hand.
     - It says, plainly, that iOS may clear the copy after about a week of Safari
       use without a visit, and that the home screen is what prevents that.
       WebKit documents both the seven day rule and the home screen exemption.

   The nudge to install fires when installing is possible and useful, and says
   something accurate when it is not.
   ============================================================ */
const SW_SUPPORTED = "serviceWorker" in navigator;
const standalone = () => window.matchMedia("(display-mode: standalone)").matches ||
                         navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

let installPrompt = null;     // Chromium's beforeinstallprompt, stashed
let savedAt = null;           // when the cache was last written, from the worker

const savedBar = document.getElementById("saved");
const savedTxt = document.getElementById("saved-txt");
const savedRf  = document.getElementById("saved-refresh");

/* A failure message has to survive long enough to be read. The worker broadcasts
   the saved date on several occasions, and an ordinary re-render arriving a
   moment after a failed refresh would quietly replace "no signal" with a
   reassuring date. Holding the failure for a few seconds is the difference
   between telling somebody their refresh did not happen and pretending it did. */
let failUntil = 0, failTimer = null;
function renderSaved(state){
  const t = T[lang];
  if(state === "failed"){
    failUntil = Date.now() + 8000;
    // and then hand the date back, because the date is the more useful of the
    // two things this strip can say and a bar stuck on an error has stopped
    // answering "how old is what I am reading"
    clearTimeout(failTimer);
    failTimer = setTimeout(()=>{ failUntil = 0; renderSaved(); }, 8000);
  } else if(!state && Date.now() < failUntil){
    return;
  }
  savedBar.hidden = false;
  savedTxt.textContent =
      state === "refreshing" ? t.savedRefreshing
    : state === "failed"     ? t.savedFailed
    : !SW_SUPPORTED          ? t.savedNoStore
    : savedAt                ? t.savedAt(fmtStamp(savedAt))
    : t.savedNever;
  savedRf.classList.toggle("busy", state === "refreshing");
  savedRf.disabled = state === "refreshing";
  measureDock();
}

/* The explanation, on tap. Everything in here is a statement about what this
   page does, not a promise about what the sea is doing, so it is the one sheet
   in the file with no hazard colour in it at all. */
function openSaved(){
  const t = T[lang];
  const when = savedAt ? t.savedAt(fmtStamp(savedAt)) : t.savedNever;
  let install = "";
  if(standalone()){
    install = `<p class="caveat">${t.savedInstalled}</p>`;
  } else if(installPrompt){
    install = `<div class="actions"><button class="btn primary wide" id="do-install">${t.installBtn}</button></div>`;
  } else if(isIOS()){
    install = `<p class="caveat">${t.installIos}</p>`;
  }
  sheetBody.innerHTML = `
    <span class="status" style="background:var(--ink)">${when}</span>
    <h2>${t.savedTitle}</h2>
    ${SW_SUPPORTED
      ? `<p class="why">${t.savedWhatIs}</p>
         <p class="prov"><span class="row">${t.savedCadence}</span></p>
         ${isIOS() && !standalone() ? `<p class="caveat">${t.savedIos}</p>` : ""}`
      : `<p class="why">${t.savedNoSw}</p>`}
    ${install}`;
  const btn = document.getElementById("do-install");
  if(btn) btn.onclick = ()=>{
    const p = installPrompt; installPrompt = null;
    sheet.classList.remove("open");
    if(p) p.prompt();
  };
  sheet.classList.add("open");
}
savedTxt.onclick = openSaved;

/* Manual refresh. Asks the worker to re-fetch everything from the network and
   report back, then reloads so the page the user is looking at is the new one.
   Without signal it says so and leaves the saved copy alone. */
savedRf.onclick = ()=>{
  if(!navigator.serviceWorker.controller){ location.reload(); return; }
  renderSaved("refreshing");
  const ch = new MessageChannel();
  const done = setTimeout(()=>renderSaved("failed"), 15000);
  ch.port1.onmessage = e=>{
    clearTimeout(done);
    if(e.data && e.data.ok){ location.reload(); }
    else renderSaved("failed");
  };
  navigator.serviceWorker.controller.postMessage({action:"REFRESH"}, [ch.port2]);
};

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  installPrompt = e;
});

if(SW_SUPPORTED){
  /* updateViaCache:"none" so the browser never serves a cached sw.js and the
     update check is real. */
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"})
    .then(reg=>{
      /* Surfrider's update prompt, which is the part people forget. A cache-first
         safety map that cannot say "the verdicts you are reading are the old
         ones, tap for today's" will show a stale verdict forever, which is the
         failure the provenance machinery exists to prevent, one layer down. */
      const banner = document.getElementById("update");
      function offerUpdate(worker){
        const t = T[lang];
        document.getElementById("update-msg").textContent = t.updateMsg;
        document.getElementById("update-go").textContent  = t.updateGo;
        banner.classList.add("show");
        document.getElementById("update-go").onclick = ()=>{
          banner.classList.remove("show");
          worker.postMessage({action:"SKIP_WAITING"});
        };
        document.getElementById("update-no").onclick = ()=>banner.classList.remove("show");
      }
      if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          // only when there is already a controller: the very first install is
          // not an update and must not raise a banner
          if(nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });
      // check again when the page comes back to the foreground, which on a phone
      // is the moment somebody has walked down to the beach and reopened it
      document.addEventListener("visibilitychange", ()=>{
        if(!document.hidden) reg.update().catch(()=>{});
      });
    })
    .catch(()=>{ /* no worker: renderSaved() already says the page is not saved */ });

  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });

  // the worker reports when it last wrote the cache
  navigator.serviceWorker.addEventListener("message", e=>{
    if(e.data && e.data.savedAt){
      savedAt = new Date(e.data.savedAt);
      renderSaved();
    }
  });
  navigator.serviceWorker.ready.then(reg=>{
    if(reg.active) reg.active.postMessage({action:"SAVED_AT"});
  });

  /* WebKit's storage policy grants persistence on heuristics, and one of them is
     whether the site is a Home Screen web app. Asking costs one line and it is
     the documented mechanism by which the cache survives on the platform most
     tourists are carrying. */
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
renderSaved();

/* ---------- QR deep links:  ?z=cocles   or   ?p=est2 ----------
   The URL carries the LOCAL part of the namespaced id, not the whole id. QR codes
   go on aluminium bolted to a post and are the least revisable thing this project
   will produce, so the shortest stable form wins and ?z=cocles keeps working. */
(function(){
  setLang(lang);
  const q=new URLSearchParams(location.search);
  const z=ZONES.find(x=>localId(x.id)===q.get("z"));
  const p=POSTS.find(x=>localId(x.id)===q.get("p"));
  /* Open from the full-coast view rather than jumping straight in. The fly is
     what tells someone who just scanned a QR code where on the coast they are. */
  if(z){ setTimeout(()=>openZone(z),350); }
  else if(p){ setTimeout(()=>openPost(p),350); }

  /* The install nudge, which is what "Guarde esta página" was reaching for. It
     fires only when it is true: installing is possible, the page is not already
     installed, and the reader has not dismissed it before. */
  if(standalone() || !SW_SUPPORTED) return;
  let seen = false;
  try{ seen = localStorage.getItem("cg-install-nudge") === "1"; }catch(e){}
  if(seen) return;
  setTimeout(()=>{
    if(standalone()) return;
    if(!installPrompt && !isIOS()) return;   // nothing to instruct on this platform
    say(T[lang].installNudge, 7000);
    try{ localStorage.setItem("cg-install-nudge","1"); }catch(e){}
  }, 4000);
})();
</script>
</body>
