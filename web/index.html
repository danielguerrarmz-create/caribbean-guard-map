// Zone names sit on z.at, the zone's own midpoint, which is on the waterline,
// so the label lands over water rather than over the beach it is naming. It is
// a datum on the record rather than a slice of z.line, so the names are on the
// picture before the traced geometry arrives.
const zoneLabels = ZONES.map(z => label(z.at, z.name.es, "zone"));
// NOT `placeLabels`. CGGeom exports a FUNCTION of that name and this const
// would shadow it at exactly the point restyleLabels() wants to call it.
const placeMarks = PLACES.map(p => label(p.ll, p.t, "place"));
const seaLabel = label(SEA.ll, SEA.t, "sea");

/* Declared HERE, not in the stations block 200 lines below, and that is not
   tidiness. map.whenReady(restyleLabels) fires synchronously because the map is
   already ready by then, so restyleLabels runs long before the stations block
   is reached. Reading a const in its temporal dead zone throws, and `typeof`
   does not save you from that. A plain flag does. */
let postMarkers = {};
let clusterMarker = null;
let stationsReady = false;

/* ONE HEXAGON, OR FOUR.
   Caribbean Guard's four stations sit inside 1.1 km of Playa Chiquita. At the
   whole-coast view that is about 25 px, so four 32 px hexagons pile on top of
   each other and on the beach name underneath them, and a reader counts two
   pins where there are four. Below z15 they collapse to one badge carrying the
   COUNT; at z15 and above they are four numbered stations again.
   The badge reads "x4" rather than "4" on purpose: a bare 4 in the same
   hexagon that station 4 uses is the same mark meaning two different things,
   which is the failure this whole file is written against. */
const STATION_CLUSTER_ZOOM = 15;
function stationsClustered(){ return map.getZoom() < STATION_CLUSTER_ZOOM; }
function applyStationVisibility(){
  if(!stationsReady) return;
  const clustered = stationsClustered();
  Object.values(postMarkers).forEach(m=>{
    const e = m.getElement();
    if(e) e.style.display = clustered ? "none" : "";
  });
  const ce = clusterMarker && clusterMarker.getElement();
  if(ce) ce.style.display = clustered ? "" : "none";
}

/* The station marks are OBSTACLES to the labels and never the other way round.
   CGGeom.placeLabels resolves label against label and hides the loser; it
   cannot be handed the markers, because it hides anything that clashes with a
   box already taken and two overlapping stations would silently lose one. A
   hidden hazard mark is a different and much worse defect than a hidden place
   name, so this pass only ever hides labels. */
const OBSTACLE_PAD = 4;
function stationBoxes(){
  const out = [];
  const add = m => {
    const e = m && m.getElement();
    if(!e || e.style.display === "none") return;
    const r = e.getBoundingClientRect();
    if(r.width) out.push(r);
  };
  Object.values(postMarkers).forEach(add);
  add(clusterMarker);
  return out;
}
function hideLabelsUnderStations(){
  const boxes = stationBoxes();
  if(!boxes.length) return;
  [...zoneLabels, ...placeMarks, seaLabel].forEach(m=>{
    const e = m.getElement();
    if(!e || e.style.display === "none") return;
    const r = e.getBoundingClientRect();
    const hit = boxes.some(b =>
      r.left < b.right + OBSTACLE_PAD && r.right  > b.left - OBSTACLE_PAD &&
      r.top  < b.bottom + OBSTACLE_PAD && r.bottom > b.top  - OBSTACLE_PAD);
    if(hit) e.style.display = "none";
  });
}

/* What shows depends on zoom, because the same label set is clutter at one scale
   and too sparse at another. The sea label only earns its place while enough sea
   is visible to need naming; the beach names drop out once you are inside a
   single beach and the card already says where you are. */
function restyleLabels(){
  const z = map.getZoom();
  const zones  = z >= 12.5 && z < 16.5;
  const places = z >= 12.5;
  const sea    = z <= 14.5;
  /* The zoom rules above are this file's ruling and CGGeom.placeLabels never
     overturns them: `visible:false` stays hidden. What it adds is collision, in
     screen rectangles rather than in metres, because the labels are DOM
     elements of different lengths and the thing that must not overlap is the
     ink. "PUERTO VIEJOPlaya Cocles" ran together on the landing view and the
     station pins sat on top of "Playa Chiquita" (hat 5, finding 12).
     Zone names outrank town names: a town the reader cannot see named is still
     a town they can see, and the beach name is what the whole map is for. */
  // Stations first, so their boxes are current when the labels are measured
  // against them. Idempotent, so calling it from both places costs nothing.
  applyStationVisibility();
  CGGeom.placeLabels(map, [
    ...zoneLabels.map(m  => ({marker:m, priority:10, visible:zones})),
    ...placeMarks.map(m  => ({marker:m, priority:1,  visible:places})),
    {marker:seaLabel, priority:5, visible:sea}
  ]);
  hideLabelsUnderStations();
}
map.on("zoomend", restyleLabels);
map.whenReady(restyleLabels);

/* Distances on a 16.6 km strip are not guessable from imagery alone, and "swim
   parallel to the beach" is advice that needs a sense of how far that is. */
L.control.scale({metric: true, imperial: false, position: "bottomleft",
                 maxWidth: 120}).addTo(map);

/* Refit on anything that changes the viewport, debounced.

   `resize` alone is not enough coverage. iOS Safari fires `orientationchange`
   and then reports the OLD innerHeight for a frame or two, so a refit scheduled
   off that event measures the pre-rotation viewport and lands wrong; hence the
   trailing second pass. `visualViewport` covers the on-screen keyboard and the
   collapsing address bar, which resize does not reliably report on mobile.

   ROTATION IS NOT DEBOUNCED, and that is the point.

   A drag-resize on a desktop fires continuously and the intermediate sizes are
   meaningless, so it waits. A rotation is one discrete event whose intermediate
   size is the OLD one, and every millisecond spent waiting is a millisecond the
   coast is drawn at the previous orientation's width. Measured at a 150 ms
   debounce: 120 ms after rotating to landscape the strip was still 442 px wide in
   an 846 px viewport, reaching its correct 744 px only by 300 ms. Nobody rotates
   this map to recentre it; they rotate it to get more coast, so the thing they
   asked for must not be the thing that lags. */
let refitTimer = null, refitTrailing = null, rotateUntil = 0;
function runRefit(){
  measureDock(false);   // update --dock-h, do not let it fit as well
  fitCoast({keepView:true});
}
function refit(delay){
  // A rotation also emits `resize`, in either order and sometimes twice. While
  // a rotation is in flight every viewport event belongs to it, so none of them
  // may reintroduce the delay.
  clearTimeout(refitTimer);
  refitTimer = setTimeout(runRefit, Date.now() < rotateUntil ? 0 : delay);
}
window.addEventListener("resize", ()=>refit(150));
window.addEventListener("orientationchange", ()=>{
  rotateUntil = Date.now() + 800;
  refit(0);
  // iOS Safari reports the old innerHeight for a frame or two after this event,
  // so the immediate pass can land on stale metrics. Run again once it settles.
  clearTimeout(refitTrailing);
  refitTrailing = setTimeout(runRefit, 500);
});
if(window.visualViewport) window.visualViewport.addEventListener("resize", ()=>refit(150));

/* Watch the CONTAINER, not only the window, and this is the one that closes the
   load-during-resize case.

   The opening fit runs inline at parse time, against whatever the container
   measured at that instant. If the window is still being resized while the page
   is coming up, that measurement is of a viewport that no longer exists by the
   time anything is painted, and no `resize` event necessarily follows, because
   the resize was already in progress before any listener was attached. The map
   then sits at the wrong scale and offset until a reload: measured in a real
   Chrome window, the base landed at y=1278 in a 932 tall viewport, showing only
   the blurred backdrop.

   That is not a hypothetical. Rotating a phone while the page is still loading
   on weak signal is exactly the case, and weak signal is the condition this map
   is built for.

   A ResizeObserver reports the container's box whenever it changes, including
   changes that happened before it was attached, so the first callback is itself
   the correction. It also covers the mobile address bar collapsing, which
   `resize` reports inconsistently. It cannot loop: `#map` is `position:absolute;
   inset:0`, so fitting the map never changes the container's size. */
if(window.ResizeObserver){
  let seenFirst = false;
  new ResizeObserver(()=>{
    // The first callback fires on observe with the current box. Take it
    // immediately rather than debounced, because during load it IS the fix.
    refit(seenFirst ? 150 : 0);
    seenFirst = true;
  }).observe(document.getElementById("map"));
}
// Belt and braces for browsers without ResizeObserver, and for a viewport that
// settles after the document finishes loading.
window.addEventListener("load", ()=>refit(0));

/* Pattern and weight carry the tier independently of colour, so the map still
   works in sunlight, on a cheap screen, and for the 1 in 12 men who cannot
   separate red from green.

   The table, the ground-width solve and the dash ratios all moved to
   geometry.js, because the card swatch and the map stroke must be the same
   numbers and they were two copies of them. `CGGeom.TIERS` is the reference
   weight and dash per tier; `CGGeom.zoneStroke(tier, zoom)` is what the map
   draws at a given zoom.

   The polarity is deliberate and it is the reverse of what this file used to
   do. It previously drew the worst tier as a fine dotted line and the best as a
   solid one, which made the most dangerous thing on the map the faintest mark
   on it. Every convention a tourist already carries, road markings, hazard
   tape, warning signage, says the loud mark is the dangerous one. So high is
   the heaviest and most solid, and low is the lightest.

   These three carry the CHARACTER, which is a property of the place. A bulletin
   a guard signed this morning is a property of the moment, so it never
   recolours these: it draws its own halo underneath. See todayHalo().

   WHAT CHANGED AT THE LANDING ZOOM, and it is hat 4's fourth blocker. The old
   code scaled each dash COMPONENT by one factor, so at z12 low's "2 8" floored
   to "2 2": 1:4 became 1:1 and all three textures converged at exactly the zoom
   a deuteranope first looks at. The ratio is now fixed per tier and only the
   gap has a floor, measured from the gap that is still VISIBLE after round caps
   eat half a weight at each end. */

let zonesReady = false;

/* The dimming of the zones you did NOT ask about.
   cgSetStyle() handles weight, dash and halo weight but deliberately not
   opacity, because opacity is not a property of the stroke vocabulary. So it is
   applied over the top, after the weights, and it reaches the halo too. Only a
   beach with a bulletin signed today has a halo, and dimming a beach nobody is
   looking at is the intent in both cases. */
function dimGroup(g, op){
  g.eachLayer(l=>{ if(l.setStyle) l.setStyle({opacity:op}); });
}

function restyleZones(){
  // fitCoast() emits zoomend during startup, before the zone layers exist.
  // `typeof layers === "undefined"` does NOT guard this: typeof still throws on
  // a const in the temporal dead zone. An ordinary flag does.
  if(!zonesReady) return;
  const z0 = map.getZoom();
  ZONES.forEach(z=>{
    const g = layers[z.id]; if(!g) return;
    const st = CGGeom.zoneStroke(tierOf(z), z0);
    const halo = todayHalo(z);
    g.cgSetStyle({
      weight: st.weight * (g.cgCurrent ? 1.25 : 1),
      dashArray: st.dashArray,
      halo: halo ? {color: halo, weight: st.halo} : null
    });
    dimGroup(g, g.cgCurrent === false && anyCurrent ? .55 : 1);
  });
}
let anyCurrent = false;

/* ---------- draw zones ----------
   Runs when data/zones-geometry.json lands, not at parse time. The cards do not
   wait for it: they are static HTML and they are the thing somebody standing on
   the sand needs first. The lines are the thing that needs to be right. */
const layers = {};
function drawZones(){
  ZONES.forEach(z=>{
    if(!z.line.length || layers[z.id]) return;
    const st = CGGeom.zoneStroke(tierOf(z), map.getZoom());

    /* A bulletin signed today draws UNDER the character stroke, never over it
       and never instead of it. If a guard signs "stay out today" at Punta Uva
       the map has to shout, but recolouring the line would erase the standing
       character the moment somebody signed one calm morning, which is the exact
       conflation the two-axis split exists to undo. A halo is additive: both
       claims stay legible and the character stroke stays on top. */
    const halo = todayHalo(z);

    /* No casing, and now no blunt ends either. The stroke tapers to 40% over
       its last 40 m at each end, so a zone stops rather than being cut off, and
       the halo tapers with it: a full-width halo under a tapering line puts the
       blunt end straight back. */
    const g = CGGeom.taperedPolyline(z.line, {
      color: COLOR[tierOf(z)],
      weight: st.weight,
      dashArray: st.dashArray,
      halo: halo ? {color: halo, weight: st.halo, opacity:.5} : null
    }, map).addTo(map);

    // Our own hit line, separate and invisible. Everything taperedPolyline
    // draws is interactive:false, so it cannot swallow a tap meant for this.
    L.polyline(z.line,{color:"#000",weight:44,opacity:0})
      .addTo(map).on("click",()=>openZone(z));
    layers[z.id] = g;
  });
  zonesReady = true;
  restyleZones();
}
map.on("zoomend", restyleZones);

/* The traced coastline. Five zones, 160 to 917 points each, against the 7 to 60
   they replace. It is in the service worker's critical precache, so after the
   first visit this resolves from disk with no signal. */
const geomReady = fetch("data/zones-geometry.json")
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(g => {
    ZONES.forEach(z=>{
      const pts = g.zones && g.zones[z.id];
      if(pts && pts.length) z.line = pts;
      else console.warn("[cg] no geometry for", z.id);
    });
    drawZones();
    restyleLabels();
  })
  .catch(err => {
    console.warn("[cg] zone geometry did not load:", err);
    /* SAY SO. The cards, their instructions and their provenance chips are all
       still on screen and all still true, because they are static HTML and do
       not depend on this fetch. The map is the part that is now lying: a coast
       with no strokes on it is indistinguishable from a coast with no hazards,
       and "absence rendered as nothing" is the precise misreading the whole
       absence vocabulary in this file exists to prevent.
       role="alert" and no timeout: this is not a notice that expires, it is the
       state the map is in until it is reloaded with signal. */
    say(T[lang].geomFailed, 60000);
  });

/* ORANGE HEXAGONS, not blue circles.
   Caribbean Guard's own annotated V5 sheet, the one already printed on a sign
   this map's readers walk past, draws a rescue station as an orange hexagon.
   This file had turned them into blue numbered circles, which hat 5 named as
   the map having stopped being theirs, and hat 1 as four marks meaning nothing
   until tapped. The shape and the colour are both theirs. See .po. */
POSTS.forEach(p=>{
  const icon = L.divIcon({className:"", html:`<div class="po">${p.n}</div>`,
    iconSize:[32,32], iconAnchor:[16,16]});
  postMarkers[p.id] = L.marker(p.ll,{icon, keyboard:true,
    alt:`${T[lang].legendStation} ${p.n}`}).addTo(map).on("click",()=>openPost(p));
});

/* The collapsed badge. Its position is the centroid of the real stations, so it
   is recomputed whenever joinStations() moves one onto the authoritative
   geometry. Tapping it zooms to the four rather than opening a sheet: the
   question a reader has at the overview is "what are those", and the answer is
   four separate stations, which is a thing to SHOW rather than to describe. */
function stationCentroid(){
  const n = POSTS.length;
  return [POSTS.reduce((s,p)=>s+p.ll[0],0)/n, POSTS.reduce((s,p)=>s+p.ll[1],0)/n];
}
function buildCluster(){
  if(clusterMarker) map.removeLayer(clusterMarker);
  const icon = L.divIcon({className:"", iconSize:[38,38], iconAnchor:[19,19],
    html:`<div class="po cluster">&times;${POSTS.length}</div>`});
  clusterMarker = L.marker(stationCentroid(), {icon, keyboard:true,
    alt:`${POSTS.length} ${T[lang].legendStation}`})
    .addTo(map)
    /* A fixed zoom, not a fit to the four stations' bounds. Fitting their
       1.1 km span into a 390 px phone with the sheet open landed at z14.25,
       which is still below STATION_CLUSTER_ZOOM, so tapping the badge left the
       badge on screen and nothing appeared to happen. The badge's entire job is
       to expand, so it flies to a zoom that is guaranteed to expand it.
       Through flyClear rather than flyTo, so the stations do not land under the
       sheet that is already open. */
    .on("click", ()=>flyClear(L.latLngBounds([stationCentroid()]).pad(0.002),
                              {maxZoom:15.75, duration:.6}));
}
buildCluster();
stationsReady = true;
map.on("zoomend", restyleLabels);   // stations and labels settle together
restyleLabels();

/* Move the markers onto the authoritative geometry once it arrives, and say so
   if the inline fallback had drifted. Silent preference for one of two copies is
   how the duplicate went unnoticed for as long as it did. */
function joinStations(gj){
  gj.features.forEach(f=>{
    if(f.properties.kind !== "rescue_station") return;
    const p = POSTS.find(x=>x.id === f.id);
    if(!p){ console.warn("[cg] station in the data with no copy here:", f.id); return; }
    const ll = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    const drift = map.distance(p.ll, ll);
    if(drift > 1) console.warn(`[cg] ${f.id}: fallback is ${drift.toFixed(1)} m from the data. Update the ll in POSTS.`);
    p.ll = ll;
    postMarkers[p.id].setLatLng(ll);
  });
  const missing = POSTS.filter(p=>!gj.features.some(f=>f.id === p.id));
  if(missing.length) console.warn("[cg] stations with no record in the data:", missing.map(p=>p.id));
  // The badge sits on their centroid, so it moves when they do.
  buildCluster();
  restyleLabels();
}

/* ---------- bottom sheet: three stops, and a real dialog ----------

   THE STOPS. PEEK is the opening state: the name, the instruction, who has
   reviewed it and today's line, all above the fold with nothing to scroll.
   HALF is for the why and the facts. FULL is for the deferral and the actions.
   The old sheet had one height, 74vh, and opened with the empty TODAY block
   filling its top 40%, which is how hat 1 came to close it before reaching the
   red instruction underneath.

   THE ACCESSIBILITY. Four separate defects from hat 4, fixed together because
   they are one object:
     - closing only translated the panel off-screen, so TalkBack kept swiping
       into "Cerrar, botón" on a panel that was not visible. Closed is now
       `hidden` and `inert`.
     - the dialog had no accessible name. It is now labelled by its own h2.
     - opening never moved focus, so a screen reader said nothing at all. Focus
       now lands on the heading, and returns to whatever opened the sheet.
     - Escape did nothing. It closes.

   THE LANGUAGE SWITCH. setLang used to end with sheet.classList.remove("open"),
   so tapping ES while reading the English Cocles panel threw the verdict away.
   Every opener now records how to render itself again, and setLang replays it
   in place. See `lastRender`. */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheet-body");
const STOPS = ["peek", "half", "full"];
let lastRender = null;    // () => void, replays the open sheet in the new language
let lastFocus = null;     // what to give focus back to on close
let sheetTimer = null;

function sheetStop(stop){
  sheet.dataset.stop = stop;
  sheet.style.height = "";
}

function openSheet(html, render){
  lastRender = render || null;
  const active = document.activeElement;
  const reopening = sheet.classList.contains("open");
  if(!reopening) lastFocus = (active && active !== document.body) ? active : null;
  sheetBody.innerHTML = html;
  clearTimeout(sheetTimer);
  sheet.hidden = false;
  sheet.removeAttribute("inert");
  if(!reopening) sheetStop("peek");
  // A reflow between un-hiding and adding .open, or the browser collapses the
  // two style changes into one frame and the slide-in never animates.
  void sheet.offsetHeight;
  sheet.classList.add("open");
  const h2 = document.getElementById("sheet-title");
  if(h2 && !reopening) h2.focus({preventScroll:true});
}

function closeSheet(){
  if(!sheet.classList.contains("open")) return;
  sheet.classList.remove("open");
  lastRender = null;
  // Wait out the slide before removing it from the tree, so the animation is
  // seen; `hidden` is display:none and would cut it off mid-flight.
  clearTimeout(sheetTimer);
  sheetTimer = setTimeout(()=>{
    sheet.hidden = true;
    sheet.setAttribute("inert", "");
    sheet.style.height = "";
  }, 300);
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
  lastFocus = null;
  markCurrent(null);
  if(desktop()) refit(0);   // the map gets its right-hand column back
}

document.getElementById("sheet-close").onclick = closeSheet;
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
});

/* Drag between the stops, and off the bottom to close.
   The handle is the whole top strip rather than the 44x5 bar, because a 5 px
   target is not a target. The sheet body joins in only when it is scrolled to
   the top and the gesture is downward, which is the one case where dragging the
   sheet and scrolling its contents are not in conflict. */
(function(){
  const head = document.getElementById("draghead");
  let startY = 0, startH = 0, dragging = false, moved = 0;

  function begin(e, fromBody){
    if(desktop()) return;
    if(fromBody && sheetBody.scrollTop > 0) return;
    startY = e.clientY;
    startH = sheet.getBoundingClientRect().height;
    dragging = true; moved = 0;
    sheet.classList.add("dragging");
    try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
  }
  function move(e){
    if(!dragging) return;
    moved = e.clientY - startY;
    const max = window.innerHeight;
    const h = Math.max(0, Math.min(max, startH - moved));
    sheet.style.height = h + "px";
  }
  function end(){
    if(!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    const vh = window.innerHeight;
    const h = sheet.getBoundingClientRect().height;
    sheet.style.height = "";
    // Below 60% of PEEK the gesture was a dismissal, not a resize.
    if(h < vh * 0.33 * 0.6){ closeSheet(); return; }
    const targets = {peek: vh * 0.33, half: vh * 0.70, full: vh};
    let best = "peek", bestD = Infinity;
    STOPS.forEach(k=>{ const d = Math.abs(targets[k] - h); if(d < bestD){ bestD = d; best = k; } });
    sheetStop(best);
  }

  head.addEventListener("pointerdown", e=>begin(e, false));
  sheetBody.addEventListener("pointerdown", e=>begin(e, true));
  window.addEventListener("pointermove", move, {passive:true});
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
})();

/* The footer every sheet carries. Hat 5, finding 10: a safety instrument with
   no correction channel keeps a known error forever, and there was no contact
   address anywhere in 2,291 lines. The donate line AJ asked about is
   deliberately not here. */
const CG_MAIL = "caribbeanguard.pv@gmail.com";
const CG_HOME = "https://caribbeanguard.org";
/* The mailto carries a BODY as well as a subject, and that is the difference
   between a correction channel and a blank compose window. Hat 5's finding was
   that a safety instrument with no way to be told it is wrong keeps a known
   error forever; a reader who taps this and faces an empty message mostly
   closes it. The body says what we need: what is wrong, and which beach. */
function reportHref(subject){
  const t = T[lang];
  return `mailto:${CG_MAIL}?subject=${encodeURIComponent(subject)}` +
         `&body=${encodeURIComponent(t.reportIntro + "\n\n")}`;
}
function sheetFoot(){
  const t = T[lang];
  return `<p class="footlink"><a href="${CG_HOME}" target="_blank" rel="noopener">${t.homeLink}</a></p>`;
}

/* THE ORDER INSIDE THE SHEET, top to bottom, and every position is argued:

     name and sub          where you are
     INSTRUCTION           what to do. Largest thing on the sheet, above the fold
                           at PEEK, and no longer sitting below an apology.
     Autor / Revisado      how much this claim is worth, one line, under the
                           claim it qualifies rather than in a footer
     today                 one line while nobody has signed; the full block the
                           moment somebody has
     why                   the reasoning, for whoever wants it
     rider and caveats     the exceptions that modify the instruction
     facts                 including the escape sentence on every rip beach
     absences              what nobody has checked
     DEFERRAL              the rule that outranks everything above it, boxed
     actions               Cómo llegar · Reportar un error · 911

   The three reorderings against the old sheet: today came first and pushed the
   instruction below the fold; the deferral sat mid-sheet where it read as one
   more caveat rather than as the thing that beats the map; and the provenance
   sat under the deferral, three screens from the verdict it qualifies.

   A map that says NO ENTRES AL AGUA has to be able to say who decided that and
   when, and the honest answer today is nobody. Saying so out loud costs some of
   the artefact's authority, and that is the correct trade: an organisation that
   admits what it has not checked is more trustworthy than one that implies it
   has checked everything. */
function openZone(z){
  const render = ()=>{
    const t = T[lang], c = z.character;
    const rider = c.class === "lower-risk"
      ? `<p class="caveat">${t.charLowerRiskRider}</p>` : "";
    const caveats = (c.caveats || [])
      .map(cv=>`<p class="caveat">${cv[lang]}</p>`).join("");
    // z.at, not a midpoint of z.line: the line may not have arrived yet and a
    // QR deep link opens this sheet 350 ms after load. Both are the same point.
    const mid = z.at.join(",");
    return `
    <h2 id="sheet-title" tabindex="-1">${z.name[lang]}</h2>
    <p class="sub">${z.sub[lang]}</p>
    ${statusPill(tierOf(z), t[c.class])}
    ${hoursLine(z)}
    ${provenance(c, true)}
    ${todayBlock(z)}
    <p class="why">${c.why[lang]}</p>
    ${rider}${caveats}
    ${factsOf(z)}
    ${gapList(z)}
    <p class="defer">${t.defer}</p>
    <div class="actions">
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${mid}">${t.route}</a>
      <a class="btn" href="${reportHref(t.reportSubject + ": " + z.name.es)}">${t.report}</a>
      <a class="btn primary wide" href="tel:911">${t.call}</a>
    </div>
    ${sheetFoot()}`;
  };
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
  markCurrent(z.id);
  // Before the geometry lands there is one point to fly to rather than a line.
  flyClear(z.line.length ? L.latLngBounds(z.line).pad(0.55)
                         : L.latLngBounds([z.at]).pad(0.02));
  history.replaceState(null,"","?z=" + localId(z.id));
}

/* The coast this map does not describe, opened from its own card in the strip.
   Every number in it is computed from the data that is actually loaded, so it
   cannot drift from what is drawn. */
function openVoid(){
  const render = ()=>{
    const t = T[lang];
    const km = m => (m / 1000).toFixed(m < 3000 ? 2 : 1);
    const total = map.distance([9.646, IMG_BOUNDS[0][1]], [9.646, IMG_BOUNDS[1][1]]);
    const zoned = zonedExtentM();
    const surveyed = map.distance([9.643, SURVEY.w], [9.643, SURVEY.e]);
    return `
    <h2 id="sheet-title" tabindex="-1">${t.voidName}</h2>
    <p class="sub">${t.voidStatus}</p>
    <p class="why">${t.voidWhy(km(total), km(zoned), km(surveyed))}</p>
    <p class="caveat">${t.voidRule}</p>
    <p class="defer">${t.defer}</p>
    <div class="actions">
      <a class="btn" href="${reportHref(t.reportSubject)}">${t.report}</a>
      <a class="btn primary" href="tel:911">${t.call}</a>
    </div>
    ${sheetFoot()}`;
  };
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
  markCurrent(null);
  history.replaceState(null, "", location.pathname);
}

/* Fly so the subject lands in the strip the sheet is NOT covering. Without this
   Leaflet centres on the full map, the sheet then eats the bottom 60% of the
   screen, and the zone you just asked about ends up pushed off the top edge. */
function flyClear(bounds, opts){
  const open  = sheet.classList.contains("open");
  const headH = document.querySelector(".topbar")?.offsetHeight || 64;
  if(desktop()){
    // Two columns, not two bands: the rail on the left and the panel on the
    // right. Padding by both is what keeps the coast out from under the panel.
    const rail = document.querySelector(".dock")?.offsetWidth || 360;
    const panel = open ? (sheet.offsetWidth || 400) : 0;
    map.flyToBounds(bounds, Object.assign({
      duration:.7, maxZoom:17,
      paddingTopLeft:[rail + 24, headH + 16],
      paddingBottomRight:[panel + 24, 32]
    }, opts||{}));
    return;
  }
  const sheetH = open ? sheet.offsetHeight : 0;
  map.flyToBounds(bounds, Object.assign({
    duration:.7, maxZoom:17,
    paddingTopLeft:[24, headH + 16],
    paddingBottomRight:[24, sheetH + 16]
  }, opts||{}));
}

function openPost(p){
  const render = ()=>{
    const t = T[lang];
    /* The deferral renders here too, and it is not boilerplate. This sheet says
       a fixed structure nearby holds rescue flotation, which is the most
       reassuring thing on the whole map, and it is exactly the sheet a reader
       could finish believing the map has them covered. The rule that outranks
       the map outranks it here as well: the guard standing on the sand beats
       this page, on every sheet, without exception. It was missing from this
       one and from the shaded-area sheet, which were the only two that
       described something reassuring. */
    return `
    <h2 id="sheet-title" tabindex="-1">${p.name[lang]}</h2>
    <p class="sub">${p.hours[lang]}</p>
    ${titleChip(markStation(), t.station)}
    ${provenance(p, true)}
    <p class="why">${t.stationHolds}</p>
    <p class="caveat">${t.stationScope}</p>
    <p class="defer">${t.defer}</p>
    <div class="actions">
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${p.ll.join(",")}">${t.route}</a>
      <a class="btn" href="${reportHref(t.reportSubject + ": " + p.name.es)}">${t.report}</a>
      <a class="btn primary wide" href="tel:911">${t.call}</a>
    </div>
    ${sheetFoot()}`;
  };
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
  flyClear(L.latLngBounds([p.ll]).pad(0.002), {maxZoom:16.5});
  history.replaceState(null,"","?p=" + localId(p.id));
}

/* ---------- the legend ----------
   Caribbean Guard's own V5 sheet carries a bilingual key in its corner and this
   map shipped without one, so four numbered marks sat on the coast meaning
   nothing until tapped (hat 5, finding 8) and the stroke vocabulary was taught
   only on the cards (hat 1, finding 7).

   MERGED, in two sections. "Qué hacer" is our four instructions, each with the
   stroke that carries it. "En el mapa" is their vocabulary in their words:
   Corriente de Resaca, Estación de Rescate. Spanish then English, two columns,
   exactly as V5 prints it.

   THE ROWS ARE CONDITIONAL ON THE LAYER EXISTING. V5 also keys roads, paths and
   Ubicaciones, and this map draws none of those today. A legend entry for a
   mark that is not on the map is a second kind of lie, and this page's whole
   argument is about not making the first kind. `hasLocations` flips the moment
   a locations layer lands in the data, and the row appears then. */
let hasLocations = false;

/* The marks, drawn as the map draws them rather than described, and defined
   ONCE: the legend and the sheet that opens when you tap the thing have to show
   the same mark, or the legend is teaching a vocabulary the sheets do not use.
   The station's dark outline is the one the marker carries: #f39c12 alone does
   not clear 3:1 over Caribbean water. */
const markRip = () => `<svg width="30" height="14" viewBox="0 0 30 14" aria-hidden="true">
    <line x1="2" y1="7" x2="20" y2="7" stroke="#0b1c2c" stroke-width="5"
          stroke-linecap="round" opacity=".85"/>
    <line x1="2" y1="7" x2="20" y2="7" stroke="#e53935" stroke-width="3"
          stroke-dasharray="5 3" stroke-linecap="round"/>
    <path d="M18 2.5 L25 7 L18 11.5" fill="none" stroke="#0b1c2c" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <path d="M18 2.5 L25 7 L18 11.5" fill="none" stroke="#e53935" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
const markStation = () => `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
    <polygon points="5.5,1 16.5,1 22,11 16.5,21 5.5,21 0,11" fill="#f39c12"
             stroke="#0b1c2c" stroke-width="1.2"/></svg>`;
const markArea = () => `<svg width="26" height="16" viewBox="0 0 26 16" aria-hidden="true">
    <rect x="1" y="1" width="24" height="14" rx="3" fill="#5b6b7a" fill-opacity=".16"
          stroke="#5b6b7a" stroke-width="2" stroke-dasharray="4 4"/></svg>`;
const markMe = () => `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
    <circle cx="11" cy="11" r="9" fill="#1565c0" fill-opacity=".16"/>
    <circle cx="11" cy="11" r="5" fill="#1565c0" stroke="#fff" stroke-width="2"/></svg>`;
const markPlaces = () => `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
    <polygon points="11,1 13.6,8 21,8 15,12.5 17.3,20 11,15.4 4.7,20 7,12.5 1,8 8.4,8"
             fill="#f2d024" stroke="#0b1c2c" stroke-width="1"/></svg>`;

function legendHTML(){
  const t = T[lang], o = lang === "es" ? "en" : "es", u = T[o];
  const row = (mark, a, b) =>
    `<div class="row"><span class="mark" aria-hidden="true">${mark}</span>
       <span class="txt"><span class="cur">${a}</span><span class="oth">${b}</span></span></div>`;
  const cls = ["no-swim","high-risk","conditional","lower-risk"];
  const tiers = cls.map(c=>{
    const tier = CHARACTER[c].tier;
    return row(swatch(tier), t[c], u[c]);
  }).join("");

  return `<h3>${t.legendDo}</h3>${tiers}
    <h3>${t.legendMap}</h3>
    ${row(markRip(), t.legendRip, u.legendRip)}
    ${row(markStation(), t.legendStation, u.legendStation)}
    ${row(markArea(), t.legendArea, u.legendArea)}
    ${hasLocations ? row(markPlaces(), t.legendPlaces, u.legendPlaces) : ""}
    ${row(markMe(), t.legendMe, u.legendMe)}`;
}

function openLegend(){
  const render = ()=>`<h2 id="sheet-title" tabindex="-1">${T[lang].legendTitle}</h2>
    <div class="legend">${legendHTML()}</div>
    <p class="defer">${T[lang].defer}</p>
    ${sheetFoot()}`;
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
  // A legend is a reading task, not a glance, so it opens past PEEK.
  sheetStop("half");
}
function renderLegendPerm(){
  const el = document.getElementById("legend-perm");
  if(el) el.innerHTML = legendHTML();
}
document.getElementById("legend-open").onclick = openLegend;

/* ---------- beach picker ----------
   The coast is 12 km of near identical jungle and sand. Nobody pans a map to
   find their beach. They read the name off the sign behind them, so the names
   are the navigation and the status is visible before anything is tapped. */
/* The swatch on each card draws the SAME stroke the map uses for that status.
   That is the legend, and it sits where the decision is made instead of behind a
   tap. The file used to define legendSafe/legendCaution/legendDanger strings and
   never reference them anywhere, which meant the pattern vocabulary existed on
   the map but was taught nowhere. A user cannot learn that solid means stop if
   nothing ever tells them. */
/* The swatch is drawn ON A DARK PLATE, and that is not decoration.
   The real stroke lives on satellite imagery, which is dark. Moderate is
   #f5b942, and #f5b942 on a white card measures about 1.5:1, so the one tier
   whose dash pattern matters most to a deuteranope simply vanished at the exact
   place the pattern is being taught. The plate shows the stroke on the ground
   it actually occupies, which is both legible and literally true. */
function swatch(tier){
  /* CGGeom.TIERS is the same table the map draws from, and the swatch derives
     its pattern the same way zoneStroke does: gap = gapK * weight, dash =
     ratio * gap, ratio null means solid. One table, two readers, so the card
     cannot teach a pattern the map does not draw. That was the whole point of
     putting the stroke on the card in the first place.
     The card shows the REFERENCE weight rather than the current zoom's, so the
     legend stays still while the map under it rescales. */
  const s = CGGeom.TIERS[tier];
  const w = Math.max(3, s.weight * 0.6);
  const gap = s.gapK * w, dash = s.ratio == null ? null : s.ratio * gap;
  return `<svg class="sw" width="30" height="16" viewBox="0 0 30 16" aria-hidden="true" focusable="false">
    <rect width="30" height="16" rx="4" fill="#24384a"/>
    <line x1="3" y1="8" x2="27" y2="8" stroke="${COLOR[tier]}"
          stroke-width="${w}" stroke-linecap="round"
          ${dash == null ? "" : `stroke-dasharray="${+dash.toFixed(2)} ${+gap.toFixed(2)}"`}/>
  </svg>`;
}

/* THE STATUS PILL. One component, used on the card and in the sheet, so the
   thing somebody reads on the strip and the thing they read after tapping are
   the same object rather than two that can drift apart.
   Tier colour is the left bar. Text is always ink. See the .pill CSS.

   IT TAKES A TIER AND AN INSTRUCTION, AND NOTHING ELSE. It used to also carry a
   station's name, a hazard's noun and an area title, which made the component
   that means "do this" the component that a noun arrived in. Those take
   titleChip() below. */
function statusPill(tier, instruction){
  return `<span class="pill ${tier}">${swatch(tier)}${instruction}</span>`;
}

/* The neutral counterpart: what KIND of thing this sheet is about, with the mark
   the map draws for it, so the sheet doubles as a key for whatever was tapped. */
function titleChip(mark, text){
  return `<span class="chip title">${mark}${text}</span>`;
}

/* CARD ANATOMY, top to bottom: name, instruction, hours, provenance chips.
   The instruction is the largest text on it and nothing else may become larger.
   Keep the static markup in the body in step with this. */
function cardHTML(z){
  const t = T[lang];
  return `<button class="card" data-id="${z.id}" aria-current="false">
      <span class="nm">${z.name[lang]}</span>
      ${statusPill(tierOf(z), t[z.character.class])}
      ${hoursLine(z)}
      ${cardChips(z)}
    </button>`;
}

function buildPicker(){
  const t = T[lang];
  // Character on the card, because the character is what the map stroke says and
  // the card is the legend for the stroke. A signed bulletin adds a chip; it
  // never replaces the character label.
  const cards = ZONES.map(cardHTML).join("");
  /* The absence, listed as a peer of the presences, and a DIFFERENT SPECIES of
     card: dashed, hatched, and carrying no status pill at all. Hat 1 skimmed
     straight past the most defensible thing on the page because it had the same
     size, shape and row as a beach and was only greyer. Still last, because it
     is the rest. */
  const voidCard = `<button class="card void" data-id="void" aria-current="false">
      <span class="nm">${t.voidName}</span>
      <span class="vd">${t.voidStatus}</span>
    </button>`;
  document.getElementById("picker").innerHTML = cards + voidCard;
  document.querySelectorAll(".card").forEach(c=>{
    c.onclick = c.dataset.id === "void"
      ? openVoid
      : ()=>openZone(ZONES.find(z=>z.id === c.dataset.id));
  });
  renderCounter();
  // after layout, not during it: offsetHeight read in the same frame as the
  // innerHTML write returns the height of the markup that has not been laid out
  requestAnimationFrame(measureDock);
}

/* "2 de 6". A horizontal scroller with both scrollbars hidden does not announce
   its own length: hats 1 and 2 both saw two cards, concluded that was all there
   was, and never reached Cocles at card three. The edge fade (a mask on .strip)
   says there is more; this says how much more and where you are. Hidden on
   desktop, where all six are stacked and visible. */
function renderCounter(){
  const el = document.getElementById("counter");
  if(!el) return;
  const cards = [...document.querySelectorAll(".card")];
  if(!cards.length) return;
  const strip = document.getElementById("picker");
  const mid = strip.scrollLeft + strip.clientWidth / 2;
  let best = 0, bestD = Infinity;
  cards.forEach((c, i)=>{
    const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
    if(d < bestD){ bestD = d; best = i; }
  });
  el.textContent = T[lang].counter(best + 1, cards.length);
}
document.getElementById("picker").addEventListener("scroll", ()=>{
  clearTimeout(renderCounter._t);
  renderCounter._t = setTimeout(renderCounter, 80);
}, {passive:true});

function markCurrent(id){
  document.querySelectorAll(".card").forEach(c=>{
    const on = c.dataset.id===id;
    c.setAttribute("aria-current",on);
    /* A deep link (?z=cocles) has to move the strip, not only the map. The QR
       code on the post at Cocles opens card three, and until this ran the
       reader landed on card one and had to hunt for the beach they were
       standing on. */
    if(on) c.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  });
  anyCurrent = !!id && !!layers[id];
  Object.entries(layers).forEach(([k,g])=>{ g.cgCurrent = (k === id); });
  restyleZones();
  setTimeout(renderCounter, 420);   // after the smooth scroll settles
}

/* The dock's height is not a constant and it is not knowable up front: it grows
   when the saved-copy bar appears and when a card grows absence marks. Two things
   depend on it. The fab and the compass stack above it, and fitCoast() pads the
   letterbox by it, so a dock that grows after the opening fit pushes the coast up
   off centre and leaves a band of nothing under it.

   Re-fitting is conditional on the map still being at its floor. If somebody has
   zoomed into a beach, moving the camera under them because a chip appeared would
   be worse than an imperfect letterbox. */
let lastDockH = 0;
function measureDock(mayFit = true){
  const dock = document.getElementById("dock");
  if(!dock) return;
  const h = dock.offsetHeight;
  if(h === lastDockH) return;
  const first = lastDockH === 0;
  lastDockH = h;
  document.documentElement.style.setProperty("--dock-h", h + "px");
  // `mayFit` is false when the caller is about to fit anyway, as refit() is.
  // Without it a resize fits twice, and the first of the two runs against a
  // dock height that has not been laid out yet.
  if(!mayFit || !zonesReady) return;
  if(first || Math.abs(map.getZoom() - map.getMinZoom()) < 0.01) fitCoast();
}

/* ---------- locate ---------- */
let meMarker=null, meCircle=null;
const toast=document.getElementById("toast");

/* THE TWO BANNERS SHARE ONE STRIP AND THE SAFETY ONE IS ON TOP.
   Both are pinned under the top bar. The update banner sits at z-index 1500 and
   the toast at 1400, so a "newer version of this map" notice was drawn straight
   over "the beach zones did not load, do not trust this map without them" and
   hid it completely. A convenience notice may never cover a safety one.
   Whichever appears first keeps the strip and the other one stacks beneath it,
   so the order they arrive in does not decide which one gets read. */
function stackBanners(){
  const upd = document.getElementById("update");
  const updShown = upd && upd.classList.contains("show");
  const toastShown = toast.classList.contains("show");
  toast.style.marginTop = (updShown && !toastShown) ? (upd.offsetHeight + 10) + "px" : "";
  if(upd) upd.style.marginTop = (toastShown && updShown) ? (toast.offsetHeight + 10) + "px" : "";
}

function say(msg,ms=4200){
  toast.textContent=msg;
  stackBanners();              // measure the other banner BEFORE showing this one
  toast.classList.add("show");
  stackBanners();              // and again, so the other one moves if it is up
  clearTimeout(say._t);
  say._t=setTimeout(()=>{ toast.classList.remove("show"); stackBanners(); }, ms);
}

/* THE FIRST RUN IS A LABELLED ACTION, NOT AN ICON.
   Hat 1's only question standing on the sand is "which beach am I on", and the
   control that answers it was an unlabelled crosshair below a compass, which
   reads as a map widget rather than as an answer. Nothing ever called
   getCurrentPosition on load either, so the map never offered.
   So on the first visit the dock carries "¿En qué playa estoy?" full width, and
   once it has been used once it collapses to the icon, because by then the icon
   has a meaning. The flag is per-device and survives a reload; if localStorage
   is unavailable the labelled action simply stays, which is the safe failure. */
const LOCATE_KEY = "cg-located";
function locateUsed(){
  try{ return localStorage.getItem(LOCATE_KEY) === "1"; }catch(e){ return false; }
}
function renderLocate(){
  const first = document.getElementById("locate-first");
  const fab = document.getElementById("locate");
  const show = !locateUsed() && !desktop();
  first.classList.toggle("show", show);
  fab.classList.toggle("hidden", show);
  requestAnimationFrame(measureDock);
}
function runLocate(){
  try{ localStorage.setItem(LOCATE_KEY, "1"); }catch(e){}
  renderLocate();
  doLocate();
}
document.getElementById("locate-first").onclick = runLocate;
document.getElementById("locate").onclick = runLocate;

function doLocate(){
  const t=T[lang];
  if(!navigator.geolocation){ say(t.denied); return; }
  say(t.locating);
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la,longitude:lo,accuracy:acc}=pos.coords;
    const ll=[la,lo];
    if(meMarker){map.removeLayer(meMarker);map.removeLayer(meCircle);}

    /* The circle is GPS error AND our registration error, combined, not GPS
       alone. The imagery under the dot is only known to 75 m in the west and
       about 150 m east of Punta Uva, so drawing a tight 8 m GPS circle would
       claim a precision this map does not have. Two independent errors add in
       quadrature. Drawing it honestly is the difference between a map that is
       useful and a map that misleads someone about where the water is safe. */
    const mapErr = lo < GEO_EAST_OF ? GEO_ACCURACY_EAST_M : GEO_ACCURACY_M;
    const shown  = Math.sqrt(acc*acc + mapErr*mapErr);
    meCircle=L.circle(ll,{radius:shown,color:"#1565c0",weight:1,fillOpacity:.14}).addTo(map);
    meMarker=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#1565c0",fillOpacity:1}).addTo(map);
    if(!L.latLngBounds(IMG_BOUNDS).contains(ll)){ say(t.outside,6000); map.fitBounds(IMG_BOUNDS); return; }
    toast.classList.remove("show");
    document.getElementById("locate").classList.add("on");
    /* Surface the zone you are standing on, but ONLY when there is exactly one
       credible answer.

       The old rule was "nearest zone within 450 m", and that was unsafe. Cocles
       ends 419 m from where Chiquita begins, which is inside 450 m, so along that
       stretch both zones qualified and the winner was decided by a few metres of
       vertex geometry sitting on top of a GPS fix and a georeference good to 75 m
       at best. Cocles is danger and Chiquita is caution. The map would show one of
       them, full screen, with no hint that it had guessed.

       Now: the nearest zone must be close in absolute terms AND clearly closer
       than the runner-up. If two zones are in contention the map says so and lets
       the person choose, because a wrong verdict here is worse than no verdict. */
    // z.line while it is there, z.at as the fallback. Falling back to a single
    // midpoint makes the distances coarser, so the MARGIN_M test below is
    // harder to pass, so the map says "you are between two beaches" more often
    // rather than less. An uncertainty that fails towards asking is the right
    // direction for this particular guess.
    const near = ZONES.map(z=>{
      const pts = z.line.length ? z.line : [z.at];
      return {z, d: Math.min(...pts.map(pt=>map.distance(ll,pt)))};
    }).sort((a,b)=>a.d-b.d);
    const NEAR_M = 250, MARGIN_M = 150;
    if(near[0] && near[0].d < NEAR_M &&
       (!near[1] || near[1].d - near[0].d > MARGIN_M)){
      openZone(near[0].z);
    } else {
      flyClear(meCircle.getBounds(), {maxZoom:16});
      if(near[0] && near[0].d < 700) say(t.ambiguous, 7000);
    }
  },()=>say(T[lang].denied,5000),{enableHighAccuracy:true,timeout:9000,maximumAge:30000});
}

/* ---------- language ----------
   EVERY aria-label moves, not one. Hat 4, finding 12: in English the close
   button still announced "Cerrar", refresh "Actualizar" and the toggle group
   "Idioma"; only #locate was ever relabelled, so a screen reader in English got
   a Spanish interface with one English word in it.

   AND THE OPEN SHEET IS RE-RENDERED, NOT DISMISSED. This function used to end
   with sheet.classList.remove("open"): hat 4 opened Playa Cocles, could not read
   the English, tapped ES, and the verdict vanished. Switching language is a
   request to read the same thing in another language. */
function setLang(l){
  lang=l;
  const t = T[l];
  document.documentElement.lang=l;
  document.getElementById("btn-es").setAttribute("aria-pressed",l==="es");
  document.getElementById("btn-en").setAttribute("aria-pressed",l==="en");
  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("rail-what").textContent = t.railWhat;
  document.getElementById("sos-word").textContent = t.sosWord;
  document.getElementById("locate-first-label").textContent = t.locateFirst;
  document.getElementById("legend-open").textContent = t.legendTitle;
  document.getElementById("locate").setAttribute("aria-label", t.ariaLocate);
  document.getElementById("locate-first").setAttribute("aria-label", t.locateFirst);
  document.getElementById("sheet-close").setAttribute("aria-label", t.ariaClose);
  document.getElementById("saved-refresh").setAttribute("aria-label", t.ariaRefresh);
  document.getElementById("lang-group").setAttribute("aria-label", t.ariaLang);
  document.getElementById("update-no").setAttribute("aria-label", t.ariaClose);
  document.getElementById("brand").setAttribute("aria-label", t.ariaHome);
  /* The "newer version" banner renders its strings once, when the worker
     reports an update, and then sits there until it is acted on. Switching
     language left it in the language it was born in, which on a page whose
     whole top bar is a language toggle reads as a piece of someone else's
     interface. Only touched while it is actually showing. */
  if(document.getElementById("update").classList.contains("show")){
    document.getElementById("update-msg").textContent = t.updateMsg;
    document.getElementById("update-go").textContent  = t.updateGo;
  }
  document.getElementById("sos").setAttribute("aria-label", t.ariaSos);
  document.getElementById("compass").setAttribute("aria-label", l==="es" ? "Norte" : "North");
  buildPicker();
  renderSaved();
  renderLegendPerm();
  if(stationsReady){
    Object.entries(postMarkers).forEach(([id, m])=>{
      const post = POSTS.find(x=>x.id === id);
      if(post && m._icon) m._icon.alt = `${t.legendStation} ${post.n}`;
    });
    buildCluster();
    restyleLabels();
  }
  if(lastRender) lastRender();
}
document.getElementById("btn-es").onclick=()=>setLang("es");
document.getElementById("btn-en").onclick=()=>setLang("en");


/* ============================================================
   CARIBBEAN GUARD'S OWN ANNOTATIONS
   Everything drawn here comes from web/data/cg-hazards.geojson, machine-read off
   the sheet Caribbean Guard already publishes on /programa-playa-organizada and
   georeferenced against Bing at 294 inliers, 1.2 m.

   It covers 1.82 km of a 16.66 km coast, which is what their sheet covers. The
   absence of arrows elsewhere means nobody has mapped it, NOT that it is clear,
   and the layer says so when you open it.

   Nothing here is authored by this map. Every feature carries needs_confirmation
   and the sheet has no date on it.
   ============================================================ */
const ANNOT = {rips:[], stations:[], areas:[]};

/* Arrow weight, head size and the minimum drawn shaft are a function of zoom,
   and all three moved to geometry.js along with the thing that matters more:
   THE ARROW IS OUTLINED NOW, not shadowed.

   Hat 4 measured the old one. #e53935 against the water sampled next to it,
   rgb(45,72,65), is 2.00:1, and 1.79:1 as a deuteranope sees it, against the
   3:1 bar WCAG 1.4.11 sets for a graphical object that carries meaning. A drop
   shadow cannot fix that, because contrast is measured at an edge and a shadow
   is a blur. Ink at 0.85 against the red is 4.4:1, and that ink edge is what
   the eye locks onto, so the arrow stops depending on whatever water it
   happens to be floating over. */

function drawAnnotations(gj){
  const layer = L.layerGroup().addTo(map);
  gj.features.forEach(f=>{
    // rescue_station is handled by joinStations(), not here: those markers are
    // already on screen from POSTS before this fetch resolves, and drawing them
    // again would double them.
    const k = f.properties.kind, g = f.geometry;
    if(k === "rip_current"){
      const pts = g.coordinates.map(c=>[c[1], c[0]]);
      const arrow = CGGeom.outlinedArrow(map, pts, {}).addTo(layer);
      // Our own hit line, on the TRUE position rather than the drawn one: at
      // the overview a 40 m rip is shorter than its own arrowhead and the shaft
      // is stretched to stay legible, but the tap target belongs where the
      // hazard is.
      L.polyline(pts,{color:"#000",weight:30,opacity:0})
        .addTo(layer).on("click", ()=>openAnnot("rip", f));
      ANNOT.rips.push({f, pts, arrow});
    }
    else if(k === "shaded_area_meaning_unknown"){
      const ring = g.coordinates[0].map(c=>[c[1], c[0]]);
      // Deliberately NOT red and NOT green. The sheet's legend does not define
      // this polygon, so it could be a hazard zone or a designated safe swimming
      // zone, and either colour would assert an answer nobody has given.
      const poly = L.polygon(ring,{color:"#5b6b7a",weight:2,dashArray:"6 6",
                                   fillColor:"#5b6b7a",fillOpacity:.16}).addTo(layer);
      poly.on("click", ()=>openAnnot("area", f));
      ANNOT.areas.push({f});
    }
  });
  // Heads and shafts are sized in screen space, so both are rebuilt on zoom.
  map.on("zoomend", ()=>{
    restyleZones();
    ANNOT.rips.forEach(r=>r.arrow.cgRedraw(map, r.pts, {}));
  });
  return layer;
}

function openAnnot(kind, f){
  const render = ()=>{
    const t = T[lang];
    /* No `sub` line here any more. It used to print ripLen, "aproximadamente
       38 m desde la orilla", one of nine values got by measuring the length of a
       hand-drawn arrow. The escape instruction takes that slot instead, which
       is the thing a swimmer actually needs from this sheet. */
    /* Same skeleton as openZone, in the same order, and that is the fix rather
       than a tidy-up: name, mark, provenance, the thing to know, the deferral.
       These two sheets had the provenance UNDER the deferral on the rip and
       missing the deferral entirely on the area, so the two sheets a reader
       reaches by tapping the map read differently from the five they reach by
       tapping a card. A page that argues its verdicts are dated observations
       cannot put the date somewhere different depending on which mark you
       touched. */
    const body = kind === "rip"
      ? `<h2 id="sheet-title" tabindex="-1">${t.ripTitle}</h2>
         ${titleChip(markRip(), t.legendRip)}
         ${provenance(f.properties, true)}
         <p class="why">${t.escapeRip} ${t.escapeHelp}</p>
         <p class="prov">${t.ripDir}</p>
         <p class="defer">${t.defer}</p>`
      : `<h2 id="sheet-title" tabindex="-1">${t.areaTitle}</h2>
         ${titleChip(markArea(), t.legendArea)}
         ${provenance(f.properties, true)}
         <p class="why">${t.areaWhy}</p>
         <p class="defer">${t.defer}</p>`;
    return body + `
    <div class="actions">
      <a class="btn" href="${reportHref(t.reportSubject + ": " + t.ripTitle)}">${t.report}</a>
      <a class="btn primary" href="tel:911">${t.call}</a>
    </div>
    ${sheetFoot()}`;
  };
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); });
}

fetch("data/cg-hazards.geojson")
  .then(r=>r.ok ? r.json() : Promise.reject(r.status))
  .then(gj=>{
    drawAnnotations(gj);
    joinStations(gj);
    /* Recompute the surveyed window from what actually loaded, so the extent the
       absence marks describe can never drift from the extent that is drawn.
       The coverage used to be announced in a toast that fired six seconds after
       load and then vanished; it is now the void card and the per beach marks,
       which are still there when somebody looks up from the sand. */
    const lons = [];
    gj.features.forEach(f=>{
      const g = f.geometry;
      const cs = g.type === "Polygon" ? g.coordinates[0]
               : g.type === "Point"   ? [g.coordinates]
               : g.coordinates;
      cs.forEach(c=>lons.push(c[0]));
    });
    /* The Ubicaciones row in the legend appears only if a locations layer
       actually landed. See legendHTML(). */
    hasLocations = gj.features.some(f=>{
      const k = f.properties && f.properties.kind;
      return k === "location" || k === "place" || k === "ubicacion";
    });
    renderLegendPerm();
    if(lons.length){
      SURVEY = {w:Math.min(...lons), e:Math.max(...lons)};
      const open = document.querySelector('.card[aria-current="true"]');
      buildPicker();
      if(open) markCurrent(open.dataset.id);
    }
  })
  .catch(()=>{ /* the map is still usable without the overlay; stay quiet */ });


/* ---------- north arrow ----------
   The imagery is rectified north-up, so a static arrow is already truthful. The
   useful version is live: on a phone with a magnetometer the needle holds north
   while you turn, which answers the question somebody standing on sand actually
   has, which is not "where is north" but "which way am I facing".

   iOS needs an explicit permission gesture, so the button asks for it on tap and
   stays a plain arrow if it is refused or unavailable. */
(function(){
  const btn = document.getElementById("compass");
  const needle = document.getElementById("needle");
  if(!btn || !needle) return;
  let live = false;

  function onOrient(e){
    // webkitCompassHeading is degrees clockwise from north; alpha is counter
    const heading = (typeof e.webkitCompassHeading === "number")
      ? e.webkitCompassHeading
      : (e.absolute && typeof e.alpha === "number" ? 360 - e.alpha : null);
    if(heading == null || Number.isNaN(heading)) return;
    if(!live){ live = true; btn.classList.add("live"); }
    // rotate the needle AGAINST the heading so it keeps pointing at true north
    needle.style.transform = `rotate(${-heading}deg)`;
    btn.setAttribute("aria-label", `${T[lang].north} ${Math.round(heading)}°`);
  }

  function start(){
    window.addEventListener("deviceorientationabsolute", onOrient, true);
    window.addEventListener("deviceorientation", onOrient, true);
  }

  btn.addEventListener("click", ()=>{
    const DOE = window.DeviceOrientationEvent;
    if(DOE && typeof DOE.requestPermission === "function"){
      DOE.requestPermission()
        .then(r=>{ if(r === "granted") start(); else say(T[lang].compassDenied, 4500); })
        .catch(()=>say(T[lang].compassDenied, 4500));
    } else if(DOE){
      start();
      // no event within a second means there is no magnetometer behind the API
      setTimeout(()=>{ if(!live) say(T[lang].compassNone, 4000); }, 1200);
    } else {
      say(T[lang].compassNone, 4000);
    }
  });

  // Android and desktop with a sensor can start without a gesture
  if(window.DeviceOrientationEvent &&
     typeof window.DeviceOrientationEvent.requestPermission !== "function") start();
})();

/* ============================================================
   4. THE SAVED COPY

   The old code ran say(T[lang].save) unconditionally on every load, which
   displayed "Guarde esta página. La señal es débil en la playa." to every visitor
   before they did anything. It was the most-seen string on the map and it
   instructed the reader to perform something the page could not do. That is the
   same class of failure as "en tiempo real", applied to capability instead of
   data, shipping three functions away from the rule that forbids it.

   So the capability now exists, and the copy is calibrated to what it actually
   delivers on each platform:

     - It says the page is SAVED ON THIS PHONE, not that it "works offline",
       because on iOS Safari that second sentence is not ours to promise.
     - It says when, with a label, always. Beachsafe's field for a cache that has
       never populated reads the literal word "Never" and that is the right
       default: an empty field reads as fine.
     - It says how often it refreshes, and gives a button to do it by hand.
     - It says, plainly, that iOS may clear the copy after about a week of Safari
       use without a visit, and that the home screen is what prevents that.
       WebKit documents both the seven day rule and the home screen exemption.

   The nudge to install fires when installing is possible and useful, and says
   something accurate when it is not.
   ============================================================ */
const SW_SUPPORTED = "serviceWorker" in navigator;
const standalone = () => window.matchMedia("(display-mode: standalone)").matches ||
                         navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

let installPrompt = null;     // Chromium's beforeinstallprompt, stashed
let savedAt = null;           // when the cache was last written, from the worker

/* The saved bar is no longer a bar. It is one 12 px line inside .dockrow,
   sharing that line with the legend chip and the strip counter, because on a
   390 px phone every row of chrome is a row of map the reader does not get.
   It still says the same three things it always said: that the page is saved
   on this device, when, and how to refresh it by hand. */
const savedTxt = document.getElementById("saved-txt");
const savedRf  = document.getElementById("saved-refresh");

/* A failure message has to survive long enough to be read. The worker broadcasts
   the saved date on several occasions, and an ordinary re-render arriving a
   moment after a failed refresh would quietly replace "no signal" with a
   reassuring date. Holding the failure for a few seconds is the difference
   between telling somebody their refresh did not happen and pretending it did. */
let failUntil = 0, failTimer = null;
function renderSaved(state){
  const t = T[lang];
  if(state === "failed"){
    failUntil = Date.now() + 8000;
    // and then hand the date back, because the date is the more useful of the
    // two things this strip can say and a bar stuck on an error has stopped
    // answering "how old is what I am reading"
    clearTimeout(failTimer);
    failTimer = setTimeout(()=>{ failUntil = 0; renderSaved(); }, 8000);
  } else if(!state && Date.now() < failUntil){
    return;
  }
  savedTxt.textContent =
      state === "refreshing" ? t.savedRefreshing
    : state === "failed"     ? t.savedFailed
    : !SW_SUPPORTED          ? t.savedNoStore
    : savedAt                ? t.savedAt(fmtStamp(savedAt))
    : t.savedNever;
  savedRf.classList.toggle("busy", state === "refreshing");
  savedRf.disabled = state === "refreshing";
  measureDock();
}

/* The explanation, on tap. Everything in here is a statement about what this
   page does, not a promise about what the sea is doing, so it is the one sheet
   in the file with no hazard colour in it at all. */
function openSaved(){
  const t = T[lang];
  const when = savedAt ? t.savedAt(fmtStamp(savedAt)) : t.savedNever;
  let install = "";
  if(standalone()){
    install = `<p class="caveat">${t.savedInstalled}</p>`;
  } else if(installPrompt){
    install = `<div class="actions"><button class="btn primary wide" id="do-install">${t.installBtn}</button></div>`;
  } else if(isIOS()){
    install = `<p class="caveat">${t.installIos}</p>`;
  }
  const html = `
    <h2 id="sheet-title" tabindex="-1">${t.savedTitle}</h2>
    <p class="sub">${when}</p>
    ${SW_SUPPORTED
      ? `<p class="why">${t.savedWhatIs}</p>
         <p class="prov"><span class="row">${t.savedCadence}</span></p>
         ${isIOS() && !standalone() ? `<p class="caveat">${t.savedIos}</p>` : ""}`
      : `<p class="why">${t.savedNoSw}</p>`}
    ${install}
    ${sheetFoot()}`;
  openSheet(html, openSaved);
  const btn = document.getElementById("do-install");
  if(btn) btn.onclick = ()=>{
    const p = installPrompt; installPrompt = null;
    closeSheet();
    if(p) p.prompt();
  };
}
savedTxt.onclick = openSaved;

/* Manual refresh. Asks the worker to re-fetch everything from the network and
   report back, then reloads so the page the user is looking at is the new one.
   Without signal it says so and leaves the saved copy alone. */
savedRf.onclick = ()=>{
  if(!navigator.serviceWorker.controller){ location.reload(); return; }
  renderSaved("refreshing");
  const ch = new MessageChannel();
  const done = setTimeout(()=>renderSaved("failed"), 15000);
  ch.port1.onmessage = e=>{
    clearTimeout(done);
    if(e.data && e.data.ok){ location.reload(); }
    else renderSaved("failed");
  };
  navigator.serviceWorker.controller.postMessage({action:"REFRESH"}, [ch.port2]);
};

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  installPrompt = e;
});

if(SW_SUPPORTED){
  /* updateViaCache:"none" so the browser never serves a cached sw.js and the
     update check is real. */
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"})
    .then(reg=>{
      /* Surfrider's update prompt, which is the part people forget. A cache-first
         safety map that cannot say "the verdicts you are reading are the old
         ones, tap for today's" will show a stale verdict forever, which is the
         failure the provenance machinery exists to prevent, one layer down. */
      const banner = document.getElementById("update");
      function offerUpdate(worker){
        const t = T[lang];
        document.getElementById("update-msg").textContent = t.updateMsg;
        document.getElementById("update-go").textContent  = t.updateGo;
        banner.classList.add("show");
        stackBanners();
        document.getElementById("update-go").onclick = ()=>{
          banner.classList.remove("show");
          stackBanners();
          worker.postMessage({action:"SKIP_WAITING"});
        };
        document.getElementById("update-no").onclick = ()=>{
          banner.classList.remove("show"); stackBanners();
        };
      }
      if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          // only when there is already a controller: the very first install is
          // not an update and must not raise a banner
          if(nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });
      // check again when the page comes back to the foreground, which on a phone
      // is the moment somebody has walked down to the beach and reopened it
      document.addEventListener("visibilitychange", ()=>{
        if(!document.hidden) reg.update().catch(()=>{});
      });
    })
    .catch(()=>{ /* no worker: renderSaved() already says the page is not saved */ });

  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });

  // the worker reports when it last wrote the cache
  navigator.serviceWorker.addEventListener("message", e=>{
    if(e.data && e.data.savedAt){
      savedAt = new Date(e.data.savedAt);
      renderSaved();
    }
  });
  navigator.serviceWorker.ready.then(reg=>{
    if(reg.active) reg.active.postMessage({action:"SAVED_AT"});
  });

  /* WebKit's storage policy grants persistence on heuristics, and one of them is
     whether the site is a Home Screen web app. Asking costs one line and it is
     the documented mechanism by which the cache survives on the platform most
     tourists are carrying. */
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
renderSaved();

/* ---------- QR deep links:  ?z=cocles   or   ?p=est2 ----------
   The URL carries the LOCAL part of the namespaced id, not the whole id. QR codes
   go on aluminium bolted to a post and are the least revisable thing this project
   will produce, so the shortest stable form wins and ?z=cocles keeps working. */
(function(){
  setLang(lang);
  renderLocate();
  /* The dock is the rail on desktop and a band on a phone, and which one it is
     changes the map's padding, the locate control and whether the legend is a
     sheet or a column. Nothing here reads a stored breakpoint, so a window
     dragged across 820 px settles correctly. */
  window.addEventListener("resize", ()=>{ renderLocate(); });
  const q=new URLSearchParams(location.search);
  const z=ZONES.find(x=>localId(x.id)===q.get("z"));
  const p=POSTS.find(x=>localId(x.id)===q.get("p"));
  /* Open from the full-coast view rather than jumping straight in. The fly is
     what tells someone who just scanned a QR code where on the coast they are. */
  if(z){ setTimeout(()=>openZone(z),350); }
  else if(p){ setTimeout(()=>openPost(p),350); }

  /* The install nudge, which is what "Guarde esta página" was reaching for. It
     fires only when it is true: installing is possible, the page is not already
     installed, and the reader has not dismissed it before. */
  if(standalone() || !SW_SUPPORTED) return;
  let seen = false;
  try{ seen = localStorage.getItem("cg-install-nudge") === "1"; }catch(e){}
  if(seen) return;
  setTimeout(()=>{
    if(standalone()) return;
    if(!installPrompt && !isIOS()) return;   // nothing to instruct on this platform
    say(T[lang].installNudge, 7000);
    try{ localStorage.setItem("cg-install-nudge","1"); }catch(e){}
  }, 4000);
})();
</script>
</body>
