<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- maximum-scale=5 and no user-scalable=no, DELIBERATELY. Beachsafe, Protected
     Planet, SINAC and OVSICORI all disable pinch zoom on public safety maps. This
     is read in bright sun by people who may not have their glasses. Do not "fix". -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0b1c2c">
<meta name="description" content="Mapa de seguridad costera de Caribbean Guard, de Puerto Viejo a Manzanillo.">
<title>Caribbean Guard | Mapa de Seguridad</title>
<link rel="manifest" href="manifest.json">
<!-- Named explicitly so the browser stops requesting /favicon.ico, which the map
     does not ship and which 404s on every single load. -->
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- Both spellings. Chrome deprecated the apple- prefixed one and logs a warning
     on every load; iOS Safari still only understands that one. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caribbean Guard">
<!-- Self-hosted, not unpkg, and with no CDN fallback on purpose.
     Measured against unpkg from a good home link: 1.27 s of TLS negotiation alone
     before the first byte of Leaflet arrived, to a host we do not control, with no
     integrity attribute on the tag. Chrome partitioned its HTTP cache in 2020, so
     the old cross-site caching argument for a public CDN no longer holds in any
     current browser. Leaflet's latest dist-tag has been 1.9.4 since 2023-05-18, so
     vendoring commits us to chasing nothing.
     A fallback would put the CDN back in the threat model to buy nothing: if the
     local copy is shipped anyway, ship only the local copy. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<!-- Atkinson Hyperlegible, self hosted, Regular and Bold only.
     Designed by the Braille Institute for low vision readers: the letterforms
     that collapse into each other in ordinary grotesques (I l 1, O 0, b d p q)
     are drawn differently on purpose. Hat 4 is mildly presbyopic on a budget
     Android in midday sun, which is the same failure mode as low vision.
     Self hosted for the same reason Leaflet is: this map must work with no
     signal, and a Google Fonts request cannot be precached by our worker.
     Preloaded because font-display:swap would otherwise repaint every
     instruction on the page a second after it is first read.
     LATIN SUBSET ONLY, 17 KB each. It covers U+0000-00FF, which is every
     character Spanish and English need, and it is the difference between 34 KB
     and 180 KB on the 2-bar Slow 3G link hat 4 is on. -->
<link rel="preload" href="fonts/AtkinsonHyperlegible-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/AtkinsonHyperlegible-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family:"Atkinson Hyperlegible"; font-style:normal; font-weight:400;
    font-display:swap; src:url(fonts/AtkinsonHyperlegible-Regular.woff2) format("woff2");
  }
  @font-face{
    font-family:"Atkinson Hyperlegible"; font-style:normal; font-weight:700;
    font-display:swap; src:url(fonts/AtkinsonHyperlegible-Bold.woff2) format("woff2");
  }
  :root{
    /* Two tiers on purpose.
       The plain tokens are for GRAPHICS on the map, where the bar is 3:1 and
       vividness helps them survive a sun-washed screen.
       The -text tokens are for TEXT AND UI BARS ON A LIGHT GROUND, where the
       bar is 4.5:1 for text and 3:1 for a meaningful graphic. White on the old
       #1f9d55 measured 3.49:1 and on #c77700 measured 3.46:1, so both status
       pills were failing outright. 13px bold does not qualify for the
       large-text exception, which needs about 18.66px bold.
       Old --moderate #c77700 also had almost exactly the same luminance as
       --low (0.254 vs 0.251), so in direct sun, which kills hue first, the two
       middle tiers were the same colour.

       These are named for the three HAZARD TIERS, low / moderate / high. They
       were named safe / caution / danger, and --safe in particular was the
       wrong name: nothing on this map is entitled to say safe. See CHARACTER. */
    --low:#1f9d55;         --low-text:#178049;
    --moderate:#f5b942;    --moderate-text:#9c5c00;
    --high:#c62828;        --high-text:#c62828;
    --ink:#0b1c2c; --paper:#ffffff; --muted:#5b6b7a;
    /* Absence has its own colour and it is not a hazard colour. Amber says "you
       are missing something", grey says "nobody has been here". Neither may be
       mistaken for a verdict, so neither is red, amber-as-caution, or green. */
    --gap:#7a4a00;   --gap-bg:#fdf4e3;  --gap-line:#e7cf9e;
    --void:#4a5764;  --void-bg:#eef1f4;  --void-line:#c9d2da;
    /* Today's bulletin has its own colour and it is deliberately outside the
       hazard palette, so a thing a guard said this morning can never be mistaken
       for what this beach is. Violet also survives red-green colour blindness
       against all three tiers. */
    --today:#7b1fa2;
    /* Caribbean Guard's own V5 sheet draws rescue stations as ORANGE hexagons.
       They were blue circles here, which is the association's map losing its own
       visual vocabulary (hat 5, finding 9). Orange is also the only station
       colour a reader who has seen the printed sheet on the sign already knows. */
    --station:#f39c12;
    --sheet-r:20px;
    --safe-pad: env(safe-area-inset-bottom, 0px);
    --dock-h: 96px;    /* set from JS; the fab and compass stack above the dock */
    /* 8 px grid and a 16 px gutter, used everywhere below rather than eyeballed
       values, so a card, a chip and a sheet all sit on the same rhythm. */
    --gut:16px;
    /* THE TYPE SCALE. Five sizes, no sixth.
       22 sheet heading / 18 instruction / 15 names and body / 13 secondary /
       12 chips, and 12 is the FLOOR. Hat 4's first blocker was that the
       instruction rendered at 11.5 px while the optional prose rendered at
       14.5: what you must obey was smaller than what you may skip. Nothing on
       this page may be smaller than --t-min. */
    --t-h2:22px; --t-instr:18px; --t-body:15px; --t-2nd:13px; --t-min:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:"Atkinson Hyperlegible","Helvetica Neue",-apple-system,
                BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:var(--t-body); line-height:1.3;
    color:var(--ink); background:var(--ink)}
  #map{position:absolute;inset:0}

  /* ONE focus ring for the whole page, and it is the only one.
     Hat 4, finding 10: no :focus or :focus-visible rule existed anywhere in the
     file, so on a switch or a keyboard nothing showed what was selected. Ink on
     light ground, white over the map and the dark chrome, 2 px either way. */
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
  .topbar :focus-visible,.fab:focus-visible,.compass:focus-visible,
  .dockrow :focus-visible,.leaflet-container :focus-visible{outline-color:#fff}

  /* Shows only while tiles are in flight, and at the edge of coverage. Navy
     rather than Leaflet's grey so a tile arriving reads as the picture filling
     in, not as a broken image repairing itself. */
  .leaflet-container{background:var(--ink);font-family:inherit}
  /* Replaces the old white casing. A shadow lifts the strokes off the imagery
     without putting a grey band around them, and it costs no width, so a thin
     line stays thin. */
  .leaflet-overlay-pane{filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}
  /* Hairline seams show between JPEG tiles on fractional zooms, because
     zoomSnap is 0.25 and a tile can land on a half pixel. Scaling each tile by
     a hair closes the seam without moving anything measurably. */
  .basemap .leaflet-tile{transform:scale(1.002);transform-origin:center}

  /* ---------- notations on the imagery ---------- */
  /* Place names, so the whole-coast view can be read without tapping anything.
     No box and no background: a plate over satellite imagery hides the thing the
     label is pointing at. A shadow does the same work and costs no area. */
  .lbl{background:none;border:0;box-shadow:none;font-weight:700;
    letter-spacing:.02em;white-space:nowrap;pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.7)}
  .lbl.zone{color:#fff;font-size:12.5px}
  .lbl.place{color:#cfe0ee;font-size:var(--t-min);font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;opacity:.9}
  .lbl.sea{color:#9fc4e0;font-size:var(--t-min);font-weight:400;letter-spacing:.22em;
    text-transform:uppercase;opacity:.75}
  .leaflet-control-scale-line{background:rgba(11,28,44,.72);border-color:rgba(255,255,255,.5);
    color:#e8f1f7;font-weight:700;font-size:var(--t-min);padding:3px 7px}

  /* ---------- top bar ---------- */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:1000;
    padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gut) 8px;
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,rgba(11,28,44,.92),rgba(11,28,44,0));
    pointer-events:none}
  /* The wordmark is a LINK HOME. Hat 5, finding 4: the association's
     highest-traffic tourist touchpoint had no route back to the organisation
     that made it, and the only outbound links in 2,291 lines were two Google
     Maps calls. */
  /* nowrap and shrinkable. At 15 px the wordmark, the 911 pill and a 44 px
     language toggle do not fit across 390 px, and the brand wrapped to three
     lines, grew the top bar to 86 px and pushed EN off the right edge. The
     wordmark drops a step and the tagline steps out below 430 px: the two
     controls on the right are the ones a reader needs in a hurry, and the
     tagline is the only thing on this bar that nothing depends on. */
  .brand{pointer-events:auto;text-decoration:none;
    font-weight:700;letter-spacing:.02em;color:#fff;font-size:var(--t-body);
    line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;
    min-width:0;overflow:hidden;
    padding:4px 0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .brand small{display:block;font-weight:400;font-size:var(--t-min);opacity:.85;
    letter-spacing:.04em;text-transform:uppercase}
  @media (max-width:429px){
    /* Two lines, not one. At 13 px on one line the wordmark still needs about
       125 px and only 107 are left once the 911 pill and a 44 px language
       toggle have taken theirs, so it clipped to "CARIBBEAN GUAI". Wrapping it
       costs nothing: the bar is 44 px tall for the targets anyway. */
    .brand{font-size:var(--t-2nd);letter-spacing:0;white-space:normal;
      max-width:104px;line-height:1.05}
    .brand small{display:none}
  }
  .spacer{flex:1}
  /* 44 px, both of them. Hat 4, finding 11: the language buttons were 36 px and
     adjacent, 911 was 40, the sheet close 38. All legal, none comfortable with
     one wet thumb. 44 is the floor in the top bar now. */
  .lang{pointer-events:auto;display:flex;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden;
    backdrop-filter:blur(8px)}
  .lang button{appearance:none;border:0;background:transparent;color:#fff;font:inherit;
    font-size:var(--t-2nd);font-weight:700;padding:0 14px;min-height:44px;min-width:44px;
    cursor:pointer}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

  /* ---------- emergency ---------- */
  /* The digits carry a word now. Hat 1 does not know Costa Rica uses 911 rather
     than 112, and a bare red badge beside a language toggle reads as decoration. */
  .sos{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;
    background:var(--high);color:#fff;text-decoration:none;font-weight:700;
    font-size:var(--t-2nd);letter-spacing:.02em;
    padding:0 14px;min-height:44px;border-radius:999px;
    box-shadow:0 3px 12px rgba(0,0,0,.4)}
  .sos b{font-size:var(--t-body);font-weight:700;letter-spacing:.04em}
  .sos .word{text-transform:uppercase;font-size:var(--t-min);letter-spacing:.06em;
    white-space:nowrap}
  .lang,.sos{flex:0 0 auto}

  /* ---------- bottom dock ---------- */
  /* One positioned container rather than three, so chrome() has a single thing
     to measure and the fab stack has a single height to clear. On desktop this
     same element becomes the left rail: one set of cards in the DOM, never two,
     because two would be two things to keep in step. */
  .dock{position:absolute;left:0;right:0;z-index:1000;
    bottom:calc(var(--safe-pad) + 8px)}

  /* The dock's own one line. It carries three things that each need to be
     permanently visible and none of which deserves a row of its own on a 390 px
     phone: the way into the legend, how old the saved copy is, and where you
     are in the strip. Everything on it is at the 12 px floor. */
  .dockrow{display:flex;align-items:center;gap:8px;margin:0 var(--gut) 8px;
    background:rgba(11,28,44,.88);backdrop-filter:blur(8px);color:#fff;
    border-radius:10px;padding:0 6px 0 6px;min-height:40px;
    box-shadow:0 3px 12px rgba(0,0,0,.3)}
  .dockrow .btn-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
    color:#fff;font:inherit;font-size:var(--t-min);font-weight:700;
    letter-spacing:.02em;border-radius:999px;padding:0 12px;min-height:32px;cursor:pointer}
  .dockrow .txt{flex:1;min-width:0;font-size:var(--t-min);line-height:1.3;font-weight:400;
    background:none;border:0;color:inherit;font-family:inherit;text-align:left;
    padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
    text-decoration-color:rgba(255,255,255,.4);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* "2 de 6". Hat 1 and hat 2 both stopped at card two because a scroller with
     both scrollbars hidden does not announce its own length. */
  .counter{flex:0 0 auto;font-size:var(--t-min);font-weight:700;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;opacity:.9;padding:0 2px}
  .dockrow .rf{flex:0 0 auto;width:34px;height:32px;border:0;border-radius:8px;
    background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font:inherit;
    display:grid;place-items:center}
  .dockrow .rf svg{width:16px;height:16px}
  .dockrow .rf[disabled]{opacity:.45}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dockrow .rf.busy svg{animation:spin .9s linear infinite}
  @media (prefers-reduced-motion:reduce){.dockrow .rf.busy svg{animation:none}}

  /* First run only. Hat 1's single question is "which beach am I on", and the
     control that answers it was an unlabelled crosshair under a compass that
     reads as a map widget. Once it has been used once it collapses back to the
     icon, because by then the icon has a meaning. */
  .locate-first{display:none;width:calc(100% - var(--gut) * 2);margin:0 var(--gut) 8px;
    min-height:48px;border-radius:12px;border:0;background:#fff;color:var(--ink);
    font:inherit;font-size:var(--t-body);font-weight:700;cursor:pointer;
    box-shadow:0 3px 14px rgba(0,0,0,.34);align-items:center;justify-content:center;gap:9px}
  .locate-first.show{display:flex}
  .locate-first svg{width:20px;height:20px}

  /* The card strip. The MASK is the edge fade: it fades the cards themselves at
     both ends rather than painting a gradient over them, which is the only way
     to fade something sitting on satellite imagery whose colour is unknown. */
  .strip{display:flex;gap:10px;padding:4px var(--gut) 6px;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,
                                        #000 calc(100% - 18px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 18px,
                                #000 calc(100% - 18px),transparent 100%)}
  .strip::-webkit-scrollbar{display:none}

  /* ---------- the card ----------
     Anatomy, top to bottom: name, instruction, provenance chips, hours.
     One card is 84vw so the instruction has room to be the largest thing on it
     and the next card still peeks in at the edge, which is what tells a thumb
     there is a next card. */
  .card{flex:0 0 84vw;max-width:340px;scroll-snap-align:center;
    background:rgba(255,255,255,.97);border-radius:14px;padding:14px var(--gut) 16px;
    border:2px solid transparent;box-shadow:0 3px 14px rgba(0,0,0,.34);cursor:pointer;
    text-align:left;font:inherit;color:var(--ink);display:block}
  .card[aria-current="true"]{border-color:var(--ink)}
  .card .nm{display:block;font-size:var(--t-body);font-weight:700;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- pill kind 1 of 2: the status pill ----------
     THE INSTRUCTION IS THE LARGEST TEXT ON THE CARD. That is hat 4's first
     blocker and it is the whole point of the card.
     The tier colour is the LEFT BAR, never the fill, and the text is always
     ink. Hat 1: green fill on the lowest tier cancels its own words, because on
     a safety map green means go and "TAKE CARE ANYWAY" then arrives second and
     loses. Green survives on the stroke and on the swatch, where it is a map
     key rather than a verdict.
     The bar takes the -text token, which clears 3:1 on this ground; the SWATCH
     next to it draws the real map stroke in the real map colour, which is its
     documented job. They differ in hue only for moderate, and that is the
     honest version: one is chrome, the other is a sample. */
  .pill{display:flex;align-items:center;gap:10px;margin-top:8px;
    border-left:6px solid var(--tier);background:#f2f5f8;
    border-radius:3px 12px 12px 3px;padding:10px 12px 10px 10px;
    font-size:var(--t-instr);font-weight:700;line-height:1.2;
    letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
  /* Three, and only three. There were three more, for the void card, a station
     and a neutral title, which is how a component that means "do this" came to
     carry nouns. Those are titleChip() now. */
  .pill.low{--tier:var(--low-text)}
  .pill.moderate{--tier:var(--moderate-text)}
  .pill.high{--tier:var(--high-text)}
  .pill .sw{flex:0 0 auto;display:block}

  /* The post's hours, next to the instruction it qualifies. Hat 2's first
     blocker: at 17:30 the Cocles card still said SOLO CON GUARDAVIDAS while its
     own facts said the post closes at 17:00, so the only instruction on screen
     could not be obeyed. Ink, never red: a closed post is not a hazard tier. */
  .hours{display:block;margin-top:6px;font-size:var(--t-2nd);line-height:1.35;color:var(--ink)}
  .hours b{font-weight:700}

  /* ---------- pill kind 2 of 2: the provenance chip ----------
     12 px, which is the floor. Hat 4, finding 2: these shipped at 9.5 px, so the
     "unreviewed must look unreviewed" doctrine sat at a size he could not
     resolve and every beach read as reviewed. Outline and neutral, never a
     hazard colour, so a missing verdict can never be read as a verdict. */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-min);
    font-weight:700;letter-spacing:.01em;padding:3px 9px;border-radius:999px;
    border:1px solid;white-space:nowrap;line-height:1.35}
  .chip.never,.chip.expired{color:var(--gap);background:var(--gap-bg);border-color:var(--gap-line)}
  .chip.unsurveyed{color:var(--void);background:var(--void-bg);border-color:var(--void-line)}
  .chip.today{color:#fff;background:var(--today);border-color:var(--today)}
  .chip .mk{font-size:var(--t-2nd);line-height:1}
  /* THE TITLE CHIP IS THE SAME COMPONENT, ONE SIZE UP, AND THAT IS THE POINT.
     The doctrine allows exactly two pill kinds: the status pill, which is an
     INSTRUCTION, and the outline chip, which is neutral metadata. A rescue
     station's name, a hazard's noun and "zona marcada, sin definir" are none of
     them instructions, and they were rendering in the status pill, which is the
     component that means "do this". A reader who has learnt that the barred pill
     is the thing to obey would have read a noun as an order.
     So they take the outline chip at 13 px with the map's own mark beside it,
     which also makes the sheet a key for the thing that was tapped. No new
     vocabulary, no third pill. */
  .chip.title{font-size:var(--t-2nd);padding:6px 14px 6px 10px;gap:8px;
    margin:0 0 14px;border-color:rgba(11,28,44,.22);color:var(--ink)}
  .chip.title svg{display:block;flex:0 0 auto}

  /* The card for the coast this map does not describe. A DIFFERENT SPECIES:
     dashed border, hatched ground, and no status pill at all, because hat 1
     skimmed past the most honest thing on the page when it had the same size,
     shape and row as a beach. It stays IN the strip and it stays last. */
  .card.void{background:repeating-linear-gradient(135deg,#eef1f4 0 7px,#e3e8ed 7px 14px);
    border:2px dashed var(--void-line);box-shadow:0 3px 14px rgba(0,0,0,.2)}
  .card.void .nm{color:var(--void)}
  .card.void .vd{display:block;margin-top:8px;font-size:var(--t-body);font-weight:700;
    line-height:1.3;color:var(--void)}

  /* ---------- locate button ---------- */
  .fab{position:absolute;right:var(--gut);z-index:1000;
    bottom:calc(var(--safe-pad) + var(--dock-h) + 16px);
    width:52px;height:52px;border-radius:50%;border:0;background:#fff;
    box-shadow:0 3px 14px rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer}
  .fab svg{width:24px;height:24px}
  .fab.hidden{display:none}
  .compass{position:absolute;right:var(--gut);z-index:1000;
    bottom:calc(var(--safe-pad) + var(--dock-h) + 76px);
    width:44px;height:44px;border-radius:50%;border:0;background:#fff;
    box-shadow:0 3px 14px rgba(0,0,0,.35);display:grid;place-items:center;
    cursor:pointer;padding:0;font:inherit}
  .compass svg{width:30px;height:30px;overflow:visible}
  .compass #needle{transform-origin:22px 22px;transition:transform .18s linear}
  .compass.live{outline:2px solid #1565c0;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.compass #needle{transition:none}}
  .fab.on svg{color:#1565c0}

  /* ---------- bottom sheet, three stops ----------
     PEEK is the opening state and it is sized so the name, the instruction and
     who has reviewed it are all above the fold with nothing to scroll. Hat 1
     closed the old sheet because the top 40% of it was an apology. HALF is for
     reading the why and the facts. FULL is for the deferral and the actions.
     33vh rather than the specified 32: measured on a 390x844 phone, 32vh cuts
     the provenance line in half and the point of PEEK is that it does not. */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1200;
    background:var(--paper);border-radius:var(--sheet-r) var(--sheet-r) 0 0;
    box-shadow:0 -6px 28px rgba(0,0,0,.35);
    height:33vh;
    transform:translateY(102%);
    transition:transform .28s cubic-bezier(.32,.72,0,1),height .28s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;padding-bottom:var(--safe-pad)}
  .sheet[data-stop="half"]{height:70vh}
  .sheet[data-stop="full"]{height:calc(100vh - env(safe-area-inset-top,0px))}
  .sheet.open{transform:translateY(0)}
  /* Dragging must not animate: the sheet has to sit under the thumb. */
  .sheet.dragging{transition:none}
  /* Closed means GONE, from the screen reader as well as from the screen.
     Hat 4, finding 7: closing only translated it off-screen, so TalkBack swiped
     into "Cerrar, botón" and a panel that was not visible. */
  .sheet[hidden]{display:none}
  .grab{width:44px;height:5px;border-radius:3px;background:#d5dbe1;margin:10px auto 2px;
    flex:0 0 auto}
  /* The whole top strip is the drag handle, not the 44x5 bar, because a 5 px
     target is not a target. */
  .draghead{flex:0 0 auto;padding-bottom:4px;cursor:grab;touch-action:none}
  .sheet-body{overflow-y:auto;padding:4px var(--gut) 24px;-webkit-overflow-scrolling:touch}
  .sheet h2{margin:4px 0 2px;font-size:var(--t-h2);line-height:1.2;font-weight:700;
    padding-right:56px}
  /* THE HEADING TAKES FOCUS AND DRAWS NO RING, and those are two decisions.
     Moving focus here is what makes the sheet announce itself: hat 4 tapped a
     card, the panel opened and TalkBack said nothing at all. That is the part
     that must stay.
     The ring is the part that must go. Chrome matches :focus-visible on a
     programmatic focus of a tabindex="-1" element, so every sighted person who
     TAPPED a card got a 2 px rectangle drawn around the beach name, which reads
     as an editable field rather than as a heading. A focus ring is a keyboard
     affordance and this focus was never a keyboard action.
     Scoped to the heading only. Every real control on the page keeps the one
     global :focus-visible outline, which is the thing hat 4 asked for. */
  .sheet h2[tabindex="-1"]:focus,
  .sheet h2[tabindex="-1"]:focus-visible{outline:none}
  .sheet .sub{margin:0 0 4px;color:var(--muted);font-size:var(--t-2nd);line-height:1.35}
  .why{background:#f4f6f8;border-left:4px solid var(--ink);border-radius:0 10px 10px 0;
    padding:12px 14px;font-size:var(--t-body);line-height:1.45;margin:0 0 16px}

  /* ---------- the two axes, rendered so they cannot be confused ----------
     beaches.ie displays a standing classification and a current reading side by
     side and labels both, and encodes them differently on purpose. Same here.
     CHARACTER is the instruction pill and it carries the map stroke. TODAY is a
     violet-tagged line or block with a name and a timestamp on it, and it never
     borrows a hazard colour.

     THE EMPTY TODAY IS NOW ONE LINE. Hat 1 and hat 5 both stopped at it: the
     most prominent block on every beach led with "nobody has signed a bulletin
     today", which is the permanent state, and a grey box shown every single day
     teaches a reader to skip the one line that would one day carry a real
     warning. The full block still renders, but only when there is something in
     it. */
  .todayline{display:flex;align-items:center;gap:8px;margin:0 0 14px;
    font-size:var(--t-2nd);line-height:1.35;color:var(--muted)}
  .today{border:1.5px solid var(--ink);border-radius:12px;padding:10px 13px;margin:0 0 16px}
  .today .verdict{font-size:var(--t-body);font-weight:700;line-height:1.25;margin:0}
  .today .stamp{margin:5px 0 0;font-size:var(--t-min);line-height:1.45;color:var(--muted)}
  .today .rider{margin:7px 0 0;font-size:var(--t-2nd);line-height:1.45}
  .today.signed{border-color:var(--today);border-width:2px}
  .today.signed .verdict{color:var(--today)}
  .today.stale{border-style:dashed}
  .badge{display:inline-block;font-size:var(--t-min);font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:#fff;background:var(--today);border-radius:5px;
    padding:2px 7px;flex:0 0 auto}
  /* The violet tag stays on the collapsed line. Violet is outside the hazard
     palette by construction, so it can never be read as a tier, and it is what
     tells a reader that this line belongs to the TODAY axis rather than to the
     standing character above it. The words next to it carry the absence. */

  /* An exception that modifies the character, sitting where it can act on it,
     rather than stranded in a facts bullet nothing reads. */
  .caveat{margin:0 0 12px;padding:10px 12px;font-size:var(--t-2nd);line-height:1.45;
    border-radius:10px;background:#f4f6f8;border-left:4px solid var(--moderate-text)}

  /* The rule that still works when this map is wrong, rendered under every
     level. Deliberately NOT styled like a caveat: a caveat qualifies the verdict
     above it, and this outranks the verdict above it. Solid ink, full border, no
     fill, so it reads as the standing rule rather than as one more exception. */
  .defer{margin:0 0 16px;padding:12px 13px;font-size:var(--t-2nd);line-height:1.45;
    font-weight:700;border:1.5px solid var(--ink);border-radius:10px;color:var(--ink)}

  /* Provenance sits directly under the claim it qualifies, not in a footer.
     ONE LINE now, two fields on it. Two stacked rows pushed the why below the
     fold at PEEK; the two claims are still separate and still both named, which
     is what OVSICORI's Autor / Revisado split is for. */
  .prov{margin:0 0 10px;font-size:var(--t-2nd);line-height:1.5;color:var(--muted)}
  .prov b{font-weight:700;color:var(--ink)}
  .prov .row{display:block}
  .prov.unverified{color:var(--gap);background:var(--gap-bg);border:1px solid var(--gap-line);
    border-radius:10px;padding:9px 12px}
  .prov.unverified b{color:var(--gap)}

  /* Absence in the sheet: the same marks as on the card, stacked, each with its
     own sentence. Never one banner for three different facts. */
  .gaplist{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
  .gaplist li{display:flex;gap:9px;align-items:flex-start;font-size:var(--t-2nd);
    line-height:1.45;border-radius:10px;padding:10px 12px;border:1px solid}
  .gaplist li.never,.gaplist li.expired{color:var(--gap);background:var(--gap-bg);border-color:var(--gap-line)}
  .gaplist li.unsurveyed{color:var(--void);background:var(--void-bg);border-color:var(--void-line)}
  .gaplist .mk{flex:0 0 18px;text-align:center;font-weight:700}
  .gaplist b{display:block;font-weight:700}

  .facts{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px}
  .facts li{display:flex;gap:10px;font-size:var(--t-body);line-height:1.45;align-items:flex-start}
  .facts .ic{flex:0 0 18px;text-align:center;font-size:var(--t-body)}
  /* The one fact that is an instruction rather than a description. EVERY beach
     carries it, word for word, not only the four with a named rip: the
     lower-risk rider already tells the reader that dangerous rip currents are
     possible near reefs, channels, headlands and river mouths, which is every
     beach on this coast. Naming the hazard and withholding the escape on the
     same card is deciding the sentence is decoration.
     Hat 1: the sentence that could save him sat behind a tap on an arrow he did
     not know was tappable. */
  .facts li.escape{font-weight:700;background:#f4f6f8;border-radius:10px;padding:10px 12px}

  .actions{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
    border-radius:12px;border:1.5px solid rgba(11,28,44,.18);background:#fff;
    font:inherit;font-size:var(--t-2nd);font-weight:700;color:var(--ink);
    text-decoration:none;cursor:pointer;text-align:center;line-height:1.2;padding:0 8px}
  .btn.primary{background:var(--high);border-color:var(--high);color:#fff;
    font-size:var(--t-body)}
  .btn.wide{grid-column:1 / -1}
  /* Hat 5, finding 10: a safety instrument with no correction channel keeps a
     known error forever, and there was no contact anywhere in 2,291 lines.
     The wordmark link is the other half of the same fix. */
  .footlink{margin:2px 0 0;font-size:var(--t-min);line-height:1.5;color:var(--muted);
    text-align:center}
  .footlink a{color:var(--muted)}
  /* 12 px in from both edges, and above the scroll container rather than
     inside it. At an 8 px inset it sat half on the sheet-body's scrollbar
     track, so on the phone it looked clipped by the sheet edge and on desktop
     it fought the scrollbar for the same pixels. The 44 px hit area is
     unchanged; only the inset and the stacking moved. */
  .close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;
    border:0;background:rgba(11,28,44,.07);font-size:22px;line-height:1;cursor:pointer;
    color:var(--ink);z-index:5;display:grid;place-items:center;padding:0}
  /* Reserve the scrollbar's width whether or not it is showing, so the content
     does not shift by 15 px the moment a sheet grows past its stop. */
  .sheet-body{scrollbar-gutter:stable}

  /* ---------- the legend ----------
     Merged: our four instructions, then Caribbean Guard's own V5 vocabulary in
     their words. Two columns, Spanish then English, exactly as the V5 sheet
     prints it, because a tourist and a local read the same box. Hat 5, finding
     8: four numbered circles sat on the coast meaning nothing until tapped,
     while the association's own map has carried a bilingual key in the corner
     all along. */
  .legend h3{margin:18px 0 8px;font-size:var(--t-2nd);font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .legend h3:first-child{margin-top:4px}
  .legend .row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;
    padding:9px 0;border-top:1px solid #e7ecf1}
  .legend .row .mark{display:grid;place-items:center;height:22px}
  /* .es and .en are wrapped in .txt rather than being siblings of .mark. As
     direct children of the grid they auto-placed into the NEXT ROW's first
     column, which is the 34 px mark column, and the English wrapped to one word
     per line. */
  .legend .txt{display:block;min-width:0}
  /* .cur and .oth, NOT .es and .en, and the comment that used to sit here said
     "Spanish then English" and was false half the time: legendHTML() puts the
     READER'S language first and the other second, so in English the left column
     is English. Naming a column after a language it does not always hold is the
     kind of small lie that survives until somebody styles Spanish and gets
     English. The V5 sheet prints Spanish first because its reader is assumed to
     be here; ours knows which language its reader chose. */
  .legend .cur{display:block;font-size:var(--t-2nd);font-weight:700;line-height:1.3}
  .legend .oth{display:block;font-size:var(--t-min);line-height:1.3;color:var(--muted)}
  /* Two language columns, the reader's first, as the V5 sheet lays them out.
     Stacks below 360 px, where two columns would force the type under the 12 px
     floor and the floor outranks the layout. */
  @media (min-width:360px){
    .legend .txt{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
  }

  /* ---------- post markers ----------
     Caribbean Guard's own hexagon, in Caribbean Guard's own orange. The dark
     outline is what holds it over water: #f39c12 against Caribbean blue is
     under the 3:1 non-text bar on its own. */
  .po{display:grid;place-items:center;width:32px;height:32px;
    background:var(--station);font-weight:700;font-size:var(--t-2nd);color:var(--ink);
    clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0% 50%);
    filter:drop-shadow(0 0 1.5px #0b1c2c) drop-shadow(0 2px 5px rgba(0,0,0,.55))}
  /* The collapsed badge. Bigger than one station and carrying "x4" rather than
     a bare numeral, so it reads as a count of stations and never as station
     number four. Same hexagon and same orange, because it is the same kind of
     thing: one mark standing for several. */
  .po.cluster{width:38px;height:38px;font-size:var(--t-body);letter-spacing:-.02em}

  /* ---------- offline / signal banner ---------- */
  .toast{position:absolute;left:var(--gut);right:var(--gut);z-index:1400;
    top:calc(env(safe-area-inset-top,0px) + 66px);
    background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;
    font-size:var(--t-2nd);line-height:1.4;box-shadow:0 4px 18px rgba(0,0,0,.4);
    display:none}
  .toast.show{display:block}

  /* ---------- new build available ----------
     Surfrider's pattern. A cache-first safety map with no way to say "the
     verdicts you are reading are the old ones" will show a stale verdict
     forever, which is the exact failure the provenance machinery exists to
     prevent, one layer down. */
  .update{position:absolute;left:var(--gut);right:var(--gut);z-index:1500;
    top:calc(env(safe-area-inset-top,0px) + 66px);
    display:none;align-items:center;gap:10px;
    background:#fff;color:var(--ink);border-radius:12px;padding:10px 10px 10px 13px;
    box-shadow:0 4px 20px rgba(0,0,0,.45);font-size:var(--t-2nd);line-height:1.35}
  .update.show{display:flex}
  .update .msg{flex:1;font-weight:700}
  .update button{border:0;font:inherit;font-size:var(--t-2nd);font-weight:700;cursor:pointer;
    border-radius:9px;min-height:44px;padding:0 13px}
  .update .go{background:var(--ink);color:#fff}
  .update .no{background:transparent;color:var(--muted);padding:0 8px;min-width:44px}

  /* 12 px, like everything else. Leaflet's 10 px default is conventional and
     it is still text on a page whose acceptance rule is that nothing is under
     the floor. "How far is 200 m" is a question this map's own advice raises,
     so the scale bar above is content, not chrome. */
  .leaflet-control-attribution{font-size:var(--t-min);padding:0 5px}
  /* The scale bar answers "how far is 200 m", which is the unit the escape
     instruction is written in, so it has to be readable rather than tucked
     under the dock. Lifted by the dock's own measured height. */
  .leaflet-bottom.leaflet-left{bottom:calc(var(--safe-pad) + var(--dock-h) + 4px)}

  /* The rail head and the permanent legend exist only on desktop. They are in
     the DOM on a phone too, and hidden, rather than built twice. */
  .railhead,.legend-perm{display:none}

  /* ================= DESKTOP =================
     Hat 5's seventh finding: what the board saw first was the phone stretched
     to 1568 px, a row of small tiles clipped by the bottom edge, no legend, no
     title, nothing saying what this is. Four of the five hats voted the same
     layout, a left column holding every beach. */
  @media (min-width:820px){
    /* The dock becomes the rail. Same cards, same DOM, different axis. */
    .dock{top:0;right:auto;bottom:0;width:360px;
      background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
      box-shadow:2px 0 24px rgba(0,0,0,.35);
      display:flex;flex-direction:column;overflow:hidden;
      padding-bottom:var(--safe-pad)}
    .railhead{display:block;flex:0 0 auto;padding:16px var(--gut) 12px;
      border-bottom:1px solid #e7ecf1}
    .railhead .wm{display:block;font-size:var(--t-body);font-weight:700;
      letter-spacing:.04em;color:var(--ink);text-decoration:none}
    .railhead .what{margin:6px 0 0;font-size:var(--t-2nd);line-height:1.4;color:var(--muted)}
    .dockrow{margin:10px var(--gut) 0;background:var(--void-bg);color:var(--ink);
      box-shadow:none;border:1px solid var(--void-line)}
    .dockrow .txt{text-decoration-color:rgba(11,28,44,.35)}
    .dockrow .rf{background:rgba(11,28,44,.08);color:var(--ink)}
    /* The legend is permanently open on desktop, so the chip that opens it as a
       sheet has nothing left to do; and every card is visible, so the counter
       has nothing left to count. */
    .dockrow .btn-chip,.counter{display:none}
    /* The rail scrolls its own two regions, never the page: six cards, a
       permanent legend and a title do not fit in 800 px of laptop, and a page
       that scrolls would take the map with it. Cards get whatever the legend
       does not, which on a tall window is all six at once. */
    .strip{flex:1 1 auto;min-height:0;flex-direction:column;overflow-x:hidden;
      overflow-y:auto;scroll-snap-type:none;padding:12px var(--gut);gap:10px;
      -webkit-mask-image:none;mask-image:none}
    .card{flex:0 0 auto;width:100%;max-width:none;padding:12px 14px 13px}
    .legend-perm{display:block;flex:0 0 auto;max-height:min(300px,38vh);
      overflow-y:auto;padding:0 var(--gut) 12px;border-top:1px solid #e7ecf1}
    .legend-perm .cur{font-size:var(--t-min)}
    /* The beach panel is a full-height right column and it never sits on the
       coast it is describing: fitCoast() pads the map by both of these widths,
       so the strokes stay in the open middle. */
    .sheet{left:auto;right:0;top:0;bottom:0;width:400px;height:auto;
      border-radius:0;box-shadow:-2px 0 24px rgba(0,0,0,.35);
      transform:translateX(102%)}
    .sheet[data-stop="peek"],.sheet[data-stop="half"],.sheet[data-stop="full"]{height:auto}
    .sheet.open{transform:translateX(0)}
    .draghead{cursor:default}
    .grab{display:none}
    .sheet-body{padding-top:16px}
    /* Nobody locates themselves from a laptop, and a laptop cannot dial, so the
       locate control is demoted and the emergency number is read rather than
       tapped. Both were unanimous across the hats. */
    .fab{width:40px;height:40px;right:12px;bottom:16px}
    .fab svg{width:20px;height:20px}
    .compass{right:12px;bottom:66px}
    .locate-first{display:none !important}
    .sos{cursor:default}
    .toast,.update{left:auto;right:16px;width:360px}
    /* The dock is a full-height rail here, so --dock-h is the viewport and the
       phone rule above would push the scale bar off the top. */
    .leaflet-bottom.leaflet-left{bottom:0;left:360px}
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <!-- Links home. Hat 5: the association's biggest tourist touchpoint was a
       dead end with no route back to the organisation whose name is on it. -->
  <a class="brand" id="brand" href="https://caribbeanguard.org" target="_blank" rel="noopener">
    CARIBBEAN GUARD<small id="tagline">Mapa de seguridad costera</small></a>
  <div class="spacer"></div>
  <a class="sos" id="sos" href="tel:911"><b>911</b><span class="word" id="sos-word">Emergencia</span></a>
  <div class="lang" role="group" id="lang-group" aria-label="Idioma">
    <button id="btn-es" aria-pressed="true">ES</button>
    <button id="btn-en" aria-pressed="false">EN</button>
  </div>
</div>

<!-- role="alert", not role="status" with aria-live="assertive". Hat 4, finding
     12: that pairing is resolved inconsistently by assistive technology, and
     every message this carries is safety relevant ("you are between two
     beaches", "you are outside this coastline"). -->
<div class="toast" id="toast" role="alert" aria-atomic="true"></div>

<button class="fab" id="locate" aria-label="Mi ubicación">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>
    <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>
  </svg>
</button>

<!-- North arrow. On a phone with a compass this becomes a live heading
     indicator: the needle keeps pointing north while you turn, which is the
     question somebody on the sand actually has ("which way am I facing?").
     Without a compass it stays a plain north arrow, which is still correct
     because the imagery is rectified north-up. -->
<button class="compass" id="compass" aria-label="Norte" aria-live="off">
  <svg viewBox="0 0 44 44" aria-hidden="true">
    <g id="needle">
      <path d="M22 7 L27.4 24 L22 20.6 L16.6 24 Z" fill="#c62828"/>
      <path d="M22 37 L16.6 20 L22 23.4 L27.4 20 Z" fill="#8ea3b6"/>
    </g>
    <text x="22" y="6.4" text-anchor="middle" font-size="7.5" font-weight="700"
          fill="#0b1c2c" font-family="inherit">N</text>
  </svg>
</button>

<div class="dock" id="dock">

  <!-- Desktop only. Hat 5 opened this on a laptop in front of the board and
       there was no title and nothing saying what the thing was. -->
  <div class="railhead">
    <a class="wm" href="https://caribbeanguard.org" target="_blank" rel="noopener">CARIBBEAN GUARD</a>
    <p class="what" id="rail-what">Qué hacer en cada playa de esta costa, según Caribbean Guard.</p>
  </div>

  <div class="dockrow">
    <button class="btn-chip" id="legend-open" type="button">Leyenda</button>
    <button class="txt" id="saved-txt" type="button"></button>
    <button class="rf" id="saved-refresh" type="button" aria-label="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 5v6h-6"/>
      </svg>
    </button>
    <span class="counter" id="counter" aria-hidden="true"></span>
  </div>

  <!-- First run only; JS collapses it to the round icon once it has been used. -->
  <button class="locate-first" id="locate-first" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>
      <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>
    </svg>
    <span id="locate-first-label">¿En qué playa estoy?</span>
  </button>

  <!-- THE CARDS ARE STATIC HTML AND THAT IS DELIBERATE.
       Hat 4, finding 6: #picker shipped empty and filled only after 147 KB of
       Leaflet had arrived and parsed, so on a 2-bar Slow 3G link there were ten
       seconds of navy before the first instruction word appeared. Nobody needs a
       satellite image to be told to stay out of the water. buildPicker() adopts
       these on first run and replaces them on a language switch, so this markup
       is the Spanish first paint and nothing more. Keep it in step with
       cardHTML() below; it is generated from the same anatomy by hand. -->
  <div class="strip" id="picker">
    <button class="card" data-id="cg:zone/playa-negra" aria-current="false">
      <span class="nm">Playa Negra</span>
      <span class="pill low"><svg class="sw" width="30" height="16" viewBox="0 0 30 16" aria-hidden="true" focusable="false"><rect width="30" height="16" rx="4" fill="#24384a"/><line x1="3" y1="8" x2="27" y2="8" stroke="#1f9d55" stroke-width="3" stroke-linecap="round" stroke-dasharray="1.2 4.8"/></svg>IGUAL, TEN CUIDADO</span>
      <span class="chips"><span class="chip never"><span class="mk" aria-hidden="true">?</span>Sin revisar</span><span class="chip unsurveyed"><span class="mk" aria-hidden="true">ø</span>Sin recorrer</span></span>
    </button>
    <button class="card" data-id="cg:zone/salsa-brava" aria-current="false">
      <span class="nm">Salsa Brava</span>
      <span class="pill high"><svg class="sw" width="30" height="16" viewBox="0 0 30 16" aria-hidden="true" focusable="false"><rect width="30" height="16" rx="4" fill="#24384a"/><line x1="3" y1="8" x2="27" y2="8" stroke="#c62828" stroke-width="6.6" stroke-linecap="round"/></svg>NO ENTRES AL AGUA</span>
      <span class="chips"><span class="chip never"><span class="mk" aria-hidden="true">?</span>Sin revisar</span><span class="chip unsurveyed"><span class="mk" aria-hidden="true">ø</span>Sin recorrer</span></span>
    </button>
    <button class="card" data-id="cg:zone/cocles" aria-current="false">
      <span class="nm">Playa Cocles</span>
      <span class="pill high"><svg class="sw" width="30" height="16" viewBox="0 0 30 16" aria-hidden="true" focusable="false"><rect width="30" height="16" rx="4" fill="#24384a"/><line x1="3" y1="8" x2="27" y2="8" stroke="#c62828" stroke-width="6.6" stroke-linecap="round"/></svg>SOLO CON GUARDAVIDAS</span>
      <span class="hours"><b>Guardavidas 9:00 a 17:00</b></span>
      <span class="chips"><span class="chip never"><span class="mk" aria-hidden="true">?</span>Sin revisar</span><span class="chip unsurveyed"><span class="mk" aria-hidden="true">ø</span>Sin recorrer</span></span>
    </button>

      NOAA's sentence naming the structures where rips persist anyway, adapted to
      the structures that exist on this coast.

   3. EVERY LEVEL DEFERS DOWNWARD, to the guards and to the flags on the sand.

/* Follow the phone's locale, with Spanish as the floor.

   Following the locale is right: this coast is mostly read by tourists, and a
   tourist's phone is usually in their own language. Spanish as the floor is also
   right: Caribbean Guard is a Costa Rican organisation writing in Spanish, so an
   unrecognised locale should land on the language of the place, not on English.

   Walking `navigator.languages` rather than only `navigator.language` matters for
   the case in between. A German phone set to ["de-DE", "en-GB"] has stated that
   it prefers English over nothing, and we publish English, so it gets English.
   A phone set to ["de-DE"] alone has stated no preference we can honour, and
   falls to Spanish. That is a preference being respected in the first case and a
   fallback being applied in the second, which are different things.

   The two-language check is deliberately explicit rather than
   `startsWith("en") ? "en" : "es"`. That earlier form silently sent every
   non-English locale to Spanish, which happens to be the same answer most of the
   time and for the wrong reason. */
function pickLang(){
  const tags = (navigator.languages && navigator.languages.length)
    ? navigator.languages
    : [navigator.language || ""];
  for(const tag of tags){
    const base = String(tag).toLowerCase().split("-")[0];
    if(base === "en") return "en";
    if(base === "es") return "es";
  }
  return "es";   // the floor, and it is the language of the coast
}
let lang = pickLang();

/* Map graphics drawn straight onto photography, so the job
   here is separating the three tiers FROM EACH OTHER rather than from a page
   background. They are separated by brightness, not hue, because hue is the first
   thing a sun-washed screen loses:
       moderate  L 0.545   ---- 3.19:1 ----+
       low       L 0.251   -- 1.98:1 --+   |
       high      L 0.137   -- 1.52:1 --+---+
   The dark #9C5C00 moderate is deliberately NOT used here: against high it
   measures 1.06:1, which on a map line is indistinguishable. It stays reserved
   for text and dots on white, where it is the value that passes 4.5:1. */
const COLOR = {low:"#1f9d55", moderate:"#f5b942", high:"#c62828"};

/* ============================================================
   3. THE TWO AXES, AND THE THREE WAYS OF NOT KNOWING

   Absence gets drawn, never hidden. Safeswim publishes eleven pin types and two
   of them are kinds of not knowing: grey means the feed broke, and a separate
   "water safety information only" pin means this beach was never in the
   programme at all. Different facts, different marks.

   Ours has three, and they can co-occur, so they render as a STACK of marks and
   never as one banner:

     never       nobody at Caribbean Guard has ever reviewed this beach
     expired     somebody did, too long ago
     unsurveyed  this stretch is outside the annotated sheet the hazards came off

   The third is the one that matters most and it was the one least visible: the
   sheet covers 1.86 km of 16.66 km, and the map used to say so in a toast that
   fired six seconds after load and then vanished. An absence rendered as nothing
   is indistinguishable from an absence of hazard, which is the precise misreading
   the coverage caveat exists to prevent. It is now a permanent card in the picker
   and a permanent mark on every beach it applies to.
   ============================================================ */

/* The stretch Caribbean Guard's annotated sheet actually covers, in longitude.
   Seeded from the shipped data so the picker can render before the fetch
   resolves, then recomputed from the fetched features so it can never drift from
   what is drawn. The coast runs broadly east to west, so a longitude interval is
   the right shape for this and a bounding box would overstate it. */
let SURVEY = {w:-82.724144, e:-82.707199};

/* THE THREE NUMBERS ON THE "REST OF THE COAST" SHEET MUST SHARE A BASIS.

   That sheet says: this map covers N km of coast, five beaches describe M of
   it, and Caribbean Guard's annotated sheet covers S. `total` and `surveyed`
   are both EAST-WEST EXTENTS, a chord at a fixed latitude. `zoned` used to be
   the summed length of the drawn zone lines, which was near enough while those
   lines were 7-to-60-point decimations, and stopped being near enough the day
   the traced coastline replaced them: arc length along a sinuous shore is much
   longer than the chord it spans. Measured, the traced zones sum to 15.0 km
   against a 16.6 km chord, which would have told a reader that only 1.6 km of
   this coast is undescribed. The true figure on a common basis is 7.2 km.

   That card is the most defensible thing on this page and the one hat 5 said
   is where a board would otherwise be exposed. A number that quietly argues
   the opposite of what the card is for is worse than no number. So all three
   are extents now, and none of them waits for a fetch. */
function zonedExtentM(){
  return ZONES.reduce((sum, z) =>
    sum + map.distance([9.646, z.span.w], [9.646, z.span.e]), 0);
}

/* Reads z.span, not z.line. The drawn line arrives over the network and the
   chip that says whether anybody walked this stretch has to be on the card in
   the first paint, before Leaflet exists. Both come from the same traced
   coastline, so they cannot disagree. */
function surveyRelation(z){
  const lo = z.span.w, hi = z.span.e;
  if(hi < SURVEY.w || lo > SURVEY.e) return "out";
  if(lo >= SURVEY.w && hi <= SURVEY.e) return "in";
  return "partial";
}

/* Days elapsed since a YYYY-MM-DD, built in LOCAL time.
   new Date("2026-07-01") parses as UTC midnight, and formatting that anywhere
   west of Greenwich renders the previous day, so a review dated the 1st displayed
   as 30 June. On fields whose entire purpose is saying when, an off by one day is
   not acceptable. */
function localDate(ymd){
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(d){
  return d.toLocaleDateString(lang === "es" ? "es-CR" : "en-GB",
                              {year:"numeric", month:"long", day:"numeric"});
}
function fmtStamp(d){
  return d.toLocaleString(lang === "es" ? "es-CR" : "en-GB",
                          {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}

/* ---- axis 1: character ---- */
function characterState(z){
  const r = z.character.reviewed;
  if(!r) return {gap:"never"};
  const on = localDate(r.on);
  const days = Math.floor((Date.now() - on.getTime()) / 86400000);
  return days > CHARACTER_VALID_DAYS
    ? {gap:"expired", reviewed:r, on, days}
    : {reviewed:r, on, days};
}

/* ---- axis 2: today ---- */
function todayState(z){
  const t = z.today;
  if(!t) return null;
  const at = new Date(t.at);
  const hours = (Date.now() - at.getTime()) / 3600000;
  return {notice:t.notice, at, hours, stale: hours > TODAY_VALID_HOURS, rec:t};
}
/* Only a signed, unexpired notice draws on the map, and `normal` draws nothing:
   "a guard looked and found nothing unusual" adds no mark, because the mark would
   read as an all clear and that is not what it says. */
function todayHalo(z){
  const s = todayState(z);
  if(!s || s.stale || s.notice === "normal") return null;
  return "#7b1fa2";
}

/* ---- the three absences, as data ---- */
function absences(z){
  const t = T[lang], out = [];
  const c = characterState(z);
  //                 css            mark   card tag           sheet heading + sentence
  if(c.gap === "never")
    out.push({css:"never",      mk:"?", tag:t.gapNeverTag,      short:t.gapNeverShort,      long:t.gapNever});
  if(c.gap === "expired")
    out.push({css:"expired",    mk:"!", tag:t.gapExpiredTag,    short:t.gapExpiredShort,    long:t.gapExpired});
  const rel = surveyRelation(z);
  /* The marks are ø and ½, not ⌀ and ◐, and that is a font decision rather than
     a taste one. The self-hosted Atkinson Hyperlegible is the latin subset,
     U+0000 to U+00FF: ⌀ (U+2300) and ◐ (U+25D0) are outside it and would fall
     back to whatever a cheap Android happens to have, which on a safety card is
     a tofu box sitting where a meaning should be. Both replacements are in
     Latin-1 and both still read as what they are: empty, and half. */
  if(rel === "out")
    out.push({css:"unsurveyed", mk:"ø", tag:t.gapUnsurveyedTag, short:t.gapUnsurveyedShort, long:t.gapUnsurveyed});
  if(rel === "partial")
    out.push({css:"unsurveyed", mk:"½", tag:t.gapPartialTag,    short:t.gapPartialShort,    long:t.gapPartial});
  return out;
}

/* One row of chips on the card: a signed bulletin first if there is one, then
   every absence that applies. One container, so a beach that is both unreviewed
   and unsurveyed shows two chips side by side rather than two stacked rows.
   12 px, the floor: at the 9.5 px these used to be, hat 4 could not resolve
   them at all, so the "unreviewed must look unreviewed" doctrine was invisible
   and every beach read as reviewed. */
function cardChips(z){
  const t = T[lang], s = todayState(z);
  const chips = [];
  if(s && !s.stale)
    chips.push(`<span class="chip today"><span class="mk" aria-hidden="true">•</span>${t.axisToday}</span>`);
  absences(z).forEach(a=>
    chips.push(`<span class="chip ${a.css}"><span class="mk" aria-hidden="true">${a.mk}</span>${a.tag}</span>`));
  return chips.length ? `<span class="chips">${chips.join("")}</span>` : "";
}
function gapList(z){
  const g = absences(z);
  if(!g.length) return "";
  return `<ul class="gaplist">${g.map(a=>
    `<li class="${a.css}">
       <span class="mk" aria-hidden="true">${a.mk}</span>
       <span><b>${a.short}</b>${a.long}</span>
     </li>`).join("")}</ul>`;
}

/* ---- provenance, two fields, following OVSICORI ----
   Autor and Revisado are different claims and they stay different claims.
   Collapsing them into one is how a machine reading of a published graphic gets
   read as a lifeguard's word. The empty review state renders visibly rather than
   hiding: theirs prints a bare "-", ours says who is missing.

   ONE LINE in the sheet now rather than two stacked rows, because the sheet
   opens at PEEK and the instruction, the provenance and today all have to be
   above the fold there with nothing to scroll. Two fields on one line is a
   layout change; one field would have been a doctrine change. */
function provenance(rec, inline){
  const t = T[lang];
  const authored = t["authored" + rec.authored.charAt(0).toUpperCase() + rec.authored.slice(1)];
  const r = rec.reviewed;
  let reviewed, stale = "";
  if(!r){
    reviewed = t.reviewedNobody;
  } else {
    const on = localDate(r.on);
    const days = Math.floor((Date.now() - on.getTime()) / 86400000);
    reviewed = t.reviewedBy(r.by, r.org, fmtDate(on));
    if(days > CHARACTER_VALID_DAYS) stale = " " + t.charStale(CHARACTER_VALID_DAYS);
  }
  const cls = !r || stale ? " unverified" : "";
  if(inline)
    return `<p class="prov${cls}"><b>${t.provAuthor}:</b> ${authored} · <b>${t.provReviewed}:</b> ${reviewed}${stale}</p>`;
  return `<p class="prov${cls}">
    <span class="row"><b>${t.provAuthor}:</b> ${authored}</span>
    <span class="row"><b>${t.provReviewed}:</b> ${reviewed}${stale}</span>
  </p>`;
}

/* ---- the today axis ----
   COLLAPSED TO ONE LINE WHEN NOBODY HAS SIGNED, WHICH IS EVERY DAY SO FAR.

   It used to render the empty state as the most prominent block on every beach:
   a dashed box, a badge, a verdict line and a three-line explanation, all of it
   saying nothing has happened. Hat 1 read "nobody", decided the app knew
   nothing and closed it before reaching the red instruction underneath. Hat 5
   put it more sharply from the board's side: a permanent grey box teaches a
   reader to skip the one line that would one day carry a real warning.

   So the axis keeps its violet tag and its place under the provenance, and
   shrinks to "Hoy: sin reporte firmado". The full block still exists and still
   renders in full, the moment there is anything in it. */
function todayBlock(z){
  const t = T[lang], s = todayState(z);
  if(!s){
    return `<p class="todayline"><span class="badge">${t.axisToday}</span>${t.todayNoneLine}</p>`;
  }
  const label = {"no-swim":t.todayNoSwim, "care":t.todayCare, "normal":t.todayNormal}[s.notice];
  const rider = s.notice === "normal" ? `<p class="rider">${t.todayNormalRider}</p>` : "";
  const old   = s.stale ? `<p class="rider">${t.todayStale(TODAY_VALID_HOURS)}</p>` : "";
  return `<div class="today signed${s.stale ? " stale" : ""}">
      <p class="verdict"><span class="badge">${t.axisToday}</span>${label}</p>
      <p class="stamp">${t.todaySigned(s.rec.by, s.rec.org, fmtStamp(s.at))}</p>
      ${old}${rider}
    </div>`;
}

/* ---- the post's clock ----
   Renders only for a zone that has one. The closed state is appended in ink,
   never in red: a post that has gone home is not a hazard tier, and colouring
   it like one would be the third colour claim on a card that already carries
   two. Reads the device clock, which is the only clock a phone on the sand has.
   Deliberately no timezone handling: the reader and the post are in the same
   place, so local is the correct and only sensible reading.

   IT COMPUTES ONCE, AT RENDER, AND THAT IS ACCEPTED. A page left open across
   17:00 keeps showing the card as it was when it was drawn, until something
   else re-renders it: a language switch, a tap on a card, a refresh. Nobody
   stands on the sand with this page open and untouched for the twenty minutes
   either side of the boundary, and the alternative is a timer that repaints
   every card on a safety map on a schedule, which is a live-updating behaviour
   this file does not otherwise have and cannot test cheaply. Reviewed and
   accepted 2026-09-17. If a bulletin-signing surface ever lands and the cards
   start refreshing on their own, fold this into that loop rather than adding a
   second one. */
function hoursLine(z){
  const p = z.post;
  if(!p) return "";
  const t = T[lang], h = new Date().getHours();
  const closed = (h < p.from || h >= p.to) ? ` · ${t.postClosed}` : "";
  return `<span class="hours"><b>${p[lang]}</b>${closed}</span>`;
}

/* ---- ESCAPE ----
   The instruction that works when everything else on this page is wrong, on
   EVERY beach, word for word.

   It was on the four beaches with a named rip, and that was wrong for the exact
   reason the lowest tier exists: charLowerRiskRider already tells the reader, on
   every lower-risk beach, that dangerous rip currents are still possible near
   reefs, channels, headlands and river mouths. A page that names the hazard on a
   beach and then withholds the escape on that same beach has decided the
   sentence is decoration. Playa Negra is the calmest stretch on this coast and
   it is still the sea.

   One sentence, five beaches, and the same sentence on the rip arrow sheet. The
   thing being asked of a frightened swimmer is recall, and recall works on one
   memorised sentence, not on four paraphrases. */
function factsOf(z){
  const list = (z.character.facts[lang] || []).slice()
    .map(f => `<li><span class="ic" aria-hidden="true">•</span><span>${f}</span></li>`);
  /* » and not an arrow glyph: U+00BB is inside the latin subset this page
     self-hosts, U+2192 is not, and a tofu box on the one instruction that
     matters is worse than a plain mark. */
  list.push(`<li class="escape"><span class="ic" aria-hidden="true">»</span><span>${T[lang].escapeRip}</span></li>`);
  return `<ul class="facts">${list.join("")}</ul>`;
}

/* ---------- map ---------- */
const BB = L.latLngBounds(IMG_BOUNDS);
const SAFE = L.latLngBounds(IMG_SAFE);
const map = L.map("map",{
  zoomControl:false, attributionControl:true,
  maxBounds:BB.pad(0.02), maxBoundsViscosity:1.0,
  maxZoom:18, zoomSnap:0.25, tap:true
});
/* THE BASEMAP IS A TILE PYRAMID, not one image.

   It used to be a single `imageOverlay` of a 1.19 MB generative upscale, and that
   one choice caused three separate problems that took a great deal of code to
   manage rather than fix:

   - BLACK BANDS. One finite rectangle over a 3.5:1 coast letterboxes on every
     viewport shape. A blurred, darkened copy of the image was stretched into the
     gaps, and it still read as a void at full zoom-out.
   - A ZOOM FLOOR THAT HAD TO BE COMPUTED. Zooming out past the image bought only
     empty space, so the floor was derived, clamped and re-derived on every
     resize, with a pan limit hung off the backdrop's bounds.
   - 5 TO 75 M OF DISPLACEMENT. The upscale is not registered to the coordinates
     everything else on this map uses. See docs/handoffs/2026-09-14.

   Tiles have none of them: they cover whatever the viewport can reach at any
   zoom, they are the same ground truth the coastline is traced from, and the
   floor is now a design choice rather than an artefact of image size.

   Cost is paid per tile and only for what is on screen, so the critical path is
   smaller than the old overview, not larger: about 6 tiles at 9 KB to fill a
   phone at the opening view, against one 36 KB overview image.

   `maxNativeZoom` is 17 because that is what the cache holds. Above it Leaflet
   upscales the z17 tile, which is honest blurring rather than invented detail.

   LICENSING: serving these redistributes Bing imagery, which their terms do not
   permit. Deriving a coastline from imagery is not the same act as reselling it.
   Before this is published, either license the imagery or point `tileUrl` at
   Esri World Imagery, which is free with attribution and finer than this cache.
   Self-hosting buys one thing a remote layer cannot: these tiles can be
   precached, and offline is the whole point of the map. */
/* TWO BOXES, and they are not the same box.

   FULL is every zoom, a tight rectangle around the coast, and it is what the
   pan limit is built from: inside it there is imagery at any zoom somebody can
   reach. CONTEXT is wider but only exists at z12 to z14, fetched purely so that
   a zoomed-out viewport on a wide screen has sea and forest at its edges instead
   of black. Asking for a z17 tile out there returns nothing, which is why the
   pan limit stays on FULL while the layer is allowed to request the wider box. */
const TILE_FULL = L.latLngBounds([[9.61429, -82.801208], [9.687398, -82.6474]]);
/* Widened, and this is what actually fixed the navy landing view. fitCoast()
   derives the zoom floor from the viewport, so a 390x844 phone lands at about
   z11.8 and Leaflet asks for LEVEL 12; at that zoom a pixel is 43 m, so 844 px
   of phone is 36 km of ground and the old z12 box was 22 km tall. The opening
   view ran out of imagery about 7 km above and below the coast on every
   portrait phone. This box is what the pyramid now covers. `bounds` is a hard
   gate: Leaflet will not request a tile outside it however many are on disk. */
const TILE_CONTEXT = L.latLngBounds([[9.0570, -83.1617], [10.2448, -82.2869]]);

const TILES = L.tileLayer("tiles/{z}/{x}/{y}.jpg", {
  minZoom: 10, maxNativeZoom: 17, maxZoom: 18,
  bounds: TILE_CONTEXT,
  // No flat fill showing through at the edges of coverage, and no grey flash
  // between a tile being requested and arriving.
  className: "basemap", keepBuffer: 3, updateWhenIdle: false,
  attribution: "Imágenes satelitales"
}).addTo(map);
const TILE_BOUNDS = TILE_FULL;
map.attributionControl.setPrefix("").addAttribution("Caribbean Guard");

/* Contain, do not cover. This was cover-fit, and on a 390px portrait phone that
   blew a 3.5:1 coast up until you could see about 370 m of it: all water, no
   headland, nothing telling you which beach you were looking at. Someone who has
   just scanned a QR code needs orientation in the first second, so show the whole
   16.6 km and let the empty bands above and below be the page background. The
   image carries alpha for the same reason, so the rotated corners read as
   background rather than as black wedges. */
/* On a phone the chrome is a band at the top and a band at the bottom. On
   desktop it is two COLUMNS, the rail on the left and the beach panel on the
   right, and the map has to be padded by both or the coast ends up underneath
   the panel describing it. Hat 5's vote was explicit: the right-hand panel must
   never overlap the coast it describes. */
function desktop(){ return window.matchMedia("(min-width:820px)").matches; }
function chrome(){
  const dockEl = document.querySelector(".dock");
  /* getElementById, not the `sheet` const below. fitCoast() runs inline at
     parse time, before that const is initialised, and reading a const in its
     temporal dead zone throws rather than returning undefined. */
  const sh = document.getElementById("sheet");
  if(desktop()){
    const sheetOpen = sh && !sh.hidden && sh.classList.contains("open");
    return {
      top: (document.querySelector(".topbar")?.offsetHeight || 64) + 8,
      bot: 16,
      left: (dockEl?.offsetWidth || 360) + 16,
      right: (sheetOpen ? (sh.offsetWidth || 400) : 0) + 16
    };
  }
  return {
    top: (document.querySelector(".topbar")?.offsetHeight || 64) + 8,
    // the dock, not the strip: the saved line sits above the cards inside it
    bot: (dockEl?.offsetHeight || 96) + 8,
    left: 0, right: 0
  };
}

/* The chrome must never be allowed to consume the viewport.

   getBoundsZoom() subtracts the padding from the map size. Hand it a padding
   larger than the map and the scale it computes is garbage, which Leaflet then
   clamps to maxZoom. That garbage becomes the zoom floor via setMinZoom(), and
   every branch below lands on it. Measured before this clamp existed: a 400x200
   viewport, where the topbar and dock total 216 px, drew the 744 px coast at
   28,299 px wide, a 38x overzoom that is stable rather than transient because the
   floor has latched.

   That is reachable two ways. A genuinely short landscape window, and, more
   importantly, the middle of a phone rotation: the viewport passes through very
   short intermediate shapes, and the refit fires immediately on rotation by
   design, so it fires straight into one.

   Capping total padding at 60 percent of the axis means the dock may overlap the
   map on a very short window. That is strictly better than the map being
   unreadable, and it only ever engages below about 360 px of height. */
function fitPadding(){
  const c = chrome(), size = map.getSize();
  let top = c.top, bot = c.bot;
  const capY = size.y * 0.6;
  if(top + bot > capY && top + bot > 0){
    const k = capY / (top + bot);
    top = Math.floor(top * k);
    bot = Math.floor(bot * k);
  }
  // The horizontal chrome gets the same treatment and for the same reason: on a
  // narrow desktop window the rail plus the panel can exceed the viewport, and
  // a padding wider than the map produces a garbage zoom that then latches into
  // the floor. Below 820 both are 0 and this is the old single value.
  const x = Math.min(8, size.x * 0.3);
  let left = (c.left || 0) + x, right = (c.right || 0) + x;
  const capX = size.x * 0.7;
  if(left + right > capX && left + right > 0){
    const k = capX / (left + right);
    left = Math.floor(left * k);
    right = Math.floor(right * k);
  }
  return {top, bot, x, left, right};
}
/* Wide viewports COVER, narrow ones CONTAIN, and the difference is not cosmetic.

   The coast is a 3:1 strip. On a landscape desktop window the image can fill the
   frame, so there is no reason to ever show the page behind it: the floor is set
   to the cover zoom and the background never appears. On a portrait phone cover
   would blow the image up until you can see about 370 m of a 16.6 km coast, all
   water and no landmark, which is the failure this file already fixed once. So
   there the floor stays at contain and the empty bands are page colour on purpose.

   maxBounds is tightened to the image itself at the same time, otherwise you can
   still pan the background into view without zooming at all. */
function wide(){ return window.matchMedia("(min-width:760px) and (orientation:landscape)").matches; }

/* `keepView` is passed by the resize path and by nothing else.

   A viewport change always has to recompute the zoom floor, the backdrop and the
   pan limit, because all three are derived from what the viewport can reach. It
   does NOT have to move the camera. Somebody who has zoomed into Cocles and then
   rotates the phone wants to still be looking at Cocles: refitting the whole
   coast under them throws away the thing they navigated to, which on a 16 km
   strip means finding their beach again. So the limits are always recomputed and
   the camera is only reset when it was sitting at the floor anyway, where a
   refit is exactly what is wanted. */
function fitCoast(opts){
  const keepView = !!(opts && opts.keepView);
  const hadZoom = map.getZoom(), hadCentre = map.getCenter();

  /* Refresh Leaflet's cached container size FIRST, before anything reads it.
     Leaflet caches the container size in map._size and only recomputes it in
     invalidateSize(). Without this line getSize(), getBoundsZoom(), fitBounds()
     and sizeBackdrop() all compute against the viewport as it was at load, so
     rotating a phone to landscape left a 1052 px wide image inside a 502 px
     viewport. On a 3:1 coast, rotating to see more of it is the most natural
     gesture there is, and it produced a dark blurred rectangle with no
     coastline. Do not remove this. */
  map.invalidateSize({animate:false, pan:false});

  /* Release the pan limit BEFORE fitting, and only then recompute it.
     maxBounds is derived from the backdrop, which is itself sized for the
     viewport that was current when it was last computed. Leaving the old limit
     in force means fitBounds gets dragged back toward the previous viewport's
     centre, and because each fit then starts from an already-displaced centre
     the error compounds: successive resizes walked the map to y=1350, entirely
     below the fold. */
  map.setMaxBounds(null);

  // Clear the floor too. getBoundsZoom clamps its own result to the current
  // minZoom, so setting minZoom from it ratchets upward on every call and the
  // map slowly loses the ability to show the whole coast.
  // Read whether the user was at the floor BEFORE clearing it, or the comparison
  // is against 0 and every view looks zoomed in.
  const wasAtFloor = Math.abs(hadZoom - map.getMinZoom()) < 0.01;
  map.setMinZoom(0);

  // Contain everywhere. Seeing all 16.6 km at once is worth more than never
  // showing the page behind the map: the whole point of the overview is knowing
  // which beach you are looking at, and a cover fit on this 3:1 strip zooms in
  // far enough to lose that on every viewport shape. The empty bands are the
  // app's own navy, so they read as a deliberate letterbox rather than a gap.
  // Padding is read AFTER invalidateSize, because it is clamped against the map
  // size and that size has just changed.
  const c = fitPadding();
  const pad = L.point(c.left, c.top).add(L.point(c.right, c.bot));
  // Derive the floor from getBoundsZoom, NOT from getZoom() after fitBounds.
  // fitBounds animates, so on the next line getZoom() is still the OLD zoom and
  // the floor lands above the fit: the map then sits below its own minimum and
  // snaps upward on the first interaction.
  let z = map.getBoundsZoom(BB, false, pad);
  // Belt and braces. fitPadding() makes a degenerate padding impossible, but a
  // non-finite floor here would latch into setMinZoom and poison every later
  // fit, so it is worth one line to never store one.
  if(!isFinite(z)) z = map.getBoundsZoom(BB, false, L.point(0, 0));

  // No slack below the fit. Zooming out past the whole coast only ever buys more
  // empty space, so the floor IS the fit.
  map.setMinZoom(z);
  // Pan limit is the TILE COVERAGE, not the coast. Clamping to the coast looks
  // right and breaks flyClear: offsetting the centre so a zone clears the bottom
  // sheet pushes the viewport past the coast edge, maxBounds drags it back, and
  // the zone the user just asked about ends up behind the sheet. Tile coverage
  // runs well past the coast on every side and is real imagery throughout, so
  // there is nothing to hide by staying inside it.
  map.setMaxBounds(TILE_BOUNDS.pad(0.08));

  if(keepView && !wasAtFloor){
    // Limits rebuilt for the new viewport, camera left where the user put it.
    // Math.max because the new floor can be HIGHER than the old zoom: rotating a
    // phone to landscape raised the floor from 12 to 12.75 here, and leaving the
    // camera below its own minimum is the bug the getBoundsZoom comment above
    // describes. setMaxBounds has already been applied, so an off-limit centre is
    // clamped by Leaflet rather than by us.
    map.setView(hadCentre, Math.max(hadZoom, z), {animate:false});

    /* Safety net, and it is the whole point of this function.

       maxBounds is the TILE COVERAGE rather than the coast, deliberately, so
       that flyClear can offset the centre off the coast to clear the bottom
       sheet. Coverage extends well past the coast on every side, so a centre
       that is a harmless few pixels off the coast at the floor is thousands of
       pixels off it when zoomed in. Rotating from that state left the coast
       2,900 px above the viewport: measured, box [-235, -2925, 742, -2257] in an
       845x502 window.

       So preserving the view is conditional on the view still containing some
       coast. Tiles mean it is now open sea rather than a blurred rectangle, but
       open sea is no more use to somebody looking for their beach. The whole
       coast is strictly better. This makes "the map is gone" structurally
       unreachable from any viewport change, rather than fixed one cause at a
       time. */
    if(map.getBounds().intersects(BB)) return;
  }
  // animate:false because this is a layout correction, not a journey. An
  // animated refit during a rotation is a camera moving under somebody's thumb,
  // and it also leaves the map in an intermediate state that nothing can assert
  // against.
  map.fitBounds(BB, {paddingTopLeft:[c.left, c.top], paddingBottomRight:[c.right, c.bot],
                     animate:false});
}
/* sizeBackdrop() lived here. It stretched a blurred copy of the base image to
   cover whatever the viewport could reach at the zoom floor, because one finite
   image cannot fill a viewport it does not span. Tiles can, so the whole
   function and the layer it managed are gone. */

map.setView(BB.getCenter(), 14);
fitCoast();

/* ---------- notations ----------

   The whole-coast view used to be readable only by tapping: five coloured lines
   on imagery, and nothing on the picture said which beach was which or which way
   Puerto Viejo lay. Someone who scans a QR code on the sand has to place
   themselves before any status means anything, and "the orange one" is not a
   place.

   Deliberately few. This is a safety map, and every label is ink spent on top of
   the thing the reader actually needs to see. Beach names, the two towns that
   anchor the coast, the sea, and a scale bar so distances are judgeable rather
   than guessed. No roads, no businesses, no points of interest: Caribbean Guard's
   own sheet carries those and it is a different document for a different moment.

   Labels are not interactive. A label that swallows a tap is a label that stops
   somebody opening the zone underneath it. */
const labels = L.layerGroup().addTo(map);

function label(ll, text, cls){
  const w = Math.max(40, text.length * 7.6);
  return L.marker(ll, {
    interactive: false, keyboard: false, zIndexOffset: -200,
    icon: L.divIcon({className: "lbl " + cls, html: text,
                     iconSize: [w, 16], iconAnchor: [w / 2, 8]})
  }).addTo(labels);
}

const PLACES = [
  {ll: [9.65670, -82.75450], t: "Puerto Viejo"},
  {ll: [9.64050, -82.65900], t: "Manzanillo"}
];
const SEA = {ll: [9.67400, -82.72000], t: "Mar Caribe"};
