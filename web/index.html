<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- maximum-scale=5 and no user-scalable=no, DELIBERATELY. Beachsafe, Protected
     Planet, SINAC and OVSICORI all disable pinch zoom on public safety maps. This
     is read in bright sun by people who may not have their glasses. Do not "fix". -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0b1c2c">
<meta name="description" content="Mapa de seguridad costera de Caribbean Guard, de Puerto Viejo a Manzanillo.">
<title>Caribbean Guard | Mapa de Seguridad</title>
<link rel="manifest" href="manifest.json">
<!-- Named explicitly so the browser stops requesting /favicon.ico, which the map
     does not ship and which 404s on every single load. -->
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- Both spellings. Chrome deprecated the apple- prefixed one and logs a warning
     on every load; iOS Safari still only understands that one. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caribbean Guard">
<!-- Self-hosted, not unpkg, and with no CDN fallback on purpose.
     Measured against unpkg from a good home link: 1.27 s of TLS negotiation alone
     before the first byte of Leaflet arrived, to a host we do not control, with no
     integrity attribute on the tag. Chrome partitioned its HTTP cache in 2020, so
     the old cross-site caching argument for a public CDN no longer holds in any
     current browser. Leaflet's latest dist-tag has been 1.9.4 since 2023-05-18, so
     vendoring commits us to chasing nothing.
     A fallback would put the CDN back in the threat model to buy nothing: if the
     local copy is shipped anyway, ship only the local copy. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<!-- POPPINS since 2026-09-23 (Daniel's call): the map now speaks in the same
     typeface as caribbeanguard.org. Self hosted, 400 / 600 / 800, latin subset
     (Spanish accents and inverted marks included), 24 KB for all three, less
     than the 71 KB of Inter it replaces. SIL OFL, see fonts/POPPINS-OFL.txt.
     The history below is kept because the hierarchy argument still holds.
     Inter, self hosted, 400 / 600 / 800, latin subset, 71 KB in total.
     It replaced Atkinson Hyperlegible on 2026-09-17. Atkinson is a better
     letterform-by-letterform font for a low vision reader, and it was chosen
     for that; it shipped in two weights, and two weights cannot build a
     hierarchy across six levels. Daniel's finding was that the page had none.
     Inter is a text-first grotesque with a tall x-height and open apertures,
     which is most of what the low vision case actually needs at 15 px in
     midday sun, and three weights let every level carry a weight signal as
     well as a size.
     Self hosted for the same reason Leaflet is: this map must work with no
     signal, and a Google Fonts request cannot be precached by our worker.
     Only the two weights the FIRST PAINT uses are preloaded. 800 draws the
     instruction on every card, 600 draws every beach name; 400 draws body copy
     that is below the fold in the dock and inside a sheet that is not open yet,
     so preloading it would compete for the same connection as the two that are
     on screen. -->
<link rel="preload" href="fonts/poppins-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* INTER, THREE WEIGHTS, SELF-HOSTED, LATIN SUBSET.
     It replaces Atkinson Hyperlegible, which shipped at 400 and 700 only.
     Daniel's finding 2026-09-17 was "no clear hierarchy in any of the text
     areas", and two weights is half of why: with only regular and bold, a name,
     an instruction and a caption can differ in SIZE alone, and this page's
     sizes ran 22 / 18 / 15 / 13 / 12, a 1.47x spread from the largest thing on
     the sheet to the body under it. Nothing could dominate anything.
     Three weights (400 / 600 / 800) plus the wider scale below give every level
     two signals instead of one.
     The latin subset is U+0000 to U+024F, which carries every accent Spanish
     needs and the inverted marks, so the ES copy renders from our own bytes and
     never falls back. Still no glyph outside it may be used anywhere on this
     page: see the ø / ½ / » notes below, which stay true.
     71 KB across three files against 35 KB across two. That is 36 KB more in
     the service worker's CRITICAL precache, which is 36 KB somebody waits for
     on a two-bar signal before the map will save. Accepted by Daniel on
     2026-09-17 as the price of a readable hierarchy. */
  @font-face{
    font-family:"Poppins"; font-style:normal; font-weight:400;
    font-display:swap; src:url(fonts/poppins-latin-400-normal.woff2) format("woff2");
  }
  @font-face{
    font-family:"Poppins"; font-style:normal; font-weight:600;
    font-display:swap; src:url(fonts/poppins-latin-600-normal.woff2) format("woff2");
  }
  @font-face{
    font-family:"Poppins"; font-style:normal; font-weight:800;
    font-display:swap; src:url(fonts/poppins-latin-800-normal.woff2) format("woff2");
  }
  :root{
    /* Two tiers on purpose.
       The plain tokens are for GRAPHICS on the map, where the bar is 3:1 and
       vividness helps them survive a sun-washed screen.
       The -text tokens are for TEXT AND UI BARS ON A LIGHT GROUND, where the
       bar is 4.5:1 for text and 3:1 for a meaningful graphic. White on the old
       #1f9d55 measured 3.49:1 and on #c77700 measured 3.46:1, so both status
       pills were failing outright. 13px bold does not qualify for the
       large-text exception, which needs about 18.66px bold.
       Old --moderate #c77700 also had almost exactly the same luminance as
       --low (0.254 vs 0.251), so in direct sun, which kills hue first, the two
       middle tiers were the same colour.

       These are named for the three HAZARD TIERS, low / moderate / high. They
       were named safe / caution / danger, and --safe in particular was the
       wrong name: nothing on this map is entitled to say safe. See CHARACTER. */
    --low:#1f9d55;         --low-text:#178049;
    --moderate:#f5b942;    --moderate-text:#9c5c00;
    --high:#c62828;        --high-text:#c62828;
    --ink:#0b1c2c; --paper:#ffffff; --muted:#5b6b7a;
    /* Absence has its own colour and it is not a hazard colour. Amber says "you
       are missing something", grey says "nobody has been here". Neither may be
       mistaken for a verdict, so neither is red, amber-as-caution, or green. */
    --gap:#7a4a00;   --gap-bg:#fdf4e3;  --gap-line:#e7cf9e;
    --void:#4a5764;  --void-bg:#eef1f4;  --void-line:#c9d2da;
    /* Today's bulletin has its own colour and it is deliberately outside the
       hazard palette, so a thing a guard said this morning can never be mistaken
       for what this beach is. Violet also survives red-green colour blindness
       against all three tiers. */
    --today:#7b1fa2;
    /* Caribbean Guard's own V5 sheet draws rescue stations as ORANGE hexagons.
       They were blue circles here, which is the association's map losing its own
       visual vocabulary (hat 5, finding 9). Orange is also the only station
       colour a reader who has seen the printed sheet on the sign already knows. */
    --station:#f39c12;
    --sheet-r:10px;
    --safe-pad: env(safe-area-inset-bottom, 0px);
    --dock-h: 96px;    /* set from JS; the fab and compass stack above the dock */
    /* 8 px grid and a 16 px gutter, used everywhere below rather than eyeballed
       values, so a card, a chip and a sheet all sit on the same rhythm. */
    --gut:16px;
    /* THE TYPE SCALE. Six sizes, no seventh, and 12 px is still the FLOOR.
       30 sheet heading / 21 instruction / 17 beach name / 15 body /
       13 secondary / 12 the floor.

       WHAT CHANGED AND WHY. It was 22 / 18 / 15 / 13 / 12. The heading was
       1.22x the instruction and 1.47x the body, so the three things a reader
       has to rank -- where am I, what do I do, why -- arrived almost the same
       size, and the page had no dominant element at any breakpoint. Steps of
       1.43 / 1.24 / 1.13 / 1.15 give the top of the scale room to be the top of
       it without pushing the body below the floor.

       SIZE IS NEVER THE ONLY SIGNAL. Every level also carries a weight and a
       colour: 800 ink for the instruction, 600 ink for names, 400 ink for body,
       400 muted for secondary. Hat 4's original blocker stands and is stricter
       now: what you must obey is the largest AND heaviest thing in its
       container, and nothing optional may outrank it on either. */
    --t-h2:30px; --t-instr:21px; --t-name:17px; --t-body:15px;
    --t-2nd:13px; --t-min:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "Helvetica Neue",sans-serif;
    font-size:var(--t-body); line-height:1.3;
    -webkit-font-smoothing:antialiased;
    color:var(--ink); background:var(--ink)}
  #map{position:absolute;inset:0}

  /* ONE focus ring for the whole page, and it is the only one.
     Hat 4, finding 10: no :focus or :focus-visible rule existed anywhere in the
     file, so on a switch or a keyboard nothing showed what was selected. Ink on
     light ground, white over the map and the dark chrome, 2 px either way. */
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
  /* The top bar left this list on 2026-09-17: it is white now, and a white
     focus ring on a white bar is no focus ring. The fab, the compass and the
     dock still sit on imagery, so they keep theirs. A ring that is invisible on
     the surface it is drawn on is the exact fault hat 4 raised. */
  .fab:focus-visible,.compass:focus-visible,
  .dockrow :focus-visible,.leaflet-container :focus-visible{outline-color:#fff}

  /* Shows only while tiles are in flight, and at the edge of coverage. Navy
     rather than Leaflet's grey so a tile arriving reads as the picture filling
     in, not as a broken image repairing itself. */
  .leaflet-container{background:var(--ink);font-family:inherit}

  /* ---------- THE IMAGERY IS DESATURATED, AND ONLY THE IMAGERY ----------
     Daniel's ruling 2026-09-17: keep satellite, compensate.

     THE PROBLEM THIS SOLVES. Safeswim's marks are legible at every zoom because
     nothing else on their screen is saturated: their basemap is desaturated
     OpenStreetMap, beige land and pale water, so the safety pins own all of the
     colour on the page. Ours are drawn on live satellite imagery full of
     saturated jungle green, turquoise shallows, red roofs and white surf. At the
     whole-coast view a 2 px red line competes with a reef for the same attention
     and frequently loses, which is the one failure a hazard line may not have.

     WHY IMAGERY STAYS ANYWAY. A tourist standing on the sand matches what they
     can see to what is on the screen, and that match is the entire reason a QR
     code on a sign works. A plain basemap is a diagram of a beach; imagery is
     THIS beach. It also costs 2,389 precached tiles and the georeferencing
     behind them to walk away from.

     So the compromise is to take the colour out of the ground and leave it on
     the marks. 0.65 is measured against what it has to survive rather than
     chosen for looks: below about 0.55 the turquoise of a shallow reef goes grey
     and the reef stops being visible as a reef, which is information a swimmer
     uses; above about 0.8 the jungle is still loud enough to fight a green
     lower-risk stroke.

     SCOPED TO THE TILE PANE, WHICH IS THE WHOLE TRICK. Everything that carries
     meaning is in a pane above it -- zone strokes in overlayPane (400), the
     extent band in cgBandPane (350), stations and labels in the marker panes --
     so none of them is touched and the tier colours stay exactly as documented.
     Filtering .leaflet-container instead would have drained the strokes too, and
     a 35% desaturated red is no longer #c62828.

     It is one composited layer and the filter resolves once per layer rather
     than per frame, so panning on the budget Android this is built for costs
     nothing extra. Tunable in one place if it ever reads wrong on a real phone
     in real sun, which is the only test that settles it. */
  .leaflet-tile-pane{filter:saturate(.65)}
  /* Replaces the old white casing. A shadow lifts the strokes off the imagery
     without putting a grey band around them, and it costs no width, so a thin
     line stays thin. */
  .leaflet-overlay-pane{filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}
  /* Hairline seams show between JPEG tiles on fractional zooms, because
     zoomSnap is 0.25 and a tile can land on a half pixel. Scaling each tile by
     a hair closes the seam without moving anything measurably. */
  .basemap .leaflet-tile{transform:scale(1.002);transform-origin:center}

  /* ---------- notations on the imagery ---------- */
  /* Place names, so the whole-coast view can be read without tapping anything.
     No box and no background: a plate over satellite imagery hides the thing the
     label is pointing at. A shadow does the same work and costs no area. */
  .lbl{background:none;border:0;box-shadow:none;font-weight:600;
    letter-spacing:.02em;white-space:nowrap;pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.7)}
  .lbl.zone{color:#fff;font-size:12.5px}
  .lbl.place{color:#cfe0ee;font-size:var(--t-min);font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;opacity:.9}
  .lbl.sea{color:#9fc4e0;font-size:var(--t-min);font-weight:400;letter-spacing:.22em;
    text-transform:uppercase;opacity:.75}
  .leaflet-control-scale-line{background:rgba(11,28,44,.72);border-color:rgba(255,255,255,.5);
    color:#e8f1f7;font-weight:600;font-size:var(--t-min);padding:3px 7px}

  /* ---------- top bar ---------- */
  /* WHITE, WITH ONE HAIRLINE AND NO SHADOW. Safeswim's header measures 80 px,
     #fff, a 0.67 px bottom border and box-shadow:none, and it is most of why
     their product reads as an instrument rather than an app: the chrome states
     its edge with a line instead of asserting itself with a gradient.
     Ours was a navy gradient fading into the imagery, which meant the bar had
     no edge at all and the wordmark needed a text-shadow to survive whatever
     happened to be under it. A solid bar needs no shadow on anything. */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:1000;
    padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gut) 8px;
    display:flex;align-items:center;gap:8px;min-height:64px;
    background:#fff;border-bottom:1px solid #E6E8EA;
    pointer-events:none}
  /* The wordmark is a LINK HOME. Hat 5, finding 4: the association's
     highest-traffic tourist touchpoint had no route back to the organisation
     that made it, and the only outbound links in 2,291 lines were two Google
     Maps calls. */
  /* nowrap and shrinkable. At 15 px the wordmark, the 911 pill and a 44 px
     language toggle do not fit across 390 px, and the brand wrapped to three
     lines, grew the top bar to 86 px and pushed EN off the right edge. The
     wordmark drops a step and the tagline steps out below 430 px: the two
     controls on the right are the ones a reader needs in a hurry, and the
     tagline is the only thing on this bar that nothing depends on. */
  .brand{pointer-events:auto;text-decoration:none;
    font-weight:800;letter-spacing:.01em;color:var(--ink);font-size:var(--t-body);
    line-height:1.15;white-space:nowrap;
    min-width:0;overflow:hidden;
    padding:4px 0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .brand small{display:block;font-weight:600;font-size:var(--t-min);
    color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  @media (max-width:429px){
    /* Two lines, not one. At 13 px on one line the wordmark still needs about
       125 px and only 107 are left once the 911 pill and a 44 px language
       toggle have taken theirs, so it clipped to "CARIBBEAN GUAI". Wrapping it
       costs nothing: the bar is 44 px tall for the targets anyway. */
    .brand{font-size:var(--t-2nd);letter-spacing:0;white-space:normal;
      max-width:104px;line-height:1.05}
    .brand small{display:none}
  }
  .spacer{flex:1}
  /* 44 px, both of them. Hat 4, finding 11: the language buttons were 36 px and
     adjacent, 911 was 40, the sheet close 38. All legal, none comfortable with
     one wet thumb. 44 is the floor in the top bar now. */
  .lang{pointer-events:auto;display:flex;background:#fff;
    border:1px solid rgba(11,28,44,.2);border-radius:999px;overflow:hidden}
  .lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;
    font-size:var(--t-2nd);font-weight:600;padding:0 14px;min-height:44px;min-width:44px;
    cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* ---------- emergency ---------- */
  /* The digits carry a word now. Hat 1 does not know Costa Rica uses 911 rather
     than 112, and a bare red badge beside a language toggle reads as decoration. */
  .sos{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;
    background:var(--high);color:#fff;text-decoration:none;font-weight:600;
    font-size:var(--t-2nd);letter-spacing:.02em;
    padding:0 14px;min-height:44px;border-radius:999px;
    box-shadow:0 3px 12px rgba(0,0,0,.4)}
  .sos b{font-size:var(--t-body);font-weight:600;letter-spacing:.04em}
  .sos .word{text-transform:uppercase;font-size:var(--t-min);letter-spacing:.06em;
    white-space:nowrap}
  .lang,.sos{flex:0 0 auto}

  /* ---------- bottom dock ---------- */
  /* One positioned container rather than three, so chrome() has a single thing
     to measure and the fab stack has a single height to clear. On desktop this
     same element becomes the left rail: one set of cards in the DOM, never two,
     because two would be two things to keep in step. */
  .dock{position:absolute;left:0;right:0;z-index:1000;
    bottom:calc(var(--safe-pad) + 8px)}

  /* The dock's own one line. It carries three things that each need to be
     permanently visible and none of which deserves a row of its own on a 390 px
     phone: the way into the legend, how old the saved copy is, and where you
     are in the strip. Everything on it is at the 12 px floor. */
  .dockrow{display:flex;align-items:center;gap:8px;margin:0 var(--gut) 8px;
    background:rgba(11,28,44,.88);backdrop-filter:blur(8px);color:#fff;
    border-radius:4px;padding:0 6px 0 6px;min-height:40px;
    box-shadow:0 3px 12px rgba(0,0,0,.3)}
  .dockrow .btn-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
    color:#fff;font:inherit;font-size:var(--t-min);font-weight:600;
    letter-spacing:.02em;border-radius:999px;padding:0 12px;min-height:32px;cursor:pointer}
  .dockrow .txt{flex:1;min-width:0;font-size:var(--t-min);line-height:1.3;font-weight:400;
    background:none;border:0;color:inherit;font-family:inherit;text-align:left;
    padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
    text-decoration-color:rgba(255,255,255,.4);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* "2 de 6". Hat 1 and hat 2 both stopped at card two because a scroller with
     both scrollbars hidden does not announce its own length. */
  .counter{flex:0 0 auto;font-size:var(--t-min);font-weight:600;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;opacity:.9;padding:0 2px}
  .dockrow .rf{flex:0 0 auto;width:34px;height:32px;border:0;border-radius:4px;
    background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font:inherit;
    display:grid;place-items:center}
  .dockrow .rf svg{width:16px;height:16px}
  .dockrow .rf[disabled]{opacity:.45}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dockrow .rf.busy svg{animation:spin .9s linear infinite}
  @media (prefers-reduced-motion:reduce){.dockrow .rf.busy svg{animation:none}}

  /* First run only. Hat 1's single question is "which beach am I on", and the
     control that answers it was an unlabelled crosshair under a compass that
     reads as a map widget. Once it has been used once it collapses back to the
     icon, because by then the icon has a meaning. */
  .locate-first{display:none;width:calc(100% - var(--gut) * 2);margin:0 var(--gut) 8px;
    min-height:48px;border-radius:6px;border:0;background:#fff;color:var(--ink);
    font:inherit;font-size:var(--t-body);font-weight:600;cursor:pointer;
    box-shadow:0 3px 14px rgba(0,0,0,.34);align-items:center;justify-content:center;gap:9px}
  .locate-first.show{display:flex}
  .locate-first svg{width:20px;height:20px}

  /* The card strip. The MASK is the edge fade: it fades the cards themselves at
     both ends rather than painting a gradient over them, which is the only way
     to fade something sitting on satellite imagery whose colour is unknown. */
  .strip{display:flex;gap:10px;padding:4px var(--gut) 6px;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,
                                        #000 calc(100% - 18px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 18px,
                                #000 calc(100% - 18px),transparent 100%)}
  .strip::-webkit-scrollbar{display:none}

  /* ---------- the card ----------
     Anatomy, top to bottom: name, instruction, provenance chips, hours.
     One card is 84vw so the instruction has room to be the largest thing on it
     and the next card still peeks in at the edge, which is what tells a thumb
     there is a next card. */
  .card{flex:0 0 84vw;max-width:340px;scroll-snap-align:center;
    background:rgba(255,255,255,.97);border-radius:6px;padding:14px var(--gut) 16px;
    border:2px solid transparent;box-shadow:0 3px 14px rgba(0,0,0,.34);cursor:pointer;
    text-align:left;font:inherit;color:var(--ink);display:block}
  .card[aria-current="true"]{border-color:var(--ink)}
  .card .nm{display:block;font-size:var(--t-name);font-weight:600;line-height:1.2;
    letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- pill kind 1 of 2: the status pill ----------
     THE INSTRUCTION IS THE LARGEST TEXT ON THE CARD. That is hat 4's first
     blocker and it is the whole point of the card.
     The tier colour is the LEFT BAR, never the fill, and the text is always
     ink. Hat 1: green fill on the lowest tier cancels its own words, because on
     a safety map green means go and "TAKE CARE ANYWAY" then arrives second and
     loses. Green survives on the stroke and on the swatch, where it is a map
     key rather than a verdict.
     The bar takes the -text token, which clears 3:1 on this ground; the SWATCH
     next to it draws the real map stroke in the real map colour, which is its
     documented job. They differ in hue only for moderate, and that is the
     honest version: one is chrome, the other is a sample.

     THE TINTED BOX IS GONE. It was `background:#f2f5f8` behind every
     instruction, on a card that is already a white box on satellite imagery.
     Daniel's finding 2026-09-17: "I do not like that there is a blue box
     holding each of the linework types." He is right about more than the
     colour. A panel inside a panel is a second container drawn around content
     that was already contained, so the eye sorts boxes before it reads words,
     and the box around the instruction looked exactly like the box around the
     caption. What survives is the part that carries meaning: the tier colour as
     a bar on the left, and the swatch, which is a sample of the real stroke.
     The instruction now sits on the card's own ground at 21 px / 800.

     THE SOLID LEFT BAR WENT WITH IT, and that is the de-duplication rather than
     a second deletion. The bar and the swatch were the same colour token saying
     the same thing 10 px apart; the swatch says it AND carries the weight and
     the dash, which is the part that survives colour blindness and is the only
     reason a stroke sample is on a card at all. One tier mark per instruction. */
  .pill{display:flex;align-items:center;gap:11px;margin-top:7px;
    background:none;border:0;border-radius:0;padding:0;
    font-size:var(--t-instr);font-weight:800;line-height:1.15;
    letter-spacing:-.01em;text-transform:uppercase;color:var(--ink)}
  /* Three, and only three. There were three more, for the void card, a station
     and a neutral title, which is how a component that means "do this" came to
     carry nouns. Those are titleChip() now. */
  .pill.low{--tier:var(--low-text)}
  .pill.moderate{--tier:var(--moderate-text)}
  .pill.high{--tier:var(--high-text)}
  .pill .sw{flex:0 0 auto;display:block}

  /* The post's hours, next to the instruction it qualifies. Hat 2's first
     blocker: at 17:30 the Cocles card still said SOLO CON GUARDAVIDAS while its
     own facts said the post closes at 17:00, so the only instruction on screen
     could not be obeyed. Ink, never red: a closed post is not a hazard tier. */
  .hours{display:block;margin-top:6px;font-size:var(--t-2nd);line-height:1.35;color:var(--ink)}
  .hours b{font-weight:600}

  /* THE OUTLINE CHIP. It is the only pill kind left besides the instruction,
     and it is neutral metadata by construction: outline, ink text, never a
     hazard colour, so a noun can never be read as an order. A rescue station's
     name, a hazard's noun and "zona marcada, sin definir" all take it, with the
     map's own mark beside them, which makes the sheet a key for whatever was
     tapped. Its two-chip sibling, the provenance chip, was deleted on
     2026-09-17 with the rest of the absence surfaces; see trustLine(). */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-min);
    font-weight:600;letter-spacing:.01em;padding:3px 9px;border-radius:999px;
    border:1px solid;white-space:nowrap;line-height:1.35}
  /* THE TITLE CHIP IS THE SAME COMPONENT, ONE SIZE UP, AND THAT IS THE POINT.
     The doctrine allows exactly two pill kinds: the status pill, which is an
     INSTRUCTION, and the outline chip, which is neutral metadata. A rescue
     station's name, a hazard's noun and "zona marcada, sin definir" are none of
     them instructions, and they were rendering in the status pill, which is the
     component that means "do this". A reader who has learnt that the barred pill
     is the thing to obey would have read a noun as an order.
     So they take the outline chip at 13 px with the map's own mark beside it,
     which also makes the sheet a key for the thing that was tapped. No new
     vocabulary, no third pill. */
  .chip.title{font-size:var(--t-2nd);padding:6px 14px 6px 10px;gap:8px;
    margin:0 0 14px;border-color:rgba(11,28,44,.22);color:var(--ink)}
  .chip.title svg{display:block;flex:0 0 auto}

  /* The card for the coast this map does not describe. A DIFFERENT SPECIES:
     dashed border, hatched ground, and no status pill at all, because hat 1
     skimmed past the most honest thing on the page when it had the same size,
     shape and row as a beach. It stays IN the strip and it stays last. */
  .card.void{background:repeating-linear-gradient(135deg,#eef1f4 0 7px,#e3e8ed 7px 14px);
    border:2px dashed var(--void-line);box-shadow:0 3px 14px rgba(0,0,0,.2)}
  .card.void .nm{color:var(--void)}
  .card.void .vd{display:block;margin-top:8px;font-size:var(--t-body);font-weight:600;
    line-height:1.3;color:var(--void)}

  /* ---------- locate button ---------- */
  .fab{position:absolute;right:var(--gut);z-index:1000;
    bottom:calc(var(--safe-pad) + var(--dock-h) + 16px);
    width:44px;height:44px;border-radius:4px;background:#fff;
    border:1px solid rgba(11,28,44,.16);
    box-shadow:0 1px 4px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer}
  .fab svg{width:24px;height:24px}
  .fab.hidden{display:none}
  .compass{position:absolute;right:var(--gut);z-index:1000;
    bottom:calc(var(--safe-pad) + var(--dock-h) + 66px);
    width:44px;height:44px;border-radius:4px;background:#fff;
    border:1px solid rgba(11,28,44,.16);
    box-shadow:0 1px 4px rgba(0,0,0,.22);display:grid;place-items:center;
    cursor:pointer;padding:0;font:inherit}
  .compass svg{width:30px;height:30px;overflow:visible}
  .compass #needle{transform-origin:22px 22px;transition:transform .18s linear}
  .compass.live{outline:2px solid #1565c0;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.compass #needle{transition:none}}
  .fab.on svg{color:#1565c0}

  /* ---------- bottom sheet, three stops ----------
     PEEK is the opening state and it is sized so that everything a person on
     the sand has to act on is above the fold with nothing to scroll: the name,
     the instruction, the one sentence of why, the escape sentence and the whole
     911 button. Hat 1 closed the old sheet because the top 40% of it was an
     apology. HALF and FULL are for the trust line and the two secondary actions.

     42vh, up from 33vh on 2026-09-17. 33 was measured against the old sheet,
     where PEEK had to clear the name, the instruction and the provenance line
     and the actions were three screens down. The sheet is a sign now: it is
     SHORTER overall, but the 911 button moved up into the opening view, and at
     33vh on a 390x844 phone that button was cut through the middle. A control
     you can see half of is a control you are not sure you can press. */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1200;
    background:var(--paper);border-radius:var(--sheet-r) var(--sheet-r) 0 0;
    box-shadow:0 -6px 28px rgba(0,0,0,.35);
    height:42vh;
    transform:translateY(102%);
    transition:transform .28s cubic-bezier(.32,.72,0,1),height .28s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;padding-bottom:var(--safe-pad)}
  .sheet[data-stop="half"]{height:70vh}
  .sheet[data-stop="full"]{height:calc(100vh - env(safe-area-inset-top,0px))}
  .sheet.open{transform:translateY(0)}
  /* Dragging must not animate: the sheet has to sit under the thumb. */
  .sheet.dragging{transition:none}
  /* Closed means GONE, from the screen reader as well as from the screen.
     Hat 4, finding 7: closing only translated it off-screen, so TalkBack swiped
     into "Cerrar, botón" and a panel that was not visible. */
  .sheet[hidden]{display:none}
  .grab{width:44px;height:5px;border-radius:2px;background:#d5dbe1;margin:10px auto 2px;
    flex:0 0 auto}
  /* The whole top strip is the drag handle, not the 44x5 bar, because a 5 px
     target is not a target. */
  .draghead{flex:0 0 auto;padding-bottom:4px;cursor:grab;touch-action:none}
  .sheet-body{overflow-y:auto;padding:4px var(--gut) 24px;-webkit-overflow-scrolling:touch}
  .sheet h2{margin:4px 0 1px;font-size:var(--t-h2);line-height:1.08;font-weight:800;
    letter-spacing:-.025em;padding-right:56px}
  /* THE HEADING TAKES FOCUS AND DRAWS NO RING, and those are two decisions.
     Moving focus here is what makes the sheet announce itself: hat 4 tapped a
     card, the panel opened and TalkBack said nothing at all. That is the part
     that must stay.
     The ring is the part that must go. Chrome matches :focus-visible on a
     programmatic focus of a tabindex="-1" element, so every sighted person who
     TAPPED a card got a 2 px rectangle drawn around the beach name, which reads
     as an editable field rather than as a heading. A focus ring is a keyboard
     affordance and this focus was never a keyboard action.
     Scoped to the heading only. Every real control on the page keeps the one
     global :focus-visible outline, which is the thing hat 4 asked for. */
  .sheet h2[tabindex="-1"]:focus,
  .sheet h2[tabindex="-1"]:focus-visible{outline:none}
  .sheet .sub{margin:0 0 18px;color:var(--muted);font-size:var(--t-2nd);line-height:1.35;
    font-weight:600;letter-spacing:.01em}

  /* ---------- THE EYEBROW ----------
     Adopted from safeswim.org.nz on Daniel's instruction, 2026-09-17. See
     docs/design/safeswim-teardown.md for the measurements.

     Safeswim's whole panel is ONE component repeated without variation:

        EYEBROW    the question this block answers
        verdict    the answer, in plain language, big
        detail     why, how, what to do

     CURRENT WATER QUALITY / "Good water quality". SURF LIFE SAVING / "Beach not
     lifeguarded". FORECAST / "Water and weather". TIDE / "Currently outgoing".
     Four sections, one shape, and a reader learns it once.

     Our sheet had six blocks in six shapes and nothing saying what any of them
     was FOR. The eyebrow is the smallest thing that fixes it: it labels the job
     of the block before the block speaks, so the instruction is visibly an
     instruction and the trust line is visibly a caveat, without either having
     to be wrapped in its own box to say so. That is also how the boxes we
     deleted this morning stay deleted.

     12 PX, NOT SAFESWIM'S 10. Theirs is 10/700 uppercase at +0.2px. Ours is the
     same shape at 12, because --t-min is the floor hat 4 set and an
     accessibility floor outranks fidelity to a precedent. A 10 px label on a
     budget Android in midday sun is a label nobody reads, and copying one would
     be imitating Safeswim rather than adapting it. */
  /* On the phone the rail is a horizontal dock and the label would eat a row of
     the one screen that has to show an instruction in ten seconds. Desktop only,
     switched on in the >=820px block with the rest of the rail. */
  .rail-eyebrow{display:none}
  .eyebrow{display:block;margin:0 0 5px;font-size:var(--t-min);font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    line-height:1.3}

  /* ---------- THE SEA STRIP ----------
     Safeswim's column strip, which is the one component of theirs we had no
     data for until now: glyph above, value below, one column per thing, on an
     aligned grid, with the day label over the column.

     IT IS NOT INSIDE A BEACH, AND THAT IS THE WHOLE DESIGN.
     Open-Meteo's marine model resolves all five of our beaches to ONE grid cell
     at 9.791664, -82.70833, between 15.5 and 17.1 km offshore, and returns
     byte-identical wave height, period and direction for every one of them.
     Playa Negra and Punta Uva are 8 km apart and get the same 1.32 m. The land
     model is no finer: one cell for all five, 5 to 9 km inland.
     So five per-beach blocks would print one number five times and invite a
     reader to compare beaches on a distinction the model never made. That is
     the coastline-tracing-the-reef failure again, one axis over: a plausible
     number in a place it was never measured. One strip, over the whole list,
     labelled for the whole coast.

     GREY AND NOT RED WHEN STALE. An old reading is an absence, not a hazard,
     and the absence vocabulary in this file is grey and amber by construction.
     Past SEA_STALE_H it dims and says how old it is rather than disappearing:
     "the sea is unknown" and "the sea is calm" must never look the same. */
  .sea{display:block;margin:2px var(--gut) 10px;padding:11px 12px;
    border-radius:6px;background:#21263D;color:#fff}
  .sea[hidden]{display:none}
  .sea .head{display:flex;align-items:baseline;gap:8px;margin:0 0 9px}
  .sea .head .eyebrow{margin:0;color:rgba(255,255,255,.72)}
  .sea .stamp{margin-left:auto;font-size:var(--t-min);color:rgba(255,255,255,.6);
    font-weight:600;white-space:nowrap}
  .sea .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .sea .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  /* The arrow points the way the swell is TRAVELLING, which is 180 degrees off
     the meteorological bearing the model reports: "from 56" means moving toward
     236. The label says VIENE DE and the letters say NE, so the two agree and
     the arrow is the picture of it rather than a second, contradictory claim. */
  .sea .col:nth-child(3) .tile svg{transform:rotate(calc(var(--from) + 180deg))}
  .sea .tile{display:grid;place-items:center;width:34px;height:34px;border-radius:4px;
    background:rgba(255,255,255,.12);color:#fff}
  .sea .tile svg{width:22px;height:22px;display:block}
  .sea .val{font-size:var(--t-2nd);font-weight:700;line-height:1.2;white-space:nowrap}
  .sea .lbl{font-size:var(--t-min);font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:rgba(255,255,255,.62);line-height:1.2;
    text-align:center}
  .sea .foot{margin:9px 0 0;font-size:var(--t-min);line-height:1.45;
    color:rgba(255,255,255,.62)}
  .sea .foot a{color:rgba(255,255,255,.8)}
  .sea.stale{background:#2b2f3d}
  .sea.stale .val,.sea.stale .tile{color:rgba(255,255,255,.62)}

  /* ---------- THE STATUS CARD ----------
     This is the Safeswim component I missed on the first pass, and Daniel was
     right to say so: I took their skeleton and left their skin. Their verdict is
     not text on a white panel. It is a SOLID COLOURED CARD -- glyph tile at the
     top-left, white eyebrow, white verdict, white detail, and an outlined pill
     at the bottom. The card IS the component; the eyebrow alone was half of it.

     WHY THE GROUND IS ALWAYS NAVY HERE, AND NEVER THE TIER COLOUR.
     Safeswim has two card grounds: green for "Good water quality", where the
     colour and the words agree, and navy for "Lifeguards not on duty", where it
     carries no verdict. We can only ever use the second, and the reason is in
     the .pill note above: our lowest tier is IGUAL, TEN CUIDADO, which is not
     permission. A green card under those words would say GO louder than the
     words say CARE, and green wins that argument every time on a safety map.
     So the tier colour lives in the glyph tile and the accent bar, at full
     strength, and the ground stays a constant that means nothing.
     This is adopting one of their two treatments, not softening either. */
  .statuscard{margin:0 0 16px;border-radius:6px;background:#21263D;color:#fff;
    padding:14px;border-left:4px solid var(--tier)}
  .statuscard.low{--tier:var(--low)}
  .statuscard.moderate{--tier:var(--moderate)}
  .statuscard.high{--tier:var(--high)}
  .statuscard .tile{display:grid;place-items:center;width:34px;height:34px;
    border-radius:4px;background:var(--tier);margin:0 0 10px}
  .statuscard .eyebrow{color:rgba(255,255,255,.72);margin-bottom:4px}
  .statuscard .instr{display:block;margin:0 0 8px;font-size:var(--t-instr);
    font-weight:800;line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;
    color:#fff}
  .statuscard .why{margin:0;color:rgba(255,255,255,.88);font-size:var(--t-body);
    line-height:1.5}
  .statuscard .hours{display:block;margin:0 0 8px;color:#fff;font-weight:600;
    font-size:var(--t-2nd)}
  /* Their outlined pill, at the foot of the card it belongs to. White outline,
     transparent fill, full width, chevron. It is a card-scoped action and it
     reads as one because it is inside the card rather than under it. */
  .statuscard .cta{display:flex;align-items:center;justify-content:center;gap:8px;
    margin:13px 0 0;min-height:44px;border-radius:999px;
    border:1.5px solid rgba(255,255,255,.55);background:none;color:#fff;
    font:inherit;font-size:var(--t-2nd);font-weight:600;text-decoration:none;
    cursor:pointer}

  /* ---------- THE EMERGENCY BLOCK ----------
     Safeswim's, almost verbatim in structure:

        IF SOMEONE IN THE WATER IS IN TROUBLE:
        Dial 111

     The LEAD-IN is the part worth taking. It names the TRIGGER before it names
     the number, so the call is attached to a situation rather than floating as
     one more button on a panel that also offers directions. Ours was a bare red
     `Call 911` bar: correct, prominent, and silent about when to press it.
     Dark navy rather than red, and that is deliberate. Red is a hazard tier on
     this map -- it is what NO ENTRES AL AGUA is drawn in -- and a red block that
     is not a tier teaches the reader that red sometimes means something else.
     Safeswim's own chrome navy (#21263D) is outside our hazard palette by
     construction, the same argument that keeps TODAY violet. */
  /* NESTED, and darker than the card it sits in, with a red bar down its left
     edge. That is Safeswim's composition exactly: the emergency block is not a
     peer of the status card, it is a thing inside it, because the trigger it
     names is a thing that happens at THIS beach. */
  .sos911{margin:13px 0 0;border-radius:4px;background:#171B2C;color:#fff;
    padding:12px 13px;border-left:4px solid var(--high)}
  .sos911 .lead{display:block;font-size:var(--t-2nd);font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;line-height:1.35;
    margin:0 0 9px;color:#fff}
  .sos911 .dial{display:flex;align-items:center;justify-content:center;
    min-height:48px;border-radius:4px;background:var(--high);color:#fff;
    font-size:var(--t-instr);font-weight:800;letter-spacing:.01em;
    text-decoration:none}

  /* THE WHY LOST ITS BOX TOO, for the same reason the card's instruction did.
     It was a grey panel with an ink bar, inside a white sheet, above a grey
     caveat panel with an amber bar, above a grey provenance panel with an amber
     border. Five panels deep, the reader sorts containers instead of reading
     sentences. One short sentence in plain ink at body size needs no container
     to be found: it is directly under the largest words on the sheet. */
  .why{margin:0 0 20px;font-size:var(--t-body);line-height:1.5;color:var(--ink)}

  /* THE ESCAPE SENTENCE IS THE SECOND INSTRUCTION ON THE SHEET and it is
     styled like one: ink, 600, its own rule above it. It is not a fact and it
     was rendering as the last bullet of a list of facts, which is where a
     reader who is skimming stops reading. The only sentence here that somebody
     has to recall in the water gets its own line. */
  .escape{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;
    font-size:var(--t-body);line-height:1.45;font-weight:600;color:var(--ink)}
  .escape .ic{flex:0 0 auto;color:var(--muted);font-weight:800}

  /* ONE line, last, grey, 13 px. Everything this map does not know, in the one
     place a reader has already got the instruction and is deciding whether to
     believe it. The review state is bold because it qualifies the sheet above
     it; the deferral that follows is the rule that outranks the sheet above it,
     and it is the same sentence it has always been. See trustLine(). */
  .trust{margin:0 0 16px;font-size:var(--t-2nd);line-height:1.5;color:var(--muted)}
  .trust b{font-weight:600;color:var(--ink)}

  /* An exception that modifies the character, sitting where it can act on it,
     rather than stranded in a facts bullet nothing reads. */
  .caveat{margin:0 0 14px;padding:0 0 0 12px;font-size:var(--t-body);line-height:1.45;
    border-left:3px solid var(--moderate-text);color:var(--ink)}

  /* The rule that still works when this map is wrong, rendered under every
     level. Deliberately NOT styled like a caveat: a caveat qualifies the verdict
     above it, and this outranks the verdict above it. Solid ink, full border, no
     fill, so it reads as the standing rule rather than as one more exception. */
  .defer{margin:0 0 16px;padding:12px 13px;font-size:var(--t-2nd);line-height:1.45;
    font-weight:600;border:1.5px solid var(--ink);border-radius:4px;color:var(--ink)}

  /* Provenance sits directly under the claim it qualifies, not in a footer.
     ONE LINE now, two fields on it. Two stacked rows pushed the why below the
     fold at PEEK; the two claims are still separate and still both named, which
     is what OVSICORI's Autor / Revisado split is for. */
  .prov{margin:0 0 10px;font-size:var(--t-2nd);line-height:1.5;color:var(--muted)}
  .prov b{font-weight:600;color:var(--ink)}
  .prov .row{display:block}
  .prov.unverified{color:var(--gap);background:var(--gap-bg);border:1px solid var(--gap-line);
    border-radius:4px;padding:9px 12px}
  .prov.unverified b{color:var(--gap)}

  .actions{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
    border-radius:6px;border:1.5px solid rgba(11,28,44,.18);background:#fff;
    font:inherit;font-size:var(--t-2nd);font-weight:600;color:var(--ink);
    text-decoration:none;cursor:pointer;text-align:center;line-height:1.2;padding:0 8px}
  .btn.primary{background:var(--high);border-color:var(--high);color:#fff;
    font-size:var(--t-body)}
  .btn.wide{grid-column:1 / -1}
  /* The 911 button left the actions row on the beach sheet. In a 2-up grid with
     Cómo llegar and Reportar un error it was one of three equal rectangles, and
     it is not one of three things: it is the only control here that reaches a
     person. It is full width, on its own, directly under the escape sentence,
     which is where a reader who has just been told what to do in a rip current
     is. The other two stay a 2-up row below the trust line, where they belong,
     because neither is urgent. */
  .btn.call{width:100%;margin:0 0 2px;font-size:var(--t-instr);font-weight:800;
    letter-spacing:.01em;min-height:54px}
  /* Hat 5, finding 10: a safety instrument with no correction channel keeps a
     known error forever, and there was no contact anywhere in 2,291 lines.
     The wordmark link is the other half of the same fix. */
  .footlink{margin:2px 0 0;font-size:var(--t-min);line-height:1.5;color:var(--muted);
    text-align:center}
  .footlink a{color:var(--muted)}
  /* 12 px in from both edges, and above the scroll container rather than
     inside it. At an 8 px inset it sat half on the sheet-body's scrollbar
     track, so on the phone it looked clipped by the sheet edge and on desktop
     it fought the scrollbar for the same pixels. The 44 px hit area is
     unchanged; only the inset and the stacking moved. */
  .close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;
    border:0;background:rgba(11,28,44,.07);font-size:22px;line-height:1;cursor:pointer;
    color:var(--ink);z-index:5;display:grid;place-items:center;padding:0}
  /* Reserve the scrollbar's width whether or not it is showing, so the content
     does not shift by 15 px the moment a sheet grows past its stop. */
  .sheet-body{scrollbar-gutter:stable}

  /* ---------- the legend ----------
     Merged: our four instructions, then Caribbean Guard's own V5 vocabulary in
     their words. Two columns, Spanish then English, exactly as the V5 sheet
     prints it, because a tourist and a local read the same box. Hat 5, finding
     8: four numbered circles sat on the coast meaning nothing until tapped,
     while the association's own map has carried a bilingual key in the corner
     all along. */
  .legend h3{margin:20px 0 8px;font-size:var(--t-min);font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .legend h3:first-child{margin-top:4px}
  .legend .row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;
    padding:9px 0;border-top:1px solid #e7ecf1}
  .legend .row .mark{display:grid;place-items:center;height:22px}
  /* .es and .en are wrapped in .txt rather than being siblings of .mark. As
     direct children of the grid they auto-placed into the NEXT ROW's first
     column, which is the 34 px mark column, and the English wrapped to one word
     per line. */
  .legend .txt{display:block;min-width:0}
  /* .cur and .oth, NOT .es and .en, and the comment that used to sit here said
     "Spanish then English" and was false half the time: legendHTML() puts the
     READER'S language first and the other second, so in English the left column
     is English. Naming a column after a language it does not always hold is the
     kind of small lie that survives until somebody styles Spanish and gets
     English. The V5 sheet prints Spanish first because its reader is assumed to
     be here; ours knows which language its reader chose. */
  .legend .cur{display:block;font-size:var(--t-2nd);font-weight:600;line-height:1.3}
  .legend .oth{display:block;font-size:var(--t-min);line-height:1.3;color:var(--muted)}
  /* Two language columns, the reader's first, as the V5 sheet lays them out.
     Stacks below 360 px, where two columns would force the type under the 12 px
     floor and the floor outranks the layout. */
  @media (min-width:360px){
    .legend .txt{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
  }

  /* ---------- post markers ----------
     Caribbean Guard's own hexagon, in Caribbean Guard's own orange. The dark
     outline is what holds it over water: #f39c12 against Caribbean blue is
     under the 3:1 non-text bar on its own. */
  .po{display:grid;place-items:center;width:32px;height:32px;
    background:var(--station);font-weight:600;font-size:var(--t-2nd);color:var(--ink);
    clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0% 50%);
    filter:drop-shadow(0 0 1.5px #0b1c2c) drop-shadow(0 2px 5px rgba(0,0,0,.55))}
  /* The collapsed badge. Bigger than one station and carrying "x4" rather than
     a bare numeral, so it reads as a count of stations and never as station
     number four. Same hexagon and same orange, because it is the same kind of
     thing: one mark standing for several. */
  .po.cluster{width:38px;height:38px;font-size:var(--t-body);letter-spacing:-.02em}

  /* ---------- offline / signal banner ---------- */
  .toast{position:absolute;left:var(--gut);right:var(--gut);z-index:1400;
    top:calc(env(safe-area-inset-top,0px) + 66px);
    background:var(--ink);color:#fff;border-radius:6px;padding:12px 14px;
    font-size:var(--t-2nd);line-height:1.4;box-shadow:0 4px 18px rgba(0,0,0,.4);
    display:none}
  .toast.show{display:block}

  /* ---------- new build available ----------
     Surfrider's pattern. A cache-first safety map with no way to say "the
     verdicts you are reading are the old ones" will show a stale verdict
     forever, which is the exact failure the provenance machinery exists to
     prevent, one layer down. */
  .update{position:absolute;left:var(--gut);right:var(--gut);z-index:1500;
    top:calc(env(safe-area-inset-top,0px) + 66px);
    display:none;align-items:center;gap:10px;
    background:#fff;color:var(--ink);border-radius:6px;padding:10px 10px 10px 13px;
    box-shadow:0 4px 20px rgba(0,0,0,.45);font-size:var(--t-2nd);line-height:1.35}
  .update.show{display:flex}
  .update .msg{flex:1;font-weight:600}
  .update button{border:0;font:inherit;font-size:var(--t-2nd);font-weight:600;cursor:pointer;
    border-radius:4px;min-height:44px;padding:0 13px}
  .update .go{background:var(--ink);color:#fff}
  .update .no{background:transparent;color:var(--muted);padding:0 8px;min-width:44px}

  /* 12 px, like everything else. Leaflet's 10 px default is conventional and
     it is still text on a page whose acceptance rule is that nothing is under
     the floor. "How far is 200 m" is a question this map's own advice raises,
     so the scale bar above is content, not chrome. */
  .leaflet-control-attribution{font-size:var(--t-min);padding:0 5px}
  /* The scale bar answers "how far is 200 m", which is the unit the escape
     instruction is written in, so it has to be readable rather than tucked
     under the dock. Lifted by the dock's own measured height. */
  .leaflet-bottom.leaflet-left{bottom:calc(var(--safe-pad) + var(--dock-h) + 4px)}

  /* The rail head and the permanent legend exist only on desktop. They are in
     the DOM on a phone too, and hidden, rather than built twice. */
  .railhead,.legend-perm{display:none}

  /* ================= DESKTOP =================
     Hat 5's seventh finding: what the board saw first was the phone stretched
     to 1568 px, a row of small tiles clipped by the bottom edge, no legend, no
     title, nothing saying what this is. Four of the five hats voted the same
     layout, a left column holding every beach. */
  @media (min-width:820px){
    /* The dock becomes the rail. Same cards, same DOM, different axis. */
    .dock{top:0;right:auto;bottom:0;width:360px;
      background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
      box-shadow:2px 0 24px rgba(0,0,0,.35);
      display:flex;flex-direction:column;overflow:hidden;
      padding-bottom:var(--safe-pad)}
    .rail-eyebrow{display:block;margin:2px var(--gut) 6px}
    .railhead{display:block;flex:0 0 auto;padding:16px var(--gut) 12px;
      border-bottom:1px solid #e7ecf1}
    .railhead .wm{display:block;font-size:var(--t-body);font-weight:600;
      letter-spacing:.04em;color:var(--ink);text-decoration:none}
    .railhead .what{margin:6px 0 0;font-size:var(--t-2nd);line-height:1.4;color:var(--muted)}
    .dockrow{margin:10px var(--gut) 0;background:var(--void-bg);color:var(--ink);
      box-shadow:none;border:1px solid var(--void-line)}
    .dockrow .txt{text-decoration-color:rgba(11,28,44,.35)}
    .dockrow .rf{background:rgba(11,28,44,.08);color:var(--ink)}
    /* The legend is permanently open on desktop, so the chip that opens it as a
       sheet has nothing left to do; and every card is visible, so the counter
       has nothing left to count. */
    .dockrow .btn-chip,.counter{display:none}
    /* The rail scrolls its own two regions, never the page: six cards, a
       permanent legend and a title do not fit in 800 px of laptop, and a page
       that scrolls would take the map with it. Cards get whatever the legend
       does not, which on a tall window is all six at once. */
    .strip{flex:1 1 auto;min-height:0;flex-direction:column;overflow-x:hidden;
      overflow-y:auto;scroll-snap-type:none;padding:12px var(--gut);gap:10px;
      -webkit-mask-image:none;mask-image:none}
    .card{flex:0 0 auto;width:100%;max-width:none;padding:12px 14px 13px}
    .legend-perm{display:block;flex:0 0 auto;max-height:min(300px,38vh);
      overflow-y:auto;padding:0 var(--gut) 12px;border-top:1px solid #e7ecf1}
    .legend-perm .cur{font-size:var(--t-min)}
    /* The beach panel is a full-height right column and it never sits on the
       coast it is describing: fitCoast() pads the map by both of these widths,
       so the strokes stay in the open middle. */
    .sheet{left:auto;right:0;top:0;bottom:0;width:400px;height:auto;
      border-radius:0;box-shadow:-2px 0 24px rgba(0,0,0,.35);
      transform:translateX(102%)}
    .sheet[data-stop="peek"],.sheet[data-stop="half"],.sheet[data-stop="full"]{height:auto}
    .sheet.open{transform:translateX(0)}
    .draghead{cursor:default}
    .grab{display:none}
    .sheet-body{padding-top:16px}
    /* Nobody locates themselves from a laptop, and a laptop cannot dial, so the
       locate control is demoted and the emergency number is read rather than
       tapped. Both were unanimous across the hats. */
    .fab{width:40px;height:40px;right:12px;bottom:16px}
    .fab svg{width:20px;height:20px}
    .compass{right:12px;bottom:66px}
    .locate-first{display:none !important}
    .sos{cursor:default}
    .toast,.update{left:auto;right:16px;width:360px}
    /* The dock is a full-height rail here, so --dock-h is the viewport and the
       phone rule above would push the scale bar off the top. */
    .leaflet-bottom.leaflet-left{bottom:0;left:360px}
  }
</style>

<!-- hidden AND inert while closed. Named by its own h2, which also takes focus
     when it opens: hat 4 tapped a card, the panel opened, and TalkBack said
     nothing at all. -->
<div class="sheet" id="sheet" role="dialog" aria-modal="false"
     aria-labelledby="sheet-title" data-stop="peek" hidden inert>

<script src="vendor/leaflet.js"></script>
<!-- The map's linework, from workstream A. A classic script defining window.CGGeom
     and nothing else: it captures window.L at definition time, so it must load
     AFTER Leaflet and BEFORE this file. Stroke widths, dash ratios, the 40 m end
     taper, the outlined rip arrow and label collision all live in there now, so
     the card swatch and the map read ONE table instead of two copies. -->
<script src="geometry.js"></script>
<script src="symbols.js"></script>
<script>
/* ============================================================
   1. GEOREFERENCE  <-- solved 2026-07-30, do not hand-edit
   Solved by tools/refine.py against Bing aerial, then the source
   image was resampled north-up into Web Mercator by tools/rectify.py
   so these bounds are exact rather than an approximation of a
   rotated image. Regenerate both if the base image is ever restitched.

   MEASURED ACCURACY (tools/residual.py, 14 points along the coast):
     Puerto Viejo to Punta Uva     5 to 75 m,  8 points confirmed
     Punta Uva to Manzanillo       not confirmable; see below
   Good enough to say which beach you are on. NOT good enough to say
   which end of it, and nowhere near good enough to place a hazard.

   The east third cannot be verified because the generative upscale
   replaced the water and reef with invented texture, so there is
   nothing real there to match against. Treat east of Punta Uva as
   roughly 150 m until better imagery replaces it.
   ============================================================ */
const IMG_BOUNDS = [[9.621462, -82.790863], [9.671534, -82.639053]]; // [[S,W],[N,E]]
/* The largest axis-aligned rectangle that fits INSIDE the rotated image.

   IMG_BOUNDS is the bounding box of a quad sitting at 3.37 degrees, so its four
   corners are transparent wedges. Cover-fitting the bounding box therefore still
   shows page colour in the corners: the image fills the box, but the box is not
   all image. This is the inscribed rectangle, and it is what the desktop zoom
   floor and the pan limit use so no background is reachable at all.

   It costs 35% of the height, which is the honest price of using rectified
   imagery from a rotated source. */
const IMG_SAFE = [[9.630126, -82.788391], [9.662873, -82.641518]]; // [[S,W],[N,E]]

const GEO_ACCURACY_M = 75;      // what we can defend in the west
const GEO_ACCURACY_EAST_M = 150;
const GEO_EAST_OF = -82.699;    // longitude where confidence drops

/* ============================================================
   2. SAFETY DATA  <-- must be authored by Caribbean Guard, not by satellite
   Edit this block to update the map. Nothing else needs to change.

   ---- IDS ----------------------------------------------------------------
   Ids are namespaced  <org>:<type>/<local>  and they are a join key, not a
   label. Caribbean Guard already has towers at Cocles and at a "Playa Grande",
   and Playa Grande Lifeguards is a separate founding member of the same national
   federation, named after a different Playa Grande on the Pacific side. The
   collision exists inside this data set before any second organisation is
   involved.

   The cost of doing this now is a prefix. The cost of doing it later is
   rewriting every provenance record that has already been signed and dated, and
   a provenance record's whole value is being an unaltered timestamped statement
   of who said what. That is the one migration this system must never perform.

   The `local` part is what the QR deep links carry (?z=cocles, ?p=est2), so it
   stays short and stays stable. Do not renumber est1..est4.

   ---- TWO AXES, NOT ONE --------------------------------------------------
   `status` used to be one word carrying two different claims: that Cocles is the
   beach with the most rescues on this coast (true for years) and that Cocles is
   dangerous today (true for hours). Flipping it to say the water is calm this
   week also said the standing fact was no longer true. In the other direction it
   was worse: a beach whose standing character is benign could not be called
   dangerous today without permanently relabelling the beach, which is exactly why
   Punta Uva was `safe` while our own copy said to avoid the east channel.

   Ireland's EPA refuses to merge these and labels both prominently. So:

     character  what this beach IS.        Changes in years.   Carries the map stroke.
     today      what a guard signed about  Changes in hours.   Never touches the stroke.
                it right now.

   character.class is one of four, mapped to three visual tiers in CHARACTER
   below. Four classes because "never swim here" (Salsa Brava) and "swim only in
   front of the guard post" (Cocles) are different instructions, and one word for
   both is the same flattening this split exists to undo. Three tiers because the
   stroke vocabulary's brightness ladder only works with three.

   beaches.ie carries its long-run scale as a COUNT OF STARS rather than a colour,
   so it cannot be confused with the current reading. That specific device does not
   transfer: a star count is an ordinal quality rating averaged over four seasons
   of sampling, we have no sampling programme, and a hazard character is not
   better-or-worse, it is a different kind of water. What transfers is the
   principle, that the two axes must be encoded in different channels. Here the
   character is colour plus stroke weight plus dash, and today is a dated bordered
   block with a person's name on it and no hazard colour at all.

   ---- PROVENANCE IS NOT OPTIONAL -----------------------------------------
   Two fields, not one, following OVSICORI, whose every earthquake popup carries
   `Autor` (what process produced this record) and `Revisado` (has a human checked
   it, currently rendering "-"):

       authored: "desk" | "sheet" | "field"     what produced this text
       reviewed: {by:"person", org:"Caribbean Guard", on:"YYYY-MM-DD"} | null

   `org` and not just `by`, because if this map becomes the federation's de facto
   safety page, the question is which organisation stands behind the verdict, not
   only which person typed it.

   Leave `reviewed` null and the interface says out loud that nobody has confirmed
   this, which is the honest state today: every description below is `desk`, which
   means written from general knowledge, not by a guard who has stood on that sand.

   The interface must never claim more currency or more authority than this block
   actually carries. No "real time", no "live conditions", no attribution to
   Caribbean Guard's guards until a real name and date sit here. Stale defaults to
   unknown, never to safe. Nothing here says safe at all: see CHARACTER.
   ============================================================ */

/* A standing characterisation confirmed more than a year ago is worth
   re-confirming; a bulletin signed this morning is worth half a day. They are
   different kinds of claim, so they get different clocks. That is the point of
   splitting them and it is the first place the split pays for itself.

   TODAY_VALID_HOURS is a placeholder. It should be whatever Caribbean Guard's
   actual patrol shift is, and nobody has told us yet. */
const CHARACTER_VALID_DAYS = 365;
const TODAY_VALID_HOURS    = 12;

const ZONES = [
  {
    id:"cg:zone/playa-negra",
    name:{es:"Playa Negra", en:"Playa Negra"},
    sub:{es:"Puerto Viejo oeste", en:"West of Puerto Viejo"},
    character:{
      class:"lower-risk",
      authored:"desk", reviewed:null,
      why:{es:"Fondo de arena, pendiente suave y poca corriente. Sin arrecife cerca de la orilla.",
           en:"Sand bottom, gentle slope and little current. No reef near the shore."},
      /* A third fact here used to send the reader east to a rescue post that
         does not exist. Hat 3, a volunteer guard, blocked on it: the nearest
         station in this map's own data is 4.34 km east at Playa Chiquita, and
         the distance that bullet named lands on Salsa Brava, live coral and a
         no-swim break. A family walking east for help would have arrived at the
         reef. Deleted rather than repointed: no station near here exists to
         point at. */
      facts:{es:["Sin arrecife cerca de la orilla","Oleaje bajo salvo en marejadas de diciembre a marzo"],
             en:["No reef near the shore","Low surf except during December to March swells"]}
    },
    today:null,
    /* GEOMETRY LIVES IN data/zones-geometry.json, not here, and it comes from
       tools/osm_coastline.py. No short fallback copy is kept: a hazard line in
       the wrong place is a claim, not a gap.
       THE SPAN CHANGED ON 2026-09-17 and the joints are now exact. The old

   in tú, and so does every Latin American volunteer water safety organisation
   studied. Usted reads correctly for a government authority issuing instructions
   from outside a community; Caribbean Guard is the opposite kind of body, and
   usted on this one artefact made the piece doing the most safety critical work
   sound like it came from a more distant organisation than the one whose name is
   on it. If you add a string, write it in tú.

   THREE RULES GOVERN THE LEVEL NAMES. All three, not one.

   1. EVERY LEVEL NAME IS AN INSTRUCTION, never a colour and never a rating.
      SMN Argentina's severity levels are "Informate", "Preparate", "Segui
      instrucciones oficiales": the level name IS the action. A rating tells you
      how bad somebody thinks it is; an instruction tells you what to do, which is
      the only thing a person standing on sand can act on. Nobody may "simplify"
      these into colour names or into a risk scale later. RIESGO ALTO is a rating
      and it is not good enough.

      United States' national rip current forecast is willing to make, on imagery
