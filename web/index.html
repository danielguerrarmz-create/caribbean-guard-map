/* Follow the phone's locale, with Spanish as the floor.

   Following the locale is right: this coast is mostly read by tourists, and a
   tourist's phone is usually in their own language. Spanish as the floor is also
   right: Caribbean Guard is a Costa Rican organisation writing in Spanish, so an
   unrecognised locale should land on the language of the place, not on English.

   Walking `navigator.languages` rather than only `navigator.language` matters for
   the case in between. A German phone set to ["de-DE", "en-GB"] has stated that
   it prefers English over nothing, and we publish English, so it gets English.
   A phone set to ["de-DE"] alone has stated no preference we can honour, and
   falls to Spanish. That is a preference being respected in the first case and a
   fallback being applied in the second, which are different things.

   The two-language check is deliberately explicit rather than
   `startsWith("en") ? "en" : "es"`. That earlier form silently sent every
   non-English locale to Spanish, which happens to be the same answer most of the
   time and for the wrong reason. */
function pickLang(){
  const tags = (navigator.languages && navigator.languages.length)
    ? navigator.languages
    : [navigator.language || ""];
  for(const tag of tags){
    const base = String(tag).toLowerCase().split("-")[0];
    if(base === "en") return "en";
    if(base === "es") return "es";
  }
  return "es";   // the floor, and it is the language of the coast
}
let lang = pickLang();

/* Map graphics drawn straight onto photography, so the job
   here is separating the three tiers FROM EACH OTHER rather than from a page
   background. They are separated by brightness, not hue, because hue is the first
   thing a sun-washed screen loses:
       moderate  L 0.545   ---- 3.19:1 ----+
       low       L 0.251   -- 1.98:1 --+   |
       high      L 0.137   -- 1.52:1 --+---+
   The dark #9C5C00 moderate is deliberately NOT used here: against high it
   measures 1.06:1, which on a map line is indistinguishable. It stays reserved
   for text and dots on white, where it is the value that passes 4.5:1. */
const COLOR = {low:"#1f9d55", moderate:"#f5b942", high:"#c62828"};

/* ============================================================
   3. THE TWO AXES, AND THE THREE WAYS OF NOT KNOWING

   Absence gets drawn, never hidden. Safeswim publishes eleven pin types and two
   of them are kinds of not knowing: grey means the feed broke, and a separate
   "water safety information only" pin means this beach was never in the
   programme at all. Different facts, different marks.

   Ours has three, and they can co-occur, so they render as a STACK of marks and
   never as one banner:

     never       nobody at Caribbean Guard has ever reviewed this beach
     expired     somebody did, too long ago
     unsurveyed  this stretch is outside the annotated sheet the hazards came off

   The third is the one that matters most and it was the one least visible: the
   sheet covers 1.86 km of 16.66 km, and the map used to say so in a toast that
   fired six seconds after load and then vanished. An absence rendered as nothing
   is indistinguishable from an absence of hazard, which is the precise misreading
   the coverage caveat exists to prevent. It is now a permanent card in the picker
   and a permanent mark on every beach it applies to.
   ============================================================ */

/* The stretch Caribbean Guard's annotated sheet actually covers, in longitude.
   Seeded from the shipped data so the picker can render before the fetch
   resolves, then recomputed from the fetched features so it can never drift from
   what is drawn. The coast runs broadly east to west, so a longitude interval is
   the right shape for this and a bounding box would overstate it. */
let SURVEY = {w:-82.724144, e:-82.707199};

/* THE THREE NUMBERS ON THE "REST OF THE COAST" SHEET MUST SHARE A BASIS.

   That sheet says: this map covers N km of coast, five beaches describe M of
   it, and Caribbean Guard's annotated sheet covers S. `total` and `surveyed`
   are both EAST-WEST EXTENTS, a chord at a fixed latitude. `zoned` used to be
   the summed length of the drawn zone lines, which was near enough while those
   lines were 7-to-60-point decimations, and stopped being near enough the day
   the traced coastline replaced them: arc length along a sinuous shore is much
   longer than the chord it spans. Measured, the traced zones sum to 15.0 km
   against a 16.6 km chord, which would have told a reader that only 1.6 km of
   this coast is undescribed. The true figure on a common basis is 7.2 km.

   That card is the most defensible thing on this page and the one hat 5 said
   is where a board would otherwise be exposed. A number that quietly argues
   the opposite of what the card is for is worse than no number. So all three
   are extents now, and none of them waits for a fetch. */
function zonedExtentM(){
  return ZONES.reduce((sum, z) =>
    sum + map.distance([9.646, z.span.w], [9.646, z.span.e]), 0);
}

/* Reads z.span, not z.line. The drawn line arrives over the network and the
   chip that says whether anybody walked this stretch has to be on the card in
   the first paint, before Leaflet exists. Both come from the same traced
   coastline, so they cannot disagree. */
function surveyRelation(z){
  const lo = z.span.w, hi = z.span.e;
  if(hi < SURVEY.w || lo > SURVEY.e) return "out";
  if(lo >= SURVEY.w && hi <= SURVEY.e) return "in";
  return "partial";
}

/* Days elapsed since a YYYY-MM-DD, built in LOCAL time.
   new Date("2026-07-01") parses as UTC midnight, and formatting that anywhere
   west of Greenwich renders the previous day, so a review dated the 1st displayed
   as 30 June. On fields whose entire purpose is saying when, an off by one day is
   not acceptable. */
function localDate(ymd){
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(d){
  return d.toLocaleDateString(lang === "es" ? "es-CR" : "en-GB",
                              {year:"numeric", month:"long", day:"numeric"});
}
function fmtStamp(d){
  return d.toLocaleString(lang === "es" ? "es-CR" : "en-GB",
                          {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}

/* ---- axis 1: character ---- */
function characterState(z){
  const r = z.character.reviewed;
  if(!r) return {gap:"never"};
  const on = localDate(r.on);
  const days = Math.floor((Date.now() - on.getTime()) / 86400000);
  return days > CHARACTER_VALID_DAYS
    ? {gap:"expired", reviewed:r, on, days}
    : {reviewed:r, on, days};
}

/* ---- axis 2: today ---- */
function todayState(z){
  const t = z.today;
  if(!t) return null;
  const at = new Date(t.at);
  const hours = (Date.now() - at.getTime()) / 3600000;
  return {notice:t.notice, at, hours, stale: hours > TODAY_VALID_HOURS, rec:t};
}
/* Only a signed, unexpired notice draws on the map, and `normal` draws nothing:
   "a guard looked and found nothing unusual" adds no mark, because the mark would
   read as an all clear and that is not what it says. */
function todayHalo(z){
  const s = todayState(z);
  if(!s || s.stale || s.notice === "normal") return null;
  return "#7b1fa2";
}

/* ---- the three absences, as data ---- */
/* ---- provenance, two fields, following OVSICORI ----
   Autor and Revisado are different claims and they stay different claims.
   Collapsing them into one is how a machine reading of a published graphic gets
   read as a lifeguard's word. The empty review state renders visibly rather than
   hiding: theirs prints a bare "-", ours says who is missing.

   ONE LINE in the sheet now rather than two stacked rows, because the sheet
   opens at PEEK and the instruction, the provenance and today all have to be
   above the fold there with nothing to scroll. Two fields on one line is a
   layout change; one field would have been a doctrine change. */
function provenance(rec, inline){
  const t = T[lang];
  const authored = t["authored" + rec.authored.charAt(0).toUpperCase() + rec.authored.slice(1)];
  const r = rec.reviewed;
  let reviewed, stale = "";
  if(!r){
    reviewed = t.reviewedNobody;
  } else {
    const on = localDate(r.on);
    const days = Math.floor((Date.now() - on.getTime()) / 86400000);
    reviewed = t.reviewedBy(r.by, r.org, fmtDate(on));
    if(days > CHARACTER_VALID_DAYS) stale = " " + t.charStale(CHARACTER_VALID_DAYS);
  }
  const cls = !r || stale ? " unverified" : "";
  if(inline)
    return `<p class="prov${cls}"><b>${t.provAuthor}:</b> ${authored} · <b>${t.provReviewed}:</b> ${reviewed}${stale}</p>`;
  return `<p class="prov${cls}">
    <span class="row"><b>${t.provAuthor}:</b> ${authored}</span>
    <span class="row"><b>${t.provReviewed}:</b> ${reviewed}${stale}</span>
  </p>`;
}
/* WHAT WAS HERE, AND WHERE IT WENT. 2026-09-17.

   Five renderers were deleted rather than left in place unreferenced:
   absences(), cardChips(), gapList(), factsOf() and todayBlock(). Between them
   they drew the two provenance chips on every card, the stacked absence boxes
   and the facts bullet list in the sheet, and the TODAY line. Nothing calls any
   of them now: the card is name / instruction / hours, and the sheet is a sign
   plus one trust line.

   THEY ARE DELETED AND NOT KEPT AS DEAD CODE, and that is the point rather than
   tidiness. This page renders its cards TWICE, once as static HTML for the
   first paint and once from cardHTML() on a language switch, and the two have
   to be kept in step by hand. A third rendering path that nothing calls, in the
   same file, styled the same way, is a trap: the next person to be asked for
   "the facts under the instruction" edits factsOf(), sees no change, and either
   gives up or wires it back in with none of the reasoning that took it out.

   The reasoning is not lost. cardHTML() carries why the chips went and the one
   condition that would bring them back; openZone() carries what left the sheet
   and why; trustLine() carries what replaced all four absence surfaces. The
   code is in git at 6be0f66:web/index.html.

   TODAY IS THE ONE TO READ BEFORE REBUILDING. todayState() and todayHalo() are
   still live, because the halo under a zone stroke still draws a signed
   bulletin. Only the sheet's rendering of it went. When the bulletin signing
   surface in the handoff's governance list finally exists, the line it needs
   has to be designed against the sign the sheet is now, not restored from the
   block it used to be. */

/* ---- the post's clock ----
   Renders only for a zone that has one. The closed state is appended in ink,
   never in red: a post that has gone home is not a hazard tier, and colouring
   it like one would be the third colour claim on a card that already carries
   two. Reads the device clock, which is the only clock a phone on the sand has.
   Deliberately no timezone handling: the reader and the post are in the same
   place, so local is the correct and only sensible reading.

   IT COMPUTES ONCE, AT RENDER, AND THAT IS ACCEPTED. A page left open across
   17:00 keeps showing the card as it was when it was drawn, until something
   else re-renders it: a language switch, a tap on a card, a refresh. Nobody
   stands on the sand with this page open and untouched for the twenty minutes
   either side of the boundary, and the alternative is a timer that repaints
   every card on a safety map on a schedule, which is a live-updating behaviour
   this file does not otherwise have and cannot test cheaply. Reviewed and
   accepted 2026-09-17. If a bulletin-signing surface ever lands and the cards
   start refreshing on their own, fold this into that loop rather than adding a
   second one. */
function hoursLine(z){
  const p = z.post;
  if(!p) return "";
  const t = T[lang], h = new Date().getHours();
  const closed = (h < p.from || h >= p.to) ? ` · ${t.postClosed}` : "";
  return `<span class="hours"><b>${p[lang]}</b>${closed}</span>`;
}
/* ---------- map ---------- */
const BB = L.latLngBounds(IMG_BOUNDS);
const SAFE = L.latLngBounds(IMG_SAFE);
const map = L.map("map",{
  zoomControl:false, attributionControl:true,
  maxBounds:BB.pad(0.02), maxBoundsViscosity:1.0,
  maxZoom:18, zoomSnap:0.25, tap:true
});
/* THE BASEMAP IS A TILE PYRAMID, not one image.

   It used to be a single `imageOverlay` of a 1.19 MB generative upscale, and that
   one choice caused three separate problems that took a great deal of code to
   manage rather than fix:

   - BLACK BANDS. One finite rectangle over a 3.5:1 coast letterboxes on every
     viewport shape. A blurred, darkened copy of the image was stretched into the
     gaps, and it still read as a void at full zoom-out.
   - A ZOOM FLOOR THAT HAD TO BE COMPUTED. Zooming out past the image bought only
     empty space, so the floor was derived, clamped and re-derived on every
     resize, with a pan limit hung off the backdrop's bounds.
   - 5 TO 75 M OF DISPLACEMENT. The upscale is not registered to the coordinates
     everything else on this map uses. See docs/handoffs/2026-09-14.

   Tiles have none of them: they cover whatever the viewport can reach at any
   zoom, they are the same ground truth the coastline is traced from, and the
   floor is now a design choice rather than an artefact of image size.

   Cost is paid per tile and only for what is on screen, so the critical path is
   smaller than the old overview, not larger: about 6 tiles at 9 KB to fill a
   phone at the opening view, against one 36 KB overview image.

   `maxNativeZoom` is 17 because that is what the cache holds. Above it Leaflet
   upscales the z17 tile, which is honest blurring rather than invented detail.

   LICENSING: serving these redistributes Bing imagery, which their terms do not
   permit. Deriving a coastline from imagery is not the same act as reselling it.
   Before this is published, either license the imagery or point `tileUrl` at
   Esri World Imagery, which is free with attribution and finer than this cache.
   Self-hosting buys one thing a remote layer cannot: these tiles can be
   precached, and offline is the whole point of the map. */
/* TWO BOXES, and they are not the same box.

   FULL is every zoom, a tight rectangle around the coast, and it is what the
   pan limit is built from: inside it there is imagery at any zoom somebody can
   reach. CONTEXT is wider but only exists at z12 to z14, fetched purely so that
   a zoomed-out viewport on a wide screen has sea and forest at its edges instead
   of black. Asking for a z17 tile out there returns nothing, which is why the
   pan limit stays on FULL while the layer is allowed to request the wider box. */
const TILE_FULL = L.latLngBounds([[9.61429, -82.801208], [9.687398, -82.6474]]);
/* Widened, and this is what actually fixed the navy landing view. fitCoast()
   derives the zoom floor from the viewport, so a 390x844 phone lands at about
   z11.8 and Leaflet asks for LEVEL 12; at that zoom a pixel is 43 m, so 844 px
   of phone is 36 km of ground and the old z12 box was 22 km tall. The opening
   view ran out of imagery about 7 km above and below the coast on every
   portrait phone. This box is what the pyramid now covers. `bounds` is a hard
   gate: Leaflet will not request a tile outside it however many are on disk. */
const TILE_CONTEXT = L.latLngBounds([[9.0570, -83.1617], [10.2448, -82.2869]]);

const TILES = L.tileLayer("tiles/{z}/{x}/{y}.jpg", {
  minZoom: 10, maxNativeZoom: 17, maxZoom: 18,
  bounds: TILE_CONTEXT,
  // No flat fill showing through at the edges of coverage, and no grey flash
  // between a tile being requested and arriving.
  className: "basemap", keepBuffer: 3, updateWhenIdle: false,
  attribution: "Imágenes satelitales"
}).addTo(map);
const TILE_BOUNDS = TILE_FULL;
// Low zoom tiles cover a much wider area than the detail tiles. Constraining a
// phone's 30 km viewport to the 8 km detail box cancels panel-aware centering.
function panBounds(){ return (map.getZoom() < 14.5 ? TILE_CONTEXT : TILE_BOUNDS).pad(0.08); }
map.on("zoomend", ()=>map.setMaxBounds(panBounds()));
map.attributionControl.setPrefix("").addAttribution("Caribbean Guard")
  .addAttribution('<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>');

/* Contain, do not cover. This was cover-fit, and on a 390px portrait phone that
   blew a 3.5:1 coast up until you could see about 370 m of it: all water, no
   headland, nothing telling you which beach you were looking at. Someone who has
   just scanned a QR code needs orientation in the first second, so show the whole
   16.6 km and let the empty bands above and below be the page background. The
   image carries alpha for the same reason, so the rotated corners read as
   background rather than as black wedges. */
/* On a phone the chrome is a band at the top and a band at the bottom. On
   desktop it is two COLUMNS, the rail on the left and the beach panel on the
   right, and the map has to be padded by both or the coast ends up underneath
   the panel describing it. Hat 5's vote was explicit: the right-hand panel must
   never overlap the coast it describes. */
function desktop(){ return window.matchMedia("(min-width:820px)").matches; }
function mapTopInset(){
  const header = document.querySelector('.topbar')?.offsetHeight || 64;
  return header;
}
function chrome(){
  const dockEl = document.querySelector(".dock");
  /* getElementById, not the `sheet` const below. fitCoast() runs inline at
     parse time, before that const is initialised, and reading a const in its
     temporal dead zone throws rather than returning undefined. */
  const sh = document.getElementById("sheet");
  if(desktop()){
    const sheetOpen = sh && !sh.hidden && sh.classList.contains("open");
    return {
      top: (document.querySelector(".topbar")?.offsetHeight || 64) + 8,
      bot: 16,
      left: (dockEl?.offsetWidth || 360) + 16,
      right: 16
    };
  }
  return {
    top: mapTopInset() + 8,
    // the dock, not the strip: the saved line sits above the cards inside it
    // What shows of it: the dock is laid out full height and slid down.
    bot: (dockEl ? Math.max(0, window.innerHeight - dockEl.getBoundingClientRect().top) : 96) + 8,
    left: 0, right: 0
  };
}

/* The chrome must never be allowed to consume the viewport.

   getBoundsZoom() subtracts the padding from the map size. Hand it a padding
   larger than the map and the scale it computes is garbage, which Leaflet then
   clamps to maxZoom. That garbage becomes the zoom floor via setMinZoom(), and
   every branch below lands on it. Measured before this clamp existed: a 400x200
   viewport, where the topbar and dock total 216 px, drew the 744 px coast at
   28,299 px wide, a 38x overzoom that is stable rather than transient because the
   floor has latched.

   That is reachable two ways. A genuinely short landscape window, and, more
   importantly, the middle of a phone rotation: the viewport passes through very
   short intermediate shapes, and the refit fires immediately on rotation by
   design, so it fires straight into one.

   Capping total padding at 60 percent of the axis means the dock may overlap the
   map on a very short window. That is strictly better than the map being
   unreadable, and it only ever engages below about 360 px of height. */
function fitPadding(){
  const c = chrome(), size = map.getSize();
  let top = c.top, bot = c.bot;
  const capY = size.y * 0.6;
  if(top + bot > capY && top + bot > 0){
    const k = capY / (top + bot);
    top = Math.floor(top * k);
    bot = Math.floor(bot * k);
  }
  // The horizontal chrome gets the same treatment and for the same reason: on a
  // narrow desktop window the rail plus the panel can exceed the viewport, and
  // a padding wider than the map produces a garbage zoom that then latches into
  // the floor. Below 820 both are 0 and this is the old single value.
  const x = Math.min(8, size.x * 0.3);
  let left = (c.left || 0) + x, right = (c.right || 0) + x;
  const capX = size.x * 0.7;
  if(left + right > capX && left + right > 0){
    const k = capX / (left + right);
    left = Math.floor(left * k);
    right = Math.floor(right * k);
  }
  return {top, bot, x, left, right};
}
/* Wide viewports COVER, narrow ones CONTAIN, and the difference is not cosmetic.

   The coast is a 3:1 strip. On a landscape desktop window the image can fill the
   frame, so there is no reason to ever show the page behind it: the floor is set
   to the cover zoom and the background never appears. On a portrait phone cover
   would blow the image up until you can see about 370 m of a 16.6 km coast, all
   water and no landmark, which is the failure this file already fixed once. So
   there the floor stays at contain and the empty bands are page colour on purpose.

   maxBounds is tightened to the image itself at the same time, otherwise you can
   still pan the background into view without zooming at all. */
function wide(){ return window.matchMedia("(min-width:760px) and (orientation:landscape)").matches; }

/* `keepView` is passed by the resize path and by nothing else.

   A viewport change always has to recompute the zoom floor, the backdrop and the
   pan limit, because all three are derived from what the viewport can reach. It
   does NOT have to move the camera. Somebody who has zoomed into Cocles and then
   rotates the phone wants to still be looking at Cocles: refitting the whole
   coast under them throws away the thing they navigated to, which on a 16 km
   strip means finding their beach again. So the limits are always recomputed and
   the camera is only reset when it was sitting at the floor anyway, where a
   refit is exactly what is wanted. */
function fitCoast(opts){
  const keepView = !!(opts && opts.keepView);
  const hadZoom = map.getZoom(), hadCentre = map.getCenter();

  /* Refresh Leaflet's cached container size FIRST, before anything reads it.
     Leaflet caches the container size in map._size and only recomputes it in
     invalidateSize(). Without this line getSize(), getBoundsZoom(), fitBounds()
     and sizeBackdrop() all compute against the viewport as it was at load, so
     rotating a phone to landscape left a 1052 px wide image inside a 502 px
     viewport. On a 3:1 coast, rotating to see more of it is the most natural
     gesture there is, and it produced a dark blurred rectangle with no
     coastline. Do not remove this. */
  map.invalidateSize({animate:false, pan:false});

  /* Release the pan limit BEFORE fitting, and only then recompute it.
     maxBounds is derived from the backdrop, which is itself sized for the
     viewport that was current when it was last computed. Leaving the old limit
     in force means fitBounds gets dragged back toward the previous viewport's
     centre, and because each fit then starts from an already-displaced centre
     the error compounds: successive resizes walked the map to y=1350, entirely
     below the fold. */
  map.setMaxBounds(null);

  // Clear the floor too. getBoundsZoom clamps its own result to the current
  // minZoom, so setting minZoom from it ratchets upward on every call and the
  // map slowly loses the ability to show the whole coast.
  // Read whether the user was at the floor BEFORE clearing it, or the comparison
  // is against 0 and every view looks zoomed in.
  const wasAtFloor = Math.abs(hadZoom - map.getMinZoom()) < 0.01;
  map.setMinZoom(0);

  // Contain everywhere. Seeing all 16.6 km at once is worth more than never
  // showing the page behind the map: the whole point of the overview is knowing
  // which beach you are looking at, and a cover fit on this 3:1 strip zooms in
  // far enough to lose that on every viewport shape. The empty bands are the
  // app's own navy, so they read as a deliberate letterbox rather than a gap.
  // Padding is read AFTER invalidateSize, because it is clamped against the map
  // size and that size has just changed.
  const c = fitPadding();
  const pad = L.point(c.left, c.top).add(L.point(c.right, c.bot));
  // Derive the floor from getBoundsZoom, NOT from getZoom() after fitBounds.
  // fitBounds animates, so on the next line getZoom() is still the OLD zoom and
  // the floor lands above the fit: the map then sits below its own minimum and
  // snaps upward on the first interaction.
  let z = map.getBoundsZoom(BB, false, pad);
  // Belt and braces. fitPadding() makes a degenerate padding impossible, but a
  // non-finite floor here would latch into setMinZoom and poison every later
  // fit, so it is worth one line to never store one.
  if(!isFinite(z)) z = map.getBoundsZoom(BB, false, L.point(0, 0));

  // No slack below the fit. Zooming out past the whole coast only ever buys more
  // empty space, so the floor IS the fit.
  map.setMinZoom(z);
  // Pan limit is the TILE COVERAGE, not the coast. Clamping to the coast looks
  // right and breaks flyClear: offsetting the centre so a zone clears the bottom
  // sheet pushes the viewport past the coast edge, maxBounds drags it back, and
  // the zone the user just asked about ends up behind the sheet. Tile coverage
  // runs well past the coast on every side and is real imagery throughout, so
  // there is nothing to hide by staying inside it.
  map.setMaxBounds((z < 14.5 ? TILE_CONTEXT : TILE_BOUNDS).pad(0.08));

  if(keepView && !wasAtFloor){
    // Limits rebuilt for the new viewport, camera left where the user put it.
    // Math.max because the new floor can be HIGHER than the old zoom: rotating a
    // phone to landscape raised the floor from 12 to 12.75 here, and leaving the
    // camera below its own minimum is the bug the getBoundsZoom comment above
    // describes. setMaxBounds has already been applied, so an off-limit centre is
    // clamped by Leaflet rather than by us.
    map.setView(hadCentre, Math.max(hadZoom, z), {animate:false});

    /* Safety net, and it is the whole point of this function.

       maxBounds is the TILE COVERAGE rather than the coast, deliberately, so
       that flyClear can offset the centre off the coast to clear the bottom
       sheet. Coverage extends well past the coast on every side, so a centre
       that is a harmless few pixels off the coast at the floor is thousands of
       pixels off it when zoomed in. Rotating from that state left the coast
       2,900 px above the viewport: measured, box [-235, -2925, 742, -2257] in an
       845x502 window.

       So preserving the view is conditional on the view still containing some
       coast. Tiles mean it is now open sea rather than a blurred rectangle, but
       open sea is no more use to somebody looking for their beach. The whole
       coast is strictly better. This makes "the map is gone" structurally
       unreachable from any viewport change, rather than fixed one cause at a
       time. */
    if(map.getBounds().intersects(BB)) return;
  }
  // animate:false because this is a layout correction, not a journey. An
  // animated refit during a rotation is a camera moving under somebody's thumb,
  // and it also leaves the map in an intermediate state that nothing can assert
  // against.
  map.fitBounds(BB, {paddingTopLeft:[c.left, c.top], paddingBottomRight:[c.right, c.bot],
                     animate:false});
}
/* sizeBackdrop() lived here. It stretched a blurred copy of the base image to
   cover whatever the viewport could reach at the zoom floor, because one finite
   image cannot fill a viewport it does not span. Tiles can, so the whole
   function and the layer it managed are gone. */

map.setView(BB.getCenter(), 14);
fitCoast();

/* ---------- notations ----------

   The whole-coast view used to be readable only by tapping: five coloured lines
   on imagery, and nothing on the picture said which beach was which or which way
   Puerto Viejo lay. Someone who scans a QR code on the sand has to place
   themselves before any status means anything, and "the orange one" is not a
   place.

   Deliberately few. This is a safety map, and every label is ink spent on top of
   the thing the reader actually needs to see. Beach names, the two towns that
   anchor the coast, the sea, and a scale bar so distances are judgeable rather
   than guessed. No roads, no businesses, no points of interest: Caribbean Guard's
   own sheet carries those and it is a different document for a different moment.

   Labels are not interactive. A label that swallows a tap is a label that stops
   somebody opening the zone underneath it. */
const labels = L.layerGroup().addTo(map);

function label(ll, text, cls){
  const w = Math.max(40, text.length * 7.6);
  return L.marker(ll, {
    interactive: false, keyboard: false, zIndexOffset: -200,
    icon: L.divIcon({className: "lbl " + cls, html: text,
                     iconSize: [w, 16], iconAnchor: [w / 2, 8]})
  }).addTo(labels);
}

const PLACES = [
  {ll: [9.65670, -82.75450], t: "Puerto Viejo"},
  {ll: [9.63167, -82.65721], t: "Manzanillo"}
];
const SEA = {ll: [9.67400, -82.72000], t: "Mar Caribe"};

// Zone names sit on z.at, the zone's own midpoint, which is on the waterline,
// so the label lands over water rather than over the beach it is naming. It is
// a datum on the record rather than a slice of z.line, so the names are on the
// picture before the traced geometry arrives.
const zoneLabels = ZONES.map(z => label(z.at, z.name.es, "zone"));
const unassessedLabels = UNASSESSED_BEACHES.map(b => label(b.at, b.name, "zone"));
// NOT `placeLabels`. CGGeom exports a FUNCTION of that name and this const
// would shadow it at exactly the point restyleLabels() wants to call it.
const placeMarks = PLACES.map(p => label(p.ll, p.t, "place"));
const seaLabel = label(SEA.ll, SEA.t, "sea");

/* Declared HERE, not in the stations block 200 lines below, and that is not
   tidiness. map.whenReady(restyleLabels) fires synchronously because the map is
   already ready by then, so restyleLabels runs long before the stations block
   is reached. Reading a const in its temporal dead zone throws, and `typeof`
   does not save you from that. A plain flag does. */
let postMarkers = {};
let clusterMarker = null;
let stationsReady = false;

/* ONE HEXAGON, OR FOUR.
   Caribbean Guard's four stations sit inside 1.1 km of Playa Chiquita. At the
   whole-coast view that is about 25 px, so four 32 px hexagons pile on top of
   each other and on the beach name underneath them, and a reader counts two
   pins where there are four. Below z15 they collapse to one badge carrying the
   COUNT; at z15 and above they are four numbered stations again.
   The badge reads "x4" rather than "4" on purpose: a bare 4 in the same
   hexagon that station 4 uses is the same mark meaning two different things,
   which is the failure this whole file is written against. */
const STATION_CLUSTER_ZOOM = 15;
function stationsClustered(){ return map.getZoom() < STATION_CLUSTER_ZOOM; }
function applyStationVisibility(){
  if(!stationsReady) return;
  const clustered = stationsClustered();
  Object.values(postMarkers).forEach(m=>{
    const e = m.getElement();
    if(e) e.style.display = clustered ? "none" : "";
  });
  const ce = clusterMarker && clusterMarker.getElement();
  if(ce) ce.style.display = clustered ? "" : "none";
}

/* The station marks are OBSTACLES to the labels and never the other way round.
   CGGeom.placeLabels resolves label against label and hides the loser; it
   cannot be handed the markers, because it hides anything that clashes with a
   box already taken and two overlapping stations would silently lose one. A
   hidden hazard mark is a different and much worse defect than a hidden place
   name, so this pass only ever hides labels. */
const OBSTACLE_PAD = 4;
function stationBoxes(){
  const out = [];
  const add = m => {
    const e = m && m.getElement();
    if(!e || e.style.display === "none") return;
    const r = e.getBoundingClientRect();
    if(r.width) out.push(r);
  };
  Object.values(postMarkers).forEach(add);
  add(clusterMarker);
  return out;
}
function hideLabelsUnderStations(){
  const boxes = stationBoxes();
  if(!boxes.length) return;
  [...zoneLabels, ...unassessedLabels, ...placeMarks, seaLabel].forEach(m=>{
    const e = m.getElement();
    if(!e || e.style.display === "none") return;
    const r = e.getBoundingClientRect();
    const hit = boxes.some(b =>
      r.left < b.right + OBSTACLE_PAD && r.right  > b.left - OBSTACLE_PAD &&
      r.top  < b.bottom + OBSTACLE_PAD && r.bottom > b.top  - OBSTACLE_PAD);
    if(hit) e.style.display = "none";
  });
}

/* What shows depends on zoom, because the same label set is clutter at one scale
   and too sparse at another. The sea label only earns its place while enough sea
   is visible to need naming; the beach names drop out once you are inside a
   single beach and the card already says where you are. */
function restyleLabels(){
  const z = map.getZoom();
  const zones  = z >= 11.5 && z < 16.5;
  const places = z >= 12.5;
  const sea    = z <= 14.5;
  /* The zoom rules above are this file's ruling and CGGeom.placeLabels never
     overturns them: `visible:false` stays hidden. What it adds is collision, in
     screen rectangles rather than in metres, because the labels are DOM
     elements of different lengths and the thing that must not overlap is the
     ink. "PUERTO VIEJOPlaya Cocles" ran together on the landing view and the
     station pins sat on top of "Playa Chiquita" (hat 5, finding 12).
     Zone names outrank town names: a town the reader cannot see named is still
     a town they can see, and the beach name is what the whole map is for. */
  // Stations first, so their boxes are current when the labels are measured
  // against them. Idempotent, so calling it from both places costs nothing.
  applyStationVisibility();
  CGGeom.placeLabels(map, [
    ...zoneLabels.map(m  => ({marker:m, priority:10, visible:zones})),
    ...unassessedLabels.map(m => ({marker:m, priority:9, visible:zones})),
    ...placeMarks.map((m,i) => ({marker:m, priority:1,
      visible:places && !(zones && (PLACES[i].t === "Puerto Viejo" || PLACES[i].t === "Manzanillo"))})),
    {marker:seaLabel, priority:5, visible:sea}
  ]);
  hideLabelsUnderStations();
}
map.on("zoomend", restyleLabels);
map.whenReady(restyleLabels);

/* Distances on a 16.6 km strip are not guessable from imagery alone, and "swim
   parallel to the beach" is advice that needs a sense of how far that is. */
// Leaflet computes metres from the actual projection and zoom. A segmented,
// horizontal ruler provides the familiar distance reference over imagery.
L.control.scale({metric: true, imperial: false, position: "bottomleft",
                 maxWidth: 160, updateWhenIdle:false}).addTo(map);

/* Refit on anything that changes the viewport, debounced.

   `resize` alone is not enough coverage. iOS Safari fires `orientationchange`
   and then reports the OLD innerHeight for a frame or two, so a refit scheduled
   off that event measures the pre-rotation viewport and lands wrong; hence the
   trailing second pass. `visualViewport` covers the on-screen keyboard and the
   collapsing address bar, which resize does not reliably report on mobile.

   ROTATION IS NOT DEBOUNCED, and that is the point.

   A drag-resize on a desktop fires continuously and the intermediate sizes are
   meaningless, so it waits. A rotation is one discrete event whose intermediate
   size is the OLD one, and every millisecond spent waiting is a millisecond the
   coast is drawn at the previous orientation's width. Measured at a 150 ms
   debounce: 120 ms after rotating to landscape the strip was still 442 px wide in
   an 846 px viewport, reaching its correct 744 px only by 300 ms. Nobody rotates
   this map to recentre it; they rotate it to get more coast, so the thing they
   asked for must not be the thing that lags. */
let refitTimer = null, refitTrailing = null, rotateUntil = 0;
function runRefit(){
  measureDock(false);   // update --dock-h, do not let it fit as well
  fitCoast({keepView:true});
}
function refit(delay){
  // A rotation also emits `resize`, in either order and sometimes twice. While
  // a rotation is in flight every viewport event belongs to it, so none of them
  // may reintroduce the delay.
  clearTimeout(refitTimer);
  refitTimer = setTimeout(runRefit, Date.now() < rotateUntil ? 0 : delay);
}
window.addEventListener("resize", ()=>refit(150));
window.addEventListener("orientationchange", ()=>{
  rotateUntil = Date.now() + 800;
  refit(0);
  // iOS Safari reports the old innerHeight for a frame or two after this event,
  // so the immediate pass can land on stale metrics. Run again once it settles.
  clearTimeout(refitTrailing);
  refitTrailing = setTimeout(runRefit, 500);
});
if(window.visualViewport) window.visualViewport.addEventListener("resize", ()=>refit(150));

/* Watch the CONTAINER, not only the window, and this is the one that closes the
   load-during-resize case.

   The opening fit runs inline at parse time, against whatever the container
   measured at that instant. If the window is still being resized while the page
   is coming up, that measurement is of a viewport that no longer exists by the
   time anything is painted, and no `resize` event necessarily follows, because
   the resize was already in progress before any listener was attached. The map
   then sits at the wrong scale and offset until a reload: measured in a real
   Chrome window, the base landed at y=1278 in a 932 tall viewport, showing only
   the blurred backdrop.

   That is not a hypothetical. Rotating a phone while the page is still loading
   on weak signal is exactly the case, and weak signal is the condition this map
   is built for.

   A ResizeObserver reports the container's box whenever it changes, including
   changes that happened before it was attached, so the first callback is itself
   the correction. It also covers the mobile address bar collapsing, which
   `resize` reports inconsistently. It cannot loop: `#map` is `position:absolute;
   inset:0`, so fitting the map never changes the container's size. */
if(window.ResizeObserver){
  let seenFirst = false;
  new ResizeObserver(()=>{
    // The first callback fires on observe with the current box. Take it
    // immediately rather than debounced, because during load it IS the fix.
    refit(seenFirst ? 150 : 0);
    seenFirst = true;
  }).observe(document.getElementById("map"));
}
// Belt and braces for browsers without ResizeObserver, and for a viewport that
// settles after the document finishes loading.
window.addEventListener("load", ()=>refit(0));

/* Pattern and weight carry the tier independently of colour, so the map still
   works in sunlight, on a cheap screen, and for the 1 in 12 men who cannot
   separate red from green.

   The table, the ground-width solve and the dash ratios all moved to
   geometry.js, because the card swatch and the map stroke must be the same
   numbers and they were two copies of them. `CGGeom.TIERS` is the reference
   weight and dash per tier; `CGGeom.zoneStroke(tier, zoom)` is what the map
   draws at a given zoom.

   The polarity is deliberate and it is the reverse of what this file used to
   do. It previously drew the worst tier as a fine dotted line and the best as a
   solid one, which made the most dangerous thing on the map the faintest mark
   on it. Every convention a tourist already carries, road markings, hazard
   tape, warning signage, says the loud mark is the dangerous one. So high is
   the heaviest and most solid, and low is the lightest.

   These three carry the CHARACTER, which is a property of the place. A bulletin
   a guard signed this morning is a property of the moment, so it never
   recolours these: it draws its own halo underneath. See todayHalo().

   WHAT CHANGED AT THE LANDING ZOOM, and it is hat 4's fourth blocker. The old
   code scaled each dash COMPONENT by one factor, so at z12 low's "2 8" floored
   to "2 2": 1:4 became 1:1 and all three textures converged at exactly the zoom
   a deuteranope first looks at. The ratio is now fixed per tier and only the
   gap has a floor, measured from the gap that is still VISIBLE after round caps
   eat half a weight at each end. */

let zonesReady = false;

/* The dimming of the zones you did NOT ask about.
   cgSetStyle() handles weight, dash and halo weight but deliberately not
   opacity, because opacity is not a property of the stroke vocabulary. So it is
   applied over the top, after the weights, and it reaches the halo too. Only a
   beach with a bulletin signed today has a halo, and dimming a beach nobody is
   looking at is the intent in both cases. */
function dimGroup(g, op){
  g.eachLayer(l=>{ if(l.setStyle) l.setStyle({opacity:op}); });
}

function restyleZones(){
  // fitCoast() emits zoomend during startup, before the zone layers exist.
  // `typeof layers === "undefined"` does NOT guard this: typeof still throws on
  // a const in the temporal dead zone. An ordinary flag does.
  if(!zonesReady) return;
  const z0 = map.getZoom();
  ZONES.forEach(z=>{
    const g = layers[z.id]; if(!g) return;
    const st = CGGeom.zoneStroke(tierOf(z), z0);
    const halo = todayHalo(z);
    g.cgSetStyle({
      weight: st.weight * (g.cgCurrent ? 1.25 : 1),
      dashArray: st.dashArray,
      halo: halo ? {color: halo, weight: st.halo} : null
    });
    dimGroup(g, g.cgCurrent === false && anyCurrent ? .55 : 1);
  });
}
let anyCurrent = false;

/* ---------- draw zones ----------
   Runs when data/zones-geometry.json lands, not at parse time. The cards do not
   wait for it: they are static HTML and they are the thing somebody standing on
   the sand needs first. The lines are the thing that needs to be right. */
const layers = {};
function drawZones(){
  ZONES.forEach(z=>{
    if(!z.line.length || layers[z.id]) return;
    const st = CGGeom.zoneStroke(tierOf(z), map.getZoom());

    /* A bulletin signed today draws UNDER the character stroke, never over it
       and never instead of it. If a guard signs "stay out today" at Punta Uva
       the map has to shout, but recolouring the line would erase the standing
       character the moment somebody signed one calm morning, which is the exact
       conflation the two-axis split exists to undo. A halo is additive: both
       claims stay legible and the character stroke stays on top. */
    const halo = todayHalo(z);

    /* No casing, and now no blunt ends either. The stroke tapers to 40% over
       its last 40 m at each end, so a zone stops rather than being cut off, and
       the halo tapers with it: a full-width halo under a tapering line puts the
       blunt end straight back. */
    const g = CGGeom.taperedPolyline(z.line, {
      color: COLOR[tierOf(z)],
      weight: st.weight,
      dashArray: st.dashArray,
      halo: halo ? {color: halo, weight: st.halo, opacity:.5} : null
    }, map).addTo(map);

    // Our own hit line, separate and invisible. Everything taperedPolyline
    // draws is interactive:false, so it cannot swallow a tap meant for this.
    L.polyline(z.line,{color:"#000",weight:44,opacity:0})
      .addTo(map).on("click",()=>openZone(z));
    layers[z.id] = g;
  });
  zonesReady = true;
  restyleZones();
  /* A QR deep link opens the sheet about 350 ms before this fetch resolves, so
     the band asked for back then had no line to be drawn from. It does now. */
  if(bandZone) showBand(bandZone);
}
map.on("zoomend", restyleZones);

/* The traced coastline. Five zones, 160 to 917 points each, against the 7 to 60
   they replace. It is in the service worker's critical precache, so after the
   first visit this resolves from disk with no signal. */
const geomReady = fetch("data/zones-geometry.json")
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(g => {
    ZONES.forEach(z=>{
      const pts = g.zones && g.zones[z.id];
      if(pts && pts.length) z.line = pts;
      else console.warn("[cg] no geometry for", z.id);
    });
    drawZones();
    restyleLabels();
  })
  .catch(err => {
    console.warn("[cg] zone geometry did not load:", err);
    /* SAY SO. The cards, their instructions and their provenance chips are all
       still on screen and all still true, because they are static HTML and do
       not depend on this fetch. The map is the part that is now lying: a coast
       with no strokes on it is indistinguishable from a coast with no hazards,
       and "absence rendered as nothing" is the precise misreading the whole
       absence vocabulary in this file exists to prevent.
       role="alert" and no timeout: this is not a notice that expires, it is the
       state the map is in until it is reloaded with signal. */
    say(T[lang].geomFailed, 60000);
  });

/* ORANGE HEXAGONS, not blue circles.
   Caribbean Guard's own annotated V5 sheet, the one already printed on a sign
   this map's readers walk past, draws a rescue station as an orange hexagon.
   This file had turned them into blue numbered circles, which hat 5 named as
   the map having stopped being theirs, and hat 1 as four marks meaning nothing
   until tapped. The shape and the colour are both theirs. See .po. */
POSTS.forEach(p=>{
  const icon = L.divIcon({className:"", html:`<div class="station-marker ${p.proposed?'planned':''}">${CGSymbols.badge(p.proposed?'proposed_rescue_station':'rescue_station')}<span class="number">${p.n}</span></div>`,
    iconSize:[40,40], iconAnchor:[20,20]});
  postMarkers[p.id] = L.marker(p.ll,{icon, keyboard:true,
    alt:`${T[lang].legendStation} ${p.n}`}).addTo(map).on("click",()=>openPost(p));
});

/* The collapsed badge. Its position is the centroid of the real stations, so it
   is recomputed whenever joinStations() moves one onto the authoritative
   geometry. Tapping it zooms to the four rather than opening a sheet: the
   question a reader has at the overview is "what are those", and the answer is
   four separate stations, which is a thing to SHOW rather than to describe. */
function stationCentroid(){
  const n = POSTS.length;
  return [POSTS.reduce((s,p)=>s+p.ll[0],0)/n, POSTS.reduce((s,p)=>s+p.ll[1],0)/n];
}
function buildCluster(){
  if(clusterMarker) map.removeLayer(clusterMarker);
  const icon = L.divIcon({className:"", iconSize:[40,40], iconAnchor:[20,20],
    html:`<div class="station-marker">${CGSymbols.badge('rescue_station')}<span class="number">${POSTS.length}</span></div>`});
  clusterMarker = L.marker(stationCentroid(), {icon, keyboard:true,
    alt:`${POSTS.length} ${T[lang].legendStation}`})
    .addTo(map)
    /* A fixed zoom, not a fit to the four stations' bounds. Fitting their
       1.1 km span into a 390 px phone with the sheet open landed at z14.25,
       which is still below STATION_CLUSTER_ZOOM, so tapping the badge left the
       badge on screen and nothing appeared to happen. The badge's entire job is
       to expand, so it flies to a zoom that is guaranteed to expand it.
       Through flyClear rather than flyTo, so the stations do not land under the
       sheet that is already open. */
    .on("click", ()=>flyClear(L.latLngBounds([stationCentroid()]).pad(0.002),
                              {maxZoom:15.75, duration:.6}));
}
buildCluster();
stationsReady = true;
map.on("zoomend", restyleLabels);   // stations and labels settle together
restyleLabels();

/* Move the markers onto the authoritative geometry once it arrives, and say so
   if the inline fallback had drifted. Silent preference for one of two copies is
   how the duplicate went unnoticed for as long as it did. */
function joinStations(gj){
  gj.features.forEach(f=>{
    if(f.properties.kind !== "rescue_station") return;
    const p = POSTS.find(x=>x.id === f.id);
    if(!p){ console.warn("[cg] station in the data with no copy here:", f.id); return; }
    const ll = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    const drift = map.distance(p.ll, ll);
    if(drift > 1) console.warn(`[cg] ${f.id}: fallback is ${drift.toFixed(1)} m from the data. Update the ll in POSTS.`);
    p.ll = ll;
    postMarkers[p.id].setLatLng(ll);
  });
  const missing = POSTS.filter(p=>!gj.features.some(f=>f.id === p.id));
  if(missing.length) console.warn("[cg] stations with no record in the data:", missing.map(p=>p.id));
  // The badge sits on their centroid, so it moves when they do.
  buildCluster();
  restyleLabels();
}

/* ---------- bottom sheet: three stops, and a real dialog ----------

   THE STOPS. PEEK is the opening state: the name, the instruction, who has
   reviewed it and today's line, all above the fold with nothing to scroll.
   HALF is for the why and the facts. FULL is for the deferral and the actions.
   The old sheet had one height, 74vh, and opened with the empty TODAY block
   filling its top 40%, which is how hat 1 came to close it before reaching the
   red instruction underneath.

   THE ACCESSIBILITY. Four separate defects from hat 4, fixed together because
   they are one object:
     - closing only translated the panel off-screen, so TalkBack kept swiping
       into "Cerrar, botón" on a panel that was not visible. Closed is now
       `hidden` and `inert`.
     - the dialog had no accessible name. It is now labelled by its own h2.
     - opening never moved focus, so a screen reader said nothing at all. Focus
       now lands on the heading, and returns to whatever opened the sheet.
     - Escape did nothing. It closes.

   THE LANGUAGE SWITCH. setLang used to end with sheet.classList.remove("open"),
   so tapping ES while reading the English Cocles panel threw the verdict away.
   Every opener now records how to render itself again, and setLang replays it
   in place. See `lastRender`. */
/* ---------- PHONE PANELS: ONE GESTURE MODEL FOR THE DOCK AND THE SHEET ----------
   Rebuilt 2026-09-23 for how this map is actually held: one hand, one thumb,
   often wet, in sun. Four decisions carry it.

   1. THE PANEL MOVES BY TRANSFORM, NEVER BY HEIGHT. Both panels are laid out
      once at full height and slid with translate3d, which the compositor moves
      without laying out the page. Animating `height` re-laid out the dock, its
      list and the map controls on every frame; on a budget Android that is the
      difference between following the thumb and trailing it.
   2. THE WHOLE PANEL IS THE GRAB AREA. The 88 x 28 handle was the only place a
      drag started. Now the handle, the title, the forecast and the list all
      move the panel, the way Apple Maps and Google Maps sheets behave: below
      its top stop, dragging anywhere resizes; at the top stop the list scrolls,
      and pulling down from its first row lowers the panel again.
   3. RELEASE CARRIES THE FINGER'S SPEED. The stop is chosen from where the
      flick would have come to rest, not where the finger lifted, and the panel
      settles on a spring that starts at the finger's velocity. A spring that
      starts from rest is the stall people feel as "not smooth".
   4. PAST THE ENDS IT RESISTS RATHER THAN STOPS. Rubber banding tells a thumb
      it reached an edge without a dead stop.

   Tap targets are unchanged: the handle is still a button (Enter, Space and a
   tap toggle it) and a tap anywhere else still selects what it lands on. A
   drag never also clicks. Reduced motion moves straight to the stop. Desktop
   (>= 820 px) never runs any of this; both panels are columns there. */
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const topbarH = () => document.querySelector(".topbar")?.offsetHeight || 64;
// The home-indicator inset, read off a probe: env() inside a custom property
// is not resolved to pixels by getComputedStyle in every engine.
const safeProbe = Object.assign(document.createElement("div"), {ariaHidden:"true"});
safeProbe.style.cssText = "position:fixed;left:0;bottom:0;width:0;visibility:hidden;pointer-events:none;height:env(safe-area-inset-bottom,0px)";
document.body.appendChild(safeProbe);
const safeBottom = () => safeProbe.offsetHeight || 0;

function createPanel(el, o){
  const P = {el, stop:o.initial, y:0, full:0, anim:0, dragging:false, stops:{}};
  const rubber = (over, dim) => (over * dim * 0.55) / (dim + over * 0.55);

  P.measure = ()=>{
    // One full height for every stop; the stops are how much of it shows.
    P.full = Math.max(0, window.innerHeight - topbarH());
    el.style.height = P.full + "px";
    // Read once here, never per frame: the detents read layout, and a layout
    // read inside a gesture forces a reflow on every move (measured: 110 ms
    // of forced reflow in one drag at 6x CPU before this cache).
    P.stops = o.detents();
  };
  P.visibleOf = stop => Math.min(P.full, Math.round(P.stops[stop] || 0));
  P.yOf = stop => P.full - P.visibleOf(stop);
  P.visible = () => Math.max(0, P.full - P.y);
  P.render = y => {
    P.y = y;
    // A close that was still sliding when the window crossed 820 px must not
    // leave a phone transform on what is now a desktop column.
    if(desktop()){ el.style.transform = ""; return; }
    el.style.transform = `translate3d(0,${y.toFixed(2)}px,0)`;
    o.onMove && o.onMove(P.visible());
  };
  P.stopAnim = () => { cancelAnimationFrame(P.anim); P.anim = 0; el.classList.remove("settling"); };

  /* A damped spring, integrated in fixed 4 ms steps so it behaves the same at
     60 and 120 Hz. Response 0.34 s and damping 0.86: a soft landing with a
     barely visible overshoot after a hard flick, and none after a slow drag. */
  P.animateTo = (stop, v0 = 0, done) => {
    P.stopAnim();
    const target = stop === "closed" ? P.full : P.yOf(stop);
    if(reducedMotion.matches || !P.full){ P.render(target); done && done(); return; }
    const k = Math.pow(2 * Math.PI / 0.34, 2), c = 2 * 0.86 * Math.sqrt(k);
    let x = P.y, v = v0 * 1000, last = performance.now();
    el.classList.add("settling");
    const step = now => {
      let dt = Math.min(0.064, (now - last) / 1000); last = now;
      while(dt > 0){
        const h = Math.min(dt, 0.004);
        v += (-k * (x - target) - c * v) * h;
        x += v * h; dt -= h;
      }
      // Leaving needs no settling: once it is off the screen it is done.
      if((stop === "closed" && x >= target - 1) || (Math.abs(x - target) < 0.4 && Math.abs(v) < 12)){
        P.render(target); P.anim = 0; el.classList.remove("settling"); done && done(); return;
      }
      P.render(x);
      P.anim = requestAnimationFrame(step);
    };
    P.anim = requestAnimationFrame(step);
  };
  P.settle = (stop, v0 = 0) => {
    P.stop = stop;
    o.onStop && o.onStop(stop);
    P.animateTo(stop, v0, () => o.onSettle && o.onSettle(stop));
  };
  // "Partial" is geometry, not a name: on a short phone PEEK and REST clamp to
  // the full height, and a panel at the top must let its content scroll.
  P.isPartial = stop => P.visibleOf(stop) < P.visibleOf(o.topStop) - 1;
  P.snap = stop => { P.stopAnim(); P.stop = stop; o.onStop && o.onStop(stop);
    P.render(P.yOf(stop)); o.onSettle && o.onSettle(stop); };

  /* ---- the gesture ---- */
  let startY = 0, startX = 0, startPanelY = 0, mode = null, scroller = null,
      samples = [], suppressClick = false, touchId = null;
  const SLOP = 6;
  const atTop = () => P.y <= P.yOf(o.topStop) + 1;
  const scrollerOf = t => {
    const s = t && t.closest && t.closest(o.scroller);
    return s && el.contains(s) ? s : null;
  };
  function begin(x, y, target){
    if(desktop() || !o.enabled()) return false;
    P.stopAnim();
    if(!P.full) P.measure();
    startX = x; startY = y; startPanelY = P.y; mode = "pending";
    scroller = scrollerOf(target);
    samples = [{y, t:performance.now()}];
    return true;
  }
  // Returns true when the panel took the movement and the page must not scroll.
  function move(x, y){
    if(!mode || mode === "scroll" || mode === "ignore") return false;
    const dy = y - startY, dx = x - startX;
    if(mode === "pending"){
      if(Math.abs(dy) < SLOP && Math.abs(dx) < SLOP) return !scroller || !atTop();
      if(Math.abs(dx) > Math.abs(dy) * 1.2){ mode = "ignore"; return false; }
      // At the top stop a list owns vertical movement, except a pull down from
      // its first row, which is the panel's.
      if(scroller && atTop() && !(dy > 0 && scroller.scrollTop <= 0)){ mode = "scroll"; return false; }
      mode = "drag"; P.dragging = true; el.classList.add("dragging");
      // A mouse drag otherwise selects the text it passes over, and a live
      // selection turns the next drag into a native text drag-and-drop.
      document.body.classList.add("panel-dragging");
      try{ window.getSelection().removeAllRanges(); }catch(_){}
      startY = y; startPanelY = P.y;          // no jump of SLOP px on pickup
    }
    const now = performance.now();
    samples.push({y, t:now});
    while(samples.length > 2 && now - samples[0].t > 90) samples.shift();
    const lo = P.yOf(o.topStop), hi = o.canClose ? P.full : P.yOf(o.bottomStop);
    let ny = startPanelY + (y - startY);
    if(ny < lo) ny = lo - rubber(lo - ny, P.full);
    if(ny > hi) ny = hi + rubber(ny - hi, 180);
    P.render(ny);
    return true;
  }
  function end(cancelled){
    const was = mode; mode = null;
    if(was !== "drag") return;
    P.dragging = false; el.classList.remove("dragging");
    document.body.classList.remove("panel-dragging");
    suppressClick = true; setTimeout(()=>{ suppressClick = false; }, 60);
    const a = samples[0], b = samples[samples.length - 1];
    const v = cancelled || !a || b.t === a.t ? 0 : (b.y - a.y) / (b.t - a.t);   // px/ms, + is down
    // Where the flick would have stopped: 0.2 s of travel at release speed.
    const projected = P.y + v * 200;
    const stops = o.stops().filter(s => s !== "closed" || o.canClose);
    let best = P.stop, bestD = Infinity;
    stops.forEach(s => {
      const d = Math.abs((s === "closed" ? P.full : P.yOf(s)) - projected);
      if(d < bestD){ bestD = d; best = s; }
    });
    if(best === "closed"){ o.onClose(v); return; }
    P.settle(best, v);
  }

  // Touch: listened to directly, non-passive, because a drag has to be able to
  // stop the page (and Android's pull to refresh) from moving underneath it.
  el.addEventListener("touchstart", e => {
    if(e.touches.length !== 1){ if(mode === "drag") end(true); mode = null; return; }
    const t = e.touches[0];
    if(begin(t.clientX, t.clientY, e.target)) touchId = t.identifier;
  }, {passive:true});
  el.addEventListener("touchmove", e => {
    const t = [...e.changedTouches].find(x => x.identifier === touchId);
    if(!t) return;
    if(move(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
  }, {passive:false});
  el.addEventListener("touchend", e => {
    if([...e.changedTouches].some(x => x.identifier === touchId)){ touchId = null; end(false); }
  });
  el.addEventListener("touchcancel", () => { touchId = null; end(true); });

  // Mouse and pen, so the same panel works in a narrow desktop window.
  el.addEventListener("pointerdown", e => {
    if(e.pointerType === "touch" || e.button !== 0) return;
    if(!begin(e.clientX, e.clientY, e.target)) return;
    const mv = ev => { if(move(ev.clientX, ev.clientY)) ev.preventDefault(); };
    const up = ev => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      end(ev.type === "pointercancel");
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });
  el.addEventListener("dragstart", e => { if(mode) e.preventDefault(); });
  // A drag that ends over a button must not also press it.
  el.addEventListener("click", e => {
    if(suppressClick){ suppressClick = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
  // Keyboard focus that lands below the visible part of the panel raises it.
  el.addEventListener("focusin", e => {
    if(desktop() || !o.enabled() || P.stop === o.topStop || e.target === el || P.anim || P.dragging) return;
    // Keyboard only. Opening a sheet focuses its heading while it is still
    // below the screen, and that must not read as a request to raise it.
    if(e.target.id === "sheet-title" || !e.target.matches(":focus-visible")) return;
    const r = e.target.getBoundingClientRect();
    if(r.bottom > window.innerHeight - safeBottom() - 4) P.settle(o.topStop);
  });
  return P;
}

/* Map controls ride on whichever panel is in front, by transform while it
   moves, and by --dock-h once it rests, so the fab, the compass and the scale
   never re-lay out mid gesture. */
let controlsBase = 0;
function placeControls(visible, settled){
  const shift = settled ? 0 : controlsBase - visible;
  if(settled){
    controlsBase = visible;
    document.documentElement.style.setProperty("--dock-h", Math.round(visible) + "px");
  }
  const tf = shift ? `translate3d(0,${shift.toFixed(2)}px,0)` : "";
  document.querySelectorAll(".fab,.compass,.leaflet-bottom.leaflet-left").forEach(n => { n.style.transform = tf; });
}

const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheet-body");
const dockEl = document.getElementById("dock");
let lastRender = null;    // () => void, replays the open sheet in the new language
let lastFocus = null;     // what to give focus back to on close
let sheetTimer = null;
let dockStop = "rest";

const dockPanel = createPanel(dockEl, {
  initial:"rest", topStop:"full", bottomStop:"min", canClose:false,
  scroller:".strip",
  enabled:() => !sheet.classList.contains("open") && !document.body.classList.contains("legend-mode"),
  detents:() => {
    const H = window.innerHeight, full = H - topbarH();
    return {
      min: 64 + safeBottom(),
      rest: Math.max(280, Math.min(full - 120, H * 0.44)),
      full
    };
  },
  stops:() => ["min", "rest", "full"],
  onMove:v => { if(!sheet.classList.contains("open")) placeControls(v, false); },
  onStop:s => setDockStop(s, true),
  onSettle:() => { if(!sheet.classList.contains("open")) placeControls(dockPanel.visible(), true); measureDock(); }
});

const sheetPanel = createPanel(sheet, {
  initial:"peek", topStop:"full", bottomStop:"peek", canClose:true,
  scroller:".sheet-body",
  enabled:() => sheet.classList.contains("open"),
  detents:() => {
    const H = window.innerHeight;
    const small = H < 650;
    return {peek: small ? H - topbarH() : Math.max(300, H * 0.5), full: H - topbarH()};
  },
  stops:() => ["closed", "peek", "full"],
  onMove:v => placeControls(v, false),
  onStop:s => sheetStop(s, true),
  onSettle:() => placeControls(sheetPanel.visible(), true),
  onClose:v => closeSheet({velocity:v})
});

function sheetStop(stop, fromGesture = false){
  if(stop === "half") stop = "full";      // one reading stop; the legend asks for it
  sheet.dataset.stop = stop;
  sheet.classList.toggle("is-partial", !desktop() && sheetPanel.isPartial(stop));
  const expanded = stop !== "peek";
  const handle = document.getElementById("sheet-expand");
  handle.setAttribute("aria-expanded", expanded);
  handle.setAttribute("aria-label", lang === "es"
    ? (expanded ? "Bajar detalles de playa" : "Subir detalles de playa")
    : (expanded ? "Lower beach details" : "Raise beach details"));
  handle.textContent = "";
  if(!fromGesture && !desktop() && sheet.classList.contains("open") && sheetPanel.stop !== stop){
    sheetPanel.settle(stop);
  }
  sheetPanel.stop = stop;                 // one record of the stop at every width
}

function openSheet(html, render){
  if(!desktop() && legendExpanded){ legendExpanded = false; renderLegendPerm(); }
  lastRender = render || null;
  const active = document.activeElement;
  if(sheetClosing){            // reopened while the last one was still leaving
    sheetClosing = false;
    sheetPanel.stopAnim();
    sheet.classList.remove("open");
  }
  const reopening = sheet.classList.contains("open");
  // No entry before the first tap: Chrome's history intervention lets Back
  // skip entries pushed without a user gesture, which on a QR deep link would
  // skip the map and leave. Without activation it keeps the single entry.
  const activated = !navigator.userActivation || navigator.userActivation.hasBeenActive;
  if(activated && !reopening && !restoringHistory && !pendingBack && !(history.state && history.state.cgSheet)){
    history.pushState({cgSheet:true}, "", location.pathname);
  }
  // Every sheet starts with no address; openers that have one set it after.
  sheetAddress("");
  if(!reopening) lastFocus = (active && active !== document.body) ? active : null;
  sheetBody.innerHTML = html;
  sheetBody.scrollTop = 0;
  clearTimeout(sheetTimer);
  sheet.hidden = false;
  sheet.removeAttribute("inert");
  sheet.classList.add("open");
  document.body.classList.add("selection-open");
  dockEl.setAttribute("inert", "");
  if(!desktop()){
    sheetPanel.measure();
    if(!reopening){
      sheetStop("peek", true);
      sheetPanel.stop = "peek";
      sheetPanel.render(sheetPanel.full);        // start below the screen
      placeControls(0, true);
      sheetPanel.settle("peek");
    }
  }else if(!reopening){
    sheetStop("peek", true);
    // A reflow between un-hiding and adding .open, or the browser collapses the
    // two style changes into one frame and the slide-in never animates.
    sheet.classList.remove("open"); void sheet.offsetHeight; sheet.classList.add("open");
  }
  const h2 = document.getElementById("sheet-title");
  if(h2 && !reopening) h2.focus({preventScroll:true});
}

/* BACK CLOSES THE SHEET. Every opener used to replaceState, so on Android the
   system Back button, and the iPhone edge swipe, left the map entirely from an
   open beach. Opening a sheet from the map now pushes ONE entry, and anything
   opened on top of it rewrites that entry, so Back always returns to the map in
   one step and Forward reopens the same beach. The close button pops the same
   entry, so the two are one action and the stack never grows. A QR deep link
   lands on the map first (see the loader at the end of the file) for the same
   reason: Back from a scanned beach shows the coast, not the camera app. */
let restoringHistory = false, sheetClosing = false;
/* history.back() is asynchronous. A sheet opened before it lands must not push
   its entry yet, or the traversal pops the new entry instead of the old one;
   it waits for the popstate and pushes then. sheetQuery is the address the
   open sheet should have, kept for exactly that moment. */
let pendingBack = false, sheetQuery = "";
function sheetAddress(query){
  sheetQuery = query;
  if(!pendingBack) history.replaceState(history.state, "", location.pathname + (query ? "?" + query : ""));
}
window.addEventListener("popstate", e => {
  if(pendingBack){
    pendingBack = false;
    if(sheet.classList.contains("open") && !sheetClosing){
      history.pushState({cgSheet:true}, "", location.pathname + (sheetQuery ? "?" + sheetQuery : ""));
    }
    return;
  }
  if(!(e.state && e.state.cgSheet)){
    if(sheet.classList.contains("open")) closeSheet({fromHistory:true});
    return;
  }
  const q = new URLSearchParams(location.search);
  const z = ZONES.find(x => localId(x.id) === q.get("z"));
  const b = UNASSESSED_BEACHES.find(x => localId(x.id) === q.get("b"));
  const p = POSTS.find(x => localId(x.id) === q.get("p"));
  restoringHistory = true;
  try{
    if(z) openZone(z); else if(b) openUnassessedBeach(b); else if(p) openPost(p);
    // A sheet with no address (legend, saved copy) cannot be rebuilt from a URL.
    // Stepping back out keeps the stack free of a dead copy of the map.
    else history.back();
  }finally{ restoringHistory = false; }
});

function closeSheet(opts = {}){
  clearBand();
  if(!sheet.classList.contains("open") || sheetClosing) return;
  // Leaving through the UI pops our own history entry; the popstate that
  // follows finds sheetClosing set and does nothing.
  if(!opts.fromHistory){
    if(pendingBack){ /* already on its way back */ }
    else if(history.state && history.state.cgSheet){ pendingBack = true; history.back(); }
    else history.replaceState(null, "", location.pathname);
  }
  sheetClosing = true;
  lastRender = null;
  clearTimeout(sheetTimer);
  const finish = () => {
    if(!sheetClosing) return;           // a new sheet took over mid-slide
    sheetClosing = false;
    sheet.classList.remove("open");
    document.body.classList.remove("selection-open");
    dockEl.removeAttribute("inert");
    sheet.hidden = true;
    sheet.setAttribute("inert", "");
    if(!desktop()) placeControls(dockPanel.visible(), true);
  };
  if(!desktop()){
    // The dock comes back up under the sheet as it leaves, and it has to be
    // focusable now: focus returns to a card below, before the slide ends.
    document.body.classList.remove("selection-open");
    dockEl.removeAttribute("inert");
    placeControls(sheetPanel.visible(), false);
    sheetPanel.animateTo("closed", opts.velocity || 0, finish);
  }else{
    sheetClosing = false;
    sheet.classList.remove("open");
    document.body.classList.remove("selection-open");
    dockEl.removeAttribute("inert");
    // Wait out the slide before removing it from the tree, so the animation is
    // seen; `hidden` is display:none and would cut it off mid-flight.
    sheetTimer = setTimeout(()=>{ sheet.hidden = true; sheet.setAttribute("inert", ""); },
      reducedMotion.matches ? 0 : 340);
  }
  const returnTo = lastFocus && document.contains(lastFocus) ? lastFocus
    : document.querySelector('.card[aria-current="true"]') || document.querySelector('.card');
  if(returnTo) returnTo.focus({preventScroll:true});
  lastFocus = null;
  markCurrent(null);
  fitCoast();
}

document.getElementById("sheet-close").onclick = () => closeSheet();
document.getElementById("sheet-expand").onclick = ()=>{
  sheetStop(sheet.dataset.stop === "peek" ? "full" : "peek");
};

function setDockStop(stop, fromGesture = false){
  if(desktop()) return;
  dockStop = stop;
  document.body.classList.toggle("dock-min", stop === "min");
  document.body.classList.toggle("dock-full", stop === "full");
  document.body.classList.toggle("list-expanded", stop === "full");
  dockEl.classList.toggle("is-partial", dockPanel.isPartial(stop));
  document.getElementById("dock-handle").setAttribute("aria-expanded", stop !== "min");
  document.getElementById("list-toggle").setAttribute("aria-expanded", stop === "full");
  updateCoastalLabels();
  if(!fromGesture && dockPanel.stop !== stop) dockPanel.settle(stop);
}
document.getElementById("list-toggle").onclick = ()=>setDockStop(dockStop === "full" ? "rest" : "full");
document.getElementById("dock-handle").onclick = ()=>{
  setDockStop(dockStop === "rest" ? "min" : "rest");
};
// Tapping the title of a lowered panel raises it: at MIN the title is all
// there is to aim at, and it is the biggest target on that strip.
document.querySelector(".railhead").addEventListener("click", ()=>{
  if(!desktop() && dockStop === "min") setDockStop("rest");
});

/* Lay both panels out for the current viewport. Runs at load, on resize and on
   rotation, and on the way across the 820 px line in either direction. */
function layoutPanels(){
  if(desktop()){
    [dockEl, sheet].forEach(n => { n.style.transform = ""; n.style.height = ""; });
    placeControls(0, true);
    document.documentElement.style.removeProperty("--dock-h");
    return;
  }
  dockPanel.measure();
  dockPanel.snap(dockStop);
  if(sheet.classList.contains("open")){
    sheetPanel.measure();
    sheetStop(sheetPanel.stop, true);     // re-derive partial for the new height
    sheetPanel.render(sheetPanel.yOf(sheetPanel.stop));
    placeControls(sheetPanel.visible(), true);
  }
}
window.addEventListener("resize", () => requestAnimationFrame(layoutPanels));

document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
});
// The page itself never scrolls; only panels do. Belt and braces for engines
// without overflow:clip, where focus() or a find-in-page can still move it.
window.addEventListener("scroll", () => { if(window.scrollY || window.scrollX) window.scrollTo(0, 0); }, {passive:true});

/* The footer every sheet carries. Hat 5, finding 10: a safety instrument with
   no correction channel keeps a known error forever, and there was no contact
   address anywhere in 2,291 lines. The donate line AJ asked about is
   deliberately not here. */
const CG_MAIL = "caribbeanguard.pv@gmail.com";
const CG_HOME = "https://caribbeanguard.org";
/* The mailto carries a BODY as well as a subject, and that is the difference
   between a correction channel and a blank compose window. Hat 5's finding was
   that a safety instrument with no way to be told it is wrong keeps a known
   error forever; a reader who taps this and faces an empty message mostly
   closes it. The body says what we need: what is wrong, and which beach. */
function reportHref(subject){
  const t = T[lang];
  return `mailto:${CG_MAIL}?subject=${encodeURIComponent(subject)}` +
         `&body=${encodeURIComponent(t.reportIntro + "\n\n")}`;
}
function sheetFoot(){
  const t = T[lang];
  return `<p class="footlink"><a href="${CG_HOME}">${t.homeLink}</a></p>`;
}

/* ---- THE TRUST LINE ----
   ONE line, at the bottom, and it is the only thing on a beach sheet that is
   not an instruction.

   It replaces four separate blocks: the Autor / Revisado provenance row, the
   TODAY badge line, the "Sin revisar" box and the "Fuera del recorrido" box.
   All four said a version of the same thing, nobody has checked this, in four
   visual languages, and together they took more vertical space on the sheet
   than the instruction, the reason and the escape sentence combined. Daniel's
   ruling 2026-09-17: cut the sheet to what a lifeguard sign says, and keep one
   line carrying the honesty claim.

   IT STILL CARRIES t.defer WORD FOR WORD, and that is not negotiable. That
   sentence is the one that still works when this map is wrong, which is the
   reason the map is allowed to be published at all, and tools/check_copy.js
   fails the build if any sheet renderer drops it.

   The review state is bold and comes FIRST, because "nobody has checked this"
   qualifies everything above it and a qualifier after the fact is a footnote.
   When a beach is finally reviewed this line says who and when, in the same
   position, so the reader learns one place to look rather than two. */
function trustLine(z){
  const t = T[lang], c = characterState(z);
  let head;
  if(c.gap === "never")        head = t.trustNever;
  else if(c.gap === "expired") head = t.trustExpired(c.reviewed.by, fmtDate(c.on));
  else                         head = t.trustReviewed(c.reviewed.by, fmtDate(c.on));
  return `<p class="trust"><b>${head}</b> ${t.defer}</p>`;
}

/* THE ORDER INSIDE THE SHEET, top to bottom. It is a lifeguard sign now, and a
   sign has four parts:

     name and sub          where you are
     INSTRUCTION           what to do. 21 px / 800, the largest and heaviest
                           thing on the sheet, above the fold at PEEK
     hours                 only Cocles has a post, and only while it qualifies
                           the instruction on screen
     why                   ONE short sentence. What the sea does here.
     exceptions            the tide rule at Chiquita, the east channel at Punta
                           Uva, the lower-risk rider. Kept because each one
                           CHANGES the instruction on a specific part of a
                           specific beach; an exception is not a detail.
     ESCAPE                what to do if a current has you. The only sentence
                           on this page a frightened swimmer has to recall.
     911                   the one action worth a full-width button
     trust line            see above
     actions               Cómo llegar · Reportar un error

   WHAT LEFT, AND WHY. Daniel's finding 2026-09-17: "There is FAR TOO MUCH
   INFORMATION. It should be simplified to the deepest possible. Think about
   lifeguard signs used worldwide and use that type of language."

   - the `facts` bullet list (two or three per beach). A sign does not carry a
     bulleted annex. The one fact per beach that changed what a swimmer would
     do has been folded into the why sentence; the rest described the place
     rather than instructing anyone.
   - the Autor / Revisado row, the TODAY line, the absence boxes: one trust
     line, above.
   - the boxed deferral: same sentence, same words, no box. It was boxed to
     stop it reading as one more caveat. With the caveats gone there is nothing
     left for it to be confused with.

   The escape sentence is UNTOUCHED and still renders on all five beaches,
   including Playa Negra. Playa Negra is the calmest stretch on this coast and
   it is still the sea. */
function openZone(z){
  const render = ()=>{
    const t = T[lang], c = z.character;
    const rider = c.class === "lower-risk"
      ? `<p class="caveat">${t.charLowerRiskRider}</p>` : "";
    const caveats = (c.caveats || [])
      .map(cv=>`<p class="caveat">${cv[lang]}</p>`).join("");
    // z.at, not a midpoint of z.line: the line may not have arrived yet and a
    // QR deep link opens this sheet 350 ms after load. Both are the same point.
    const mid = z.at.join(",");
    return `
    <div class="zone-detail">
    <div class="zone-top">
    <h2 id="sheet-title" tabindex="-1">${z.name[lang]}</h2>
    <p class="sub">${z.sub[lang]}</p>
    <div class="statuscard ${tierOf(z)}">
      <span class="tile" aria-hidden="true">${CGSymbols.badge(c.class)}</span>
      <span class="eyebrow">${t.ebWhatToDo}</span>
      <span class="instr">${t[c.class]}</span>
      ${hoursLine(z)}
      <p class="why">${c.why[lang]}</p>
      <div class="sos911">
        <span class="lead">${t.sosLead}</span>
        <a class="dial" href="tel:911">${t.call}</a>
      </div>
    </div>
    ${rider}${caveats}
    </div>
    <div class="zone-lower">
    <span class="eyebrow">${t.ebRip}</span>
    <p class="escape">${t.escapeRip}</p>
    <span class="eyebrow">${t.ebWhoSays}</span>
    ${trustLine(z)}
    <div class="actions">
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${mid}">${t.route}</a>
      <a class="btn" href="${reportHref(t.reportSubject + ": " + z.name.es)}">${t.report}</a>
    </div>
    </div>
    ${renderWeatherPanel()}
    ${sheetFoot()}
    </div>`;
  };
  openSheet(render(), ()=>{ sheetBody.innerHTML = render(); requestAnimationFrame(fitZoneDetail); });
  requestAnimationFrame(fitZoneDetail);
  markCurrent(z.id);
  // Before the geometry lands there is one point to fly to rather than a line.
  flyClear(z.line.length ? L.latLngBounds(z.line).pad(0.55)
                         : L.latLngBounds([z.at]).pad(0.02));
  /* AFTER flyClear, not before: showBand() reads map.getZoom(), and on a deep
     link that zoom is still the whole-coast landing view for the length of the
     flight. flyToBounds fires zoomend when it lands, and the zoomend handler
     above redraws the band at the zoom it actually arrived at. On a deep link
     z.line is empty here as well; drawZones() calls this again when the
     geometry fetch resolves. */
  showBand(z);
  sheetAddress("z=" + localId(z.id));
}

/* The coast this map does not describe, opened from its own card in the strip.
   Every number in it is computed from the data that is actually loaded, so it
   cannot drift from what is drawn. */
function openVoid(){

function openUnassessedBeach(beach){
