<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- maximum-scale=5 and no user-scalable=no, DELIBERATELY. Beachsafe, Protected
     Planet, SINAC and OVSICORI all disable pinch zoom on public safety maps. This
     is read in bright sun by people who may not have their glasses. Do not "fix". -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0b1c2c">
<meta name="description" content="Mapa de seguridad costera de Caribbean Guard, de Puerto Viejo a Manzanillo.">
<title>Caribbean Guard | Mapa de Seguridad</title>
<link rel="manifest" href="manifest.json">
<!-- Named explicitly so the browser stops requesting /favicon.ico, which the map
     does not ship and which 404s on every single load. -->
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caribbean Guard">
<!-- Self-hosted, not unpkg, and with no CDN fallback on purpose.
     Measured against unpkg from a good home link: 1.27 s of TLS negotiation alone
     before the first byte of Leaflet arrived, to a host we do not control, with no
     integrity attribute on the tag. Chrome partitioned its HTTP cache in 2020, so
     the old cross-site caching argument for a public CDN no longer holds in any
     current browser. Leaflet's latest dist-tag has been 1.9.4 since 2023-05-18, so
     vendoring commits us to chasing nothing.
     A fallback would put the CDN back in the threat model to buy nothing: if the
     local copy is shipped anyway, ship only the local copy. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{
    /* Two tiers on purpose.
       The plain tokens are for GRAPHICS on the map, where the bar is 3:1 and
       vividness helps them survive a sun-washed screen.
       The -text tokens are for SOLID FILLS CARRYING WHITE TEXT, where the bar is
       4.5:1. White on the old #1f9d55 measured 3.49:1 and on #c77700 measured
       3.46:1, so both status pills were failing outright. 13px bold does not
       qualify for the large-text exception, which needs about 18.66px bold.
       Old --moderate #c77700 also had almost exactly the same luminance as --low
       (0.254 vs 0.251), so in direct sun, which kills hue first, the two middle
       tiers were the same colour.

       These are named for the three HAZARD TIERS, low / moderate / high. They were
       named safe / caution / danger, and --safe in particular was the wrong name:
       nothing on this map is entitled to say safe. See the CHARACTER block. */
    --low:#1f9d55;         --low-text:#178049;
    --moderate:#9c5c00;    --moderate-text:#9c5c00;
    --high:#c62828;        --high-text:#c62828;
    --ink:#0b1c2c; --paper:#ffffff; --muted:#5b6b7a;
    /* Absence has its own colour and it is not a hazard colour. Amber says "you
       are missing something", grey says "nobody has been here". Neither may be
       mistaken for a verdict, so neither is red, amber-as-caution, or green. */
    --gap:#7a4a00;   --gap-bg:#fdf4e3;  --gap-line:#e7cf9e;
    --void:#4a5764;  --void-bg:#eef1f4;  --void-line:#c9d2da;
    /* Today's bulletin has its own colour and it is deliberately outside the
       hazard palette, so a thing a guard said this morning can never be mistaken
       for what this beach is. Violet also survives red-green colour blindness
       against all three tiers. */
    --today:#7b1fa2;
    --sheet-r:20px;
    --safe-pad: env(safe-area-inset-bottom, 0px);
    --dock-h: 96px;    /* set from JS; the fab and compass stack above the dock */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:var(--ink)}
  #map{position:absolute;inset:0}
  /* The coast is a 3.5:1 strip and the phone is portrait, so there will always be
     empty bands above and below it. Leaflet fills those with its own light grey,
     which reads as a broken image. Make them the app's own navy so the letterbox
     looks deliberate. */
  .leaflet-container{background:var(--ink)}
  /* Replaces the old white casing. A shadow lifts the strokes off the imagery
     without putting a grey band around them, and it costs no width, so a thin
     line stays thin. */
  .leaflet-overlay-pane{filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}
  /* The coast is a 3:1 strip, so on any viewport shape there is empty space above
     and below it once the whole thing is on screen. Flat colour there reads as a
     broken image. This is the overview blown up, blurred and darkened, sitting
     behind the real base: the sea appears to continue instead of stopping at an
     edge. It is deliberately unreadable, so it cannot be mistaken for map data. */
  .backdrop{filter:blur(26px) saturate(.55) brightness(.42);
    transform:scale(1.04);transform-origin:center}

  /* ---------- top bar ---------- */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:1000;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(11,28,44,.92),rgba(11,28,44,0));
    pointer-events:none}
  .brand{font-weight:800;letter-spacing:.02em;color:#fff;font-size:15px;line-height:1.15;
    text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .brand small{display:block;font-weight:500;font-size:11px;opacity:.85;letter-spacing:.04em;
    text-transform:uppercase}
  .spacer{flex:1}
  .lang{pointer-events:auto;display:flex;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden;
    backdrop-filter:blur(8px)}
  .lang button{appearance:none;border:0;background:transparent;color:#fff;font:inherit;
    font-size:12px;font-weight:700;padding:7px 12px;min-height:36px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

  /* ---------- emergency ---------- */
  .sos{pointer-events:auto;display:flex;align-items:center;gap:6px;
    background:var(--high);color:#fff;text-decoration:none;font-weight:800;font-size:13px;
    padding:9px 14px;min-height:40px;border-radius:999px;
    box-shadow:0 3px 12px rgba(0,0,0,.4)}

  /* ---------- bottom dock: offline bar + beach picker ---------- */
  /* One positioned container rather than two, so chrome() has a single thing to
     measure and the fab stack has a single height to clear. */
  .dock{position:absolute;left:0;right:0;z-index:1000;
    bottom:calc(var(--safe-pad) + 10px)}
  .picker{display:flex;gap:9px;padding:6px 12px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
  .picker::-webkit-scrollbar{display:none}
  .card{flex:0 0 auto;scroll-snap-align:center;min-width:146px;
    background:rgba(255,255,255,.97);border-radius:14px;padding:10px 13px 11px;
    border:2px solid transparent;box-shadow:0 3px 14px rgba(0,0,0,.34);cursor:pointer;
    text-align:left;font:inherit;color:var(--ink)}
  .card[aria-current="true"]{border-color:var(--ink)}
  .card .nm{display:block;font-size:14.5px;font-weight:800;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
  .card .st{display:flex;align-items:center;gap:6px;margin-top:5px;
    font-size:11.5px;font-weight:800;letter-spacing:.03em}
  /* coloured text on white, so also the -text tier */
  .card .st.low{color:var(--low-text)} .card .st.moderate{color:var(--moderate-text)}
  .card .st.high{color:var(--high-text)}
  /* was an 11px square identical for all three statuses, so it carried no
     information beyond its fill. Now it is a sample of the actual map stroke. */
  .sw{flex:0 0 auto;display:block}

  /* Absence, rendered on the card so it is visible before anything is tapped.
     Three different absences get three different marks, never one banner: see the
     ABSENCE block in the script. Deliberately typographic, not coloured like a
     status, so a missing verdict can never be read as a verdict. */
  .gaps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .gap{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;
    letter-spacing:.01em;padding:2px 5px;border-radius:5px;border:1px solid;
    white-space:nowrap}
  .gap.never,.gap.expired{color:var(--gap);background:var(--gap-bg);border-color:var(--gap-line)}
  .gap.unsurveyed{color:var(--void);background:var(--void-bg);border-color:var(--void-line)}
  .gap .mk{font-size:11px;line-height:1}

  /* The card for the coast this map does not describe. It sits in the picker
     alongside the beaches on purpose: an absence listed as a peer of the presences
     is the only version of it somebody will actually see. Hatched, so it does not
     read as one more beach. */
  .card.void{background:
      repeating-linear-gradient(135deg,#eef1f4 0 7px,#e3e8ed 7px 14px);
    border-color:var(--void-line)}
  .card.void .nm{color:var(--void)}
  .card.void .st{color:var(--void)}

  /* ---------- locate button ---------- */
  .fab{position:absolute;right:12px;z-index:1000;
    bottom:calc(var(--safe-pad) + var(--dock-h) + 16px);
    width:52px;height:52px;border-radius:50%;border:0;background:#fff;
    box-shadow:0 3px 14px rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer}
  .fab svg{width:24px;height:24px}
  .compass{position:absolute;right:12px;z-index:1000;
    bottom:calc(var(--safe-pad) + var(--dock-h) + 76px);
    width:44px;height:44px;border-radius:50%;border:0;background:#fff;
    box-shadow:0 3px 14px rgba(0,0,0,.35);display:grid;place-items:center;
    cursor:pointer;padding:0;font:inherit}
  .compass svg{width:30px;height:30px;overflow:visible}
  .compass #needle{transform-origin:22px 22px;transition:transform .18s linear}
  .compass.live{outline:2px solid #1565c0;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.compass #needle{transition:none}}
  .fab.on svg{color:#1565c0}

  /* ---------- bottom sheet ---------- */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1200;
    background:var(--paper);border-radius:var(--sheet-r) var(--sheet-r) 0 0;
    box-shadow:0 -6px 28px rgba(0,0,0,.35);
    transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:74vh;display:flex;flex-direction:column;
    padding-bottom:var(--safe-pad)}
  .sheet.open{transform:translateY(0)}
  .grab{width:40px;height:4px;border-radius:2px;background:#d5dbe1;margin:9px auto 4px;flex:0 0 auto}
  .sheet-body{overflow-y:auto;padding:6px 18px 20px;-webkit-overflow-scrolling:touch}
  .status{display:inline-flex;align-items:center;gap:8px;border-radius:999px;
    padding:7px 14px;font-size:13px;font-weight:800;color:#fff;letter-spacing:.02em}
  /* white text on a solid fill, so these take the -text tier */
  .status.low{background:var(--low-text)} .status.moderate{background:var(--moderate-text)}
  .status.high{background:var(--high-text)}
  .status.station{background:#1565c0}
  .sheet h2{margin:12px 0 2px;font-size:22px;line-height:1.2}
  .sheet .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
  .why{background:#f4f6f8;border-left:4px solid var(--ink);border-radius:0 10px 10px 0;
    padding:12px 14px;font-size:14.5px;line-height:1.5;margin:0 0 14px}

  /* ---------- the two axes, rendered so they cannot be confused ----------
     beaches.ie displays a standing classification and a current reading side by
     side and labels both, and encodes them differently on purpose. Same here.
     CHARACTER is a coloured pill in the hazard palette and it carries the map
     stroke. TODAY is a dark bordered block with a name and a timestamp on it, and
     it never borrows a hazard colour, so nothing about it can be mistaken for the
     standing character above it. */
  .axis{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 0 6px}
  .today{border:1.5px solid var(--ink);border-radius:12px;padding:10px 13px;margin:0 0 14px}
  .today .verdict{font-size:14px;font-weight:800;line-height:1.25;margin:0}
  .today .stamp{margin:5px 0 0;font-size:12px;line-height:1.45;color:var(--muted)}
  .today .rider{margin:7px 0 0;font-size:12.5px;line-height:1.45}
  /* nobody has signed a bulletin today. This is the ordinary state on a 16 km
     coast with one association, so it is stated plainly and greyly. Amber every
     single day would teach people that amber means nothing. */
  .today.none{border-color:var(--void-line);border-style:dashed}
  .today.none .verdict{color:var(--void);font-weight:700}
  .today.signed{border-color:var(--today);border-width:2px}
  .today.signed .verdict{color:var(--today)}
  .today.stale{border-style:dashed}
  .today .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:#fff;background:var(--today);border-radius:5px;
    padding:2px 6px;margin-right:7px;vertical-align:2px}
  .today.none .badge{background:var(--void)}
  /* the card marker for a beach that has a bulletin today */
  .gap.today{color:#fff;background:var(--today);border-color:var(--today)}

  /* An exception that modifies the character, sitting where it can act on it,
     rather than stranded in a facts bullet nothing reads. */
  .caveat{margin:0 0 12px;padding:9px 12px;font-size:13px;line-height:1.45;
    border-radius:10px;background:#f4f6f8;border-left:4px solid var(--moderate-text)}

  /* The rule that still works when this map is wrong, rendered under every level.
     Deliberately NOT styled like a caveat: a caveat qualifies the verdict above
     it, and this outranks the verdict above it. Solid ink, full border, no fill,
     so it reads as the standing rule rather than as one more exception. */
  .defer{margin:0 0 14px;padding:10px 13px;font-size:13px;line-height:1.45;
    font-weight:600;border:1.5px solid var(--ink);border-radius:10px;color:var(--ink)}

  /* Provenance sits directly under the claim it qualifies, not in a footer.
     Two lines, not one, following OVSICORI: what produced this record, and whether
     a human has confirmed it. They are different claims and collapsing them is how
     a machine reading gets read as a lifeguard's word. */
  .prov{margin:-4px 0 14px;font-size:12.5px;line-height:1.5;color:var(--muted)}
  .prov b{font-weight:700;color:var(--ink)}
  .prov .row{display:block}
  .prov.unverified{color:var(--gap);background:var(--gap-bg);border:1px solid var(--gap-line);
    border-radius:10px;padding:9px 12px;font-weight:600}
  .prov.unverified b{color:var(--gap)}

  /* Absence in the sheet: the same three marks as on the card, stacked, each with
     its own sentence. Never one banner for three different facts. */
  .gaplist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
  .gaplist li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;
    border-radius:10px;padding:9px 12px;border:1px solid}
  .gaplist li.never,.gaplist li.expired{color:var(--gap);background:var(--gap-bg);border-color:var(--gap-line)}
  .gaplist li.unsurveyed{color:var(--void);background:var(--void-bg);border-color:var(--void-line)}
  .gaplist .mk{flex:0 0 18px;text-align:center;font-weight:800}
  .gaplist b{display:block;font-weight:800}

  .facts{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px}
  .facts li{display:flex;gap:10px;font-size:14px;line-height:1.45;align-items:flex-start}
  .facts .ic{flex:0 0 22px;text-align:center;font-size:15px}
  .actions{display:grid;gap:9px;grid-template-columns:1fr 1fr}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
    border-radius:12px;border:1.5px solid rgba(11,28,44,.15);background:#fff;
    font:inherit;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;cursor:pointer}
  .btn.primary{background:var(--high);border-color:var(--high);color:#fff}
  .btn.wide{grid-column:1 / -1}
  .close{position:absolute;top:8px;right:10px;width:38px;height:38px;border-radius:50%;
    border:0;background:rgba(11,28,44,.07);font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}

  /* ---------- post markers ---------- */
  .po{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
    background:#fff;border:3px solid var(--ink);font-weight:800;font-size:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.4)}
  /* One kind now: these are Caribbean Guard's real fixed rescue stations, not a
     mix of staffed and proposed posts I had invented. Blue, because a station is
     infrastructure rather than a swim verdict, and must not read as a status. */
  .po.station{border-color:#1565c0}

  /* ---------- offline / signal banner ---------- */
  .toast{position:absolute;left:12px;right:12px;z-index:1400;
    top:calc(env(safe-area-inset-top,0px) + 62px);
    background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;
    font-size:13px;line-height:1.4;box-shadow:0 4px 18px rgba(0,0,0,.4);
    display:none}
  .toast.show{display:block}

  /* ---------- the saved-copy bar ----------
     Material Money's triple, in one strip: a LABELLED timestamp, a plain statement
     of the refresh cadence, and a manual refresh affordance. It is permanent
     rather than a toast, because "when was this saved" is a question somebody has
     at the moment they act on the verdict, not six seconds after load.
     Beachsafe's default value for a cache that has never populated is the literal
     word "Never". That is the honest pattern and it is copied here. */
  .saved{display:flex;align-items:center;gap:8px;margin:0 12px 8px;
    background:rgba(11,28,44,.88);backdrop-filter:blur(8px);color:#fff;
    border-radius:10px;padding:0 4px 0 11px;min-height:34px;
    box-shadow:0 3px 12px rgba(0,0,0,.3)}
  .saved .txt{flex:1;font-size:11.5px;line-height:1.3;font-weight:600;
    background:none;border:0;color:inherit;font-family:inherit;text-align:left;
    padding:7px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
    text-decoration-color:rgba(255,255,255,.4)}
  .saved .rf{flex:0 0 auto;width:34px;height:30px;border:0;border-radius:8px;
    background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font:inherit;
    display:grid;place-items:center}
  .saved .rf svg{width:16px;height:16px}
  .saved .rf[disabled]{opacity:.45}
  @keyframes spin{to{transform:rotate(360deg)}}
  .saved .rf.busy svg{animation:spin .9s linear infinite}
  @media (prefers-reduced-motion:reduce){.saved .rf.busy svg{animation:none}}

  /* ---------- new build available ----------
     Surfrider's pattern. A cache-first safety map with no way to say "the verdicts
     you are reading are the old ones" will show a stale verdict forever, which is
     the exact failure the provenance machinery exists to prevent, one layer down. */
  .update{position:absolute;left:12px;right:12px;z-index:1500;
    top:calc(env(safe-area-inset-top,0px) + 62px);
    display:none;align-items:center;gap:10px;
    background:#fff;color:var(--ink);border-radius:12px;padding:10px 10px 10px 13px;
    box-shadow:0 4px 20px rgba(0,0,0,.45);font-size:13px;line-height:1.35}
  .update.show{display:flex}
  .update .msg{flex:1;font-weight:600}
  .update button{border:0;font:inherit;font-size:13px;font-weight:800;cursor:pointer;
    border-radius:9px;min-height:38px;padding:0 13px}
  .update .go{background:var(--ink);color:#fff}
  .update .no{background:transparent;color:var(--muted);padding:0 8px;min-width:38px}

  .leaflet-control-attribution{font-size:9px}
  @media (min-width:820px){
    .sheet{left:auto;right:16px;bottom:16px;width:390px;border-radius:16px;max-height:70vh}
    .sheet.open{transform:translateY(0)}
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="brand">CARIBBEAN GUARD<small id="tagline">Mapa de seguridad costera</small></div>
  <div class="spacer"></div>
  <a class="sos" href="tel:911">911</a>
  <div class="lang" role="group" aria-label="Idioma">
    <button id="btn-es" aria-pressed="true">ES</button>
    <button id="btn-en" aria-pressed="false">EN</button>
  </div>
</div>

<!-- assertive, not polite: every message this carries is safety relevant
     ("you are between two beaches", "you are outside this coastline") and a
     polite region would be queued behind whatever else is speaking. -->
<div class="toast" id="toast" role="status" aria-live="assertive" aria-atomic="true"></div>

<button class="fab" id="locate" aria-label="Mi ubicación">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>
    <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>
  </svg>
</button>

<!-- North arrow. On a phone with a compass this becomes a live heading
     indicator: the needle keeps pointing north while you turn, which is the
     question somebody on the sand actually has ("which way am I facing?").
     Without a compass it stays a plain north arrow, which is still correct
     because the imagery is rectified north-up. -->
<button class="compass" id="compass" aria-label="Norte" aria-live="off">
  <svg viewBox="0 0 44 44" aria-hidden="true">
    <g id="needle">
      <path d="M22 7 L27.4 24 L22 20.6 L16.6 24 Z" fill="#c62828"/>
      <path d="M22 37 L16.6 20 L22 23.4 L27.4 20 Z" fill="#8ea3b6"/>
    </g>
    <text x="22" y="6.4" text-anchor="middle" font-size="7.5" font-weight="800"
          fill="#0b1c2c" font-family="inherit">N</text>
  </svg>
</button>

<div class="dock" id="dock">
  <div class="saved" id="saved" hidden>
    <button class="txt" id="saved-txt" type="button"></button>
    <button class="rf" id="saved-refresh" type="button" aria-label="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 5v6h-6"/>
      </svg>
    </button>
  </div>
  <div class="picker" id="picker"></div>
</div>

<div class="update" id="update" role="status" aria-live="polite">
  <span class="msg" id="update-msg"></span>
  <button class="go" id="update-go"></button>
  <button class="no" id="update-no" aria-label="Cerrar">&times;</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="false">
  <div class="grab"></div>
  <button class="close" id="sheet-close" aria-label="Cerrar">&times;</button>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script src="vendor/leaflet.js"></script>
<script>
/* ============================================================
   1. GEOREFERENCE  <-- solved 2026-07-30, do not hand-edit

/* ============================================================
   2. SAFETY DATA  <-- must be authored by Caribbean Guard, not by satellite
   Edit this block to update the map. Nothing else needs to change.

   ---- IDS ----------------------------------------------------------------
   Ids are namespaced  <org>:<type>/<local>  and they are a join key, not a
   label. Caribbean Guard already has towers at Cocles and at a "Playa Grande",
   and Playa Grande Lifeguards is a separate founding member of the same national
   federation, named after a different Playa Grande on the Pacific side. The
   collision exists inside this data set before any second organisation is
   involved.

   The cost of doing this now is a prefix. The cost of doing it later is
   rewriting every provenance record that has already been signed and dated, and
   a provenance record's whole value is being an unaltered timestamped statement
   of who said what. That is the one migration this system must never perform.

   The `local` part is what the QR deep links carry (?z=cocles, ?p=est2), so it
   stays short and stays stable. Do not renumber est1..est4.

   ---- TWO AXES, NOT ONE --------------------------------------------------
   `status` used to be one word carrying two different claims: that Cocles is the
   beach with the most rescues on this coast (true for years) and that Cocles is
   dangerous today (true for hours). Flipping it to say the water is calm this
   week also said the standing fact was no longer true. In the other direction it
   was worse: a beach whose standing character is benign could not be called
   dangerous today without permanently relabelling the beach, which is exactly why
   Punta Uva was `safe` while our own copy said to avoid the east channel.

   Ireland's EPA refuses to merge these and labels both prominently. So:

     character  what this beach IS.        Changes in years.   Carries the map stroke.
     today      what a guard signed about  Changes in hours.   Never touches the stroke.
                it right now.

   character.class is one of four, mapped to three visual tiers in CHARACTER
   below. Four classes because "never swim here" (Salsa Brava) and "swim only in
   front of the guard post" (Cocles) are different instructions, and one word for
   both is the same flattening this split exists to undo. Three tiers because the
   stroke vocabulary's brightness ladder only works with three.

   beaches.ie carries its long-run scale as a COUNT OF STARS rather than a colour,
   so it cannot be confused with the current reading. That specific device does not
   transfer: a star count is an ordinal quality rating averaged over four seasons
   of sampling, we have no sampling programme, and a hazard character is not
   better-or-worse, it is a different kind of water. What transfers is the
   principle, that the two axes must be encoded in different channels. Here the
   character is colour plus stroke weight plus dash, and today is a dated bordered
   block with a person's name on it and no hazard colour at all.

   ---- PROVENANCE IS NOT OPTIONAL -----------------------------------------
   Two fields, not one, following OVSICORI, whose every earthquake popup carries
   `Autor` (what process produced this record) and `Revisado` (has a human checked
   it, currently rendering "-"):

       authored: "desk" | "sheet" | "field"     what produced this text
       reviewed: {by:"person", org:"Caribbean Guard", on:"YYYY-MM-DD"} | null

   `org` and not just `by`, because if this map becomes the federation's de facto
   safety page, the question is which organisation stands behind the verdict, not
   only which person typed it.

   Leave `reviewed` null and the interface says out loud that nobody has confirmed
   this, which is the honest state today: every description below is `desk`, which
   means written from general knowledge, not by a guard who has stood on that sand.

   The interface must never claim more currency or more authority than this block
   actually carries. No "real time", no "live conditions", no attribution to
   Caribbean Guard's guards until a real name and date sit here. Stale defaults to
   unknown, never to safe. Nothing here says safe at all: see CHARACTER.
   ============================================================ */

/* ============================================================
   COPY

   Spanish is tú throughout, not usted. The rest of Caribbean Guard's site writes
   in tú, and so does every Latin American volunteer water safety organisation
   studied. Usted reads correctly for a government authority issuing instructions
   from outside a community; Caribbean Guard is the opposite kind of body, and
   usted on this one artefact made the piece doing the most safety critical work
   sound like it came from a more distant organisation than the one whose name is
   on it. If you add a string, write it in tú.

   THREE RULES GOVERN THE LEVEL NAMES. All three, not one.

   1. EVERY LEVEL NAME IS AN INSTRUCTION, never a colour and never a rating.
      SMN Argentina's severity levels are "Informate", "Preparate", "Segui
      instrucciones oficiales": the level name IS the action. A rating tells you
      how bad somebody thinks it is; an instruction tells you what to do, which is
      the only thing a person standing on sand can act on. Nobody may "simplify"
      these into colour names or into a risk scale later. RIESGO ALTO is a rating
      and it is not good enough.

   2. NO LEVEL NAME MAY READ AS PERMISSION. The old lowest tier read SE PUEDE
      NADAR / SWIMMING OK, which is a stronger claim than the lowest tier of the
      United States' national rip current forecast is willing to make, on imagery
      uncertain to 75 m, about beaches no guard has reviewed. NOAA's LOW tier does
      not contain the word safe. Ours is TEN CUIDADO IGUAL / TAKE CARE ANYWAY,
      which is an instruction that grants nothing, and charLowerRiskRider carries
      NOAA's sentence naming the structures where rips persist anyway, adapted to
      the structures that exist on this coast.

   3. EVERY LEVEL DEFERS DOWNWARD, to the guards and to the flags on the sand.
      Every NOAA tier does this. RNLI reduces its entire public message to "No
      Flags = No Lifeguards". SLSA's disclaimer does the same third move that we
      were missing: after downgrading the artefact and naming the reason, hand the
      reader a rule that still works when the artefact is wrong. That is `defer`,
      and it renders under EVERY character, not only the lowest one.

      Note how `defer` is phrased. Caribbean Guard's rescue towers at Cocles and
      Playa Grande are verified. A red flag SYSTEM along this coast is NOT: our own
      Cocles copy asserts "banderas rojas marcan los canales activos" and nobody
      has confirmed it. So the sentence is conditional, "if there is a guard or a
      flag", which is true whether or not the system exists and is stronger than
      asserting it. Do not rewrite it into "obey the flags" until Caribbean Guard
      confirms there are flags to obey.
