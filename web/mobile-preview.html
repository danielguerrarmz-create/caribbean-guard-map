<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caribbean Guard | Mobile preview</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:Arial,Helvetica,sans-serif;color:#18313e;background:#e8eef0}
    body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px 16px 20px}
    header{display:flex;justify-content:space-between;align-items:center;gap:16px;width:min(100%,600px);min-height:44px;font-size:13px}
    strong{font-size:14px}
    a{color:#125b73}
    #stage{position:relative;flex:none}
    iframe{display:block;width:390px;height:844px;border:0;border-radius:20px;background:#fff;box-shadow:0 14px 46px #18313e30;transform-origin:top left}
    @media(max-width:420px){body{padding:0}header{padding:0 12px}iframe{border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <header><strong>Mobile preview · 390 × 844</strong><a href="/" target="_blank" rel="noopener">Open full site</a></header>
  <div id="stage"><iframe id="app" src="/" title="Caribbean Guard mobile app" allow="geolocation"></iframe></div>
  <script>
    const frame = document.getElementById('app');
    const stage = document.getElementById('stage');
    function sizePreview(){
      const scale = Math.min(1, (innerWidth - 32) / 390, (innerHeight - 76) / 844);
      frame.style.transform = `scale(${scale})`;
      stage.style.width = `${390 * scale}px`;
      stage.style.height = `${844 * scale}px`;
    }
    addEventListener('resize', sizePreview);
    sizePreview();
  </script>
</body>
</html>
